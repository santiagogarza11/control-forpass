/* Botón para volver a la lista de clientes, arriba de cada vista interna. */
function botonRegresar(){
  return '<div style="margin-bottom:14px">'
       + '<button type="button" class="btn btn-suave btn-mini" data-accion="ir-clientes">'
       + ICONO.atras + 'Regresar a clientes</button></div>';
}

function iniciales(nombre){
  const p = String(nombre||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '—';
  return (p.length === 1 ? p[0].slice(0,2) : p[0][0] + p[1][0]).toUpperCase();
}

function tarjetaKpi(label, valor, pie, clase, accion){
  const cuerpo = '<div class="k-label">' + esc(label) + '</div>'
               + '<div class="k-valor">' + valor + '</div>'
               + (pie ? '<div class="k-pie">' + esc(pie) + '</div>' : '');
  /* Algunos indicadores se pueden abrir para ver el detalle. */
  return accion
    ? '<button type="button" class="kpi kpi-clic ' + (clase||'') + '" data-accion="' + esc(accion) + '">'
      + cuerpo + '<span class="k-mas">Ver cuáles →</span></button>'
    : '<div class="kpi ' + (clase||'') + '">' + cuerpo + '</div>';
}

function barraHerramientas(){
  /* El Excel lo puede sacar cualquiera: es la herramienta del día a día.
     Respaldar y restaurar mueven TODA la base de golpe, así que quedan solo
     para Owner y Admin. */
  let h = '<button type="button" class="btn btn-suave btn-mini" data-accion="excel">' + ICONO.excel + 'Descargar Excel</button>';
  if(esAdmin()){
    h += '<button type="button" class="btn btn-suave btn-mini" data-accion="respaldo">' + ICONO.respaldo + 'Respaldo JSON</button>'
       + '<button type="button" class="btn btn-suave btn-mini" data-accion="restaurar">' + ICONO.subir + 'Restaurar</button>';
  }
  return h;
}

/* ------------------------------ Vista: clientes ------------------------------ */
function vistaClientes(){
  const r = resumir(datos.sitios);
  /* Solo los de este módulo: los que existen nada más por una póliza se quedan
     en Pólizas. Ver clientesDeForpass(). */
  const mios = clientesDeForpass();
  const soloPoliza = datos.clientes.length - mios.length;
  let h = '';

  h += '<div class="titulo-zona"><div>'
     +   '<h2>Clientes</h2>'
     +   '<p>' + numero(mios.length) + ' ' + plural(mios.length,'cliente','clientes')
     +   ' · ' + numero(r.sitios) + ' ' + plural(r.sitios,'sitio','sitios') + ' registrados'
     +   (soloPoliza ? ' · ' + numero(soloPoliza) + ' más solo con póliza' : '') + '</p>'
     + '</div><div class="acciones">'
     +   barraHerramientas()
     +   '<button type="button" class="btn btn-primario" data-accion="nuevo-cliente">' + ICONO.mas + 'Agregar cliente</button>'
     + '</div></div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Forpass activos', numero(r.forpass), r.sitiosActivos + ' ' + plural(r.sitiosActivos,'sitio activo','sitios activos'), 'k-ok')
     + tarjetaKpi('Mensualidad total', dinero(r.mrr), 'Suma de sitios activos (sin IVA)')
     /* Los tres de cobranza se pueden abrir; los dos primeros no, porque son
        sumas sin detalle que valga una ventana. Se ofrecen solo cuando hay algo
        que ver: un "Ver cuáles" con cero adentro también decepciona. */
     + tarjetaKpi('Sitios atrasados', numero(r.atrasados), r.mensualidadesAtrasadas + ' ' + plural(r.mensualidadesAtrasadas,'mensualidad vencida','mensualidades vencidas') + ' · ' + dinero(r.adeudo), r.atrasados ? 'k-error' : '', r.atrasados ? 'ver-atrasados' : '')
     + tarjetaKpi('Por pagar (7 días)', numero(r.porPagar), 'Mensualidad próxima a vencer', r.porPagar ? 'k-alerta' : '', r.porPagar ? 'ver-por-pagar' : '')
     + tarjetaKpi('Vigencias por vencer', numero(r.porVencer), 'Contratos que terminan en 45 días', r.porVencer ? 'k-alerta' : '', 'ver-por-vencer')
     + '</div>';

  h += avisoClaveInicial();
  h += avisoRespaldo();
  h += avisoLocal();

  if(!mios.length){
    h += vistaVacia('edificio','Todavía no hay clientes','Agrega tu primer cliente y después registra los sitios con sus Forpass, mensualidad y vigencia.','nuevo-cliente','Agregar cliente');
    return h;
  }

  h += '<div class="barra-busca">'
     +   '<input type="search" id="buscaCliente" placeholder="Buscar cliente…" value="' + esc(estado.busca) + '">'
     +   '<select id="filtroCliente">'
     +     '<option value="todos">Todos los clientes</option>'
     +     '<option value="atrasados">Solo con atrasos</option>'
     +     '<option value="activos">Solo con Forpass activos</option>'
     +   '</select>'
     + '</div>';

  const q = estado.busca.trim().toLowerCase();
  const lista = mios.filter(c=>{
    const ss = sitiosDe(c.id);
    if(q){
      const enSitios = ss.some(s => s.nombre.toLowerCase().includes(q));
      if(!c.nombre.toLowerCase().includes(q) && !enSitios) return false;
    }
    const rr = resumir(ss);
    if(estado.filtro === 'atrasados' && !rr.atrasados) return false;
    if(estado.filtro === 'activos' && !rr.forpass) return false;
    return true;
  });

  if(!lista.length){
    h += '<div class="vacio"><h3>Sin resultados</h3><p>Ningún cliente coincide con la búsqueda o el filtro.</p></div>';
    return h;
  }

  h += '<div class="grid' + (animarTarjetas ? '' : ' sin-entrada') + '">' + lista.map((c,i)=>{
    const ss = sitiosDe(c.id);
    const rr = resumir(ss);
    const tono = rr.atrasados ? 'error' : (rr.porPagar ? 'alerta' : (rr.forpass ? 'ok' : 'neutro'));

    /* Esta bolita habla SOLO de si hay Forpass encendidos: verde si sí, gris si
       no. El estatus de pago tiene sus propias insignias más abajo; mezclarlos
       aquí hacía que un "3 Forpass activos" saliera con punto rojo. */
    let chips = '<span class="insignia ' + (rr.forpass ? 'i-ok' : 'i-neutro') + '">'
              + '<span class="punto ' + (rr.forpass ? 'p-ok' : 'p-neutro') + '"></span>'
              + numero(rr.forpass) + ' ' + plural(rr.forpass,'Forpass activo','Forpass activos') + '</span>';
    if(rr.atrasados) chips += '<span class="insignia i-error">' + rr.atrasados + ' ' + plural(rr.atrasados,'sitio atrasado','sitios atrasados') + '</span>';
    else if(rr.porPagar) chips += '<span class="insignia i-alerta">' + rr.porPagar + ' por pagar</span>';
    if(rr.porVencer) chips += '<span class="insignia i-info">' + rr.porVencer + ' por vencer</span>';
    /* Sin estas tres, un cliente con todo pausado y otro que ya terminó de pagar
       se veían igual: ambos "0 Forpass activos · $0". Son cosas opuestas. */
    if(rr.cubiertos) chips += '<span class="insignia i-info">' + rr.cubiertos + ' ' + plural(rr.cubiertos,'contrato cubierto','contratos cubiertos') + '</span>';
    if(rr.pausados) chips += '<span class="insignia i-neutro">' + rr.pausados + ' ' + plural(rr.pausados,'pausado','pausados') + '</span>';
    if(rr.bajas) chips += '<span class="insignia i-neutro">' + rr.bajas + ' de baja</span>';

    return '<div class="tarjeta tarjeta-clic t-' + tono + '" data-cliente="' + esc(c.id) + '" style="--d:' + (i*45) + 'ms" tabindex="0" role="button">'
         +   '<div class="t-cabeza">'
         +     avatarCliente(c)
         +     '<div style="flex:1; min-width:0">'
         +       '<div class="t-nombre">' + esc(c.nombre) + '</div>'
         +       '<div class="t-sub">' + numero(rr.sitios) + ' ' + plural(rr.sitios,'sitio','sitios')
         +         (c.contacto ? ' · ' + esc(c.contacto) : '') + '</div>'
         +     '</div>'
         +   '</div>'
         +   '<div class="t-chips">' + chips + '</div>'
         +   '<div class="t-datos">'
         +     '<div class="t-dato"><div class="d-label">Mensualidad</div><div class="d-valor">' + dinero(rr.mrr) + '</div></div>'
         +     '<div class="t-dato"><div class="d-label">Sitios activos</div><div class="d-valor">' + numero(rr.sitiosActivos) + ' de ' + numero(rr.sitios) + '</div></div>'
         +   '</div>'
         +   '<div class="t-pie">'
         +     '<button type="button" class="btn btn-suave btn-mini" data-ver="' + esc(c.id) + '">Ver sitios →</button>'
         +     '<span class="espacio"></span>'
         +     '<button type="button" class="btn btn-suave btn-mini" data-editar-cliente="' + esc(c.id) + '" title="Editar cliente">' + ICONO.lapiz + '</button>'
         /* Borrar del tablero es de Admin para arriba, decidido por Santiago el
            19-ago-2026: capturar y corregir es el trabajo del día —cualquiera con
            permiso de editar lo hace— pero eliminar un registro ya creado se lleva
            de golpe su historial y no hay deshacer. Un cliente arrastra además sus
            sitios, y con la colección compartida, su póliza de mantenimiento. */
         +     (esAdmin()
                ? '<button type="button" class="btn btn-peligro btn-mini" data-borrar-cliente="' + esc(c.id) + '" title="Eliminar cliente">' + ICONO.basura + '</button>'
                : '')
         +   '</div>'
         + '</div>';
  }).join('') + '</div>';

  return h;
}

/* ------------------------------- Vista: sitios ------------------------------- */
function vistaCliente(){
  const c = clientePorId(estado.clienteId);
  if(!c){ estado.vista = 'clientes'; return vistaClientes(); }
  const todos = sitiosDe(c.id);

  /* Los filtros deciden qué sitios entran a los indicadores y a la lista.
     Si lo elegido ya no existe, se regresa a "todos". */
  if(estado.sitioFiltro && !todos.some(s => s.id === estado.sitioFiltro)) estado.sitioFiltro = '';
  const encargados = [...new Set(todos.map(s => s.encargado.nombre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  if(estado.encargadoFiltro && estado.encargadoFiltro !== '__sin__' && !encargados.includes(estado.encargadoFiltro)){
    estado.encargadoFiltro = '';
  }

  let ss = todos;
  if(estado.encargadoFiltro){
    ss = ss.filter(s => estado.encargadoFiltro === '__sin__'
      ? !s.encargado.nombre
      : s.encargado.nombre === estado.encargadoFiltro);
  }
  if(estado.sitioFiltro) ss = ss.filter(s => s.id === estado.sitioFiltro);

  const r = resumir(ss);
  const rTodos = resumir(todos);
  const filtrando = !!(estado.sitioFiltro || estado.encargadoFiltro);
  let h = '';

  h += botonRegresar();

  h += '<div class="titulo-zona">'
     + '<div style="display:flex; align-items:center; gap:14px">'
     +   avatarCliente(c, 52)
     +   '<div>'
     +   '<h2>' + esc(c.nombre) + '</h2>'
     +   '<p>' + numero(rTodos.sitios) + ' ' + plural(rTodos.sitios,'sitio','sitios')
     +   ' · ' + numero(rTodos.forpass) + ' ' + plural(rTodos.forpass,'Forpass activo','Forpass activos')
     +   (c.contacto ? ' · ' + esc(c.contacto) : '') + '</p>'
     + '</div></div><div class="acciones">'
     +   '<button type="button" class="btn btn-suave btn-mini" data-accion="excel-cliente">' + ICONO.excel + 'Excel de este cliente</button>'
     +   '<button type="button" class="btn btn-primario" data-accion="nuevo-sitio">' + ICONO.mas + 'Agregar sitio</button>'
     + '</div></div>';

  /* Filtros: siempre presentes en cuanto haya al menos un sitio, para que la
     vista se comporte igual en todos los clientes. */
  if(todos.length){
    const opcSitios = todos.slice().sort((a,b)=> a.nombre.localeCompare(b.nombre,'es')).map(s =>
      '<option value="' + esc(s.id) + '"' + (s.id === estado.sitioFiltro ? ' selected' : '') + '>'
      + esc(s.nombre) + (s.zona ? ' · ' + esc(s.zona) : '') + ' — ' + dinero(s.mensualidad) + '/mes</option>').join('');

    const sinAsignar = todos.filter(s => !s.encargado.nombre).length;
    const opcEncargados = encargados.map(n =>
      '<option value="' + esc(n) + '"' + (n === estado.encargadoFiltro ? ' selected' : '') + '>'
      + esc(n) + ' (' + todos.filter(s => s.encargado.nombre === n).length + ')</option>').join('')
      + (sinAsignar
          ? '<option value="__sin__"' + (estado.encargadoFiltro === '__sin__' ? ' selected' : '') + '>'
            + 'Sin asignar (' + sinAsignar + ')</option>'
          : '');

    h += '<div class="barra-busca">'
       +   '<label for="filtroSitio" style="font-size:12.5px; color:var(--gray); align-self:center; font-weight:600">Ver:</label>'
       +   '<select id="filtroSitio" style="flex:1; min-width:200px">'
       +     '<option value="">Todos los sitios (' + todos.length + ')</option>' + opcSitios
       +   '</select>'
       +   '<label for="filtroEncargado" style="font-size:12.5px; color:var(--gray); align-self:center; font-weight:600">A cargo de:</label>'
       +   '<select id="filtroEncargado" style="flex:1; min-width:180px">'
       +     '<option value="">Cualquiera</option>' + opcEncargados
       +   '</select>'
       +   (filtrando ? '<button type="button" class="btn btn-suave btn-mini" data-accion="limpiar-filtros">Quitar filtros</button>' : '')
       + '</div>';
  }

  const pieMrr = filtrando
    ? (ss.length === 1 ? 'Solo este sitio' : 'Solo los ' + ss.length + ' filtrados')
      + ' · ' + dinero(rTodos.mrr) + ' entre todos'
    : 'Sitios activos (sin IVA)';

  h += '<div class="kpis">'
     + tarjetaKpi('Forpass activos', numero(r.forpass), r.sitiosActivos + ' ' + plural(r.sitiosActivos,'sitio activo','sitios activos'), 'k-ok')
     + tarjetaKpi('Mensualidad total', dinero(r.mrr), pieMrr)
     + tarjetaKpi('Mensualidades vencidas', numero(r.mensualidadesAtrasadas), r.adeudo ? dinero(r.adeudo) + ' por cobrar' : 'Nada pendiente', r.mensualidadesAtrasadas ? 'k-error' : '', r.mensualidadesAtrasadas ? 'ver-atrasados-cliente' : '')
     + tarjetaKpi('Vigencias por vencer', numero(r.porVencer), 'Terminan en 45 días', r.porVencer ? 'k-alerta' : '', 'ver-por-vencer-cliente')
     + '</div>';

  if(!todos.length){
    h += vistaVacia('credencial','Este cliente aún no tiene sitios','Registra un sitio (por ejemplo MXCD13) con sus Forpass, la mensualidad, la vigencia y si incluyó viáticos u onboarding.','nuevo-sitio','Agregar sitio');
    return h;
  }

  const ordenados = ss.slice().sort((a,b)=>{
    const ca = calcular(a), cb = calcular(b);
    const peso = t => t === 'error' ? 0 : t === 'alerta' ? 1 : t === 'ok' ? 2 : 3;
    return peso(ca.tono) - peso(cb.tono) || a.nombre.localeCompare(b.nombre, 'es');
  });

  h += '<div class="grid grid-sitios' + (animarTarjetas ? '' : ' sin-entrada') + '">' + ordenados.map((s,i)=> tarjetaSitio(s, i)).join('') + '</div>';
  return h;
}

function tarjetaSitio(s, i){
  const c = calcular(s);
  const clasePunto = c.tono === 'error' ? 'p-error late' : c.tono === 'alerta' ? 'p-alerta' : (c.activo ? 'p-ok' : 'p-neutro');
  const claseIns = c.tono === 'error' ? 'i-error' : c.tono === 'alerta' ? 'i-alerta' : c.tono === 'ok' ? 'i-ok' : 'i-neutro';

  /* Siguiente pago: se muestra el MONTO como dato principal y la fecha abajo.
     Así el analista ve de una lo que hay que cobrar, sin cuentas mentales. */
  const iSig = s.pagos.findIndex(p => !p);
  let txtProx = 'Contrato cubierto', tonoProx = 'ok', pieProx = 'Las ' + s.meses + ' mensualidades están pagadas';
  if(c.proximo){
    txtProx = dinero(c.montos[iSig]);
    const cuando = fmtFecha(c.proximo) + ' · mensualidad ' + (iSig + 1);
    if(c.diasRest < 0){ tonoProx = 'error'; pieProx = cuando + ' · vencida hace ' + Math.abs(c.diasRest) + ' ' + plural(Math.abs(c.diasRest),'día','días'); }
    else if(c.diasRest === 0){ tonoProx = 'error'; pieProx = cuando + ' · se vence hoy'; }
    else{ tonoProx = c.diasRest <= 7 ? 'alerta' : 'ok'; pieProx = cuando + ' · faltan ' + c.diasRest + ' ' + plural(c.diasRest,'día','días'); }
  }

  const casillas = s.pagos.map((p,idx)=>{
    const cl = p ? 'pagado' : (idx < c.debidas ? 'debido' : '');
    const fecha = fmtFecha(sumarMeses(s.fechaInicio, idx));
    const detalle = 'Mensualidad ' + (idx+1) + ' · ' + fecha + ' · ' + dinero(c.montos[idx])
                  + (idx === 0 && c.extras ? ' (incluye onboarding y viáticos)' : '')
                  + (p ? ' · pagada' : ' · sin pagar');
    return '<button type="button" class="mes ' + cl + '" data-pago="' + esc(s.id) + '" data-idx="' + idx + '" '
         + 'title="' + esc(detalle) + '" aria-label="' + esc(detalle) + '" '
         + 'aria-pressed="' + (p ? 'true' : 'false') + '">' + (idx+1) + '</button>';
  }).join('');

  /* Etiqueta del encargado, asomando por el borde de arriba. Todos la ven;
     solo Owner y Admin la pueden cambiar, así que para los demás no es botón. */
  const enc = s.encargado.nombre;
  const etiquetaEnc = esAdmin()
    ? '<button type="button" class="encargado' + (enc ? '' : ' vacio') + '" data-encargado="' + esc(s.id) + '" '
      + 'title="' + (enc ? esc('A cargo de ' + enc + '. Clic para cambiar.') : 'Asignar un encargado') + '">'
      + ICONO.persona + '<span>' + esc(enc || 'Sin asignar') + '</span></button>'
    : '<div class="encargado' + (enc ? '' : ' vacio') + '" '
      + 'title="' + (enc ? esc('A cargo de ' + enc) : 'Sin encargado asignado') + '">'
      + ICONO.persona + '<span>' + esc(enc || 'Sin asignar') + '</span></div>';

  return '<div class="tarjeta t-' + c.tono + '" style="--d:' + (i*45) + 'ms">'
       +   etiquetaEnc
       +   '<div class="t-cabeza">'
       +     '<div style="flex:1; min-width:0">'
       +       '<div class="t-nombre" style="display:flex; align-items:center; gap:9px">'
       +         '<span class="punto ' + clasePunto + '"></span>' + esc(s.nombre)
       +         '<span class="t-iconos">'
       +           '<button type="button" class="icono-btn' + (s.contactos.length ? '' : ' sin-datos') + '" '
       +             'data-contactos="' + esc(s.id) + '" '
       +             'title="' + (s.contactos.length
                        ? esc('Quién manda la OC: ' + s.contactos.map(x=>x.nombre || x.correo).filter(Boolean).join(', '))
                        : 'Falta registrar quién nos manda la OC') + '" '
       +             'aria-label="Contacto de la OC en ' + esc(s.nombre) + '">' + ICONO.persona + '</button>'
       +           '<button type="button" class="icono-btn" data-plan="' + esc(s.id) + '" '
       +             'title="Ver el plan de pagos mes por mes" aria-label="Plan de pagos de ' + esc(s.nombre) + '">'
       +             '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>'
       +           '</button>'
       /* El puente de vuelta, solo si este kiosco tiene póliza ligada: de aquí
          se brinca a su mantenimiento y de allá se regresa. */
       +           (datos.polizas.some(q => q.sitioId === s.id)
                    ? '<button type="button" class="icono-btn" data-ir-poliza-sitio="' + esc(s.id) + '" '
                      + 'title="Ver su póliza de mantenimiento" aria-label="Póliza de ' + esc(s.nombre) + '">'
                      + ICONO.credencial + '</button>'
                    : '')
       +         '</span>'
       +       '</div>'
       +       '<div class="t-sub">'
       +         (s.zona ? '<span class="chip-zona z-' + esc(s.color) + '">' + esc(s.zona) + '</span>' : '')
       +         numero(s.modulos) + ' Forpass'
       +         (c.activo ? plural(s.modulos,' activo',' activos') : ' · ' + ETIQUETA_ESTADO[s.estado] + (c.vigente ? '' : ' · vigencia terminada'))
       +         ' · ' + ETIQUETA_TIPO[s.tipo] + '</div>'
       +     '</div>'
       +     '<span class="insignia ' + claseIns + '">' + esc(c.estatus) + '</span>'
       +   '</div>'

       +   '<div class="t-datos">'
       +     '<div class="t-dato"><div class="d-label">Siguiente pago</div><div class="d-valor ' + tonoProx + '">' + esc(txtProx) + '</div><div class="d-label" style="text-transform:none; letter-spacing:0; font-weight:500; margin-top:2px">' + esc(pieProx) + '</div></div>'
       +     '<div class="t-dato"><div class="d-label">Mensualidad</div><div class="d-valor">' + dinero(s.mensualidad) + '</div></div>'
       +     '<div class="t-dato"><div class="d-label">Inicio</div><div class="d-valor chico">' + fmtFecha(s.fechaInicio) + '</div></div>'
       +     '<div class="t-dato"><div class="d-label">Vigencia</div><div class="d-valor chico">' + fmtFecha(c.fin)
       +       '</div><div class="d-label" style="text-transform:none; letter-spacing:0; font-weight:500; margin-top:2px">'
       +       (c.vigente ? 'Faltan ' + c.diasVigencia + ' ' + plural(c.diasVigencia,'día','días') : 'Terminó hace ' + Math.abs(c.diasVigencia) + ' ' + plural(Math.abs(c.diasVigencia),'día','días'))
       +       '</div></div>'
       +   '</div>'

       +   '<div class="progreso">'
       +     '<div class="p-cabeza"><span>Mensualidades pagadas</span><span>' + c.pagados + ' de ' + s.meses
       +       (c.atrasadas ? ' · <b style="color:#a5322e">' + c.atrasadas + ' vencida' + (c.atrasadas===1?'':'s') + '</b>' : '') + '</span></div>'
       +     '<div class="meses">' + casillas + '</div>'
       +   '</div>'

       +   (s.notas ? '<div class="t-nota">' + esc(s.notas) + '</div>' : '')

       +   '<div class="t-pie">'
       +     (c.proximo ? '<button type="button" class="btn btn-verde btn-mini" data-marcar="' + esc(s.id) + '">' + ICONO.cheque + 'Marcar pagada</button>' : '')
       +     '<span class="espacio"></span>'
       +     '<button type="button" class="btn btn-suave btn-mini" data-editar-sitio="' + esc(s.id) + '">' + ICONO.lapiz + 'Editar</button>'
       /* Mismo criterio que el cliente: borrar un sitio se lleva su historial de
          pagos y sus OC, y eso no se deshace. */
       +     (esAdmin()
              ? '<button type="button" class="btn btn-peligro btn-mini" data-borrar-sitio="' + esc(s.id) + '" title="Eliminar sitio">' + ICONO.basura + '</button>'
              : '')
       +   '</div>'
       + '</div>';
}

/* ------------------------------ Vista: pólizas ------------------------------
   Pinta RESÚMENES y nada más. Las partidas se ven solo en el detalle: cuarenta
   pólizas de setenta y nueve renglones serían ~3,000 renglones de HTML en CADA
   render(), y render() corre completo también en el refresco de 30 s.
   --------------------------------------------------------------------------- */

/* Suma de un conjunto de pólizas, para los indicadores de arriba. Gemelo de
   resumir(), pero aparte: una póliza no tiene módulos ni mensualidad. */
function resumirPolizas(lista){
  const r = { total:lista.length, activas:0, valorActivo:0, enLaCalle:0, montoEnLaCalle:0,
              esperaLarga:0, tocanEsteMes:0, atrasados:0, cobroAtrasado:0, porVencer:0, borradores:0 };
  lista.forEach(p=>{
    const c = calcularPoliza(p);
    if(c.activa){
      r.activas++; r.valorActivo += c.precioAnual;
      r.tocanEsteMes += c.tocanEsteMes; r.atrasados += c.atrasados;
      if(c.cobrosAtrasados) r.cobroAtrasado++;
      if(c.diasVigencia >= 0 && c.diasVigencia <= 45) r.porVencer++;
    }
    if(p.estatus === 'enviada'){
      r.enLaCalle++; r.montoEnLaCalle += c.precioAnual;
      /* Más de tres semanas sin respuesta: eso es lo accionable, no el conteo. */
      if(c.diasEsperando !== null && c.diasEsperando > 21) r.esperaLarga++;
    }
    if(p.estatus === 'cotizacion') r.borradores++;
  });
  return r;
}

/* Nombre presentable de una póliza: el sitio manda porque es lo que se imprime. */
function tituloPoliza(p){
  const cli = clientePorId(p.clienteId);
  const sitio = p.sitioNombre || p.folio || 'Póliza';
  if(!cli) return sitio;
  /* La misma regla que el documento impreso: si el sitio ya trae el nombre del
     cliente adentro —«Prolec» / «Prolec Planta 1»— repetirlo es ruido. En la
     agenda se veía triple: «Prolec Planta 1 · Prolec · Prolec». Buscar por el
     nombre del cliente sigue funcionando: si el título lo omite es porque el
     sitio ya empieza con él. */
  if(llaveTexto(sitio).startsWith(llaveTexto(cli.nombre))) return sitio;
  return sitio + ' · ' + cli.nombre;
}

function vistaPolizas(){
  const r = resumirPolizas(datos.polizas);
  let h = '';

  h += '<div class="titulo-zona"><div>'
     +   '<h2>Pólizas de mantenimiento</h2>'
     +   '<p>' + numero(r.total) + ' ' + plural(r.total,'póliza','pólizas')
     +   ' · ' + numero(r.activas) + ' ' + plural(r.activas,'activa','activas') + '</p>'
     + '</div><div class="acciones">'
     /* Mientras no haya pólizas, el único botón es el del estado vacío: dos
        "Nueva cotización" en la misma pantalla es preguntar lo mismo dos veces. */
     +   (datos.polizas.some(p => p.estatus === 'activa')
          ? '<button type="button" class="btn btn-suave btn-mini" data-accion="ver-agenda" '
            + 'title="Qué mantenimientos tocan, en todas las pólizas">' + ICONO.calendario + 'Agenda</button>'
          : '')
     +   '<button type="button" class="btn btn-suave btn-mini" data-accion="ver-precios">' + ICONO.credencial + 'Lista de precios</button>'
     /* Las cotizaciones viejas ya existen en JSON: se cargan, no se recapturan. */
     +   (puedeEditar()
          ? '<button type="button" class="btn btn-suave btn-mini" data-accion="importar-polizas" '
            + 'title="Cargar una cotización ya extraída de su PDF">' + ICONO.subir + 'Importar JSON</button>'
          : '')
     +   (datos.polizas.length && puedeEditar()
          ? '<button type="button" class="btn btn-primario" data-accion="nueva-poliza">' + ICONO.mas + 'Nueva cotización</button>'
          : '')
     + '</div></div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Pólizas activas', numero(r.activas), dineroCent(r.valorActivo) + ' al año', r.activas ? 'k-ok' : '')
     + tarjetaKpi('En espera de confirmar', numero(r.enLaCalle),
         r.enLaCalle ? dineroCent(r.montoEnLaCalle) + ' esperando respuesta' : 'Nada enviado sin contestar',
         r.esperaLarga ? 'k-alerta' : '')
     /* Se ofrecen para abrir SOLO cuando hay algo que ver: un «Ver cuáles» con cero
        adentro decepciona, y es la misma regla que siguen los de cobranza. */
     + tarjetaKpi('Servicios este mes', numero(r.tocanEsteMes), 'Mantenimientos que tocan y siguen sin hacerse',
         r.tocanEsteMes ? 'k-alerta' : '', r.tocanEsteMes ? 'ver-agenda-pendiente' : '')
     + tarjetaKpi('Servicios atrasados', numero(r.atrasados), 'Meses ya cumplidos sin registrar',
         r.atrasados ? 'k-error' : '', r.atrasados ? 'ver-agenda-pendiente' : '')
     + '</div>';

  h += avisoLocal();

  if(!datos.polizas.length){
    h += vistaVacia('edificio', 'Todavía no hay pólizas',
          'Cotiza una póliza de mantenimiento: agrega los equipos con su cantidad, precio y cuántos servicios al año lleva cada uno.',
          'nueva-poliza', 'Nueva cotización');
    return h;
  }

  h += '<div class="barra-busca">'
     +   '<input type="search" id="buscaPoliza" placeholder="Buscar por sitio, cliente o folio…" value="' + esc(estado.busca) + '">'
     +   '<select id="filtroPoliza">'
     +     '<option value="todos">Todas</option>'
     +     '<option value="activas">Solo activas</option>'
     +     '<option value="calle">Solo en la calle</option>'
     +     '<option value="pendientes">Con servicios pendientes</option>'
     +   '</select>'
     + '</div>';

  const q = estado.busca.trim().toLowerCase();
  const lista = datos.polizas.filter(p=>{
    if(q && !tituloPoliza(p).toLowerCase().includes(q) && !p.folio.toLowerCase().includes(q)) return false;
    const c = calcularPoliza(p);
    if(estado.filtro === 'activas' && !c.activa) return false;
    if(estado.filtro === 'calle' && p.estatus !== 'enviada') return false;
    if(estado.filtro === 'pendientes' && !(c.tocanEsteMes || c.atrasados)) return false;
    return true;
  });

  if(!lista.length){
    h += '<div class="vacio"><h3>Sin resultados</h3><p>Ninguna póliza coincide con la búsqueda o el filtro.</p></div>';
    return h;
  }

  h += '<div class="grid' + (animarTarjetas ? '' : ' sin-entrada') + '">' + lista.map((p,i)=>{
    const c = calcularPoliza(p);
    const cli = clientePorId(p.clienteId);

    /* La insignia principal es el estado. Cuando hay una cuenta detrás, el número
       va DENTRO de ella: "Servicios atrasados" seguido de "8 servicios atrasados"
       es decir dos veces lo mismo, y ocupa el doble. */
    let principal = c.estado;
    if(c.estado === 'Servicios atrasados') principal = c.atrasados + ' ' + plural(c.atrasados,'servicio atrasado','servicios atrasados');
    else if(c.estado === 'Toca este mes')  principal = c.tocanEsteMes + ' ' + plural(c.tocanEsteMes,'servicio este mes','servicios este mes');

    let chips = '<span class="insignia i-' + c.tono + '">'
              + '<span class="punto p-' + c.tono + '"></span>' + esc(principal) + '</span>';

    /* Las secundarias solo agregan lo que la principal NO alcanzó a decir: el
       semáforo se queda con un motivo y los demás se perderían. */
    if(p.estatus === 'enviada' && c.diasEsperando !== null){
      chips += '<span class="insignia ' + (c.diasEsperando > 21 ? 'i-alerta' : 'i-info') + '">'
             + c.diasEsperando + ' ' + plural(c.diasEsperando,'día','días') + ' esperando</span>';
    }
    if(c.activa && c.cobrosAtrasados && c.estado !== 'Cobro atrasado') chips += '<span class="insignia i-error">Cobro atrasado</span>';
    if(c.activa && c.tocanEsteMes && c.estado !== 'Toca este mes') chips += '<span class="insignia i-alerta">' + c.tocanEsteMes + ' este mes</span>';
    if(c.huerfanos) chips += '<span class="insignia i-info">' + c.huerfanos + ' fuera de calendario</span>';
    /* Una cotización que no cuadra no se puede cerrar; si ya se mandó, peor. */
    if(!c.cerrable && (p.estatus === 'cotizacion' || p.estatus === 'enviada')) chips += '<span class="insignia i-alerta">Renglones sin cuadrar</span>';

    return '<div class="tarjeta tarjeta-clic t-' + c.tono + '" data-poliza="' + esc(p.id) + '" style="--d:' + (i*45) + 'ms" tabindex="0" role="button">'
         +   '<div class="t-cabeza">'
         +     (cli
                 ? (puedeEditar()
                     /* El avatar es el atajo a la foto: es donde el ojo la busca. */
                     ? '<button type="button" class="avatar-btn" data-editar-cliente="' + esc(cli.id) + '" '
                       + 'data-tip="' + (cli.logo ? 'Cambiar logo' : 'Subir logo') + '">' + avatarCliente(cli) + '</button>'
                     : avatarCliente(cli))
                 : '<div class="t-avatar">' + esc(iniciales(p.sitioNombre)) + '</div>')
         +     '<div style="flex:1; min-width:0">'
         +       '<div class="t-nombre">' + esc(p.sitioNombre || p.folio || 'Póliza') + '</div>'
         +       '<div class="t-sub">' + esc(cli ? cli.nombre : 'Sin cliente ligado')
         +         (p.folio ? ' · ' + esc(p.folio) : '') + '</div>'
         +     '</div>'
         +   '</div>'
         +   '<div class="t-chips">' + chips + '</div>'
         +   '<div class="t-datos">'
         /* Al centavo, como el detalle: la tarjeta decía $737,135 y adentro
            $737,134.80 — dos números para la misma póliza. */
         +     '<div class="t-dato"><div class="d-label">Precio anual</div><div class="d-valor">' + dineroCent(c.precioAnual) + '</div></div>'
         +     '<div class="t-dato"><div class="d-label">Servicios</div><div class="d-valor">' + c.hechos + ' de ' + c.programados + '</div></div>'
         +   '</div>'
         +   '<div class="t-pie">'
         +     '<button type="button" class="btn btn-suave btn-mini" data-ver-poliza="' + esc(p.id) + '">Ver detalle →</button>'
         +     '<button type="button" class="btn btn-suave btn-mini" data-calendario="' + esc(p.id) + '" '
         +       'title="Qué equipos se atienden cada mes">' + ICONO.calendario + '</button>'
         +     '<span class="espacio"></span>'
         /* Editar y borrar SOLO con permiso. Al Viewer no se le enseñan botones
            que el servidor le va a negar: la interfaz debe decir la verdad de lo
            que puede hacer, no ofrecerle callejones sin salida. Ver el detalle,
            el calendario y el documento sí los tiene: son lectura. */
         +     (puedeEditar()
                ? '<button type="button" class="btn btn-suave btn-mini" data-editar-poliza="' + esc(p.id) + '" title="Editar póliza">' + ICONO.lapiz + '</button>'
                : '')
         /* Borrar es de Admin SIEMPRE: la regla del servidor niega todo delete
            de pólizas a quien no lo es, sin importar el estatus. El botón se le
            ofrecía a un Analyst, la póliza desaparecía de su pantalla, y el 403
            la resucitaba al recargar. */
         +     (esAdmin()
                ? '<button type="button" class="btn btn-peligro btn-mini" data-borrar-poliza="' + esc(p.id) + '" title="Eliminar póliza">' + ICONO.basura + '</button>'
                : '')
         +   '</div>'
         + '</div>';
  }).join('') + '</div>';

  return h;
}

/* Detalle de una póliza. ESTE es el único lugar donde se pintan las partidas:
   en la lista serían miles de renglones de HTML en cada render(). */
function vistaPoliza(){
  const p = polizaPorId(estado.polizaId);
  if(!p){ estado.vista = 'polizas'; return vistaPolizas(); }
  const c = calcularPoliza(p);
  const cli = clientePorId(p.clienteId);
  const sitio = p.sitioId ? sitioPorId(p.sitioId) : null;

  let h = botonRegresarPolizas();

  h += '<div class="titulo-zona"><div>'
     +   '<h2>' + esc(p.sitioNombre || p.folio || 'Póliza') + '</h2>'
     +   '<p>' + esc(cli ? cli.nombre : 'Sin cliente ligado')
     +     (p.folio ? ' · ' + esc(p.folio) : '')
     +     ' · <b>' + esc(ETIQUETA_ESTATUS[p.estatus]) + '</b>'
     /* El semáforo solo se agrega si dice algo distinto del estatus. En cuatro
        de los cinco el texto es el mismo —«En espera de confirmar» dos veces— porque
        solo una póliza activa se juzga por servicios, cobranza y vigencia. */
     +     (c.estado === ETIQUETA_ESTATUS[p.estatus] ? '' : ' · ' + esc(c.estado)) + '</p>'
     + '</div><div class="acciones">'
     +   '<button type="button" class="btn btn-suave btn-mini" data-accion="calendario-poliza">' + ICONO.calendario + 'Calendario</button>'
     /* Imprimir va en TODOS los estatus y para TODOS los roles: una cotización
        se imprime antes de aprobarse o aunque nunca se venda, y el estatus solo
        cambia el título de portada (eso ya lo resuelve el payload). */
     +   '<button type="button" class="btn btn-suave btn-mini" data-accion="imprimir-poliza" '
     +     'title="Abre el documento en otra pestaña, listo para guardarse como PDF">' + ICONO.imprimir + 'Imprimir</button>'
     +   (puedeEditar() ? '<button type="button" class="btn btn-primario" data-accion="editar-poliza">' + ICONO.lapiz + 'Editar</button>' : '')
     + '</div></div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Precio anual', dineroCent(c.precioAnual), p.partidas.length + ' ' + plural(p.partidas.length,'equipo','equipos'))
     + tarjetaKpi('Precio mensual', dineroCent(c.precioMensual), 'Anual ÷ ' + MESES_POLIZA)
     + tarjetaKpi('Servicios', c.hechos + ' de ' + c.programados,
         c.atrasados ? c.atrasados + ' ' + plural(c.atrasados,'atrasado','atrasados') : 'Sin atrasos', c.atrasados ? 'k-error' : '')
     + tarjetaKpi('Vigencia', fmtFecha(p.fechaInicio) + ' → ' + fmtFecha(c.fin),
         c.vigente ? 'Faltan ' + c.diasVigencia + ' ' + plural(c.diasVigencia,'día','días') : 'Terminada')
     + '</div>';

  if(c.noCuadran){
    h += '<div class="aviso" style="border-left-color:var(--alerta)">' + ICONO.info
       + '<div><b>' + c.noCuadran + ' ' + plural(c.noCuadran,'renglón no cuadra','renglones no cuadran') + '</b> entre '
       + 'los meses marcados y los servicios al año. Se puede guardar así, pero no cerrar la póliza como activa.</div></div>';
  }

  /* --- Datos de la cotización --- */
  h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Cotización</h3></div></div>'
     /* El logo y el botón viven aquí porque es el único lugar del módulo donde se
        puede abrir modalCliente sin destruir una captura en curso: el recortador
        con zoom es el de Forpass, tal cual, sin duplicar nada. */
     + '<div class="c-fila"><span>Cliente</span><b style="display:flex; align-items:center; gap:9px">'
     +   (cli ? avatarCliente(cli, 28) : '')
     +   esc(cli ? cli.nombre : '—')
     +   (cli && puedeEditar()
         ? '<button type="button" class="btn btn-suave btn-mini" data-editar-cliente="' + esc(cli.id) + '" '
           + 'title="Editar el cliente y subir su logo">' + ICONO.lapiz + (cli.logo ? 'Cambiar logo' : 'Subir logo') + '</button>'
         : '')
     + '</b></div>'
     + '<div class="c-fila"><span>Sitio</span><b>' + esc(p.sitioNombre || '—')
     /* Con kiosco ligado, el paréntesis gris se vuelve el puente al otro módulo.
        Sin kiosco no se dibuja nada: un botón muerto es peor que ninguno. */
     +   (sitio
          ? ' <button type="button" class="enlace-modulo" data-ir-sitio="' + esc(sitio.id) + '" '
            + 'title="Ver su kiosco Forpass: mensualidad, pagos y vigencia">'
            + ICONO.credencial + 'Ver su kiosco Forpass</button>'
          : '') + '</b></div>'
     + '<div class="c-fila"><span>Fecha de cotización</span><b>' + fmtFecha(p.fechaCotizacion) + '</b></div>'
     + (p.fechaEnvio ? '<div class="c-fila"><span>Enviada</span><b>' + fmtFecha(p.fechaEnvio)
         + (c.diasEsperando !== null && p.estatus === 'enviada' ? ' · ' + c.diasEsperando + ' ' + plural(c.diasEsperando,'día','días') + ' esperando' : '') + '</b></div>' : '')
     + (p.fechaCierre ? '<div class="c-fila"><span>Cerrada</span><b>' + fmtFecha(p.fechaCierre)
         + ' <span class="pista" style="display:inline">precios congelados</span></b></div>' : '')
     + '<div class="c-fila"><span>Facturación</span><b>' + (p.facturacion === 'mensual' ? 'Mensual — doce cobros' : 'Anual — un solo cobro') + '</b></div>'
     + '<div class="c-fila"><span>Vendedor</span><b>' + esc(p.vendedor.nombre || '—')
     +   (p.vendedor.telefono ? ' · ' + esc(p.vendedor.telefono) : '') + '</b></div>'
     + (p.notas ? '<div class="c-fila"><span>Notas</span><b style="font-weight:500; text-align:right">' + esc(p.notas) + '</b></div>' : '')
     + '</div>';

  /* --- Los renglones ---
     Los meses son BOTONES cuando se puede editar: es donde se marca que un
     mantenimiento ya se hizo. Mismo molde que las casillas de cobro. */
  const marcable = puedeEditar();
  h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Equipos cotizados</h3>'
     + '<p>El total de cada renglón se calcula: precio × cantidad × servicios al año. Nunca se captura.'
     + (marcable ? ' Pica un mes para registrar que ese mantenimiento ya se hizo.' : '') + '</p>'
     + '</div></div><div class="rodillo"><table class="tabla">'
     + '<thead><tr><th>#</th><th>Concepto</th><th>Marca</th><th>Cant.</th>'
     + '<th>P. unitario</th><th>Serv./año</th><th>Meses</th><th>Total</th></tr></thead><tbody>'
     + p.partidas.map((x,i)=>{
         const fuera = serviciosFueraDeCalendario(p, x);
         const chip = (m, tono, aviso) => {
           const etiqueta = etiquetaMesServicio(p.fechaInicio, m);
           /* El segurista no se marca: sus meses son presencia incluida, no
              mantenimientos. Chip plano, sin botón, que lo diga. */
           if(esSegurista(x)){
             return '<span class="chip-zona z-gris" title="Incluye segurista en '
               + esc(etiqueta) + ' — es presencia, no lleva registro de mantenimiento">'
               + esc(etiqueta) + '</span>';
           }
           const hecho = servicioDetalle(p, x, m);
           /* Servicio a medias —2 de 3 unidades— se distingue de completo: chip
              ámbar con la fracción adentro, y el porqué en el globito. */
           const parcial = hecho && x.cantidad > 1 && (hecho.hechas || x.cantidad) < x.cantidad;
           if(parcial) tono = 'z-ambar';
           const tip = etiqueta + (hecho ? ' · hecho el ' + fmtFecha(hecho.cuando)
                                            + (hecho.quien ? ' · ' + hecho.quien : '')
                                            + (parcial ? ' · ' + hecho.hechas + ' de ' + x.cantidad
                                                + (hecho.motivo ? ' · faltó: ' + hecho.motivo : '') : '')
                                         : ' · pendiente')
                     + (aviso ? ' · fuera del calendario' : '')
                     + (marcable ? (hecho ? ' — pica para corregirlo' : ' — pica para marcarlo hecho') : '');
           const dentro = esc(etiqueta) + (parcial ? ' ' + hecho.hechas + '/' + x.cantidad : '') + (aviso ? ' ⚠' : '');
           return marcable
             ? '<button type="button" class="chip-zona chip-mes ' + tono + '" title="' + esc(tip) + '" '
               + 'data-servicio="' + esc(p.id) + '" data-partida="' + esc(x.id) + '" data-mes="' + m + '">' + dentro + '</button>'
             : '<span class="chip-zona ' + tono + '" title="' + esc(tip) + '">' + dentro + '</span>';
         };
         const meses = x.mesesServicio.map(m => chip(m, servicioHecho(p,x,m) ? 'z-verde' : 'z-gris', false)).join(' ')
           + fuera.map(m => chip(m, 'z-ambar', true)).join(' ');
         return '<tr>'
           + '<td>' + (i+1) + '</td>'
           + '<td><b>' + esc(x.concepto) + '</b>'
           +   (descripcionDe(x) ? '<div class="pista">' + esc(descripcionDe(x)) + '</div>' : '') + '</td>'
           + '<td>' + esc(x.marca || '—') + '</td>'
           + '<td>' + numero(x.cantidad) + '</td>'
           + '<td>' + dineroCent(x.precioUnitario) + '</td>'
           + '<td>' + x.frecuencia + (cuadraFrecuencia(x) ? '' : ' <b style="color:var(--error)">≠' + x.mesesServicio.length + '</b>') + '</td>'
           + '<td>' + meses + '</td>'
           + '<td><b>' + dineroCent(c.totales[i]) + '</b></td>'
           + '</tr>';
       }).join('')
     + '</tbody></table></div>'
     /* Con descuento se enseñan los tres renglones: sin el subtotal a la vista,
        el «Precio anual» no cuadra contra la suma de la columna de arriba y
        parece un error de la app. */
     + (c.descuento
         ? '<div class="c-fila" style="margin-top:12px"><span>Subtotal — suma de los renglones</span><b>' + dineroCent(c.subtotal) + '</b></div>'
           + '<div class="c-fila"><span>Descuento ' + c.descuento + '%</span><b style="color:var(--error)">−' + dineroCent(c.montoDescuento) + '</b></div>'
           + '<div class="c-fila"><span>Precio anual — ya con descuento</span><b>' + dineroCent(c.precioAnual) + '</b></div>'
         : '<div class="c-fila" style="margin-top:12px"><span>Precio anual — suma de los renglones</span><b>' + dineroCent(c.precioAnual) + '</b></div>')
     + '<div class="c-fila"><span>Precio mensual — anual ÷ ' + MESES_POLIZA + '</span><b>' + dineroCent(c.precioMensual) + '</b></div>'
     + '</div>';

  /* --- Cobranza --- */
  h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Cobranza</h3>'
     + '<p>' + (p.facturacion === 'mensual'
         ? 'Doce cobros. El último lleva el residuo del reparto para que la suma dé el anual al centavo.'
         : 'Un solo cobro al inicio de la vigencia.') + '</p></div></div>'
     + '<div class="c-fila"><span>Cobrado</span><b>' + dineroCent(c.cobrado) + ' de ' + dineroCent(c.precioAnual) + '</b></div>'
     + '<div class="c-fila"><span>Vencido sin cobrar</span><b' + (c.adeudo ? ' style="color:var(--error)"' : '') + '>' + dineroCent(c.adeudo) + '</b></div>'
     + '<div class="c-fila"><span>Casillas</span><b>' + c.cobrados + ' de ' + p.cobros.length + ' pagadas</b></div>'
     + '<div class="meses" style="margin-top:10px">'
     /* Las casillas se VEN siempre —el estado de cobranza es lectura— pero solo
        son botones con permiso: al Viewer no se le ofrece un clic que termina en
        «tu cuenta no puede hacer cambios». Mismo criterio que los chips de mes. */
     + p.cobros.map((ok,i)=>{
         const clase = 'mes' + (ok ? ' pagado' : (i < c.debidos ? ' debido' : ''));
         const tip = 'Cobro ' + (i+1) + ' · ' + dineroCent(c.montos[i])
             + (p.facturacion === 'mensual' ? ' · ' + fmtFecha(sumarMeses(p.fechaInicio, i)) : '')
             + (ok ? ' · pagado' + (p.cobrosDetalle[i].oc ? ' con OC ' + p.cobrosDetalle[i].oc : '')
                   : (i < c.debidos ? ' · vencido' : ' · por venir'))
             + (puedeEditar() ? ' — clic para capturar' : '');
         return puedeEditar()
           ? '<button type="button" class="' + clase + '" data-cobro="' + esc(p.id) + '" data-idx="' + i + '" '
             + 'title="' + esc(tip) + '">' + (i+1) + '</button>'
           : '<span class="' + clase + '" title="' + esc(tip) + '">' + (i+1) + '</span>';
       }).join('')
     + '</div>'
     + (puedeEditar()
         ? '<div class="pista" style="margin-top:8px">Pícale a una casilla para capturar su OC. '
           + 'Un cobro ya capturado se puede reabrir para corregirlo.</div>'
         : '')
     + (c.cobrados
         ? '<div class="rodillo" style="margin-top:14px"><table class="tabla">'
           + '<thead><tr><th>#</th><th>Monto</th><th>OC</th><th>Capturó</th><th>Cuándo</th><th>Factura</th></tr></thead><tbody>'
           + p.cobros.map((ok,i)=>{
               if(!ok) return '';
               const d = p.cobrosDetalle[i];
               return '<tr><td>' + (i+1) + '</td><td>' + dineroCent(c.montos[i]) + '</td>'
                 + '<td><b>' + esc(d.oc || '—') + '</b></td><td>' + esc(d.quien || '—') + '</td>'
                 + '<td>' + esc(d.cuando ? fechaHora(d.cuando) : '—') + '</td>'
                 + '<td>' + (d.facturado ? '<span class="insignia i-ok">Facturada</span>' : '<span class="insignia i-alerta">Sin facturar</span>') + '</td></tr>';
             }).join('')
           + '</tbody></table></div>'
         : '')
     + '</div>';

  return h;
}

/* --------------------------- Vista: lista de precios ---------------------------
   La ve todo el equipo porque el vendedor la necesita para cotizar; solo Owner y
   Admin la cambian, y eso sí lo exige el servidor por regla.
   ----------------------------------------------------------------------------- */
function vistaPrecios(){
  const puede = esAdmin();
  const lista = catalogo().slice().sort((a,b)=> a.concepto.localeCompare(b.concepto,'es'));
  const q = estado.busca.trim().toLowerCase();
  const vistos = q ? lista.filter(e => e.concepto.toLowerCase().includes(q)) : lista;
  const sinPrecio = lista.filter(e => !e.precio).length;

  let h = botonRegresarPolizas();

  h += '<div class="titulo-zona"><div>'
     +   '<h2>Lista de precios</h2>'
     +   '<p>' + numero(lista.length) + ' ' + plural(lista.length,'equipo','equipos')
     +   (puede ? ' · los precios de aquí se sugieren al cotizar y siempre se pueden cambiar en el renglón'
              : ' · solo un Admin puede cambiarlos') + '</p>'
     + '</div><div class="acciones">'
     +   (puede ? '<button type="button" class="btn btn-primario" data-accion="nuevo-equipo">' + ICONO.mas + 'Agregar equipo</button>' : '')
     + '</div></div>';

  if(sinPrecio){
    h += '<div class="aviso" style="border-left-color:var(--alerta)">' + ICONO.info
       + '<div><b>' + sinPrecio + ' ' + plural(sinPrecio,'equipo','equipos') + ' sin precio.</b> '
       + 'Aparecen en las descripciones de las cotizaciones viejas pero en ningún renglón con importe, '
       + 'así que quedaron en cero. Ponles precio antes de usarlos.</div></div>';
  }
  if(!datos.catalogo.length){
    h += '<div class="aviso" style="border-left-color:var(--gray)">' + ICONO.info
       + '<div>Esta lista todavía no está guardada en el servidor: es la de arranque, sacada de las '
       + 'cotizaciones de MXGT01, MXNL02, INOAC y NGK. '
       + (puede ? 'Guárdala para que la vea todo el equipo, o cambia cualquier precio y se guarda sola.' : 'Un Admin la va a guardar.')
       + (puede ? '<div style="margin-top:9px"><button type="button" class="btn btn-verde btn-mini" data-accion="guardar-catalogo">'
                  + ICONO.cheque + 'Guardar la lista en el servidor</button></div>' : '')
       + '</div></div>';
  }

  h += '<div class="barra-busca">'
     +   '<input type="search" id="buscaEquipo" placeholder="Buscar equipo…" value="' + esc(estado.busca) + '">'
     + '</div>';

  h += '<div class="bloque">'
     + (puede
         ? '<div class="bloque-cabeza"><div><h3>Qué hace cada botón</h3>'
           + '<p><b>Editar precio</b> cambia el precio, los servicios al año y la descripción de ese equipo. '
           + 'Es lo que se va a sugerir la próxima vez que alguien lo cotice; en la cotización siempre se puede poner otro.<br>'
           + '<b>Ya no ofrecer</b> lo saca del buscador de equipos al cotizar, sin borrarlo. '
           + 'Sirve para lo que dejaste de vender: las pólizas que ya lo tienen siguen mostrando su nombre y su descripción, '
           + 'y se puede volver a ofrecer cuando quieras.</p></div></div>'
         : '')
     + '<div class="rodillo"><table class="tabla">'
     + '<thead><tr><th>Equipo</th><th>Precio unitario</th><th>Servicios/año</th><th>Descripción del trabajo</th>'
     + (puede ? '<th class="acciones">Acciones</th>' : '') + '</tr></thead><tbody>'
     + (vistos.length ? vistos.map(e =>
         '<tr' + (e.activo ? '' : ' style="opacity:.5"') + '>'
       + '<td><b>' + esc(e.concepto) + '</b>' + (e.activo ? '' : ' <span class="pista" style="display:inline">(apagado)</span>') + '</td>'
       + '<td' + (e.precio ? '' : ' style="color:var(--error)"') + '>' + (e.precio ? dineroCent(e.precio) : 'sin precio') + '</td>'
       + '<td>' + e.frecuencia + ' · cada ' + (MESES_POLIZA / e.frecuencia % 1 === 0 ? (MESES_POLIZA/e.frecuencia) + ' ' + plural(MESES_POLIZA/e.frecuencia,'mes','meses') : 'irregular') + '</td>'
       + '<td>' + (e.descripcion ? '<div class="pista">' + esc(e.descripcion) + '</div>' : '<span class="pista">— sin descripción —</span>') + '</td>'
       + (puede
           ? '<td class="acciones">'
             + '<button type="button" class="btn btn-suave btn-mini" data-editar-equipo="' + esc(e.id) + '">' + ICONO.lapiz + 'Editar precio</button>'
             + '<button type="button" class="btn btn-suave btn-mini" data-apagar-equipo="' + esc(e.id) + '" '
               + 'title="' + (e.activo
                   ? 'Deja de aparecer en el buscador al cotizar. No se borra: las pólizas que ya lo usan siguen viéndolo.'
                   : 'Vuelve a aparecer en el buscador al cotizar.') + '">'
               + (e.activo ? 'Ya no ofrecer' : 'Volver a ofrecer') + '</button>'
             + '</td>'
           : '')
       + '</tr>').join('')
       : '<tr><td colspan="5"><span class="pista">Ningún equipo coincide con la búsqueda.</span></td></tr>')
     + '</tbody></table></div>'
     + (puede ? '<div class="pista" style="margin-top:10px">La lista es un solo documento: si dos administradores la editan al mismo tiempo, gana el último que guarde.</div>' : '')
     + '</div>';

  return h;
}

/* Alta y edición de un equipo del catálogo. */
function modalEquipo(id){
  if(!exigirAdmin('cambiar la lista de precios')) return;
  const e = id ? catalogo().find(x => x.id === id) : null;

  const cuerpo =
      '<div class="campo"><label>Equipo *</label>'
    +   '<input type="text" id="eqConcepto" placeholder="Ej. Cámara de refrigeración" value="' + esc(e ? e.concepto : '') + '"></div>'
    + '<div class="fila2">'
    +   '<div class="campo"><label>Precio unitario</label>'
    +     '<input type="text" inputmode="decimal" id="eqPrecio" value="' + (e && e.precio ? numero(e.precio) : '') + '">'
    +     '<div class="pista">Es una sugerencia: al cotizar se puede cambiar en el renglón.</div></div>'
    +   '<div class="campo"><label>Servicios al año</label>'
    +     '<input type="number" min="1" max="' + MESES_POLIZA + '" id="eqFrecuencia" value="' + (e ? e.frecuencia : 3) + '">'
    +     '<div class="pista" id="eqIntervalo"></div></div>'
    + '</div>'
    + '<div class="campo"><label>Descripción del trabajo (opcional)</label>'
    +   '<textarea id="eqDescripcion" placeholder="Lo que se le hace al equipo en cada visita. Sale impreso en la cotización.">' + esc(e ? e.descripcion : '') + '</textarea></div>';

  abrirModal(e ? 'Editar ' + e.concepto : 'Agregar equipo al catálogo', cuerpo,
      '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
    + '<button type="button" class="btn btn-primario" data-modal="guardar">' + (e ? 'Guardar cambios' : 'Agregar') + '</button>');

  function pintarIntervalo(){
    const f = Math.max(1, Math.min(MESES_POLIZA, parseInt($('eqFrecuencia').value,10) || 1));
    $('eqIntervalo').textContent = MESES_POLIZA % f === 0
      ? 'Cada ' + (MESES_POLIZA/f) + ' ' + plural(MESES_POLIZA/f,'mes','meses') + '.'
      : 'Repartidos lo más parejo posible en el año: ' + mesesRegulares(0,f).map(m => m+1).join(', ') + '.';
  }
  $('eqFrecuencia').addEventListener('input', pintarIntervalo);
  $('eqPrecio').addEventListener('input', ()=> formatearMiles($('eqPrecio')));
  pintarIntervalo();

  cerrarModalActual = ()=>{
    const concepto = $('eqConcepto').value.trim();
    if(!concepto){ $('eqConcepto').setAttribute('aria-invalid','true'); $('eqConcepto').focus(); aviso('El equipo necesita un nombre.', true); return; }
    const nuevo = normalizarEquipo({
      id: e ? e.id : concepto.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),
      concepto, precio: aNumero($('eqPrecio').value),
      frecuencia: $('eqFrecuencia').value, descripcion: $('eqDescripcion').value.trim(),
      activo: e ? e.activo : true
    });
    /* Si la lista todavía era la semilla, al primer cambio se materializa completa:
       guardar un solo equipo dejaría al servidor con una lista de uno. */
    if(!datos.catalogo.length) datos.catalogo = CATALOGO_SEMILLA.map(normalizarEquipo);
    const i = datos.catalogo.findIndex(x => x.id === nuevo.id);
    if(i === -1) datos.catalogo.push(nuevo); else datos.catalogo[i] = nuevo;
    guardarCatalogo((e ? 'editó ' : 'agregó ') + concepto + ' · ' + dineroCent(nuevo.precio));
    cerrarModal(); render();
    aviso(e ? 'Equipo actualizado.' : 'Equipo agregado.');
  };
}

/* ===================== VISTA: agenda de servicios =====================
   Contesta «qué toca ahora, en todas las pólizas». Ver agendaServicios() para el
   porqué de agrupar por estado y no por mes. */
function vistaAgenda(){
  const ag = agendaServicios();
  const q = estado.busca.trim().toLowerCase();
  const coincide = it => !q
    || (it.titulo || '').toLowerCase().includes(q)
    || (it.cliente || '').toLowerCase().includes(q)
    || (it.partida.concepto || '').toLowerCase().includes(q);

  const atrasados = ag.atrasados.filter(coincide);
  const ahora     = ag.ahora.filter(coincide);
  /* El horizonte se cuenta en meses de calendario desde el actual. */
  const tope = mesMasN(hoyISO(), estado.horizonte);
  const proximos = ag.proximos.filter(coincide)
    .filter(it => estado.horizonte === 0 || it.clave <= tope);

  const pendientes = atrasados.length + ahora.length;
  const sitiosTocados = new Set(atrasados.concat(ahora).map(it => it.polizaId)).size;

  let h = botonRegresarPolizas();

  h += '<div class="titulo-zona"><div>'
     +   '<h2>Agenda de servicios</h2>'
     +   '<p>' + (pendientes
          ? numero(pendientes) + ' ' + plural(pendientes,'servicio','servicios') + ' por atender en '
            + numero(sitiosTocados) + ' ' + plural(sitiosTocados,'sitio','sitios')
            + (atrasados.length ? ' · ' + numero(atrasados.length) + ' ya atrasado' + (atrasados.length===1?'':'s') : '')
          : 'Nada pendiente ahora mismo')
     +   '</p>'
     + '</div></div>';

  if(!ag.atrasados.length && !ag.ahora.length && !ag.proximos.length){
    /* Tres vacíos distintos, tres verdades distintas. El mensaje único de
       «cierra una cotización» mentía cuando SÍ había activas: con todo el año
       registrado sugería que faltaba vender, y con una activa vencida ni
       mencionaba que lo que toca es renovar. */
    const activas = datos.polizas.filter(q => calcularPoliza(q).activa).length;
    const vencidas = datos.polizas.filter(q => q.estatus === 'activa' && !calcularPoliza(q).vigente).length;
    if(activas){
      h += vistaVacia('calendario', 'Todo registrado',
            'Las ' + (activas === 1 ? 'póliza activa tiene' : activas + ' pólizas activas tienen')
            + ' todos sus servicios del año registrados. Nada pendiente.', '', '');
    } else if(vencidas){
      h += vistaVacia('calendario', 'No hay pólizas vigentes',
            (vencidas === 1 ? 'Hay una póliza activa cuya vigencia ya terminó'
              : 'Hay ' + vencidas + ' pólizas activas cuya vigencia ya terminó')
            + '. Renovarla la regresa a la agenda; sus servicios viven en su detalle.', '', '');
    } else {
      h += vistaVacia('calendario', 'Todavía no hay servicios programados',
            'La agenda se llena con las pólizas activas. Cierra una cotización como activa y sus '
            + 'mantenimientos aparecen aquí, mes por mes.', '', '');
    }
    return h;
  }

  h += '<div class="barra-busca">'
     +   '<input type="search" id="buscaAgenda" placeholder="Buscar por sitio, cliente o equipo…" value="' + esc(estado.busca) + '">'
     +   '<select id="horizonteAgenda">'
     +     '<option value="0"' + (estado.horizonte === 0 ? ' selected' : '') + '>Solo lo pendiente</option>'
     +     '<option value="2"' + (estado.horizonte === 2 ? ' selected' : '') + '>Y los próximos 2 meses</option>'
     +     '<option value="6"' + (estado.horizonte === 6 ? ' selected' : '') + '>Y los próximos 6 meses</option>'
     +     '<option value="12"' + (estado.horizonte === 12 ? ' selected' : '') + '>Todo el año</option>'
     +   '</select>'
     + '</div>';

  h += bloqueAgenda('Atrasados', atrasados, 'error',
        'Su mes ya se cumplió completo y nadie los registró.');
  h += bloqueAgenda('Toca ahora', ahora, 'alerta',
        'El mes en curso de su póliza. Todavía no están atrasados.');
  /* Los parciales son meses YA registrados a los que les faltaron unidades
     («4 de 5»). No cuentan como pendientes —el indicador tampoco los cuenta, y
     la agenda cuadra con el indicador— pero esconderlos era dar por atendido lo
     que no se terminó: se calculaba `parcial` y no lo leía nadie. Van aparte,
     con su fracción, y picarlos abre el registro para completarlo o corregirlo. */
  h += bloqueAgenda('Parciales', ag.hechos.filter(it => it.parcial).filter(coincide), 'neutro',
        'Registrados con unidades faltantes. No cuentan como pendientes; pícalos para corregir el registro.');
  if(estado.horizonte !== 0){
    h += bloqueAgenda('Programados', proximos, 'neutro',
          'Lo que viene, para planear la ruta.');
  }

  if(ag.seguristas){
    h += '<p class="pista" style="margin-top:18px">Además hay ' + numero(ag.seguristas) + ' '
       + plural(ag.seguristas,'mes con segurista incluido','meses con segurista incluido')
       + '. No llevan registro de mantenimiento: es presencia, no equipo.</p>';
  }
  return h;
}

/* Un bloque de la agenda: mes → sitio → equipos. Cada equipo es el botón que abre
   el registro del servicio, el MISMO modal del calendario por póliza — al guardar
   hace render() y esta vista se repinta con el servicio ya marcado. */
function bloqueAgenda(titulo, lista, tono, explica){
  if(!lista.length) return '';
  const puede = puedeEditar();
  let h = '<div class="agenda-bloque a-' + tono + '">'
        + '<div class="agenda-cabeza"><h3>' + esc(titulo)
        +   ' <span class="agenda-cuenta">' + numero(lista.length) + '</span></h3>'
        + '<p class="pista">' + esc(explica) + '</p></div>';

  agruparAgenda(lista).forEach(mes=>{
    h += '<div class="agenda-mes"><div class="agenda-mes-tit">' + esc(mes.etiqueta) + '</div>';
    mes.sitios.forEach(si=>{
      const n = si.equipos.length;
      h += '<div class="agenda-sitio">'
         /* `data-poliza` es el mismo atributo de las tarjetas de la lista, así que
            lo abre el manejador que ya existe: no hace falta uno nuevo. */
         +   '<button type="button" class="agenda-sitio-tit" data-poliza="' + esc(si.polizaId) + '" '
         +     'title="Abrir la póliza">' + esc(si.titulo)
         +     ' <span class="agenda-cuenta-mini">' + n + '</span></button>'
         +   '<div class="agenda-equipos">';
      si.equipos.forEach(it=>{
        const x = it.partida;
        const etq = esc(x.concepto || 'Equipo')
          + (it.parcial
              ? ' <b>' + it.det.hechas + ' de ' + x.cantidad + '</b>'
              : (x.cantidad > 1 ? ' <b>×' + x.cantidad + '</b>' : ''));
        /* Los mismos tres atributos que usan los chips del detalle, para que los
           abra el manejador de [data-servicio] que ya está puesto. Al guardar hace
           cerrarModal() y render(), así que la agenda se repinta con el servicio
           ya marcado sin que haya que devolver a ninguna parte. */
        const atrib = 'data-servicio="' + esc(it.polizaId) + '" data-partida="' + esc(x.id) + '" '
                    + 'data-mes="' + it.mes + '"';
        const tip = it.parcial
          ? (it.det.motivo ? 'Faltó: ' + it.det.motivo + ' — abre el registro para corregirlo' : 'Abrir el registro')
          : 'Registrar que ya se hizo';
        h += puede
          ? '<button type="button" class="agenda-eq' + (it.parcial ? ' parcial' : '') + '" ' + atrib + ' title="' + esc(tip) + '">' + etq + '</button>'
          : '<span class="agenda-eq inerte' + (it.parcial ? ' parcial' : '') + '" title="' + esc(tip) + '">' + etq + '</span>';
      });
      h += '</div></div>';
    });
    h += '</div>';
  });
  return h + '</div>';
}

/* 'AAAA-MM' n meses después del mes de una fecha. Con texto, como todas las fechas
   de aquí: `Date` corre los días por zona horaria. */
function mesMasN(iso, n){ return sumarMeses(iso.slice(0,8) + '01', n).slice(0,7); }

function botonRegresarPolizas(){
  return '<div style="margin-bottom:14px">'
       + '<button type="button" class="btn btn-suave btn-mini" data-accion="ir-polizas">'
       + ICONO.atras + 'Regresar a pólizas</button></div>';
}

/* Gemelos de irAClientes() y entrarCliente(): prenden la animación de entrada.
   Sin esto las tarjetas se verían desaparecer y reaparecer en cada refresco de
   30 s, porque render() rehace el HTML completo. */
function irAPrecios(){
  animarTarjetas = false;          /* es una tabla, no una reja de tarjetas */
  estado.vista = 'precios'; estado.polizaId = null; estado.busca = '';
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}
/* La agenda se abre de tres lados: el botón de la portada y los dos indicadores
   de servicios. Desde los indicadores llega en «solo lo pendiente», porque eso es
   lo que la persona picó — enseñarle además tres meses de futuro entierra lo que
   venía a ver. */
function irAAgenda(soloPendiente){
  animarTarjetas = false;         /* son bloques con listas, no una reja de tarjetas */
  estado.vista = 'agenda';
  estado.polizaId = null;
  estado.busca = '';
  if(soloPendiente) estado.horizonte = 0;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}
function irAPolizas(){
  animarTarjetas = true;
  estado.vista = 'polizas';
  estado.polizaId = null;
  estado.busca = '';        /* el buscador de equipos no debe seguir filtrando pólizas */
  render();
}
function entrarPoliza(id){
  animarTarjetas = true;
  estado.vista = 'poliza'; estado.polizaId = id;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function vistaVacia(icono, titulo, texto, accion, textoBoton){
  return '<div class="vacio">'
       +   '<div class="v-icono">' + ICONO[icono] + '</div>'
       +   '<h3>' + esc(titulo) + '</h3><p>' + esc(texto) + '</p>'
       /* Sin acción no se dibuja el botón: un botón vacío es peor que ninguno.
          Lo pide el estado vacío de la agenda, donde lo que falta —cerrar una
          cotización como activa— se hace en otra pantalla. */
       +   (accion ? '<button type="button" class="btn btn-primario" data-accion="' + accion + '">' + ICONO.mas + esc(textoBoton) + '</button>' : '')
       + '</div>';
}

/* Recomendación —no bloqueo— de cambiar la contraseña que dio el administrador
   por una propia. Se muestra mientras siga siendo la inicial y se va sola en
   cuanto la cambien, porque el dato sale de Firebase y no de una bandera. */
function avisoClaveInicial(){

       + '</div></div>';
}

function avisoLocal(){
  if(HAY_NUBE){
    if(sesion.rol === 'viewer'){
      return '<div class="aviso">' + ICONO.info
           + '<div>Tu cuenta es <b>Viewer</b>: puedes ver todo y descargar el Excel, pero no cambiar nada. '
           + 'Si necesitas capturar, pide que te suban a <b>Analyst</b>.</div></div>';
    }

  }
  return '<div class="aviso">' + ICONO.info
       + '<div>La información se guarda <b>en este navegador</b>, no en un servidor. '

       + 'y ábrelo allá con <b>Restaurar</b>. El <b>Excel</b> es para reportar y respaldar en tu formato de siempre.</div></div>';

/* La entrada escalonada de las tarjetas corre al llegar a una lista, no en cada
   redibujado. render() rehace el HTML completo, y al arrancar corre varias veces
   —copia local, datos del servidor, avisos—; sin esta bandera la animación se
   reiniciaba en cada una y se veía un parpadeo. Se prende al cambiar de vista y
   se apaga en cuanto se dibujó. */
let animarTarjetas = true;

function render(){
  pintarEstadoNube();
  pintarCabecera();
  /* Se despacha primero por módulo y luego por vista. El panel de admin va antes
     que los dos: es de la app entera, no de un producto, y se llega a él desde
     cualquiera de los dos módulos. */
  $('vista').innerHTML =
      estado.vista === 'admin'    ? vistaAdmin()
    : estado.modulo === 'polizas' ? (estado.vista === 'poliza' ? vistaPoliza()
                                    : estado.vista === 'precios' ? vistaPrecios()
                                    : estado.vista === 'agenda'  ? vistaAgenda()
                                    : vistaPolizas())
    : (estado.vista === 'cliente' ? vistaCliente() : vistaClientes());

  const be = $('buscaEquipo');
  if(be) be.addEventListener('input', ()=>{ estado.busca = be.value; renderConservandoFoco(be, 'buscaEquipo'); });
  const bp = $('buscaPoliza');
  if(bp){
    bp.addEventListener('input', ()=>{ estado.busca = bp.value; renderConservandoFoco(bp, 'buscaPoliza'); });
    const fp = $('filtroPoliza');
    fp.value = estado.filtro;
    fp.addEventListener('change', ()=>{ estado.filtro = fp.value; render(); });
  }
  const ba = $('buscaAgenda');
  if(ba){
    /* Con su propio id: renderConservandoFoco lo necesita o el foco se va al
       buscador de Forpass. Es la trampa que ya está documentada. */
    ba.addEventListener('input', ()=>{ estado.busca = ba.value; renderConservandoFoco(ba, 'buscaAgenda'); });
    const ha = $('horizonteAgenda');
    if(ha) ha.addEventListener('change', ()=>{ estado.horizonte = parseInt(ha.value,10) || 0; render(); });
  }
  const b = $('buscaCliente');
  if(b){
    b.addEventListener('input', ()=>{ estado.busca = b.value; renderConservandoFoco(b); });
    const f = $('filtroCliente');
    f.value = estado.filtro;
    f.addEventListener('change', ()=>{ estado.filtro = f.value; render(); });
  }
  const fs = $('filtroSitio');
  if(fs) fs.addEventListener('change', ()=>{ estado.sitioFiltro = fs.value; render(); });
  const fe = $('filtroEncargado');
  if(fe) fe.addEventListener('change', ()=>{ estado.encargadoFiltro = fe.value; render(); });
  if(estado.vista === 'admin') montarAdmin();
  /* Ya se dibujó: los siguientes redibujados de esta misma lista son instantáneos.
     Solo cambiar de vista vuelve a prender la animación. */
  animarTarjetas = false;
}

function pintarCabecera(){
  const dentro = HAY_NUBE && haySesion();
  const nom = $('nombreSesion');
  nom.textContent = dentro ? nombreDe(sesion) : '';
  nom.title = dentro ? sesion.correo : '';          /* el correo queda al pasar el mouse */
  $('rolSesion').innerHTML = (dentro && sesion.rol) ? etiquetaRol(sesion.rol) : '';
  $('btnAdmin').style.display = (dentro && esAdmin()) ? '' : 'none';
  $('btnPerfil').style.display = dentro ? '' : 'none';
  $('btnSalir').style.display = dentro ? '' : 'none';
  pintarPuntoClave();

  /* Pestaña encendida. Se pinta aquí y no al hacer clic para que el selector diga
     la verdad venga de donde venga el cambio: clic, arranque, o lo que se haya
     recordado de la sesión pasada. */
  $('selectorModulo').querySelectorAll('[data-modulo]').forEach(b=>{
    b.setAttribute('aria-selected', b.dataset.modulo === estado.modulo ? 'true' : 'false');
  });

  /* El logo solo funciona como atajo cuando hay a dónde volver. En la portada
     del módulo queda deshabilitado: sin esto sería un botón que no hace nada y
     además estorbaría en el recorrido del teclado. */
  const inicio = $('btnInicio');
  const destino = estado.modulo === 'polizas' ? 'Pólizas' : 'Clientes';
  const enPortada = estado.vista === inicioDelModulo();
  inicio.disabled = enPortada;
  inicio.title = enPortada ? '' : 'Volver a ' + destino;
  inicio.setAttribute('aria-label', enPortada ? 'Forguard' : 'Volver a ' + destino);
}

/* Una sola función para volver a la portada: la usan el botón "Clientes" de la
   ruta de migas y el atajo del logo. Separadas se desincronizan. */
function irAClientes(){
  animarTarjetas = true;                                  /* lista nueva: sí anima */
  estado.vista = 'clientes';
  estado.clienteId = null;
  render();
}

/* Corta la acción si la cuenta no tiene permiso de modificar. */
function exigirPermiso(){
  if(puedeEditar()) return true;
  aviso('Tu cuenta es Viewer: no puede hacer cambios.', true);
  return false;
}
/* Para lo que toca toda la base de golpe: solo Owner y Admin. */
function exigirAdmin(quePasa){
  if(esAdmin()) return true;
  aviso('Solo un Admin puede ' + quePasa + '.', true);
  return false;
}
/* Redibuja sin perder el cursor del buscador. El id se recibe para que sirva a
   los dos módulos; por omisión es el de Forpass, que es como estaba. */
function renderConservandoFoco(input, id){
  const pos = input.selectionStart;
  render();
  const nuevo = $(id || 'buscaCliente');
  if(nuevo){ nuevo.focus(); try{ nuevo.setSelectionRange(pos,pos); }catch(e){} }
}

async function montarAdmin(forzar){
  if(!esAdmin()) return;
  if(admin.cargando) return;
  /* Se exigen LAS DOS cosas cargadas, no solo las cuentas: el asignador de
     encargado también llena admin.usuarios, y con solo esa condición el panel
     se salteaba la carga del historial y se veía vacío como si no hubiera nada. */
  if(admin.usuarios && admin.bitacora && !forzar){ pintarUsuarios(); pintarBitacora(); return; }
  admin.cargando = true; admin.error = '';
  $('tablaUsuarios').innerHTML = '<div class="vacio-chico">Cargando cuentas…</div>';
  $('listaBitacora').innerHTML = '<div class="vacio-chico">Cargando historial…</div>';
  try{
    const [us, bi] = await Promise.all([listarNube('usuarios'), listarNube('bitacora')]);
    admin.usuarios = us;
    admin.bitacora = bi.sort((a,b)=> String(b.cuando||'').localeCompare(String(a.cuando||''))).slice(0,150);
  }catch(e){
    admin.error = /SIN_PERMISO/.test(String(e.message)) ? 'permiso' : String(e.message);
  }finally{
    admin.cargando = false;
  }
  pintarUsuarios(); pintarBitacora();
}

function pintarUsuarios(){
  const cont = $('tablaUsuarios');
  if(!cont) return;
  if(admin.error){
    cont.innerHTML = '<div class="vacio-chico">' + (admin.error === 'permiso'
      ? 'Tu cuenta no tiene permiso de administrador para ver las cuentas.'
      : 'No se pudieron cargar las cuentas: ' + esc(admin.error)) + '</div>';
    $('adminResumen').textContent = '';
    return;
  }
  const ORDEN_ROL = ['owner','admin','analyst','viewer'];
  const us = (admin.usuarios || []).slice()
    .map(u => Object.assign({}, u, { rol: normalizarRol(u.rol) }))
    .sort((a,b)=> ORDEN_ROL.indexOf(a.rol) - ORDEN_ROL.indexOf(b.rol)
                  || String(a.correo||'').localeCompare(String(b.correo||'')));

  const cuenta = r => us.filter(u => u.rol === r).length;
  const bloqueados = us.filter(u => u.activo === false).length;
  $('adminResumen').textContent = us.length + ' ' + plural(us.length,'cuenta','cuentas') + ' · '
    + ORDEN_ROL.filter(r => cuenta(r)).map(r => cuenta(r) + ' ' + ROLES[r].nombre).join(' · ')
    + (bloqueados ? ' · ' + bloqueados + ' ' + plural(bloqueados,'bloqueada','bloqueadas') : '');

  if(!us.length){ cont.innerHTML = '<div class="vacio-chico">Todavía no hay cuentas registradas.</div>'; return; }

  cont.innerHTML = '<table class="tabla"><thead><tr>'
    + '<th>Cuenta</th><th>Permiso</th><th>Estado</th><th>Creada</th><th>Último acceso</th><th></th>'
    + '</tr></thead><tbody>'
    + us.map(u=>{
        const yo = u.id === sesion.uid;
        const esDueno = u.rol === 'owner';
        /* Solo un Owner puede tocar a otro Owner o nombrar uno nuevo. */
        const protegido = yo || (esDueno && !esOwner());
        /* El Owner borra a cualquiera; un Admin a todos menos a un Owner.
           Nadie se borra a sí mismo: sería quedarse fuera sin vuelta. */
        const puedeBorrar = !yo && (esOwner() || (esAdmin() && !esDueno));
        const rolesQuePuedeDar = Object.keys(ROLES).filter(r => r !== 'owner' || esOwner());
        const opciones = rolesQuePuedeDar.map(r =>
          '<option value="' + r + '"' + (u.rol === r ? ' selected' : '') + '>' + esc(ROLES[r].nombre) + '</option>').join('');
        const razon = yo ? 'No puedes cambiarte tu propio permiso'
                         : 'Solo un Owner puede cambiar el permiso de un Owner';

        return '<tr>'
          + '<td><b>' + esc(nombreDe(u) || '—') + '</b>' + (yo ? ' <span class="yo">(tú)</span>' : '')
          +   '<div style="font-size:11.5px; color:var(--gray)">' + esc(u.correo || '') + '</div></td>'
          + '<td>' + (protegido
                ? '<span class="rol c-' + u.rol + '" title="' + esc(razon) + '">' + esc(ROLES[u.rol].nombre) + '</span>'
                : '<select class="sel-rol c-' + u.rol + '" data-rol="' + esc(u.id) + '">' + opciones + '</select>') + '</td>'
          + '<td>' + (u.activo === false
                ? '<span class="insignia i-error">Bloqueada</span>'
                : '<span class="insignia i-ok"><span class="punto p-ok"></span>Activa</span>') + '</td>'
          + '<td>' + esc(fechaHora(u.creado, true)) + '</td>'
          + '<td>' + esc(fechaHora(u.ultimoAcceso, true)) + '</td>'
          + '<td class="acciones">'
          +   (protegido ? '' : '<button type="button" class="btn ' + (u.activo === false ? 'btn-verde' : 'btn-suave')
                 + ' btn-mini" data-bloquear="' + esc(u.id) + '">' + (u.activo === false ? 'Reactivar' : 'Bloquear') + '</button>')
          +   (puedeBorrar ? '<button type="button" class="btn btn-peligro btn-mini" data-borrar-usuario="' + esc(u.id) + '" '
                 + 'title="Borrar el acceso de esta cuenta">' + ICONO.basura + '</button>' : '')
          + '</td></tr>';
      }).join('')
    + '</tbody></table>';
}
