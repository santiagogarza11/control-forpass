/* Fecha y hora legibles a partir de un texto ISO. */
function fechaHora(iso, soloFecha){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const base = String(d.getDate()).padStart(2,'0') + ' ' + MES[d.getMonth()] + ' ' + d.getFullYear();
  if(soloFecha) return base;
  return base + ', ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* Contraseña temporal fácil de dictar por teléfono. */
function claveSugerida(){
  const silabas = ['for','pass','guard','kio','sco','mex','nova','ter','lum','vera','sol','rio'];
  const s = () => silabas[Math.floor(Math.random()*silabas.length)];
  return s() + '-' + s() + '-' + String(Math.floor(Math.random()*9000) + 1000);
}

/* ------------------------- Modal: crear cuenta ------------------------- */
function modalCuenta(){
  const sugerida = claveSugerida();
  /* Solo un Owner puede crear otro Owner. */
  const opciones = Object.keys(ROLES).filter(r => r !== 'owner' || esOwner()).map(r =>
    '<option value="' + r + '"' + (r === 'analyst' ? ' selected' : '') + '>' + esc(ROLES[r].nombre) + ' — ' + esc(ROLES[r].desc) + '</option>').join('');

  abrirModal('Crear cuenta',
      '<div class="campo"><label>Correo de la persona *</label>'
    +   '<input type="email" id="uCorreo" placeholder="nombre@empresa.com" autocomplete="off"></div>'
    + '<div class="campo"><label>Nombre (opcional)</label>'
    +   '<input type="text" id="uNombre" placeholder="Ej. Ana Torres">'
    +   '<div class="pista">Si lo dejas vacío, se toma del correo: <b>ana.torres@…</b> se muestra como <b>Ana Torres</b>.</div></div>'
    + '<div class="campo"><label>Permiso *</label><select id="uRol">' + opciones + '</select></div>'
    + '<div class="campo"><label>Contraseña temporal *</label>'
    +   '<input type="text" id="uClave" value="' + esc(sugerida) + '">'
    +   '<div class="pista">Mínimo 6 caracteres. Se la pasas a la persona y ella puede cambiarla después '
    +   'con el enlace de «¿Olvidaste tu contraseña?». Tú no la vas a poder volver a ver.</div></div>',
      '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
    + '<button type="button" class="btn btn-primario" data-modal="guardar">Crear cuenta</button>');

  cerrarModalActual = async ()=>{
    const correo = $('uCorreo').value.trim();
    const clave  = $('uClave').value;
    const rol    = $('uRol').value;
    const nombre = $('uNombre').value.trim();
    if(!correo){ $('uCorreo').setAttribute('aria-invalid','true'); $('uCorreo').focus(); aviso('Falta el correo.', true); return; }
    if(clave.length < 6){ $('uClave').setAttribute('aria-invalid','true'); aviso('La contraseña necesita al menos 6 caracteres.', true); return; }

    const btn = $('modalPie').querySelector('[data-modal="guardar"]');
    btn.disabled = true; btn.textContent = 'Creando…';
    try{
      /* Se crea la cuenta en Firebase. Los tokens que devuelve se descartan:
         tu sesión de administrador no se toca. */
      const d = await pedirAuth('signUp', { email:correo, password:clave, returnSecureToken:false });
      const perfil = {
        correo, nombre, rol, activo:true,
        creado: new Date().toISOString(),
        creadoPor: sesion.correo || '',
        ultimoAcceso: ''
      };
      await escribirNube('usuarios', d.localId, perfil);
      anotar('creó', 'cuenta', correo, ROLES[rol].nombre);
      admin.usuarios = (admin.usuarios || []).concat([Object.assign({ id:d.localId }, perfil)]);

      abrirModal('Cuenta creada',
          '<p style="font-size:13.5px; color:#3a4256; line-height:1.65; margin-bottom:14px">'
        +   'Ya puede entrar. Pásale estos datos a <b>' + esc(correo) + '</b>:</p>'
        + '<div class="credencial">'
        +   '<div class="c-fila"><span>Página</span><code>' + esc(location.origin + location.pathname) + '</code></div>'
        +   '<div class="c-fila"><span>Correo</span><code>' + esc(correo) + '</code></div>'
        +   '<div class="c-fila"><span>Contraseña</span><code>' + esc(clave) + '</code></div>'
        +   '<div class="c-nota">Esta es la única vez que ves la contraseña. Si se pierde, no se recupera: '
        +   'se manda un correo para poner una nueva.</div>'
        + '</div>',
          '<button type="button" class="btn btn-suave izq" id="copiarDatos">Copiar los datos</button>'
        + '<button type="button" class="btn btn-primario" data-modal="cancelar">Listo</button>');

      $('copiarDatos').addEventListener('click', ()=>{
        const texto = 'Control de Forpass\n' + location.origin + location.pathname
                    + '\nCorreo: ' + correo + '\nContraseña: ' + clave;
        navigator.clipboard.writeText(texto)
          .then(()=> aviso('Datos copiados.'))
          .catch(()=> aviso('No se pudo copiar. Selecciona el texto a mano.', true));
      });
      cerrarModalActual = null;
      pintarUsuarios();
    }catch(e){
      btn.disabled = false; btn.textContent = 'Crear cuenta';
      aviso(e.message, true);
    }
  };
}

/* --------------------- Acciones del panel de admin --------------------- */
$('vista').addEventListener('change', async ev=>{
  const sel = ev.target.closest('[data-rol]');
  if(!sel) return;
  const uid = sel.dataset.rol, rol = sel.value;
  const u = (admin.usuarios || []).find(x => x.id === uid);
  if(!u) return;
  const anterior = u.rol;
  sel.disabled = true;
  try{
    await escribirNube('usuarios', uid, Object.assign({}, u, { rol, id:undefined }));
    u.rol = rol;
    anotar('cambió permiso de', 'cuenta', u.correo, ROLES[anterior] ? ROLES[anterior].nombre + ' → ' + ROLES[rol].nombre : ROLES[rol].nombre);

    pintarUsuarios();                     /* repinta para que el color siga al permiso */
  }catch(e){
    sel.value = anterior;
    aviso('No se pudo cambiar el permiso: ' + e.message, true);
  }finally{
    sel.disabled = false;
  }
});

$('vista').addEventListener('click', async ev=>{
  const bor = ev.target.closest('[data-borrar-usuario]');
  if(bor){
    const u = (admin.usuarios || []).find(x => x.id === bor.dataset.borrarUsuario);
    if(!u) return;
    if(u.id === sesion.uid){ aviso('No puedes borrar tu propia cuenta.', true); return; }
    if(normalizarRol(u.rol) === 'owner' && !esOwner()){ aviso('Solo un Owner puede borrar a un Owner.', true); return; }

    confirmar('Borrar el acceso de ' + nombreDe(u),
      'A <b>' + esc(nombreDe(u)) + '</b> (' + esc(u.correo) + ') se le quita el acceso <b>de inmediato y para siempre</b>: '
      + 'ya no podrá ver ni capturar nada.'
      + '<br><br>Un detalle importante: <b>su correo y contraseña siguen existiendo</b> en Firebase. '
      + 'Si intenta entrar, la página le va a decir que no tiene acceso y no verá información. '
      + 'Para borrar también el usuario de raíz, hay que eliminarlo en la consola de Firebase, '
      + 'en Authentication → Users.'
      + '<br><br>Si solo quieres quitarle el acceso un rato, usa <b>Bloquear</b>: eso sí se puede deshacer.',
      'Sí, borrar el acceso', async ()=>{
        try{
          await borrarNube('usuarios', u.id);
          admin.usuarios = (admin.usuarios || []).filter(x => x.id !== u.id);
          anotar('borró el acceso de', 'cuenta', u.correo, ROLES[normalizarRol(u.rol)].nombre);
          pintarUsuarios();
          aviso('Acceso de ' + nombreDe(u) + ' borrado.');
        }catch(e){
          aviso(/SIN_PERMISO/.test(String(e.message))
            ? 'El servidor no te dejó borrar esa cuenta. Solo un Owner puede borrar a un Owner.'
            : 'No se pudo borrar: ' + e.message, true);
        }
      });
    return;
  }

  const blo = ev.target.closest('[data-bloquear]');
  if(blo){
    const u = (admin.usuarios || []).find(x => x.id === blo.dataset.bloquear);
    if(!u) return;
    const bloquear = u.activo !== false;
    confirmar(bloquear ? 'Bloquear cuenta' : 'Reactivar cuenta',
      bloquear
        ? 'A <b>' + esc(nombreDe(u)) + '</b> (' + esc(u.correo) + ') se le va a quitar el acceso de inmediato. La cuenta no se borra: la puedes reactivar cuando quieras.'
        : 'A <b>' + esc(nombreDe(u)) + '</b> (' + esc(u.correo) + ') se le devuelve el acceso con el permiso de <b>' + esc(ROLES[normalizarRol(u.rol)].nombre) + '</b>.',
      bloquear ? 'Sí, bloquear' : 'Sí, reactivar', async ()=>{
        try{
          await escribirNube('usuarios', u.id, Object.assign({}, u, { activo:!bloquear, id:undefined }));
          u.activo = !bloquear;
          anotar(bloquear ? 'bloqueó' : 'reactivó', 'cuenta', u.correo);
          pintarUsuarios();
          aviso(bloquear ? 'Cuenta bloqueada.' : 'Cuenta reactivada.');
        }catch(e){ aviso('No se pudo actualizar: ' + e.message, true); }
      });
    return;
  }
});

/* ============================ VENTANA MODAL ============================ */
let cerrarModalActual = null;

function abrirModal(titulo, cuerpo, pie){
  $('modalTitulo').textContent = titulo;
  $('modalCuerpo').innerHTML = cuerpo;
  $('modalPie').innerHTML = pie;
  $('telon').classList.add('abierto');
  document.body.style.overflow = 'hidden';
  const primero = $('modalCuerpo').querySelector('input,select,textarea');
  if(primero) setTimeout(()=>primero.focus(), 60);
}
function cerrarModal(){
  $('telon').classList.remove('abierto');
  $('modal').classList.remove('ancho', 'enorme');
  /* Se reemplaza el contenedor por uno limpio en vez de solo vaciarlo: así se
     van también los listeners que algún modal le haya colgado, y no se
     acumulan cada vez que se abre. */
  const cuerpo = $('modalCuerpo');
  cuerpo.replaceWith(cuerpo.cloneNode(false));
  $('modalPie').innerHTML = '';
  document.body.style.overflow = '';
  cerrarModalActual = null;
}
$('modalCerrar').addEventListener('click', cerrarModal);
$('telon').addEventListener('mousedown', ev=>{ if(ev.target === $('telon')) cerrarModal(); });
document.addEventListener('keydown', ev=>{ if(ev.key === 'Escape' && $('telon').classList.contains('abierto')) cerrarModal(); });

function aviso(texto, esError){
  const t = $('toast');
  t.textContent = texto;
  t.classList.toggle('err', !!esError);
  t.classList.add('visible');
  clearTimeout(t._temp);
  t._temp = setTimeout(()=>t.classList.remove('visible'), 3400);
}

/* --------------------------- Modal: cliente --------------------------- */
function modalCliente(id){
  const c = id ? clientePorId(id) : null;
  let logoTmp = c ? c.logo : '';          /* vive mientras el modal está abierto */

  const cuerpo =
      '<div class="campo"><label>Logo del cliente (opcional)</label>'
    +   '<div class="logo-zona">'
    +     '<div id="logoCaja"></div>'
    +     '<div class="logo-lado">'
    +       '<div id="logoZoom"></div>'
    +       '<div class="logo-botones">'
    +         '<button type="button" class="btn btn-suave btn-mini" id="btnSubirLogo">Subir logo…</button>'
    +         '<button type="button" class="btn btn-peligro btn-mini" id="btnQuitarLogo">Quitar</button>'
    +       '</div>'
    +       '<div class="pista" id="pistaLogo">PNG, JPG o WEBP. Se reduce sola para no pesar. '
    +         'Si no pones logo, se usan las iniciales.</div>'
    +     '</div>'
    +   '</div>'
    +   '<input type="file" id="archivoLogo" accept="image/*" style="display:none">'
    + '</div>'
    + '<div class="campo"><label>Nombre del cliente *</label>'
    +   '<input type="text" id="cNombre" placeholder="Ej. Mercado Libre" value="' + esc(c ? c.nombre : '') + '"></div>'
    + '<div class="campo"><label>Contacto (opcional)</label>'
    +   '<input type="text" id="cContacto" placeholder="Ej. Juan Pérez · compras@cliente.com" value="' + esc(c ? c.contacto : '') + '"></div>'
    + '<div class="campo"><label>Notas (opcional)</label>'
    +   '<textarea id="cNotas" placeholder="Condiciones comerciales, forma de pago, etc.">' + esc(c ? c.notas : '') + '</textarea></div>'
    /* La casilla que decide en qué lista vive. Prendida por omisión al crear
       desde Forpass (ahí se está capturando un cliente de kioscos); al editar,
       enseña la decisión guardada — y para un cliente de antes de la casilla,
       lo que la lista ya hacía con él, para que marcarla no lo mueva de lugar
       sin querer. Con kioscos capturados la lista lo enseña aunque la casilla
       esté apagada: el dato manda, y la pista lo dice. */
    + (() => {
        const prendida = !c ? true
          : c.usaForpass === 'si' ? true
          : c.usaForpass === 'no' ? false
          : (sitiosDe(c.id).length > 0 || !polizasDeCliente(c.id).length);
        return '<label class="casilla"><input type="checkbox" id="cUsaForpass"' + (prendida ? ' checked' : '') + '> '
          + 'Incluye Forpass</label>'
          + '<div class="pista">Prendida, el cliente aparece en la lista de Forpass aunque todavía no tenga kioscos. '
          + 'Apagada, solo vive en Pólizas — hay cuentas con póliza y sin Forpass, y al revés. '
          + 'Un cliente con kioscos capturados aparece en Forpass de todos modos.</div>';
      })();

  const pie = '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
            + '<button type="button" class="btn btn-primario" data-modal="guardar">' + (c ? 'Guardar cambios' : 'Agregar cliente') + '</button>';

  abrirModal(c ? 'Editar cliente' : 'Agregar cliente', cuerpo, pie);

  /* Estado del encuadre mientras el modal está abierto. */
  let imgLogo = null;                 /* la imagen cargada, si hay una para encuadrar */
  let zoom = 1, offX = 0, offY = 0;
  const lienzo = document.createElement('canvas');
  lienzo.width = lienzo.height = LOGO_LADO;
  lienzo.className = 'logo-lienzo';
  lienzo.title = 'Arrastra para mover el logo';

  /* Solo dibuja. Comprimir en cada movimiento del dedo sería un desperdicio:
     la compresión se hace una sola vez, al guardar. */
  function refrescarEncuadre(){
    $('pistaLogo').textContent = 'Arrastra la imagen para encuadrarla. Se guarda a '
      + LOGO_LADO + '×' + LOGO_LADO + ' px.';
    return dibujarLogo(lienzo, imgLogo, zoom, offX, offY);
  }

  function pintarLogoUI(){
    const caja = $('logoCaja');
    const nombre = $('cNombre').value.trim() || (c ? c.nombre : '');

    if(imgLogo){
      if(lienzo.parentNode !== caja){ caja.innerHTML = ''; caja.appendChild(lienzo); }
      $('logoZoom').innerHTML =
          '<div class="logo-zoom"><label for="rangoZoom">Zoom</label>'
        + '<input type="range" id="rangoZoom" min="100" max="400" step="5" value="' + Math.round(zoom*100) + '">'
        + '<output id="valorZoom">' + Math.round(zoom*100) + '%</output></div>';
      $('rangoZoom').addEventListener('input', ev=>{
        zoom = (+ev.target.value) / 100;
        $('valorZoom').textContent = Math.round(zoom*100) + '%';
        refrescarEncuadre();
      });
      refrescarEncuadre();
    }else{
      caja.innerHTML = logoTmp
        ? '<div class="logo-previa con-logo"><img src="' + esc(logoTmp) + '" alt=""></div>'
        : '<div class="logo-previa">' + esc(iniciales(nombre) || '—') + '</div>';
      $('logoZoom').innerHTML = '';
    }
    $('btnQuitarLogo').style.display = (logoTmp || imgLogo) ? '' : 'none';
    $('btnSubirLogo').textContent = (logoTmp || imgLogo) ? 'Cambiar logo…' : 'Subir logo…';
  }

  /* Arrastrar dentro del cuadro para mover el logo. */
  let arrastrando = false, xPrev = 0, yPrev = 0;
  lienzo.addEventListener('pointerdown', ev=>{
    if(!imgLogo) return;
    arrastrando = true; xPrev = ev.clientX; yPrev = ev.clientY;
    lienzo.setPointerCapture(ev.pointerId);
  });
  lienzo.addEventListener('pointermove', ev=>{
    if(!arrastrando || !imgLogo) return;
    /* El cuadro se ve a 128 px pero mide 256: hay que escalar el movimiento. */
    const factor = LOGO_LADO / lienzo.getBoundingClientRect().width;
    const tam = dibujarLogo(lienzo, imgLogo, zoom, offX, offY);
    offX = limitarOffset(offX + (ev.clientX - xPrev) * factor, tam.w, LOGO_LADO);
    offY = limitarOffset(offY + (ev.clientY - yPrev) * factor, tam.h, LOGO_LADO);
    xPrev = ev.clientX; yPrev = ev.clientY;
    refrescarEncuadre();
  });
  lienzo.addEventListener('pointerup', ()=>{ arrastrando = false; });
  lienzo.addEventListener('pointercancel', ()=>{ arrastrando = false; });

  /* Si el cliente ya tenía logo, se carga para poder reencuadrarlo. */
  if(logoTmp){
    const previo = new Image();
    previo.onload = ()=>{ imgLogo = previo; zoom = 1; offX = offY = 0; pintarLogoUI(); };
    previo.src = logoTmp;
  }
  pintarLogoUI();

  $('cNombre').addEventListener('input', ()=>{ if(!logoTmp && !imgLogo) pintarLogoUI(); });
  $('btnSubirLogo').addEventListener('click', ()=> $('archivoLogo').click());
  $('btnQuitarLogo').addEventListener('click', ()=>{
    logoTmp = ''; imgLogo = null; zoom = 1; offX = offY = 0;
    $('archivoLogo').value = '';
    pintarLogoUI();
    $('pistaLogo').textContent = 'Se van a usar las iniciales.';
  });
  $('archivoLogo').addEventListener('change', async ev=>{
    const archivo = ev.target.files && ev.target.files[0];
    if(!archivo) return;
    $('pistaLogo').textContent = 'Procesando la imagen…';
    try{
      imgLogo = await leerLogo(archivo);
      zoom = 1; offX = offY = 0;
      pintarLogoUI();
    }catch(e){
      $('pistaLogo').textContent = e.message;
      aviso(e.message, true);
    }
    ev.target.value = '';
  });

  cerrarModalActual = ()=>{
    const nombre = $('cNombre').value.trim();
    if(!nombre){ $('cNombre').setAttribute('aria-invalid','true'); $('cNombre').focus(); aviso('El cliente necesita un nombre.', true); return; }

    /* El encuadre se convierte a imagen aquí, una sola vez. */
    if(imgLogo){
      try{
        dibujarLogo(lienzo, imgLogo, zoom, offX, offY);
        logoTmp = comprimirLienzo(lienzo);
      }catch(e){ aviso(e.message, true); return; }
    }

    /* Al guardar, la decisión queda EXPLÍCITA ('si'/'no'): un cliente de antes
       de la casilla se gradúa del estado heredado en cuanto alguien lo edita. */
    const usa = $('cUsaForpass').checked ? 'si' : 'no';
    let reg;
    if(c){
      c.nombre = nombre; c.contacto = $('cContacto').value.trim(); c.notas = $('cNotas').value.trim();
      c.logo = logoTmp; c.usaForpass = usa;
      reg = c;
    }else{
      reg = normalizarCliente({ id:nuevoId(), nombre, contacto:$('cContacto').value.trim(),
                                notas:$('cNotas').value.trim(), logo:logoTmp, usaForpass: usa });
      datos.clientes.push(reg);
    }
    guardarCliente(reg, c ? 'editó' : 'creó');
    cerrarModal(); render();
    aviso(c ? 'Cliente actualizado.' : 'Cliente agregado.');
  };
}

    +   '</div>'

    +     '<div class="meses-modal" id="mesesModal"></div>'

    const unit = f.modulos > 0 ? f.mensualidad / f.modulos : 0;

        '<div class="r-fila"><span>Vigencia</span><span>' + fmtFecha(f.fechaInicio) + ' → ' + fmtFecha(c.fin) + '</span></div>'
      + '<div class="r-fila"><span>Siguiente mensualidad</span><span>' + esc(prox) + '</span></div>'
      + '<div class="r-fila"><span>Mensualidades pagadas</span><span>' + c.pagados + ' de ' + f.meses + (c.atrasadas ? ' · ' + c.atrasadas + ' vencida' + (c.atrasadas===1?'':'s') : '') + '</span></div>'
      + (c.extras
          ? '<div class="r-fila"><span>Pago 1 — mensualidad + extras</span><span>' + dinero(c.primerPago) + '</span></div>'
            + (f.meses > 1
                ? '<div class="r-fila"><span>Pagos 2 al ' + f.meses + ' — cada uno</span><span>' + dinero(f.mensualidad) + '</span></div>'
                : '')
          : '<div class="r-fila"><span>Cada mensualidad</span><span>' + dinero(f.mensualidad) + '</span></div>')
      + '<div class="r-fila"><span>Renta ' + f.meses + ' ' + plural(f.meses,'mes','meses') + '</span><span>' + dinero(f.mensualidad * f.meses) + '</span></div>'
      + (c.extras ? '<div class="r-fila"><span>Onboarding y viáticos (una vez)</span><span>' + dinero(c.extras) + '</span></div>' : '')
      + '<div class="r-fila r-total"><span>Valor total del contrato</span><span>' + dinero(c.valorContrato) + '</span></div>';

    $('wrapOnboarding').style.display = f.incOnboarding ? '' : 'none';
    $('wrapViaticos').style.display   = f.incViaticos   ? '' : 'none';
  }

  function refrescar(){ pintarMeses(); pintarResumen(); }

  ['sNombre','sCliente','sModulos','sEstado','sTipo','sMensualidad','sIncOnboarding','sOnboarding','sIncViaticos','sViaticos','sInicio','sNotas']
    .forEach(id => $(id).addEventListener('input', pintarResumen));
  /* Paleta de color de la etiqueta. Si el usuario no ha tocado el color y
     escribe una zona que ya existe en otro sitio, se hereda ese color para que
     la misma plaza no acabe con tres colores distintos. */
  let colorTocado = !!s;
  function pintarPaleta(){
    $('paletaColor').querySelectorAll('[data-color]').forEach(b=>{
      b.setAttribute('aria-pressed', b.dataset.color === $('sColor').value ? 'true' : 'false');
    });
  }
  $('paletaColor').addEventListener('click', ev=>{
    const b = ev.target.closest('[data-color]');
    if(!b) return;
    $('sColor').value = b.dataset.color;
    colorTocado = true;
    pintarPaleta();
  });
  $('sZona').addEventListener('input', ()=>{
    if(colorTocado) return;
    const z = $('sZona').value.trim().toLowerCase();
    if(!z) return;
    const igual = datos.sitios.find(x => x.zona.trim().toLowerCase() === z && x.id !== (s ? s.id : ''));
    if(igual){ $('sColor').value = igual.color; pintarPaleta(); }
  });

  $('sMeses').addEventListener('input', refrescar);
  $('sInicio').addEventListener('change', refrescar);
  ['sMensualidad','sOnboarding','sViaticos'].forEach(id=>{
    $(id).addEventListener('input', ()=> formatearMiles($(id)));
  });
  $('mesesModal').addEventListener('click', ev=>{
    const b = ev.target.closest('[data-mtmp]');
    if(!b) return;
    const i = +b.dataset.mtmp;
    pagosTmp[i] = !pagosTmp[i];
    refrescar();
  });

  refrescar();

  cerrarModalActual = ()=>{
    const f = leerForm();
    if(!f.nombre){ $('sNombre').setAttribute('aria-invalid','true'); $('sNombre').focus(); aviso('El sitio necesita un nombre.', true); return; }
    if(!f.clienteId){ aviso('Selecciona un cliente.', true); return; }
    /* El formulario no trae todo lo del sitio: las OC de cada pago, el contacto
       y el encargado se administran por separado. Hay que arrastrarlos aquí o
       normalizarSitio los deja en blanco y se borran al editar. */
    const conservado = s
      ? { pagosDetalle: s.pagosDetalle, contactos: s.contactos, encargado: s.encargado }
      : {};
    const limpio = normalizarSitio(Object.assign({}, conservado, f, { pagos:pagosTmp, id: s ? s.id : nuevoId() }));
    if(s){ Object.assign(s, limpio); }
    else{ datos.sitios.push(limpio); }
    guardarSitio(s || limpio, s ? 'editó' : 'creó');
    cerrarModal();
    estado.vista = 'cliente'; estado.clienteId = limpio.clienteId;
    render();
    aviso(s ? 'Sitio actualizado.' : 'Sitio agregado.');
  };
}

/* ---------------------- Cobranza de la póliza ----------------------
   Mismo molde que la captura de mensualidades de Forpass: la OC es obligatoria,
   queda quién la capturó y cuándo, y un cobro ya capturado se puede reabrir para
   corregirlo. Lo único distinto es que el monto sale de montos[], que reparte el
   anual en centavos enteros.
   ------------------------------------------------------------------ */
function deshacerCobro(polizaId, idx){
  const p = polizaPorId(polizaId);
  if(!p || !p.cobros[idx]) return;
  const oc = p.cobrosDetalle[idx].oc;
  cerrarModal();
  confirmar('Deshacer el cobro ' + (idx+1),
    'Se va a marcar como <b>no cobrado</b> y se borra su OC (<b>' + esc(oc || 'sin OC') + '</b>), '
    + 'quién lo capturó y cuándo. La póliza no se toca.',
    'Sí, deshacer', ()=>{
      p.cobros[idx] = false;
      p.cobrosDetalle[idx] = { oc:'', quien:'', cuando:'', facturado:false };
      guardarPoliza(p, 'deshizo el cobro de', 'cobro ' + (idx+1) + (oc ? ' · OC ' + oc : ''));
      render();
      aviso('Cobro ' + (idx+1) + ' deshecho.');
    });
}

function modalCobroPoliza(polizaId, idx){
  const p = polizaPorId(polizaId);
  if(!p || idx < 0 || idx >= p.cobros.length) return;
  if(!exigirPermiso()) return;
  const c = calcularPoliza(p);
  const det = p.cobrosDetalle[idx] || { oc:'', quien:'', cuando:'', facturado:false };
  const conCuenta = HAY_NUBE && haySesion();
  const yaCobrado = !!p.cobros[idx];
  const cli = clientePorId(p.clienteId);

  const cuerpo =
      '<div class="resumen" style="margin-bottom:18px">'
    +   '<div class="r-fila"><span>Póliza</span><span>' + esc(p.sitioNombre || p.folio || 'Póliza')
    +     (cli ? ' · ' + esc(cli.nombre) : '') + '</span></div>'
    +   '<div class="r-fila"><span>Cobro</span><span>' + (idx+1) + ' de ' + p.cobros.length
    +     (p.facturacion === 'anual' ? ' (anual)' : '') + '</span></div>'
    +   (p.facturacion === 'mensual'
        ? '<div class="r-fila"><span>Fecha de corte</span><span>' + fmtFecha(sumarMeses(p.fechaInicio, idx)) + '</span></div>'
        : '<div class="r-fila"><span>Inicio de la vigencia</span><span>' + fmtFecha(p.fechaInicio) + '</span></div>')
    +   (idx === p.cobros.length - 1 && p.cobros.length > 1 && c.montos[idx] !== c.montos[0]
        ? '<div class="r-fila"><span>Ojo</span><span>Lleva el residuo del reparto</span></div>' : '')
    +   '<div class="r-fila r-total"><span>Monto de este cobro</span><span>' + dineroCent(c.montos[idx]) + '</span></div>'
    + '</div>'

    + '<div class="campo"><label>Nombre de quien captura *</label>'
    +   (conCuenta
          ? '<input type="text" id="cbQuien" value="' + esc(nombreDe(sesion)) + '" readonly>'
            + '<div class="pista">Es tu cuenta (' + esc(sesion.correo) + '). Queda registrada en el historial de cambios.</div>'
          : '<input type="text" id="cbQuien" placeholder="Ej. Santiago Garza" value="' + esc(nombreCapturador()) + '">'
            + '<div class="pista">Se guarda para las siguientes capturas de esta computadora.</div>')
    + '</div>'

    + '<div class="campo"><label>Número de OC *</label>'
    +   '<input type="text" id="cbOC" placeholder="Ej. 4500123" value="' + esc(det.oc) + '">'
    +   '<div class="pista">La orden de compra con la que se pagó <b>este</b> cobro. Cada uno lleva la suya.</div>'
    + '</div>'

    + '<label class="casilla"><input type="checkbox" id="cbFacturado"' + (det.facturado ? ' checked' : '') + '> '
    +   'Ya se facturó este cobro</label>'
    + '<div class="pista" style="margin:-6px 0 0">Si todavía no se factura, déjala sin marcar y márcala después '
    +   'volviendo a abrir esta casilla.</div>';

  abrirModal((yaCobrado ? 'Cobro ' : 'Capturar cobro ') + (idx+1), cuerpo,
      (yaCobrado ? '<button type="button" class="btn btn-peligro izq" id="btnDeshacerCobro">Deshacer captura</button>' : '')
    + '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
    + '<button type="button" class="btn btn-verde" data-modal="guardar">' + ICONO.cheque
    + (yaCobrado ? 'Guardar cambios' : 'Capturar cobro') + '</button>');

  if(yaCobrado) $('btnDeshacerCobro').addEventListener('click', ()=> deshacerCobro(polizaId, idx));
  setTimeout(()=>{ const oc = $('cbOC'); if(oc) oc.focus(); }, 70);

  cerrarModalActual = ()=>{
    /* Se lee TODO antes de cerrar: cerrarModal reemplaza el contenedor. */
    const quien = $('cbQuien').value.trim();
    const oc    = $('cbOC').value.trim();
    if(!quien){ $('cbQuien').setAttribute('aria-invalid','true'); $('cbQuien').focus(); aviso('Falta el nombre de quien captura.', true); return; }
    if(!oc){ $('cbOC').setAttribute('aria-invalid','true'); $('cbOC').focus(); aviso('Falta el número de OC.', true); return; }
    const facturado = $('cbFacturado').checked;

    p.cobros[idx] = true;
    p.cobrosDetalle[idx] = { oc, quien, cuando: new Date().toISOString(), facturado };
    if(!conCuenta) recordarCapturador(quien);

    guardarPoliza(p, yaCobrado ? 'corrigió el cobro de' : 'capturó el cobro de',
      'cobro ' + (idx+1) + ' de ' + p.cobros.length + ' · ' + dineroCent(c.montos[idx])
      + ' · OC ' + oc + ' · ' + (facturado ? 'facturado' : 'sin facturar') + ' · capturó ' + quien);
    cerrarModal();
    render();
    aviso('Cobro ' + (idx+1) + (yaCobrado ? ' actualizado' : ' capturado') + ' con OC ' + oc
      + (facturado ? ' · facturado' : ' · sin facturar') + '.');
  };
}

/* ------------------- Servicios ejecutados: "este ya se hizo" -------------------
   Gemelo de la cobranza, en el mismo molde: quién capturó, cuándo se hizo, y un
   servicio ya registrado se puede reabrir para corregirlo o deshacerlo.

   Dos diferencias con el cobro, y las dos importan:

   · La fecha SE CAPTURA en vez de ser la del momento. Un cobro se registra
     cuando llega la OC, pero un mantenimiento se marca el lunes y se hizo el
     viernes. Poner la del sistema sería mentir en el papel que se le enseña al
     cliente. Se guarda aparte `capturado`, que sí es del momento.

   · Se llega desde DOS lados: los chips de meses del detalle (por renglón) y el
     calendario (por mes). El calendario es el que se usa de verdad —el técnico
     va un mes y atiende varios equipos— así que al guardar desde ahí se vuelve
     a abrir el calendario para seguir marcando sin salir y entrar.
   ------------------------------------------------------------------------- */
function modalServicioPoliza(polizaId, partidaId, mes, vuelveAlCalendario){
  const p = polizaPorId(polizaId);
  if(!p) return;
  const x = p.partidas.find(q => q.id === partidaId);
  if(!x) return;
  /* Cinturón por si algún camino viejo llega aquí con un segurista. */
  if(esSegurista(x)){
    aviso('El segurista es presencia incluida en la póliza: no lleva registro de mantenimiento.');
    return;
  }
  if(!exigirPermiso()) return;

  const det = servicioDetalle(p, x, mes);
  const yaHecho = !!det;
  const conCuenta = HAY_NUBE && haySesion();
  const cli = clientePorId(p.clienteId);
  const enCalendario = x.mesesServicio.includes(mes);
  const etiqueta = etiquetaMesServicio(p.fechaInicio, mes);
  /* El mes de la vigencia va del día 1 al último; la fecha del servicio se
     propone dentro de él, no "hoy", que puede caer en otro mes. */
  const inicioMes = sumarMeses(p.fechaInicio, mes);
  const hoy = hoyISO();
  /* El mismo juez que la agenda y el calendario: mesesTranscurridos. La versión
     anterior usaba el intervalo [inicio, inicio+1 mes) con sumarMeses, y en
     pólizas que arrancan el 29/30/31 el recorte de fin de mes (31-ene + 1 mes =
     28-feb) las desalineaba justo en el día frontera: la agenda decía «toca
     ahora» y este modal proponía una fecha de un mes atrás. La definición del
     mes vive en UN lugar. */
  const dentroDelMes = diasEntre(inicioMes, hoy) >= 0 && mesesTranscurridos(p.fechaInicio, hoy) === mes;
  const propuesta = (det && det.cuando) || (dentroDelMes ? hoy : inicioMes);

  const cuerpo =
      '<div class="resumen" style="margin-bottom:18px">'
    +   '<div class="r-fila"><span>Póliza</span><span>' + esc(p.sitioNombre || p.folio || 'Póliza')
    +     (cli ? ' · ' + esc(cli.nombre) : '') + '</span></div>'
    +   '<div class="r-fila"><span>Equipo</span><span>' + esc(x.concepto)
    +     (x.cantidad > 1 ? ' ×' + x.cantidad : '') + (x.marca ? ' · ' + esc(x.marca) : '') + '</span></div>'
    +   '<div class="r-fila r-total"><span>Mes del calendario</span><span>' + esc(etiqueta) + '</span></div>'
    +   (enCalendario ? ''
        : '<div class="r-fila"><span>Ojo</span><span>Este mes ya no está en el calendario del equipo</span></div>')
    + '</div>'

    /* Con varias unidades en el renglón, se marca CUÁNTAS se atendieron: botones
       prendidos por omisión, se apagan los que no se hicieron. Las unidades de
       un renglón consolidado son idénticas entre sí, así que el número del botón
       no nombra a nadie: lo que cuenta es cuántos quedan prendidos. Si falta
       alguno, el porqué es obligatorio — un faltante sin explicación es
       exactamente la clase de dato mudo que este módulo vino a matar. */
    + (x.cantidad > 1
        ? '<div class="campo"><label>Equipos atendidos *</label>'
          + '<div class="sv-unidades" id="svUnidades">'
          + Array.from({length:x.cantidad}, (_,i)=>{
              const prendido = det ? (i < (det.hechas || x.cantidad)) : true;
              return '<button type="button" class="sv-uni' + (prendido ? ' activa' : '') + '" data-uni="' + i + '">' + (i+1) + '</button>';
            }).join('')
          + '</div>'
          + '<div class="pista">Apaga los que NO se atendieron. No importa cuál número: los '
          +   x.cantidad + ' son el mismo equipo, lo que se guarda es cuántos.</div>'
          + '</div>'
          + '<div class="campo" id="svCampoMotivo" style="display:none">'
          +   '<label>¿Por qué no se atendieron todos? *</label>'
          +   '<input type="text" id="svMotivo" placeholder="Ej. el equipo estaba en uso y no lo pudieron detener" value="' + esc((det && det.motivo) || '') + '">'
          +   '<div class="pista">Queda en el registro del mes, junto a cuántos se atendieron.</div>'
          + '</div>'
        : '')

    + '<div class="campo"><label>Fecha en que se hizo *</label>'
    +   '<input type="date" id="svCuando" value="' + esc(propuesta) + '">'
    +   '<div class="pista">La fecha real del mantenimiento, no la de hoy. Es la que se le enseña al cliente.</div>'
    + '</div>'

    + '<div class="campo"><label>Nombre de quien captura *</label>'
    +   (conCuenta
          ? '<input type="text" id="svQuien" value="' + esc(nombreDe(sesion)) + '" readonly>'
            + '<div class="pista">Es tu cuenta (' + esc(sesion.correo) + '). Queda registrada en el historial de cambios.</div>'
          : '<input type="text" id="svQuien" placeholder="Ej. Santiago Garza" value="' + esc((det && det.quien) || nombreCapturador()) + '">'
            + '<div class="pista">Se guarda para las siguientes capturas de esta computadora.</div>')
    + '</div>'

    + '<div class="campo"><label>Nota (opcional)</label>'
    +   '<input type="text" id="svNota" placeholder="Ej. se cambió el empaque de la puerta" value="' + esc((det && det.nota) || '') + '">'
    +   '<div class="pista">Lo que valga la pena recordar del servicio: un refacción cambiada, algo que quedó pendiente.</div>'
    + '</div>';

  /* Cancelar desde el calendario devuelve al calendario: si no, abrir un equipo
     y arrepentirse te saca de la lista que venías recorriendo. Por eso el botón
     lleva su propio id en ese caso — data-modal="cancelar" solo cierra. */
  abrirModal((yaHecho ? 'Servicio de ' : 'Registrar servicio de ') + etiqueta, cuerpo,
      (yaHecho ? '<button type="button" class="btn btn-peligro izq" id="btnDeshacerServicio">Deshacer registro</button>' : '')
    + (vuelveAlCalendario
        ? '<button type="button" class="btn btn-suave" id="btnVolverCalendario">Volver al calendario</button>'
        : '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>')
    + '<button type="button" class="btn btn-verde" data-modal="guardar">' + ICONO.cheque
    + (yaHecho ? 'Guardar cambios' : 'Marcar como hecho') + '</button>');

  const volver = ()=>{ if(vuelveAlCalendario) modalCalendario(polizaId); };
  if(yaHecho){
    $('btnDeshacerServicio').addEventListener('click',
      ()=> deshacerServicio(polizaId, partidaId, mes, vuelveAlCalendario));
  }
  if(vuelveAlCalendario){
    $('btnVolverCalendario').addEventListener('click', ()=>{ cerrarModal(); volver(); });
  }
  /* Los botones de unidad: prender/apagar, y el motivo solo aparece cuando
     falta alguno. Delegado en el contenedor, que muere con el modal. */
  if(x.cantidad > 1){
    $('svUnidades').addEventListener('click', ev=>{
      const b = ev.target.closest('.sv-uni');
      if(!b) return;
      b.classList.toggle('activa');
      const prendidos = $('svUnidades').querySelectorAll('.activa').length;
      const campo = $('svCampoMotivo');
      campo.style.display = prendidos < x.cantidad ? '' : 'none';
      if(prendidos < x.cantidad) $('svMotivo').focus();
    });
    /* Al reabrir un registro parcial, el campo del motivo ya debe verse. */
    if(det && (det.hechas || x.cantidad) < x.cantidad) $('svCampoMotivo').style.display = '';
  }
  setTimeout(()=>{ const f = $('svCuando'); if(f) f.focus(); }, 70);
  cerrarModalActual = ()=>{
    /* Todo se lee ANTES de cerrar: cerrarModal reemplaza el contenedor por un
       clon limpio y después los campos devuelven null. */
    const cuando = $('svCuando').value.trim();
    const quien  = $('svQuien').value.trim();
    const nota   = $('svNota').value.trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(cuando)){
      $('svCuando').setAttribute('aria-invalid','true'); $('svCuando').focus();
      aviso('Falta la fecha en que se hizo el servicio.', true); return;
    }
    if(diasEntre(cuando, hoyISO()) < 0){
      $('svCuando').setAttribute('aria-invalid','true'); $('svCuando').focus();
      aviso('Esa fecha todavía no llega: un servicio no se puede marcar por adelantado.', true); return;
    }
    if(!quien){
      $('svQuien').setAttribute('aria-invalid','true'); $('svQuien').focus();
      aviso('Falta el nombre de quien captura.', true); return;
    }

    /* Cuántas unidades quedaron prendidas, y el porqué si falta alguna. */
    let hechas = x.cantidad, motivo = '';
    if(x.cantidad > 1){
      hechas = $('svUnidades').querySelectorAll('.activa').length;
      if(hechas === 0){
        aviso('Si no se atendió ninguno, no lo marques como hecho: cancela, o deshaz el registro.', true);
        return;
      }
      if(hechas < x.cantidad){
        motivo = $('svMotivo').value.trim();
        if(!motivo){
          $('svMotivo').setAttribute('aria-invalid','true'); $('svMotivo').focus();
          aviso('Falta el porqué de los equipos que no se atendieron.', true); return;
        }
      }
    }

    marcarServicio(p, partidaId, mes, Object.assign({ cuando, quien, nota, hechas },
      motivo ? { motivo } : {}));
    if(!conCuenta) recordarCapturador(quien);

    const parcial = hechas < x.cantidad ? ' · ' + hechas + ' de ' + x.cantidad + ' · faltó: ' + motivo : '';
    guardarPoliza(p, yaHecho ? 'corrigió el servicio de' : 'registró el servicio de',
      x.concepto + ' · ' + etiqueta + ' · hecho el ' + fmtFecha(cuando) + ' · capturó ' + quien
      + parcial + (nota ? ' · ' + nota : ''));
    cerrarModal();
    render();
    aviso('Servicio de ' + x.concepto + ' en ' + etiqueta
      + (hechas < x.cantidad ? ' registrado: ' + hechas + ' de ' + x.cantidad : (yaHecho ? ' actualizado' : ' registrado')) + '.');
    volver();
  };
}

function deshacerServicio(polizaId, partidaId, mes, vuelveAlCalendario){
  const p = polizaPorId(polizaId);
  if(!p) return;
  const x = p.partidas.find(q => q.id === partidaId);
  if(!x) return;
  const det = servicioDetalle(p, x, mes);
  if(!det) return;
  const etiqueta = etiquetaMesServicio(p.fechaInicio, mes);
  cerrarModal();
  confirmar('Deshacer el servicio de ' + etiqueta,
    'Se va a marcar <b>' + esc(x.concepto) + '</b> como <b>pendiente</b> en ' + esc(etiqueta)
    + ', y se borra la fecha (<b>' + fmtFecha(det.cuando) + '</b>), quién lo capturó y la nota. '
    + 'El calendario y los precios no se tocan.',
    'Sí, deshacer', ()=>{
      marcarServicio(p, partidaId, mes, null);
      guardarPoliza(p, 'deshizo el servicio de', x.concepto + ' · ' + etiqueta);
      render();
      aviso('Servicio de ' + x.concepto + ' en ' + etiqueta + ' deshecho.');
      /* Con un tick de retraso a propósito: confirmar() corre este callback y
         DESPUÉS cierra el modal, así que abrir el calendario aquí mismo lo
         abriría para cerrarlo en la misma línea. */
      if(vuelveAlCalendario) setTimeout(()=> modalCalendario(polizaId), 0);
    });
}

/* ------------------------- Modal: calendario de la póliza -------------------
   Mes por mes, qué equipos toca atender. Es la pregunta operativa del módulo —
   "qué hay que hacer este mes"— y en la tabla de captura no se contesta: ahí se
   ve por renglón, no por mes.
   --------------------------------------------------------------------------- */
function modalCalendario(id){
  const p = polizaPorId(id);
  if(!p) return;
  const c = calcularPoliza(p);
  const hoy = hoyISO();
  /* En qué mes de la vigencia estamos, para marcar "este mes". El -1 cubre las
     DOS puntas: antes de arrancar y después de terminar. Sin la segunda, una
     póliza vencida marcaba su mes 12 como «este mes» para siempre — el clamp a
     MESES_POLIZA-1 congelaba el resaltado en el último mes. */
  const trans = mesesTranscurridos(p.fechaInicio, hoy);
  const mesActual = (diasEntre(p.fechaInicio, hoy) < 0 || trans >= MESES_POLIZA) ? -1 : trans;

  const marcable = puedeEditar();
  const meses = Array.from({length:MESES_POLIZA}, (_,m)=>{
    const toca = [], seguristas = [];
    p.partidas.forEach(x=>{
      /* El segurista no es un equipo que atender: se anuncia aparte, sin
         palomita, sin contar en los equipos del mes. */
      if(esSegurista(x)){
        if(x.mesesServicio.includes(m)) seguristas.push(x);
        return;
      }
      if(x.mesesServicio.includes(m)) toca.push({ x, det: servicioDetalle(p, x, m), fuera:false });
      else if(servicioHecho(p, x, m)) toca.push({ x, det: servicioDetalle(p, x, m), fuera:true });
    });
    return { m, toca, seguristas, equipos: toca.reduce((t,r)=> t + r.x.cantidad, 0),
             pendientes: toca.filter(r => !r.det).length };
  });
  const pico = Math.max(...meses.map(z=>z.equipos));

  /* Con su envoltorio .cal-resumen: .c-fila solo trae estilo dentro de .bloque
     y aquí quedaba pelona — etiqueta y valor salían pegados («Vigencia01 jun»). */
  const cuerpo =
      '<div class="cal-resumen">'
    +   '<div class="c-fila"><span>Vigencia:</span><b>' + fmtFecha(p.fechaInicio) + ' → ' + fmtFecha(c.fin) + '</b></div>'
    +   '<div class="c-fila"><span>Servicios en el año:</span><b>' + numero(c.programados)
    +     ' · ' + c.hechos + ' ' + plural(c.hechos,'hecho','hechos') + '</b></div>'
    +   '<div class="c-fila"><span>Mes más cargado:</span><b>' + pico + ' ' + plural(pico,'equipo','equipos') + '</b></div>'
    + '</div>'
    + (marcable ? '<div class="pista" style="margin:10px 0 0">Pica un equipo para registrar que su mantenimiento ya se hizo.</div>' : '')
    + '<div class="cal-meses">'
    + meses.map(z=>{
        const esAhora = z.m === mesActual;
        const renglon = r => {
          const marca = r.det ? ICONO.cheque : '';
          /* «2 de 3» visible cuando el mes quedó a medias; el PORQUÉ va en el
             globito, no en la tarjeta: inline rompía el renglón en columnas
             angostas. Al picar, el registro lo enseña completo. */
          const parcial = r.det && r.x.cantidad > 1 && (r.det.hechas || r.x.cantidad) < r.x.cantidad;
          const texto = esc(r.x.concepto) + (r.x.cantidad > 1 ? ' <b>×' + r.x.cantidad + '</b>' : '')
              + (r.fuera ? ' <span class="pista" style="display:inline">(fuera de calendario)</span>' : '')
              + (r.det && r.det.cuando ? ' <span class="pista" style="display:inline">' + fmtFecha(r.det.cuando) + '</span>' : '')
              + (parcial ? ' <b style="color:#8A5A0B">' + r.det.hechas + ' de ' + r.x.cantidad + '</b>' : '');
          const tip = r.det
            ? 'Hecho el ' + fmtFecha(r.det.cuando) + (r.det.quien ? ' · ' + r.det.quien : '')
              + (parcial ? ' · ' + r.det.hechas + ' de ' + r.x.cantidad
                  + (r.det.motivo ? ' · faltó: ' + r.det.motivo : '') : '')
              + (r.det.nota ? ' · ' + r.det.nota : '')
              + (marcable ? ' — pica para corregirlo' : '')
            : (marcable ? 'Registrar que ya se hizo' : 'Pendiente');
          return '<li' + (r.det ? ' class="hecho"' : '') + ' title="' + esc(tip) + '">'
            + (marcable
                ? '<button type="button" class="cal-marcar" data-servicio="' + esc(p.id) + '" '
                  + 'data-partida="' + esc(r.x.id) + '" data-mes="' + z.m + '" data-vuelve="cal">'
                  + marca + texto + '</button>'
                : marca + texto)
            + '</li>';
        };
        /* La nota del segurista: presencia incluida, no mantenimiento. El icono
           va acotado a mano: los SVG de ICONO no traen tamaño propio y en un
           div suelto se inflan al ancho completo. */
        const notaSegurista = z.seguristas.map(x =>
          '<div class="pista" style="margin-top:7px;display:flex;align-items:center;gap:5px">'
          + '<span style="display:inline-flex;width:13px;height:13px;flex:0 0 auto">' + ICONO.persona + '</span>'
          + 'Incluye segurista' + (x.cantidad > 1 ? ' ×' + x.cantidad : '') + '</div>').join('');
        return '<div class="cal-mes' + (z.toca.length ? '' : ' vacio') + (esAhora ? ' ahora' : '') + '">'
          + '<div class="cal-cabeza">'
          +   '<b>' + esc(etiquetaMesServicio(p.fechaInicio, z.m)) + '</b>'
          +   (esAhora ? '<span class="insignia i-alerta">este mes</span>' : '')
          +   '<span class="espacio"></span>'
          +   (z.toca.length ? '<span class="cal-cuenta">' + z.equipos + ' ' + plural(z.equipos,'equipo','equipos') + '</span>' : '<span class="cal-cuenta">—</span>')
          + '</div>'
          + (z.toca.length
              ? '<ul class="cal-lista">' + z.toca.map(renglon).join('') + '</ul>'
              : '<div class="pista">Sin servicios programados.</div>')
          + notaSegurista
          + '</div>';
      }).join('')
    + '</div>';

  abrirModal('Calendario · ' + (p.sitioNombre || 'Póliza'), cuerpo,
    '<button type="button" class="btn btn-suave" data-modal="cancelar">Cerrar</button>');
  $('modal').classList.add('ancho');

  /* Delegado y colgado aquí, no fuera: #modalCuerpo lo reemplaza cerrarModal()
     por un clon limpio en cada cierre, así que este listener se va con él y no
     se acumula. Colgarlo una vez fuera no serviría — apuntaría al nodo viejo. */
  if(marcable){
    $('modalCuerpo').addEventListener('click', ev=>{
      const b = ev.target.closest('[data-servicio]');
      if(!b) return;
      modalServicioPoliza(b.dataset.servicio, b.dataset.partida, +b.dataset.mes, true);
    });
  }
}

/* --------------------------- Modal: póliza ---------------------------
   La cotización completa en una ventana: datos, vendedor y renglones.

   Los renglones NO se redibujan en cada tecla. Se trabaja sobre una copia en
   partidasTmp y al teclear solo se actualizan el total de ESE renglón y el
   resumen de abajo. La lista completa se rehace únicamente al agregar o quitar
   un renglón, que es cuando nadie tiene el cursor puesto. Redibujar en cada
   tecla lo tiraría.
   --------------------------------------------------------------------- */
const MES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
/* Etiqueta del mes i de la vigencia: "ago 26". Preguntarle a alguien en qué mes
   le toca a la campana no se contesta con un número del 1 al 12. */
function etiquetaMesServicio(fechaInicio, i){
  const q = partes(sumarMeses(fechaInicio, i));
  return MES_CORTO[q.m - 1] + ' ' + String(q.a).slice(2);
}

function modalPoliza(id){
  const p = id ? polizaPorId(id) : null;
  if(!datos.clientes.length){
    aviso('Primero da de alta un cliente: la póliza cuelga de uno.', true);
    return;
  }

  /* Copia de trabajo: se toca esto y no el registro, para que Cancelar cancele
     de verdad. hechosDetalle viaja adentro sin que el formulario lo toque — si
     no se arrastrara, editar una póliza borraría su historial de servicios. */
  let partidasTmp = (p ? p.partidas : []).map(x => Object.assign({}, x, { mesesServicio: x.mesesServicio.slice() }));

  /* Lo que el servidor NO va a dejar guardar en esta póliza a esta persona. No es
     cosmético: sin esto el formulario ofrece la tabla completa sobre una póliza
     cerrada, y como los meses de servicio, el concepto y la marca viven DENTRO de
     `partidas`, cualquier tecla ahí acaba en un 403. */
  const congelada = polizaCongelada(p);
  const soloL = congelada ? ' readonly' : '';
  const bloq  = congelada ? ' disabled' : '';

  const opc = (lista, sel, texto, valor) => lista.map(o =>
    '<option value="' + esc(valor(o)) + '"' + (valor(o) === sel ? ' selected' : '') + '>' + esc(texto(o)) + '</option>').join('');

  const clientesOrd = datos.clientes.slice().sort((a,b)=> a.nombre.localeCompare(b.nombre,'es'));
  /* El vendedor se prellena de quien está capturando. Se guarda COPIADO: el
     documento impreso lleva su nombre y su celular y tiene que seguir diciendo
     lo mismo dentro de un año. */
  const v = p ? p.vendedor : { uid:sesion.uid || '', nombre:nombreDe(sesion), correo:sesion.correo || '', telefono:sesion.telefono || '' };

  const cuerpo =
      (congelada
        ? '<div class="aviso-congelada">'
          + '<b>Esta póliza ya está cerrada.</b> Los equipos, los precios, la vigencia y la '
          + 'facturación quedaron congelados el día que se cerró, así que aquí se ven pero no '
          + 'se editan. Lo que sí puedes corregir: el sitio, el folio, el vendedor, las fechas '
          + 'de cotización y las notas. Para cambiar lo demás, un Admin tiene que '
          + 'reabrirla.'
          + '</div>'
        : '')
    + '<div class="seccion"><h4>Datos de la póliza</h4>'
    +   '<div class="fila2">'
    +     '<div class="campo"><label>Cliente *</label>'
    +       '<div class="cliente-zona">'
    +         '<select id="pCliente">' + opc(clientesOrd, p ? p.clienteId : '', c=>c.nombre, c=>c.id) + '</select>'
    +         '<button type="button" class="btn btn-suave btn-mini" id="btnClienteNuevo" '
    +           'title="Dar de alta un cliente sin salir de aquí">' + ICONO.mas + 'Nuevo</button>'
    +       '</div>'
    +       '<div class="pista">Hay clientes con póliza y sin ningún kiosco Forpass. Si no está en la lista, créalo aquí.</div>'
    /* El alta del cliente va EN LÍNEA, dentro de este mismo modal — no en la
       ficha completa, porque el sistema de modales es de uno a la vez y abrirla
       encima borraría la captura de la cotización en curso (la trampa
       documentada de confirmar()/abrirModal). Antes era un window.prompt que
       solo pedía el nombre, y la casilla de «Incluye Forpass» quedaba en OTRA
       ventana que había que ir a buscar después: pedido de Santiago, todo en
       una. El logo sí queda para después (el recortador es la ficha completa);
       el aviso al crear lo dice. */
    +     '<div id="zonaClienteNuevo" class="cliente-nuevo" hidden>'
    +       '<div class="campo"><label>Nombre del cliente nuevo *</label>'
    +         '<input type="text" id="ncNombre" placeholder="Ej. Mercado Libre" autocomplete="off"></div>'
    +       '<label class="casilla"><input type="checkbox" id="ncUsaForpass"> Incluye Forpass</label>'
    +       '<div class="pista">Préndela si también va a tener kioscos: así aparece en la lista de Forpass desde ya. '
    +         'Apagada, vive solo en Pólizas. Se puede cambiar después en su ficha.</div>'
    +       '<div class="cliente-nuevo-botones">'
    +         '<button type="button" class="btn btn-suave btn-mini" id="ncCancelar">Cancelar</button>'
    +         '<button type="button" class="btn btn-primario btn-mini" id="ncCrear">Crear y seleccionar</button>'
    +       '</div>'
    +     '</div>'
    +     '</div>'
    +     '<div class="campo"><label>Sitio *</label>'
    +       '<input type="text" id="pSitioNombre" placeholder="Ej. MXNL02" value="' + esc(p ? p.sitioNombre : '') + '">'
    +       '<div class="pista">Es lo que sale impreso. Se guarda como texto para que sobreviva aunque el sitio no exista en Forpass.</div></div>'
    +   '</div>'
    +   '<div class="campo"><label>Ligar a un kiosco de Forpass (opcional)</label>'
    +     '<select id="pSitioId"></select>'
    +     '<div class="pista">Si esta cafetería también tiene kiosco, ligarlos pone un botón para brincar '
    +       'entre su póliza y su kiosco. El importador los liga solo cuando el nombre coincide; '
    +       'aquí se corrige el caso en que no coincidió. Hay pólizas en sitios sin Forpass.</div></div>'
    +   '<div class="fila2">'
    +     '<div class="campo"><label>Folio (opcional)</label>'
    +       '<input type="text" id="pFolio" placeholder="Ej. COT-2026-0041" value="' + esc(p ? p.folio : '') + '"></div>'
    +     '<div class="campo"><label>Estatus</label><select id="pEstatus"' + bloq + '>'
    /* Las opciones dependen del ROL: la regla del servidor solo deja a un
       Analyst mover el estatus entre 'cotizacion' y 'enviada' — 'activa' y
       'cancelada' le rebotan con 403. Antes se le ofrecían las cuatro, marcaba
       «Cancelada» porque el cliente dijo que no, veía la póliza cancelada en
       pantalla, y al recargar seguía viva: la captura se perdía con un aviso
       genérico. Es la misma regla que el descuento: no se ofrece lo que el
       servidor va a negar. Si la póliza trae un estatus fuera de la lista
       —'perdida' de antes, o una cerrada que un admin le pidió tocar— se agrega
       para que abrir el modal no se lo cambie en silencio. */
    +       (() => {
              const base = esAdmin() ? ESTATUS_OFRECIDOS : ESTATUS_ABIERTOS;
              const actual = p ? p.estatus : 'cotizacion';
              return opc(base.includes(actual) ? base : base.concat(actual),
                actual, e=>ETIQUETA_ESTATUS[e], e=>e);
            })() + '</select></div>'
    +   '</div>'
    +   '<div class="fila2">'
    +     '<div class="campo"><label>Fecha de la cotización</label>'
    +       '<input type="date" id="pCotizacion" value="' + esc(p ? p.fechaCotizacion : hoyISO()) + '"></div>'
    +     '<div class="campo"><label>Inicio de la vigencia</label>'
    +       '<input type="date" id="pInicio" value="' + esc(p ? p.fechaInicio : hoyISO()) + '"' + soloL + '>'
    +       '<div class="pista">Manda el calendario: los meses de servicio se cuentan desde aquí.</div></div>'
    +   '</div>'
    +   '<div class="campo"><label>Facturación</label><select id="pFacturacion"' + bloq + '>'
    +     '<option value="anual"' + (!p || p.facturacion === 'anual' ? ' selected' : '') + '>Anual — un solo cobro</option>'
    +     '<option value="mensual"' + (p && p.facturacion === 'mensual' ? ' selected' : '') + '>Mensual — doce cobros</option>'
    +   '</select></div>'
    /* El descuento solo lo VE quien lo puede poner. A un Analyst no se le enseña
       una casilla que el servidor le va a negar; y si la póliza ya trae uno, se
       le muestra como texto para que sepa con qué está trabajando. */
    +   (esAdmin()
        ? '<div class="campo"><label>Descuento (%)</label>'
          + '<input type="number" id="pDescuento" min="0" max="100" step="0.01" '
          +   'value="' + (p && p.descuento ? p.descuento : '') + '" placeholder="0">'
          + '<div class="pista">Se aplica al total, se imprime como renglón aparte y '
          +   '<b>los precios de los equipos no se tocan</b>. Déjalo vacío si no hay.</div>'
          + '</div>'
        : (p && p.descuento
            ? '<div class="campo"><label>Descuento</label>'
              + '<input type="text" value="' + p.descuento + '% — solo un Admin lo cambia" readonly>'
              + '</div>'
            : ''))
    + '</div>'

    + '<div class="seccion"><h4>Vendedor</h4>'
    +   '<div class="fila2">'
    +     '<div class="campo"><label>Nombre</label><input type="text" id="pVendNombre" value="' + esc(v.nombre) + '"></div>'
    +     '<div class="campo"><label>Teléfono</label><input type="text" id="pVendTel" placeholder="811 60 71 051" value="' + esc(v.telefono) + '"></div>'
    +   '</div>'
    +   '<div class="campo"><label>Correo</label><input type="text" id="pVendCorreo" value="' + esc(v.correo) + '">'
    +     '<div class="pista">Sale impreso en la cotización. Se guarda copiado, no ligado a la cuenta.</div></div>'
    + '</div>'

    + '<div class="seccion"><h4>Equipos cotizados</h4>'
    +   '<div class="busca-equipo">'
    +     '<input type="text" id="pBuscaEquipo" list="pCatalogoEquipos" autocomplete="off"'
    +       ' placeholder="Escribe un equipo del catálogo y elígelo para agregarlo…"' + bloq + '>'
    +     '<datalist id="pCatalogoEquipos">'
    +       catalogo().filter(e => e.activo).map(e => '<option value="' + esc(e.concepto) + '">').join('')
    +     '</datalist>'
    +     '<span class="cuantos-zona">'
    +       '<button type="button" class="btn btn-suave btn-mini" id="btnOtroEquipo"' + bloq + '>' + ICONO.mas + 'Agregar otro</button>'
    +       '<input type="number" id="pCuantos" class="cuantos" min="1" max="' + MAX_RENGLONES + '" step="1" value="1"'
    +         ' title="Cuántos renglones vacíos agregar de un golpe" aria-label="Cuántos renglones agregar"' + bloq + '>'
    +     '</span>'
    +   '</div>'
    +   '<div class="chips-equipo" id="chipsEquipo"></div>'
    +   '<div id="listaPartidas"></div>'
    + '</div>'

    + '<div class="seccion"><h4>Resumen</h4><div class="resumen" id="resumenPoliza"></div></div>'

    + '<div class="campo"><label>Notas (opcional)</label>'
    +   '<textarea id="pNotas" placeholder="Condiciones, accesos, contacto en sitio…">' + esc(p ? p.notas : '') + '</textarea></div>';

  const pie = '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
            + '<button type="button" class="btn btn-primario" data-modal="guardar">' + (p ? 'Guardar cambios' : 'Crear cotización') + '</button>';

  abrirModal(p ? 'Editar póliza' : 'Nueva cotización de póliza', cuerpo, pie);
  $('modal').classList.add('enorme');

  /* Si la cuenta no trae teléfono, se dice de frente y se sigue: la póliza guarda
     su propia copia, así que esto nunca detiene la captura. */
  if(!p && !sesion.telefono){
    aviso('Tu perfil no tiene teléfono. Escríbelo aquí para que salga en la cotización, o guárdalo en Mi cuenta.');
  }

  function leerForm(){
    const estatus = ESTATUS_POLIZA.includes($('pEstatus').value) ? $('pEstatus').value : 'cotizacion';
    return {
      clienteId: $('pCliente').value,
      sitioId: $('pSitioId').value,
      sitioNombre: $('pSitioNombre').value.trim(),
      folio: $('pFolio').value.trim(),
      estatus,
      facturacion: $('pFacturacion').value,
      /* Si no hay casilla —Analyst— se ARRASTRA el que ya tenía: leerForm solo
         trae los campos del formulario, y sin esto editar una póliza le borraría
         el descuento a quien no lo puede ver. Es la misma trampa que ya nos costó
         las OC y el historial de servicios. */
      descuento: $('pDescuento') ? (parseFloat($('pDescuento').value) || 0) : (p ? p.descuento : 0),
      fechaCotizacion: $('pCotizacion').value || hoyISO(),
      fechaInicio: $('pInicio').value || hoyISO(),
      /* Las dos fechas de trámite se deducen del estatus en vez de capturarse:
         un campo más que alguien puede dejar en blanco es un campo que miente.
         Volver a borrador limpia el cierre, que es lo que descongela los precios. */
      fechaEnvio: estatus === 'cotizacion' ? '' : ((p && p.fechaEnvio) || hoyISO()),
      fechaCierre: estatus === 'activa' ? ((p && p.fechaCierre) || hoyISO()) : '',
      vendedor: { uid: v.uid || '', nombre: $('pVendNombre').value.trim(),
                  correo: $('pVendCorreo').value.trim(), telefono: $('pVendTel').value.trim() },
      notas: $('pNotas').value.trim()
    };
  }

  /* Los sitios de Forpass del cliente elegido. Se repinta solo este select. */
  function pintarSitios(){
    const cli = $('pCliente').value;
    const suyos = sitiosDe(cli);
    const actual = p ? p.sitioId : '';
    $('pSitioId').innerHTML = '<option value="">— Sin kiosco Forpass —</option>'
      + suyos.map(s => '<option value="' + esc(s.id) + '"' + (s.id === actual ? ' selected' : '') + '>' + esc(s.nombre) + '</option>').join('');
  }

  /* Pinta la tabla completa. Solo se llama al agregar, quitar, duplicar o mover
     la fecha de inicio: al teclear NO se redibuja, o se perdería el cursor. */
  function pintarPartidas(){
    const ini = $('pInicio').value || hoyISO();
    if(!partidasTmp.length){
      $('listaPartidas').innerHTML = '<div class="pista">Todavía no hay equipos. '
        + 'Busca el primero arriba: el precio anual es la suma de los renglones.</div>';
      refrescarResumen();
      return;
    }

    const filas = partidasTmp.map((x,i)=>{
      const lim = normalizarPartida(x);
      const arranque = mesArranqueDe(lim);
      const irregular = arranque === null;

      /* El selector de arranque solo ofrece los ciclos DISTINTOS que existen: con
         frecuencia 3 (cada 4 meses) hay 4, no 12. Arrancar en el mes 0 y en el 4
         daría el mismo [0,4,8]. */
      const opc = arranquesDe(lim.frecuencia).map(a =>
        '<option value="' + a + '"' + (a === arranque ? ' selected' : '') + '>'
        + esc(etiquetaMesServicio(ini, a)) + '</option>').join('');
      const arrHtml = '<select data-arranque' + bloq + '>'
              + (irregular ? '<option value="" selected>— a mano —</option>' : '')
              + opc + '</select>';

      const fila =
          '<tr data-idx="' + i + '"' + (irregular ? ' class="irregular"' : '') + '>'
        + '<td class="num">' + (i+1) + '</td>'
        + '<td class="equipo"><input type="text" data-campo="concepto" value="' + esc(x.concepto) + '" placeholder="Nombre del equipo"' + soloL + '></td>'
        + '<td class="marca"><input type="text" data-campo="marca" value="' + esc(x.marca) + '" placeholder="—"' + soloL + '></td>'
        + '<td class="mini"><input type="number" min="1" step="1" data-campo="cantidad" value="' + x.cantidad + '"' + soloL + '></td>'
        + '<td class="med"><input type="text" inputmode="decimal" data-campo="precioUnitario" value="' + numero(x.precioUnitario) + '"' + soloL + '></td>'
        + '<td class="mini"><input type="number" min="1" max="' + MESES_POLIZA + '" step="1" data-campo="frecuencia" value="' + x.frecuencia + '"' + soloL + '></td>'
        + '<td class="arr">' + arrHtml + '</td>'
        + '<td class="med"><input type="text" readonly data-total value=""></td>'
        + '<td class="acc">'
        +   '<button type="button" class="icono-mini' + (x._abierta ? ' on' : '') + '" data-meses-mano="' + i + '" '
        +     'data-tip="Calendario"' + bloq + '>' + ICONO.calendario + '</button>'
        +   '<button type="button" class="icono-mini" data-duplicar="' + i + '" '
        +     'data-tip="Duplicar"' + bloq + '>' + ICONO.respaldo + '</button>'
        +   '<button type="button" class="icono-mini" data-quitar="' + i + '" '
        +     'data-tip="Borrar"' + bloq + '>' + ICONO.basura + '</button>'
        + '</td>'
        + '</tr>';

      /* Los doce meses a mano: modo avanzado, cerrado por omisión. Solo hace falta
         cuando una unidad no sigue el intervalo. */
      if(!x._abierta) return fila;
      const casillas = Array.from({length:MESES_POLIZA}, (_,m)=>
        '<button type="button" class="mes' + (lim.mesesServicio.includes(m) ? ' serv' : '') + '" data-mes="' + m + '" '
        + 'aria-pressed="' + (lim.mesesServicio.includes(m) ? 'true' : 'false') + '"' + bloq + '>'
        + esc(etiquetaMesServicio(ini, m)) + '</button>').join('');
      return fila
        + '<tr class="fila-meses" data-idx="' + i + '"><td></td><td colspan="8">'
        +   '<div class="pista" style="margin-bottom:7px">Meses de <b>' + esc(x.concepto || 'este renglón') + '</b>. '
        +     'Los servicios al año se ajustan solos a los que marques, y el arranque pasa a «a mano».</div>'
        +   '<div class="meses-modal con-mes" data-meses>' + casillas + '</div>'
        +   '<div class="aviso-cuadre" data-cuadre hidden></div>'
        + '</td></tr>';
    }).join('');

    $('listaPartidas').innerHTML =
        '<div class="rodillo"><table class="tabla-renglones">'
      + '<thead><tr><th></th><th class="equipo">Equipo</th><th class="marca">Marca</th><th>Cant.</th><th>P. unitario</th>'
      +   '<th>Serv./año</th><th>Arranque</th><th>Total</th><th></th></tr></thead>'
      + '<tbody>' + filas + '</tbody></table></div>'
      /* El pie va FUERA del contenedor que se recorre a lo ancho: los totales son
         lo que más se mira y no pueden quedar escondidos a la derecha. */
      + '<div class="pie-renglones">'
      +   '<div id="pieBloqueDesc" style="display:none"><span>Subtotal</span><b id="pieSubtotal"></b></div>'
      +   '<div id="pieBloqueDesc2" style="display:none"><span id="pieDescEtiqueta">Descuento</span><b id="pieDescuento" style="color:var(--error)"></b></div>'
      +   '<div><span>Precio anual</span><b id="pieAnual"></b></div>'
      +   '<div><span>Mensual (anual ÷ ' + MESES_POLIZA + ')</span><b id="pieMensual"></b></div>'
      + '</div>';
    refrescar();
  }

  /* Actualiza SOLO los números, sin tocar el HTML de los campos: nadie pierde el
     cursor a media captura. */
  /* Con "soloIdx" actualiza un renglón; sin él, todos. Al teclear se pasa el
     índice: recorrer 150 renglones en cada tecla se siente. */
  function refrescar(soloIdx){
    const sel = soloIdx === undefined
      ? 'tbody tr[data-idx]:not(.fila-meses)'
      : 'tbody tr[data-idx="' + soloIdx + '"]:not(.fila-meses)';
    const nodos = $('listaPartidas').querySelectorAll(sel);
    nodos.forEach(nodo=>{
      const i = +nodo.dataset.idx, x = partidasTmp[i];
      if(!x) return;
      const lim = normalizarPartida(x);
      const t = nodo.querySelector('[data-total]');
      if(t) t.value = dineroCent(totalRenglon(lim));
      const cuadra = cuadraFrecuencia(lim);
      const fr = nodo.querySelector('[data-campo="frecuencia"]');
      /* No se regaña antes de que el usuario escriba nada: un renglón recién
         agregado está vacío por definición. */
      if(fr) fr.setAttribute('aria-invalid', (cuadra || !x._tocada) ? 'false' : 'true');
      /* Ancho del concepto para el documento impreso. Se avisa, NO se bloquea:
         es el mismo criterio que la frecuencia que no cuadra. */
      const cp = nodo.querySelector('[data-campo="concepto"]');
      if(cp){
        const largo = (x.concepto || '').trim().length;
        const cabe = conceptoCabeImpreso(x);
        /* Sin el guardo de `_tocada` que sí usa la frecuencia, y a propósito: un
           concepto de 40 caracteres no cabe igual si lo acaban de teclear que si
           entró por el importador —y las cuatro pólizas reales entraron así—. Un
           renglón nuevo trae el concepto vacío, así que nunca se regaña de gratis. */
        cp.setAttribute('aria-invalid', cabe ? 'false' : 'true');
        cp.title = cabe ? '' :
          'Son ' + largo + ' caracteres y en el documento impreso caben unos '
          + CHARS_CONCEPTO_IMPRESO + '. No se bloquea: si no cabe, el nombre se '
          + 'parte en dos líneas y ese renglón queda más alto que los demás.';
      }
      const cu = $('listaPartidas').querySelector('.fila-meses[data-idx="' + i + '"] [data-cuadre]');
      if(cu){
        cu.hidden = cuadra || !x._tocada;
        if(!cuadra) cu.textContent = 'Marcaste ' + lim.mesesServicio.length + ' '
          + plural(lim.mesesServicio.length,'mes','meses') + ' y pusiste ' + lim.frecuencia + ' '
          + plural(lim.frecuencia,'servicio al año','servicios al año') + '. No cuadra.';
      }
    });
    refrescarResumen();
  }

  function refrescarResumen(){
    const f = leerForm();
    const prov = normalizarPoliza(Object.assign({}, f, { partidas: partidasTmp, id:'tmp' }));
    const c = calcularPoliza(prov);
    if($('pieAnual'))   $('pieAnual').textContent   = dineroCent(c.precioAnual);
    /* El descuento en vivo mientras se captura: se teclea 5 y el pie ya enseña
       cuánto son y cuánto queda. Sin esto habría que guardar para saberlo. */
    if($('pieBloqueDesc')){
      const hay = c.descuento > 0;
      $('pieBloqueDesc').style.display  = hay ? '' : 'none';
      $('pieBloqueDesc2').style.display = hay ? '' : 'none';
      if(hay){
        $('pieSubtotal').textContent = dineroCent(c.subtotal);
        $('pieDescEtiqueta').textContent = 'Descuento ' + c.descuento + '%';
        $('pieDescuento').textContent = '−' + dineroCent(c.montoDescuento);
      }
    }
    if($('pieMensual')) $('pieMensual').textContent = dineroCent(c.precioMensual);

    const nCobros = prov.cobros.length;
    /* Se CUENTAN los iguales en vez de dar por hecho "11 y uno": cuando el anual
       divide exacto entre doce, los doce cobros son iguales y decir "11 de X"
       era un off-by-one puro y duro. */
    const iguales = c.montosCent.filter(m => m === c.montosCent[0]).length;
    const ultimo = c.montos[nCobros - 1];
    $('resumenPoliza').innerHTML =
        '<div class="r-fila"><span>Renglones</span><span>' + partidasTmp.length
      + (c.noCuadran ? ' · ' + c.noCuadran + ' sin cuadrar' : '') + '</span></div>'
      + '<div class="r-fila"><span>Equipos en total</span><span>'
      +   numero(prov.partidas.reduce((t,x)=> t + x.cantidad, 0)) + '</span></div>'
      + '<div class="r-fila"><span>Vigencia</span><span>' + fmtFecha(prov.fechaInicio) + ' → ' + fmtFecha(c.fin) + '</span></div>'
      + '<div class="r-fila"><span>Servicios al año</span><span>' + numero(c.programados) + '</span></div>'
      + (prov.facturacion === 'mensual'
          ? '<div class="r-fila"><span>Cobros</span><span>'
            + (iguales === nCobros
                ? nCobros + ' de ' + dineroCent(c.montos[0])
                : iguales + ' de ' + dineroCent(c.montos[0]) + ' y uno de ' + dineroCent(ultimo))
            + '</span></div>'
          : '<div class="r-fila"><span>Cobros</span><span>uno solo, al inicio</span></div>')
      + '<div class="r-fila r-total"><span>Precio anual</span><span>' + dineroCent(c.precioAnual) + '</span></div>';
  }

  /* Agrega un renglón y deja el cursor donde toca seguir capturando. */
  function agregarRenglon(base, foco){
    /* Candado de respaldo. Los controles que llegan aquí ya van apagados, pero
       agregar un renglón cambia `partidas` y en una póliza congelada eso es un
       403: más vale que no haya un segundo camino. */
    if(congelada) return;
    if(partidasTmp.length >= MAX_RENGLONES){
      aviso('Una cotización aguanta ' + MAX_RENGLONES + ' renglones. Ya no cabe otro.', true);
      return;
    }
    partidasTmp.push(normalizarPartida(base));
    pintarPartidas();
    if(foco === null) return;          /* quien llama se encarga del foco */
    const fila = $('listaPartidas').querySelector('tr[data-idx="' + (partidasTmp.length-1) + '"]');
    const campo = fila && fila.querySelector('[data-campo="' + (foco || 'concepto') + '"]');
    if(campo){ campo.focus(); campo.select && campo.select(); }
  }

  /* ---- Listeners delegados: se cuelgan UNA vez, fuera de pintarPartidas.
     Adentro se acumularían y una sola acción correría N veces. ---- */
  $('listaPartidas').addEventListener('input', ev=>{
    const campo = ev.target.closest('[data-campo]');
    if(!campo) return;
    const fila = campo.closest('[data-idx]');
    const x = partidasTmp[+fila.dataset.idx];
    if(!x) return;
    const k = campo.dataset.campo;
    x._tocada = true;
    if(k === 'cantidad'){ x.cantidad = parseInt(campo.value,10) || 0; }
    else if(k === 'frecuencia'){
      const antes = mesArranqueDe(normalizarPartida(x));
      x.frecuencia = parseInt(campo.value,10) || 0;
      /* Cambiar la frecuencia cambia el intervalo, así que los meses se recalculan
         desde el mismo arranque. Si el renglón estaba a mano no se le tocan: ahí
         los meses los puso alguien a propósito. */
      const nuevos = mesesRegulares(antes === null ? 0 : antes, Math.max(1, x.frecuencia));
      if(antes !== null && nuevos) { x.mesesServicio = nuevos; pintarPartidas(); return; }
    }
    else if(k === 'precioUnitario'){ formatearMiles(campo); x.precioUnitario = aNumero(campo.value); }
    else x[k] = campo.value;
    refrescar(+fila.dataset.idx);
  });

  $('listaPartidas').addEventListener('change', ev=>{
    const sel = ev.target.closest('[data-arranque]');
    if(!sel) return;
    if(sel.value === '') return;                 /* «a mano»: no se toca nada */
    const x = partidasTmp[+sel.closest('[data-idx]').dataset.idx];
    const m = mesesRegulares(parseInt(sel.value,10), Math.max(1, x.frecuencia));
    if(!m) return;
    x.mesesServicio = m;
    x._tocada = true;
    pintarPartidas();
  });

  $('listaPartidas').addEventListener('click', ev=>{
    const mes = ev.target.closest('[data-mes]');
    if(mes){
      const x = partidasTmp[+mes.closest('[data-idx]').dataset.idx];
      const m = +mes.dataset.mes;
      const j = x.mesesServicio.indexOf(m);
      x._tocada = true;
      if(j === -1) x.mesesServicio.push(m); else x.mesesServicio.splice(j,1);
      x.mesesServicio.sort((a,b)=> a-b);
      /* Marcar meses a mano AJUSTA la frecuencia: si escoges cuatro meses, son
         cuatro servicios al año. Antes había que corregir el número aparte y el
         renglón se quedaba en rojo por no cuadrar consigo mismo. Si se quedan en
         cero no se toca: 0 servicios al año no significa nada. */
      if(x.mesesServicio.length) x.frecuencia = x.mesesServicio.length;
      pintarPartidas();          /* el arranque puede haber pasado a «a mano» */
      return;
    }
    const mano = ev.target.closest('[data-meses-mano]');
    if(mano){
      const x = partidasTmp[+mano.dataset.mesesMano];
      x._abierta = !x._abierta;
      pintarPartidas();
      return;
    }
    const dup = ev.target.closest('[data-duplicar]');
    if(dup){
      const i = +dup.dataset.duplicar;
      /* Copia con id EN BLANCO: el duplicado es otro equipo, no el mismo con dos
         vidas. Como el historial de servicios se llavea por el id de la partida,
         dejarle el mismo id le heredaría los servicios del original — y borrar
         uno de los dos borraría los del otro. normalizarPartida le pone uno
         nuevo. */
      const copia = Object.assign({}, partidasTmp[i],
        { id:'', mesesServicio: partidasTmp[i].mesesServicio.slice() });
      partidasTmp.splice(i + 1, 0, normalizarPartida(copia));
      partidasTmp[i + 1]._tocada = true;
      pintarPartidas();
      aviso('Renglón duplicado. Cámbiale los meses si esa unidad va aparte.');
      return;
    }
    const quitar = ev.target.closest('[data-quitar]');
    if(quitar){
      const i = +quitar.dataset.quitar;
      const x = partidasTmp[i];
      /* Un renglón con servicios ya registrados no se va sin avisar: eso borra
         trabajo hecho, no solo una línea de precio. El historial vive en la
         póliza, llaveado por el id de este renglón — y normalizarPoliza tira las
         llaves cuyo renglón ya no existe, así que quitarlo sí se lo lleva. */
      const hechos = Object.keys((p && p.hechos && p.hechos[x.id]) || {}).length;
      /* Mismo motivo que arriba: confirmar() reemplazaría #modalCuerpo y se
         perdería la captura. Diálogo del navegador. */
      if(hechos && !window.confirm(
          (x.concepto || 'Este equipo') + ' tiene ' + hechos + ' '
          + plural(hechos,'servicio registrado','servicios registrados')
          + '.\n\nAl quitarlo se borra también ese historial. ¿Seguir?')){
        return;
      }
      partidasTmp.splice(i,1);
      pintarPartidas();
    }
  });

  /* Chips de acceso rápido: los equipos que más se cotizan, a un clic. Escribir
     el nombre completo para los de siempre era el trabajo tonto de la captura.
     Salen de las pólizas que ya existen; si no hay ninguna, del catálogo. */
  function pintarChips(){
    const caja = $('chipsEquipo');
    if(!caja) return;
    /* En una póliza congelada no se agregan renglones, así que los chips no van.
       Doce botones apagados son ruido; no enseñarlos dice lo mismo mejor. */
    if(congelada){ caja.innerHTML = ''; caja.hidden = true; return; }
    caja.hidden = false;
    const cuenta = {};
    datos.polizas.forEach(q => q.partidas.forEach(x => {
      if(x.catalogoId) cuenta[x.catalogoId] = (cuenta[x.catalogoId] || 0) + 1;
    }));
    const activos = catalogo().filter(e => e.activo);
    const orden = activos.slice().sort((a,b)=> (cuenta[b.id]||0) - (cuenta[a.id]||0) || a.concepto.localeCompare(b.concepto,'es'));
    caja.innerHTML = orden.slice(0, 12).map(e =>
      '<button type="button" class="chip-eq" data-chip="' + esc(e.id) + '" '
      + 'title="' + esc(e.concepto + (e.precio ? ' · ' + dineroCent(e.precio) : ' · sin precio')
          + ' · ' + e.frecuencia + ' al año') + '">'
      + esc(e.concepto) + '<span class="mas">+</span></button>').join('');
  }
  $('chipsEquipo').addEventListener('click', ev=>{
    const b = ev.target.closest('[data-chip]');
    if(!b) return;
    const e = equipoDeCatalogo(b.dataset.chip);
    if(e) agregarDelEquipo(e);
  });

  /* Buscador del catálogo: al elegir un equipo se agrega el renglón ya con su
     precio y su frecuencia, y el foco SE QUEDA en el buscador para poder escribir
     el siguiente sin volver a picarlo. Con 34 equipos, ir y volver al buscador
     cada vez era la mitad del trabajo. */
  function agregarDelCatalogo(){
    const txt = $('pBuscaEquipo').value.trim();
    if(!txt) return;
    const e = catalogo().find(q => q.activo && q.concepto.toLowerCase() === txt.toLowerCase())
           || catalogo().find(q => q.activo && q.concepto.toLowerCase().startsWith(txt.toLowerCase()));
    $('pBuscaEquipo').value = '';
    if(!e){
      aviso('«' + txt + '» no está en el catálogo. Usa «Agregar otro» y captúralo a mano.', true);
      return;
    }
    agregarDelEquipo(e);
  }
  function agregarDelEquipo(e){
    agregarRenglon({
      catalogoId: e.id, concepto: e.concepto, cantidad: 1,
      precioUnitario: e.precio, frecuencia: e.frecuencia,
      /* Arranca en el primer mes; "Balancear calendario" los reparte después. */
      mesesServicio: mesesRegulares(0, e.frecuencia)
    }, null);
    /* El foco vuelve al buscador, no a la cantidad: así se encadenan los 34
       equipos escribiendo, y las cantidades se ajustan al final en la tabla. */
    if($('pBuscaEquipo')) $('pBuscaEquipo').focus();
    if(!e.precio) aviso(e.concepto + ' no tiene precio en el catálogo. Escríbelo en el renglón.', true);
  }
  $('pBuscaEquipo').addEventListener('change', agregarDelCatalogo);
  $('pBuscaEquipo').addEventListener('keydown', ev=>{
    if(ev.key === 'Enter'){ ev.preventDefault(); agregarDelCatalogo(); }
  });
  /* Agregar de a muchos: capturar una cotización de 40 equipos picando "Agregar
     otro" cuarenta veces es absurdo. Se pide el número y se ponen todos de golpe. */
  $('btnOtroEquipo').addEventListener('click', ()=>{
    const pedidos = Math.max(1, Math.min(MAX_RENGLONES, parseInt($('pCuantos').value,10) || 1));
    const espacio = MAX_RENGLONES - partidasTmp.length;
    if(espacio <= 0){
      aviso('Una cotización aguanta ' + MAX_RENGLONES + ' renglones. Ya no cabe otro.', true);
      return;
    }
    const cuantos = Math.min(pedidos, espacio);
    const molde = () => ({ concepto:'', cantidad:1, precioUnitario:0, frecuencia:3, mesesServicio:mesesRegulares(0,3) });
    for(let i = 0; i < cuantos; i++) partidasTmp.push(normalizarPartida(molde()));
    pintarPartidas();
    /* El cursor cae en el PRIMERO de los nuevos, no en el último: se captura de
       arriba hacia abajo y de ahí en adelante todo es Tab. */
    const fila = $('listaPartidas').querySelector('tr[data-idx="' + (partidasTmp.length - cuantos) + '"]');
    const campo = fila && fila.querySelector('[data-campo="concepto"]');
    if(campo) campo.focus();
    $('pCuantos').value = 1;
    if(cuantos > 1) aviso(cuantos + ' renglones agregados. Captúralos con Tab.');
    if(cuantos < pedidos) aviso('Solo cupieron ' + cuantos + ': el tope es ' + MAX_RENGLONES + ' renglones.', true);
  });

  /* Cliente nuevo sin salir del modal: hay clientes con póliza y sin ningún
