    +   '<label class="casilla"><input type="checkbox" id="sIncOnboarding"' + (s && s.incOnboarding ? ' checked':'') + '> Incluyó arranque y onboarding</label>'
    +   '<div class="campo" id="wrapOnboarding"><label>Monto de onboarding (MX$) — solo en el pago 1</label>'
    +     '<input type="text" id="sOnboarding" inputmode="decimal" placeholder="Ej. 16,000" value="' + (s && s.onboarding ? numero(s.onboarding) : '') + '"></div>'

    +   '<label class="casilla"><input type="checkbox" id="sIncViaticos"' + (s && s.incViaticos ? ' checked':'') + '> Incluyó viáticos</label>'
    +   '<div class="campo" id="wrapViaticos"><label>Monto de viáticos (MX$) — solo en el pago 1</label>'
    +     '<input type="text" id="sViaticos" inputmode="decimal" placeholder="Ej. 5,000" value="' + (s && s.viaticos ? numero(s.viaticos) : '') + '"></div>'
    + '</div>'

    + '<div class="seccion"><h4>Vigencia y pagos</h4>'
    +   '<div class="fila2">'
    +     '<div class="campo"><label>Fecha de inicio *</label>'
    +       '<input type="date" id="sInicio" value="' + esc(s ? s.fechaInicio : hoyISO()) + '">'
    +       '<div class="pista">El día de esta fecha marca el día de corte de cada mensualidad.</div></div>'
    +     '<div class="campo"><label>Mensualidades del contrato *</label>'
    +       '<input type="number" id="sMeses" min="1" max="' + MAX_MESES + '" step="1" value="' + (s ? s.meses : 12) + '">'
    +       '<div class="pista">De 1 a ' + MAX_MESES + '. Lo normal son 12.</div></div>'
    +   '</div>'
    +   '<div class="campo"><label>Mensualidades ya pagadas</label>'
    +     '<div class="meses-modal" id="mesesModal"></div>'
    +     '<div class="pista">Haz clic en el número de la mensualidad que ya te pagaron.</div></div>'
    +   '<div class="campo"><label>Notas del sitio (opcional)</label>'
    +     '<textarea id="sNotas" placeholder="Orden de compra, contacto de sitio, pendientes…">' + esc(s ? s.notas : '') + '</textarea></div>'
    +   '<div class="resumen" id="resumenSitio"></div>'
    + '</div>';

  const pie = '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
            + '<button type="button" class="btn btn-primario" data-modal="guardar">' + (s ? 'Guardar cambios' : 'Agregar sitio') + '</button>';

  abrirModal(s ? 'Editar sitio · ' + (cli ? cli.nombre : '') : 'Agregar sitio' + (cli ? ' · ' + cli.nombre : ''), cuerpo, pie);

  /* Estado temporal de las casillas de mes mientras el modal está abierto. */
  let pagosTmp = s ? s.pagos.slice() : [];

  function leerForm(){
    const meses = Math.max(1, Math.min(MAX_MESES, parseInt($('sMeses').value,10) || 12));
    return {
      nombre: $('sNombre').value.trim(),
      clienteId: $('sCliente').value,
      modulos: Math.max(0, parseInt($('sModulos').value,10) || 0),
      estado: $('sEstado').value,
      tipo: $('sTipo').value,
      mensualidad: aNumero($('sMensualidad').value),
      incOnboarding: $('sIncOnboarding').checked,
      onboarding: aNumero($('sOnboarding').value),
      incViaticos: $('sIncViaticos').checked,
      viaticos: aNumero($('sViaticos').value),
      fechaInicio: $('sInicio').value || hoyISO(),
      meses,
      notas: $('sNotas').value.trim()
    };
  }

  function pintarMeses(){
    const f = leerForm();
    const extras = (f.incOnboarding ? f.onboarding : 0) + (f.incViaticos ? f.viaticos : 0);
    pagosTmp = Array.from({length:f.meses}, (_,i)=> !!pagosTmp[i]);
    $('mesesModal').innerHTML = pagosTmp.map((p,i)=>{
      const monto = f.mensualidad + (i === 0 ? extras : 0);
      const t = 'Mensualidad ' + (i+1) + ' · ' + fmtFecha(sumarMeses(f.fechaInicio, i)) + ' · ' + dinero(monto)
              + (i === 0 && extras ? ' (incluye onboarding y viáticos)' : '');
      return '<button type="button" class="mes ' + (p ? 'pagado' : '') + '" data-mtmp="' + i + '" '
        + 'title="' + esc(t) + '" aria-pressed="' + (p ? 'true' : 'false') + '">' + (i+1) + '</button>';
    }).join('');
  }

  function pintarResumen(){
    const f = leerForm();
    const prov = normalizarSitio(Object.assign({}, f, { pagos:pagosTmp, id:'tmp' }));
    const c = calcular(prov);
    const unit = f.modulos > 0 ? f.mensualidad / f.modulos : 0;
    $('pistaUnitario').textContent = f.modulos > 0
      ? 'Es el total mensual del sitio: ' + dinero(f.mensualidad) + ' ÷ ' + f.modulos + ' Forpass = ' + dinero(unit) + ' por módulo.'
      : 'Es el total mensual del sitio, sumando todos sus Forpass.';

    let prox = 'Contrato cubierto';
    if(c.proximo) prox = fmtFecha(c.proximo) + ' · ' + (c.diasRest < 0
      ? 'vencida hace ' + Math.abs(c.diasRest) + ' ' + plural(Math.abs(c.diasRest),'día','días')
      : 'faltan ' + c.diasRest + ' ' + plural(c.diasRest,'día','días'));

    $('resumenSitio').innerHTML =
        '<div class="r-fila"><span>Vigencia</span><span>' + fmtFecha(f.fechaInicio) + ' → ' + fmtFecha(c.fin) + '</span></div>'
      + '<div class="r-fila"><span>Siguiente mensualidad</span><span>' + esc(prox) + '</span></div>'
      + '<div class="r-fila"><span>Mensualidades pagadas</span><span>' + c.pagados + ' de ' + f.meses + (c.atrasadas ? ' · ' + c.atrasadas + ' vencida' + (c.atrasadas===1?'':'s') : '') + '</span></div>'
      + (c.extras
          ? '<div class="r-fila"><span>Pago 1 — mensualidad + extras</span><span>' + dinero(c.primerPago) + '</span></div>'
            + (f.meses > 1
                ? '<div class="r-fila"><span>Pagos 2 al ' + f.meses + ' — cada uno</span><span>' + dinero(f.mensualidad) + '</span></div>'
                : '')
          : '<div class="r-fila"><span>Cada mensualidad</span><span>' + dinero(f.mensualidad) + '</span></div>')
      + '<div class="r-fila"><span>Renta ' + f.meses + ' ' + plural(f.meses,'mes','meses') + '</span><span>' + dinero(f.mensualidad * f.meses) + '</span></div>'
      + (c.extras ? '<div class="r-fila"><span>Onboarding y viáticos (una vez)</span><span>' + dinero(c.extras) + '</span></div>' : '')
      + '<div class="r-fila r-total"><span>Valor total del contrato</span><span>' + dinero(c.valorContrato) + '</span></div>';

    $('wrapOnboarding').style.display = f.incOnboarding ? '' : 'none';
    $('wrapViaticos').style.display   = f.incViaticos   ? '' : 'none';
  }

  function refrescar(){ pintarMeses(); pintarResumen(); }

  ['sNombre','sCliente','sModulos','sEstado','sTipo','sMensualidad','sIncOnboarding','sOnboarding','sIncViaticos','sViaticos','sInicio','sNotas']
    .forEach(id => $(id).addEventListener('input', pintarResumen));
  $('sMeses').addEventListener('input', refrescar);
  $('sInicio').addEventListener('change', refrescar);
  ['sMensualidad','sOnboarding','sViaticos'].forEach(id=>{
    $(id).addEventListener('input', ()=> formatearMiles($(id)));
  });
  $('mesesModal').addEventListener('click', ev=>{
    const b = ev.target.closest('[data-mtmp]');
    if(!b) return;
    const i = +b.dataset.mtmp;
    pagosTmp[i] = !pagosTmp[i];
    refrescar();
  });

  refrescar();

  cerrarModalActual = ()=>{
    const f = leerForm();
    if(!f.nombre){ $('sNombre').setAttribute('aria-invalid','true'); $('sNombre').focus(); aviso('El sitio necesita un nombre.', true); return; }
    if(!f.clienteId){ aviso('Selecciona un cliente.', true); return; }
    const limpio = normalizarSitio(Object.assign({}, f, { pagos:pagosTmp, id: s ? s.id : nuevoId() }));
    if(s){ Object.assign(s, limpio); }
    else{ datos.sitios.push(limpio); }
    guardarSitio(s || limpio, s ? 'editó' : 'creó');
    cerrarModal();
    estado.vista = 'cliente'; estado.clienteId = limpio.clienteId;
    render();
    aviso(s ? 'Sitio actualizado.' : 'Sitio agregado.');
  };
}

/* ----------------------- Modal: plan de pagos -----------------------------
   El desglose mes por mes: cuánto toca cada mensualidad, si ya se pagó, con
   qué OC y quién la capturó. Los extras van en el mes 1 y se ven ahí mismo,
   sin necesidad de explicarlo con textos en la tarjeta.
   ------------------------------------------------------------------------- */
function modalPlanDePagos(sitioId){
  const s = sitioPorId(sitioId);
  if(!s) return;
  const c = calcular(s);

  const filas = s.pagos.map((pagado, i)=>{
    const det = s.pagosDetalle[i] || {};
    const fecha = sumarMeses(s.fechaInicio, i);
    const vencida = !pagado && i < c.debidas;

    let concepto = 'Mensualidad';
    if(i === 0){
      const extras = [];
      if(s.incOnboarding && s.onboarding) extras.push('onboarding ' + dinero(s.onboarding));
      if(s.incViaticos && s.viaticos)     extras.push('viáticos ' + dinero(s.viaticos));
      if(extras.length) concepto = 'Mensualidad + ' + extras.join(' + ');
    }

    let estado;
    if(pagado) estado = '<span class="rol c-analyst">Pagada</span>';
    else if(vencida) estado = '<span class="rol c-owner">Vencida</span>';
    else estado = '<span class="rol c-viewer">Pendiente</span>';

    const detalle = pagado
      ? '<div style="font-size:11px; color:var(--gray); margin-top:3px">'
        + (det.oc ? 'OC <b>' + esc(det.oc) + '</b>' : 'sin OC registrada')
        + (det.quien ? ' · capturó ' + esc(det.quien) : '')
        + (det.cuando ? ' · ' + esc(fechaHora(det.cuando)) : '') + '</div>'
      : '';

    return '<tr>'
      + '<td style="text-align:center; font-weight:700; color:var(--navy)">' + (i+1) + '</td>'
      + '<td>' + fmtFecha(fecha) + '</td>'
      + '<td>' + esc(concepto) + detalle + '</td>'
      + '<td style="text-align:right; font-weight:700">' + dinero(c.montos[i]) + '</td>'
      + '<td style="text-align:right">' + estado + '</td>'
      + '</tr>';
  }).join('');

  const cuerpo =
      '<div class="resumen" style="margin-bottom:16px">'
    +   '<div class="r-fila"><span>Mensualidades pagadas</span><span>' + c.pagados + ' de ' + s.meses + '</span></div>'
    +   '<div class="r-fila"><span>Cobrado</span><span>' + dinero(c.cobrado) + '</span></div>'
    +   (c.adeudo ? '<div class="r-fila"><span>Vencido por cobrar</span><span>' + dinero(c.adeudo) + '</span></div>' : '')
    +   '<div class="r-fila r-total"><span>Valor total del contrato</span><span>' + dinero(c.valorContrato) + '</span></div>'
    + '</div>'
    + '<div class="rodillo"><table class="tabla" style="min-width:520px"><thead><tr>'
    +   '<th style="text-align:center">Mes</th><th>Fecha de corte</th><th>Concepto</th>'
    +   '<th style="text-align:right">Monto</th><th style="text-align:right">Estado</th>'
    + '</tr></thead><tbody>' + filas + '</tbody></table></div>';

  abrirModal('Plan de pagos · ' + s.nombre, cuerpo,
    '<button type="button" class="btn btn-suave" data-modal="cancelar">Cerrar</button>');
  $('modal').classList.add('ancho');
  cerrarModalActual = null;
}

/* --------------------- Modal: capturar una mensualidad ---------------------
   Cada pago queda con su número de OC y con el nombre de quien lo capturó.
   ------------------------------------------------------------------------- */
const LLAVE_CAPTURADOR = 'forguard_forpass_capturador_v1';
function nombreCapturador(){
  if(HAY_NUBE && haySesion()) return nombreDe(sesion);
  try{ return localStorage.getItem(LLAVE_CAPTURADOR) || ''; }catch(e){ return ''; }
}
function recordarCapturador(nombre){
  try{ localStorage.setItem(LLAVE_CAPTURADOR, nombre || ''); }catch(e){}
}

function modalCapturarPago(sitioId, idx){
  const s = sitioPorId(sitioId);
  if(!s || idx < 0 || idx >= s.meses) return;
  const c = calcular(s);
  const det = s.pagosDetalle[idx] || { oc:'', quien:'', cuando:'' };
  const conCuenta = HAY_NUBE && haySesion();
  const partes = [];
  if(idx === 0 && s.incOnboarding && s.onboarding) partes.push('onboarding ' + dinero(s.onboarding));
  if(idx === 0 && s.incViaticos && s.viaticos)     partes.push('viáticos ' + dinero(s.viaticos));

  const cuerpo =
      '<div class="resumen" style="margin-bottom:18px">'
    +   '<div class="r-fila"><span>Sitio</span><span>' + esc(s.nombre) + '</span></div>'
    +   '<div class="r-fila"><span>Mensualidad</span><span>' + (idx+1) + ' de ' + s.meses + '</span></div>'
    +   '<div class="r-fila"><span>Fecha de corte</span><span>' + fmtFecha(sumarMeses(s.fechaInicio, idx)) + '</span></div>'
    +   (partes.length ? '<div class="r-fila"><span>Incluye</span><span>' + esc(partes.join(' + ')) + '</span></div>' : '')
    +   '<div class="r-fila r-total"><span>Monto de esta mensualidad</span><span>' + dinero(c.montos[idx]) + '</span></div>'
    + '</div>'

    + '<div class="campo"><label>Nombre de quien captura *</label>'
    +   (conCuenta
          ? '<input type="text" id="pQuien" value="' + esc(nombreDe(sesion)) + '" readonly>'
            + '<div class="pista">Es tu cuenta (' + esc(sesion.correo) + '). Queda registrada en el historial de cambios.</div>'
          : '<input type="text" id="pQuien" placeholder="Ej. Santiago Garza" value="' + esc(nombreCapturador()) + '">'
            + '<div class="pista">Se guarda para las siguientes capturas de esta computadora.</div>')
    + '</div>'

    + '<div class="campo"><label>Número de OC *</label>'
    +   '<input type="text" id="pOC" placeholder="Ej. 4500123" value="' + esc(det.oc) + '">'
    +   '<div class="pista">La orden de compra con la que se pagó <b>esta</b> mensualidad. Cada pago lleva la suya.</div>'
    + '</div>';

  abrirModal('Capturar mensualidad ' + (idx+1), cuerpo,
      '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
    + '<button type="button" class="btn btn-verde" data-modal="guardar">' + ICONO.cheque + 'Capturar mensualidad</button>');

  setTimeout(()=>{ const oc = $('pOC'); if(oc) oc.focus(); }, 70);

  cerrarModalActual = ()=>{
    const quien = $('pQuien').value.trim();
    const oc    = $('pOC').value.trim();
    if(!quien){ $('pQuien').setAttribute('aria-invalid','true'); $('pQuien').focus(); aviso('Falta el nombre de quien captura.', true); return; }
    if(!oc){ $('pOC').setAttribute('aria-invalid','true'); $('pOC').focus(); aviso('Falta el número de OC.', true); return; }

    s.pagos[idx] = true;
    s.pagosDetalle[idx] = { oc, quien, cuando: new Date().toISOString() };
    if(!conCuenta) recordarCapturador(quien);

    guardarSitio(s, 'marcó pagada', 'mensualidad ' + (idx+1) + ' de ' + s.meses + ' · OC ' + oc + ' · capturó ' + quien);
    cerrarModal();
    render();
    aviso('Mensualidad ' + (idx+1) + ' de ' + s.nombre + ' capturada con OC ' + oc + '.');
  };
}

function confirmar(titulo, texto, textoBoton, alAceptar){

    + '<button type="button" class="btn btn-peligro" data-modal="guardar">' + esc(textoBoton) + '</button>');

}

/* Escribe separadores de miles mientras se teclea, sin mover el cursor al final. */
function aNumero(txt){ return Math.max(0, Number(String(txt||'').replace(/[^0-9.]/g,'')) || 0); }
function formatearMiles(input){
  const antes = input.value, cursor = input.selectionStart;
  const digitosAntes = antes.slice(0, cursor).replace(/[^0-9.]/g,'').length;
  const partes = antes.replace(/[^0-9.]/g,'').split('.');
  let limpio = partes.shift();
  if(partes.length) limpio += '.' + partes.join('').slice(0,2);
  if(limpio === '' || limpio === '.'){ input.value = limpio; return; }
  const [ent, dec] = limpio.split('.');
  let salida = (ent ? Number(ent).toLocaleString('en-US') : '') + (dec !== undefined ? '.' + dec : '');
  input.value = salida;
  let vistos = 0, pos = 0;
  for(; pos < salida.length && vistos < digitosAntes; pos++) if(/[0-9.]/.test(salida[pos])) vistos++;
  try{ input.setSelectionRange(pos, pos); }catch(e){}
}

/* ============================ EVENTOS DE LA VISTA ============================ */
$('vista').addEventListener('click', ev=>{
  const t = ev.target;

  const acc = t.closest('[data-accion]');
  if(acc){
    const a = acc.dataset.accion;
    if(a === 'nuevo-cliente'){ if(exigirPermiso()) modalCliente(null); }
    else if(a === 'nuevo-sitio'){ if(exigirPermiso()) modalSitio(estado.clienteId, null); }
    else if(a === 'ir-clientes'){ estado.vista = 'clientes'; estado.clienteId = null; render(); }
    else if(a === 'excel') descargarExcel(null);
    else if(a === 'excel-cliente') descargarExcel(estado.clienteId);
    else if(a === 'respaldo') descargarRespaldo();
    else if(a === 'restaurar') $('archivoRestaurar').click();
    else if(a === 'nueva-cuenta') modalCuenta();
    else if(a === 'refrescar-admin') montarAdmin(true);
    return;
  }

  const ver = t.closest('[data-ver]');
  if(ver){ entrarCliente(ver.dataset.ver); return; }

  const edC = t.closest('[data-editar-cliente]');
  if(edC){ if(exigirPermiso()) modalCliente(edC.dataset.editarCliente); return; }

  const boC = t.closest('[data-borrar-cliente]');
  if(boC){
    if(!exigirPermiso()) return;
    const c = clientePorId(boC.dataset.borrarCliente);
    const n = sitiosDe(c.id).length;
    confirmar('Eliminar cliente',
      'Se va a eliminar <b>' + esc(c.nombre) + '</b>' + (n ? ' junto con sus <b>' + n + ' ' + plural(n,'sitio','sitios') + '</b>' : '') + '. Esta acción no se puede deshacer.',
      'Sí, eliminar', ()=>{
        sitiosDe(c.id).forEach(s => borrarRegistro('sitios', s.id));
        datos.sitios = datos.sitios.filter(s => s.clienteId !== c.id);
        datos.clientes = datos.clientes.filter(x => x.id !== c.id);
        if(estado.clienteId === c.id){ estado.vista = 'clientes'; estado.clienteId = null; }
        borrarRegistro('clientes', c.id);
        anotar('eliminó', 'cliente', c.nombre, n ? 'junto con ' + n + ' ' + plural(n,'sitio','sitios') : '');
        render(); aviso('Cliente eliminado.');
      });
    return;
  }

  const edS = t.closest('[data-editar-sitio]');
  if(edS){ if(exigirPermiso()) modalSitio(null, edS.dataset.editarSitio); return; }

  const boS = t.closest('[data-borrar-sitio]');
  if(boS){
    if(!exigirPermiso()) return;
    const s = sitioPorId(boS.dataset.borrarSitio);
    confirmar('Eliminar sitio', 'Se va a eliminar el sitio <b>' + esc(s.nombre) + '</b> y su historial de pagos. Esta acción no se puede deshacer.',
      'Sí, eliminar', ()=>{
        datos.sitios = datos.sitios.filter(x => x.id !== s.id);
        borrarRegistro('sitios', s.id);
        anotar('eliminó', 'sitio', s.nombre);
        render(); aviso('Sitio eliminado.');
      });
    return;
  }

  const pago = t.closest('[data-pago]');
  if(pago){
    if(!exigirPermiso()) return;
    const s = sitioPorId(pago.dataset.pago);
    const i = +pago.dataset.idx;
    if(s.pagos[i]){
      /* Ya estaba pagada: se pregunta antes de deshacer, porque se pierde la OC. */
      const det = s.pagosDetalle[i] || {};
      confirmar('Deshacer esta captura',
        'La mensualidad <b>' + (i+1) + '</b> de <b>' + esc(s.nombre) + '</b> quedaría como no pagada'
        + (det.oc ? ', y se borra su <b>OC ' + esc(det.oc) + '</b>' : '') + '.',
        'Sí, deshacer', ()=>{
          s.pagos[i] = false;
          s.pagosDetalle[i] = { oc:'', quien:'', cuando:'' };
          guardarSitio(s, 'deshizo la captura de', 'mensualidad ' + (i+1) + ' de ' + s.meses
                       + (det.oc ? ' · OC ' + det.oc : ''));
          render();
        });
    }else{
      modalCapturarPago(s.id, i);
    }
    return;
  }

  const marcar = t.closest('[data-marcar]');
  if(marcar){
    if(!exigirPermiso()) return;
    const s = sitioPorId(marcar.dataset.marcar);
    const i = s.pagos.findIndex(p => !p);
    if(i === -1){ aviso('Todas las mensualidades ya están pagadas.'); return; }
    modalCapturarPago(s.id, i);
    return;
  }

  const plan = t.closest('[data-plan]');
  if(plan){ modalPlanDePagos(plan.dataset.plan); return; }

  const tar = t.closest('[data-cliente]');
  if(tar){ entrarCliente(tar.dataset.cliente); return; }
});

/* ======================= GENERADOR DE ARCHIVO XLSX =======================
   Se arma el .xlsx a mano: es un ZIP (sin compresión) con unos cuantos XML.
   Así no hace falta ninguna librería externa y la página sigue funcionando
   sin internet.
   ======================================================================== */
const TABLA_CRC = (()=>{
  const t = new Uint32Array(256);
  for(let n=0; n<256; n++){ let c = n; for(let k=0; k<8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0; i<bytes.length; i++) c = TABLA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const aBytes = txt => new TextEncoder().encode(txt);

function armarZip(archivos){
  const partes = [], central = [];
  let desplazamiento = 0, tamCentral = 0;
  const HORA = 0, FECHA = (1 << 5) | 1;   /* 1 de enero de 1980, fijo */

  archivos.forEach(a=>{
    const nombre = aBytes(a.nombre), datosB = a.datos, crc = crc32(datosB);

    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true);   /* nombres en UTF-8 */
    local.setUint16(8, 0, true);                                       /* sin compresión */
    local.setUint16(10, HORA, true); local.setUint16(12, FECHA, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, datosB.length, true); local.setUint32(22, datosB.length, true);
    local.setUint16(26, nombre.length, true); local.setUint16(28, 0, true);
    partes.push(new Uint8Array(local.buffer), nombre, datosB);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, HORA, true); cd.setUint16(14, FECHA, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, datosB.length, true); cd.setUint32(24, datosB.length, true);
    cd.setUint16(28, nombre.length, true);
    cd.setUint32(42, desplazamiento, true);
    central.push(new Uint8Array(cd.buffer), nombre);

    desplazamiento += 30 + nombre.length + datosB.length;
    tamCentral += 46 + nombre.length;
  });

  const fin = new DataView(new ArrayBuffer(22));
  fin.setUint32(0, 0x06054b50, true);
  fin.setUint16(8, archivos.length, true); fin.setUint16(10, archivos.length, true);
  fin.setUint32(12, tamCentral, true); fin.setUint32(16, desplazamiento, true);

  return new Blob(partes.concat(central, [new Uint8Array(fin.buffer)]),
                  { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

const escXml = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function letraCol(n){    /* 1 -> A, 27 -> AA */
  let s = '';
  while(n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
/* Constructores de celda: t=texto, n=número, f=fecha, m=dinero, x=fórmula */
const cT = (v, e) => ({ t:'s', v, e });
const cN = (v, e) => ({ t:'n', v, e });
const cF = (iso, e) => ({ t:'d', v:iso, e });
const cX = (formula, cache, e) => ({ t:'f', v:formula, cache, e });

function filaXml(nFila, celdas){
  let x = '<row r="' + nFila + '">';
  celdas.forEach((c, i)=>{
    if(c === null || c === undefined) return;
    const ref = letraCol(i+1) + nFila;
    const est = c.e !== undefined ? ' s="' + c.e + '"' : '';
    if(c.t === 's'){
      if(c.v === '' || c.v === null || c.v === undefined){ x += '<c r="' + ref + '"' + est + '/>'; return; }
      x += '<c r="' + ref + '"' + est + ' t="inlineStr"><is><t xml:space="preserve">' + escXml(c.v) + '</t></is></c>';
    }else if(c.t === 'n'){
      x += '<c r="' + ref + '"' + est + '><v>' + (Number(c.v) || 0) + '</v></c>';
    }else if(c.t === 'd'){
      x += '<c r="' + ref + '"' + est + '><v>' + serialExcel(c.v) + '</v></c>';
    }else if(c.t === 'f'){
      x += '<c r="' + ref + '"' + est + '><f>' + escXml(c.v) + '</f>'
         + (c.cache !== undefined ? (typeof c.cache === 'number' ? '<v>' + c.cache + '</v>' : '<v>' + escXml(c.cache) + '</v>') : '')
         + '</c>';
      /* Las fórmulas de texto necesitan declarar el tipo str */
      if(typeof c.cache === 'string') x = x.replace('<c r="' + ref + '"' + est + '>', '<c r="' + ref + '"' + est + ' t="str">');
    }
  });
  return x + '</row>';
}

/* La hoja se arma según el contrato más largo que se esté exportando: con
   contratos de 12 meses sale igual que el formato de siempre, y solo crece a
   Mes 13…24 si hace falta. Las letras de columna se calculan, nunca se
   escriben a mano, para que nada se descuadre al mover columnas. */
function planoHoja(filasSitios){
  const nMeses = Math.max(12, ...filasSitios.map(f => f.sitio.meses));
  const fijas = ['Cliente','Sitio','Módulos','Tipo','Mensualidad ($)','Fecha inicio','Vigencia (fin)','Suscripción'];
  const meses = Array.from({length:nMeses}, (_,i)=>'Mes ' + (i+1));
  const finales = ['Pagados','Pendientes','Debió pagar (a hoy)','Estatus de pago',
                   'Onboarding ($)','Viáticos ($)','Primer pago ($)','Valor del contrato ($)',
                   'Próximo pago','Días restantes','Estado del sitio','OC por mensualidad','Notas'];
  const encabezados = fijas.concat(meses, finales);
  const anchos = [22,14,9,22,15,12,13,12].concat(meses.map(()=>6), [9,11,17,15, 15,13,14,19,12,13,14,46,42]);

  const iMes0 = fijas.length;                 /* primera columna de mes */
  const i = {
    inicio:5, vigencia:6, mes0:iMes0, mesN:iMes0 + nMeses - 1,
    pagados:iMes0 + nMeses, pendientes:iMes0 + nMeses + 1,
    debio:iMes0 + nMeses + 2, estatus:iMes0 + nMeses + 3,
    proximo:iMes0 + nMeses + 8
  };
  /* Letra de columna a partir del índice (0 → A). */
  const L = idx => letraCol(idx + 1);
  return { nMeses, encabezados, anchos, i, L };
}

function construirHoja(filasSitios){
  const HOY = hoyISO();
  const { nMeses, encabezados, anchos, i, L } = planoHoja(filasSitios);
  const ultimaCol = letraCol(encabezados.length);

  let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<dimension ref="A1:' + ultimaCol + Math.max(5, 4 + filasSitios.length) + '"/>'
    + '<sheetViews><sheetView showGridLines="0" tabSelected="1" workbookViewId="0">'
    + '<pane ySplit="4" topLeftCell="A5" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
    + '<sheetFormatPr defaultRowHeight="15"/>'
    + '<cols>' + anchos.map((w,k)=>'<col min="' + (k+1) + '" max="' + (k+1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>'
    + '<sheetData>';

  xml += filaXml(1, [cT('Control de Kioskos Forpass', 1)]);
  xml += filaXml(2, [cT('Instrucciones: una fila por sitio. Escribe 1 en el mes cuando se pague esa mensualidad (0 o vacío si no). '
    + 'El onboarding y los viáticos se cobran una sola vez, en el pago 1: por eso la columna «Primer pago» es más alta que la «Mensualidad». '
    + 'La columna «Suscripción» dice si el contrato sigue Activa o ya Terminó según las fechas. «Estatus de pago» te avisa si el cliente va Al día o Atrasado. '
    + 'Las columnas calculadas se actualizan solas al abrir el archivo.', 2)]);
  xml += filaXml(3, [cT('Fecha de hoy:', 9), cX('TODAY()', serialExcel(HOY), 8), cT('(cambia sola cada día que abres el archivo)', 2)]);
  xml += filaXml(4, encabezados.map(h => cT(h, 3)));

  filasSitios.forEach((f, k)=>{
    const n = 5 + k;                       /* número de fila en Excel */
    const c = f.calc, s = f.sitio;
    const celdas = [
      cT(f.cliente, 4), cT(s.nombre, 4), cN(s.modulos, 5), cT(ETIQUETA_TIPO[s.tipo], 4),
      cN(s.mensualidad, 7), cF(s.fechaInicio, 6), cF(c.fin, 6),
      cX('IF(TODAY()<=' + L(i.vigencia) + n + ',"Activa","Terminó")', c.suscripcion, 5)
    ];
    /* Una casilla por mes; los meses fuera del contrato quedan en blanco. */
    for(let m=0; m<nMeses; m++) celdas.push(m < s.meses ? cN(s.pagos[m] ? 1 : 0, 5) : cT('', 5));

    const F = L(i.inicio) + n, U = L(i.pagados) + n, W = L(i.debio) + n;
    celdas.push(cX('SUM(' + L(i.mes0) + n + ':' + L(i.mesN) + n + ')', c.pagados, 5));
    celdas.push(cX(s.meses + '-' + U, c.pendientes, 5));
    celdas.push(cX('IF(TODAY()<' + F + ',0,MIN(' + s.meses + ',DATEDIF(' + F + ',TODAY(),"m")+1))', c.debidas, 5));
    celdas.push(cX('IF(' + U + '>=' + W + ',"Al día","Atrasado")', c.atrasadas > 0 ? 'Atrasado' : 'Al día', 5));
    celdas.push(cN(s.incOnboarding ? s.onboarding : 0, 7));
    celdas.push(cN(s.incViaticos ? s.viaticos : 0, 7));
    celdas.push(cN(c.primerPago, 7));       /* mensualidad + onboarding + viáticos */
    celdas.push(cN(c.valorContrato, 7));
    celdas.push(c.proximo ? cF(c.proximo, 6) : cT('Cubierto', 5));
    /* Días restantes: fórmula viva contra la fecha de «Próximo pago». */
    celdas.push(c.proximo ? cX(L(i.proximo) + n + '-TODAY()', c.diasRest, 5) : cT('—', 5));
    celdas.push(cT(ETIQUETA_ESTADO[s.estado], 5));
    /* Las OC de cada mensualidad pagada, en una sola celda para el vistazo
       rápido. El detalle completo va en la hoja «Pagos con OC». */
    celdas.push(cT(s.pagos.map((p, m) => {
      const d = s.pagosDetalle[m] || {};
      return (p && d.oc) ? 'M' + (m+1) + ' ' + d.oc : '';
    }).filter(Boolean).join(' · '), 4));
    celdas.push(cT(s.notas, 4));

    xml += filaXml(n, celdas);
  });

  const ultima = Math.max(5, 4 + filasSitios.length);
  const colEstatus = L(i.estatus);
  xml += '</sheetData>'
    + '<autoFilter ref="A4:' + ultimaCol + ultima + '"/>'
    + '<conditionalFormatting sqref="' + colEstatus + '5:' + colEstatus + ultima + '">'
    + '<cfRule type="cellIs" dxfId="0" priority="1" operator="equal"><formula>"Atrasado"</formula></cfRule>'
    + '<cfRule type="cellIs" dxfId="1" priority="2" operator="equal"><formula>"Al día"</formula></cfRule>'
    + '</conditionalFormatting>'
    + '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>'
    + '</worksheet>';
  return xml;
}

/* Segunda hoja: un renglón por mensualidad, con su OC y quién la capturó.
   Es la que sirve para filtrar y cuadrar pagos contra órdenes de compra. */
const ENC_PAGOS = ['Cliente','Sitio','Mensualidad','Fecha de corte','Concepto','Monto ($)',
                   'Estatus','Número de OC','Capturó','Fecha de captura'];
const ANCHOS_PAGOS = [22,14,12,14,34,13,12,18,22,18];

function construirHojaPagos(filasSitios){
  let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<sheetViews><sheetView showGridLines="0" workbookViewId="0">'
    + '<pane ySplit="2" topLeftCell="A3" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
    + '<sheetFormatPr defaultRowHeight="15"/>'
    + '<cols>' + ANCHOS_PAGOS.map((w,k)=>'<col min="' + (k+1) + '" max="' + (k+1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>'
    + '<sheetData>';

  xml += filaXml(1, [cT('Pagos con su orden de compra', 1)]);
  xml += filaXml(2, ENC_PAGOS.map(h => cT(h, 3)));

  let fila = 2;
  filasSitios.forEach(f=>{
    const s = f.sitio, c = f.calc;
    for(let m = 0; m < s.meses; m++){
      const d = s.pagosDetalle[m] || {};
      const pagado = !!s.pagos[m];
      const vencida = !pagado && m < c.debidas;

      let concepto = 'Mensualidad';
      if(m === 0){
        const extras = [];
        if(s.incOnboarding && s.onboarding) extras.push('onboarding ' + dinero(s.onboarding));
        if(s.incViaticos && s.viaticos)     extras.push('viáticos ' + dinero(s.viaticos));
        if(extras.length) concepto = 'Mensualidad + ' + extras.join(' + ');
      }

      fila++;
      xml += filaXml(fila, [
        cT(f.cliente, 4), cT(s.nombre, 4), cN(m + 1, 5),
        cF(sumarMeses(s.fechaInicio, m), 6),
        cT(concepto, 4), cN(c.montos[m], 7),
        cT(pagado ? 'Pagada' : (vencida ? 'Vencida' : 'Pendiente'), 5),
        cT(pagado ? (d.oc || '(sin OC)') : '', 4),
        cT(pagado ? (d.quien || '') : '', 4),
        d.cuando ? cF(String(d.cuando).slice(0, 10), 6) : cT('', 5)
      ]);
    }
  });

  const ultima = Math.max(3, fila);
  xml += '</sheetData>'
    + '<autoFilter ref="A2:' + letraCol(ENC_PAGOS.length) + ultima + '"/>'
    + '<conditionalFormatting sqref="G3:G' + ultima + '">'
    + '<cfRule type="cellIs" dxfId="0" priority="1" operator="equal"><formula>"Vencida"</formula></cfRule>'
    + '<cfRule type="cellIs" dxfId="1" priority="2" operator="equal"><formula>"Pagada"</formula></cfRule>'
    + '</conditionalFormatting>'
    + '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>'
    + '</worksheet>';
  return xml;
}

function descargarExcel(clienteId){
  const lista = (clienteId ? sitiosDe(clienteId) : datos.sitios).slice();
  if(!lista.length){ aviso('No hay sitios que exportar todavía.', true); return; }

  lista.sort((a,b)=>{
    const ca = clientePorId(a.clienteId), cb = clientePorId(b.clienteId);
    return String(ca ? ca.nombre : '').localeCompare(String(cb ? cb.nombre : ''), 'es') || a.nombre.localeCompare(b.nombre, 'es');
  });

  const filas = lista.map(s=>{
    const c = clientePorId(s.clienteId);
    return { cliente: c ? c.nombre : 'Sin cliente', sitio:s, calc:calcular(s) };
  });

  const archivos = [
    { nombre:'[Content_Types].xml', datos: aBytes('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
      + '<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + '</Types>') },
    { nombre:'_rels/.rels', datos: aBytes('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      + '</Relationships>') },
    { nombre:'xl/workbook.xml', datos: aBytes('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
      + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
      + '<sheets><sheet name="Control Forpass" sheetId="1" r:id="rId1"/>'
      +   '<sheet name="Pagos con OC" sheetId="2" r:id="rId3"/></sheets>'
      + '<calcPr calcId="124519" fullCalcOnLoad="1"/></workbook>') },
    { nombre:'xl/_rels/workbook.xml.rels', datos: aBytes('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
      + '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>'
      + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      + '</Relationships>') },
    { nombre:'xl/styles.xml', datos: aBytes(XLSX_ESTILOS) },
    { nombre:'xl/worksheets/sheet1.xml', datos: aBytes(construirHoja(filas)) },
    { nombre:'xl/worksheets/sheet2.xml', datos: aBytes(construirHojaPagos(filas)) }
  ];

  const cli = clienteId ? clientePorId(clienteId) : null;
  const sufijo = cli ? '_' + cli.nombre.replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'') : '';
  descargar(armarZip(archivos), 'Control_Forpass' + sufijo + '_' + selloFecha() + '.xlsx');
  aviso('Excel descargado con ' + filas.length + ' ' + plural(filas.length,'sitio','sitios') + '.');
}

/* ======================== PANTALLA DE ACCESO ========================
   El correo se recuerda aunque cierres sesión, para que la próxima vez solo
   teclees la contraseña. La contraseña nunca se guarda: de eso se encarga el
   navegador si le dices que la recuerde.
   ==================================================================== */
const LLAVE_CORREO = 'forguard_forpass_ultimo_correo_v1';
function recordarCorreo(correo){
  try{ localStorage.setItem(LLAVE_CORREO, correo || ''); }catch(e){}
}
function correoRecordado(){
  try{ return localStorage.getItem(LLAVE_CORREO) || ''; }catch(e){ return ''; }
}
function olvidarCorreo(){
  try{ localStorage.removeItem(LLAVE_CORREO); }catch(e){}
}

function mostrarAcceso(mensaje){
  $('acceso').classList.add('abierto');
  document.body.style.overflow = 'hidden';
  errorAcceso(mensaje || '');

  const recordado = correoRecordado();
  const campoCorreo = $('aCorreo');
  if(recordado && !campoCorreo.value) campoCorreo.value = recordado;

  /* Si ya sabemos quién eres, el cursor va directo a la contraseña. */
  $('otraCuenta').style.display = campoCorreo.value ? '' : 'none';
  $('saludo').textContent = recordado ? 'Hola, ' + nombreDeCorreo(recordado) + '.' : '';
  setTimeout(()=>{
    const ir = campoCorreo.value ? $('aClave') : campoCorreo;
    if(ir) ir.focus();
  }, 80);
}
function ocultarAcceso(){
  $('acceso').classList.remove('abierto');
  document.body.style.overflow = '';
  $('aClave').value = '';
}
function errorAcceso(txt){
  const e = $('accesoError');
  e.textContent = txt || '';
  e.classList.toggle('visible', !!txt);
}

$('formAcceso').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const correo = $('aCorreo').value.trim(), clave = $('aClave').value;
  if(!correo || !clave){ errorAcceso('Escribe tu correo y tu contraseña.'); return; }
  const btn = $('aEntrar');
  btn.disabled = true; btn.textContent = 'Entrando…';
  errorAcceso('');
  try{
    await entrar(correo, clave);
    recordarCorreo(sesion.correo);
    ocultarAcceso();
    anotar('entró', 'sesión', sesion.correo);
    await arrancarNube();
  }catch(e){
    const m = String(e.message || '');
    if(/SIN_PERMISO/.test(m)){
      errorAcceso('Tu cuenta existe pero todavía no tiene acceso concedido. Pide a un administrador que te lo dé.');
      salirSilencioso();
    }else if(/BLOQUEADO/.test(m)){
      errorAcceso('Tu cuenta está bloqueada. Pide a un administrador que la reactive.');
      salirSilencioso();
    }else{
      errorAcceso(m);
    }
  }finally{
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});

/* Limpia la sesión sin redibujar ni mover al usuario de pantalla. */
function salirSilencioso(){
  Object.assign(sesion, { correo:null, uid:null, idToken:null, refreshToken:null, expira:0, rol:null, nombre:'' });
  try{ localStorage.removeItem(LLAVE_SESION); }catch(e){}
}

$('aOtraCuenta').addEventListener('click', ()=>{
  olvidarCorreo();
  $('aCorreo').value = '';
  $('aClave').value = '';
  $('saludo').textContent = '';
  $('otraCuenta').style.display = 'none';
  errorAcceso('');
  $('aCorreo').focus();
});

$('aOlvide').addEventListener('click', async ()=>{
  const correo = $('aCorreo').value.trim();
  if(!correo){ errorAcceso('Escribe primero tu correo y vuelve a darle.'); $('aCorreo').focus(); return; }
  try{
    await pedirAuth('sendOobCode', { requestType:'PASSWORD_RESET', email:correo });
    errorAcceso('');
    aviso('Te mandamos un correo a ' + correo + ' para poner una contraseña nueva.');
  }catch(e){ errorAcceso(e.message); }
});

$('btnSalir').addEventListener('click', ()=>{
  if(cola.length){
    confirmar('Salir con cambios pendientes',
      'Hay <b>' + cola.length + ' ' + plural(cola.length,'cambio','cambios') + '</b> que todavía no se subieron al servidor. '
      + 'Si sales ahora se pierden. Conéctate a internet y espera a que diga «Guardado en la nube».',
      'Salir de todos modos', ()=>{ cola = []; guardarCola(); salir(); });
    return;
  }
  salir();
});

$('btnAdmin').addEventListener('click', ()=>{
  if(!esAdmin()) return;
  estado.vista = 'admin'; estado.clienteId = null;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
});

/* ===================== SINCRONIZACIÓN PERIÓDICA =====================
   Firestore por REST no avisa solo de los cambios de otros, así que se
   vuelve a consultar cada medio minuto mientras la pestaña esté a la vista
   y no haya nada pendiente ni un formulario abierto.
   ==================================================================== */
/* ¿El error fue por falta de internet? Entonces NO hay que cerrar la sesión:
   sería sacar al usuario y pedirle la contraseña por una falla pasajera. */
function esFalloDeRed(e){
  if(e instanceof TypeError) return true;      /* así se queja fetch cuando no hay red */
  const m = String((e && e.message) || e || '');
  return /Failed to fetch|NetworkError|Load failed|network error|ERR_INTERNET/i.test(m);
}
/* Queda en falso mientras no se haya logrado leer del servidor ni una vez. */
let sincronizado = false;

async function refrescarDesdeNube(){
  if(!HAY_NUBE || !haySesion()) return;
  if(cola.length || vaciando) return;
  if($('telon').classList.contains('abierto')) return;
  if(document.hidden) return;
  try{
    const antes = JSON.stringify(datos);
    await bajarDeLaNube();
    sincronizado = true;
    if(JSON.stringify(datos) !== antes) render();
  }catch(e){
    if(/SIN_SESION|SESION_VENCIDA/.test(String(e.message))) salir(true);
  }
}

/* Al volver el internet o al regresar a la pestaña: si nunca se logró la primera
   lectura, se intenta de nuevo; si ya estaba sincronizado, basta con subir la cola. */
function reintentarSincronizar(){
  if(!HAY_NUBE || !haySesion()) return;
  intentosFallidos = 0;
  if(!sincronizado){
    cargarPerfil().then(arrancarNube).catch(manejarFalloDeArranque);
    return;
  }
  vaciarCola();
  refrescarDesdeNube();
}

/* Qué hacer si al abrir la página no se pudo hablar con el servidor. Solo se
   cierra la sesión cuando el problema es de la cuenta, nunca por red. */
function manejarFalloDeArranque(e){
  const m = String((e && e.message) || '');
  if(/SIN_PERMISO/.test(m)){
    salirSilencioso();
    mostrarAcceso('Tu cuenta ya no tiene acceso concedido. Habla con un administrador.');
    render(); return;
  }
  if(/BLOQUEADO/.test(m)){
    salirSilencioso();
    mostrarAcceso('Tu cuenta está bloqueada. Pide a un administrador que la reactive.');
    render(); return;
  }
  if(/SESION_VENCIDA|SIN_SESION/.test(m)){ salir(true); return; }

  /* Cualquier otra cosa (sin internet, servidor caído) se aguanta: sigues dentro,
     trabajando con la última copia, y se reintenta solo. */
  console.warn('No se pudo sincronizar al arrancar:', m);
  /* Tienes sesión válida: que no te quede la pantalla de acceso encima. */
  if(haySesion()) ocultarAcceso();
  aviso(esFalloDeRed(e)
    ? 'Sin conexión. Estás viendo la última copia guardada aquí; se sincroniza solo al volver el internet.'
    : 'No se pudo leer del servidor; se muestra la última copia local.', true);
  render();
  vaciarCola();
}

async function arrancarNube(){
  try{
    const r = await bajarDeLaNube();
    sincronizado = true;
    /* Primera conexión: el servidor está vacío y aquí ya había capturas. Se suben. */
    if(r === 'vacia'){
      if(puedeEditar()){
        subirTodo();
        anotar('subió', 'información local', 'primera sincronización',
               datos.clientes.length + ' clientes y ' + datos.sitios.length + ' sitios');
        aviso('Subiendo al servidor lo que tenías capturado en esta computadora…');
      }else{
        aviso('El servidor está vacío y tu cuenta es Viewer: lo que ves sigue siendo local.', true);
      }
    }
  }catch(e){
    manejarFalloDeArranque(e);
    return;
  }
  render();
  vaciarCola();
}

/* =============================== ARRANQUE =============================== */
$('logoAcceso').src = document.querySelector('header.app img').src;

cargar();
cargarCola();

if(!HAY_NUBE){
  /* Modo local: igual que siempre, sin cuentas. */
  render();
}else{
  cargarSesion();
  if(haySesion()){
    render();                       /* pinta ya con la copia local, sin esperar la red */
    cargarPerfil()
      .then(arrancarNube)
      .catch(manejarFalloDeArranque);
  }else{
    mostrarAcceso();
    render();
  }
  setInterval(refrescarDesdeNube, 30000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reintentarSincronizar(); });
  window.addEventListener('online', reintentarSincronizar);
}
</script>
