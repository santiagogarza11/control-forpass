/* La hoja se arma según el contrato más largo que se esté exportando: con
   contratos de 12 meses sale igual que el formato de siempre, y solo crece a
   Mes 13…24 si hace falta. Las letras de columna se calculan, nunca se
   escriben a mano, para que nada se descuadre al mover columnas. */
function planoHoja(filasSitios){
  const nMeses = Math.max(12, ...filasSitios.map(f => f.sitio.meses));
  const fijas = ['Cliente','Sitio','Zona','Módulos','Tipo','Mensualidad ($)','Fecha inicio','Vigencia (fin)','Suscripción'];
  const meses = Array.from({length:nMeses}, (_,i)=>'Mes ' + (i+1));
  const finales = ['Pagados','Pendientes','Debió pagar (a hoy)','Estatus de pago',
                   'Onboarding ($)','Viáticos ($)','Primer pago ($)','Valor del contrato ($)',
                   'Próximo pago','Días restantes','Estado del sitio','Encargado','OC por mensualidad',
                   'Contacto para la OC','Notas'];
  const encabezados = fijas.concat(meses, finales);
  const anchos = [22,14,10,9,22,15,12,13,12].concat(meses.map(()=>6), [9,11,17,15, 15,13,14,19,12,13,14,20,46,40,42]);

  const iMes0 = fijas.length;                 /* primera columna de mes */
  const i = {
    mensualidad:5, inicio:6, vigencia:7, mes0:iMes0, mesN:iMes0 + nMeses - 1,
    pagados:iMes0 + nMeses, pendientes:iMes0 + nMeses + 1,
    debio:iMes0 + nMeses + 2, estatus:iMes0 + nMeses + 3,
    onboarding:iMes0 + nMeses + 4, viaticos:iMes0 + nMeses + 5,
    proximo:iMes0 + nMeses + 8
  };
  /* Letra de columna a partir del índice (0 → A). */
  const L = idx => letraCol(idx + 1);
  return { nMeses, encabezados, anchos, i, L };
}

function construirHoja(filasSitios){
  const HOY = hoyISO();
  const { nMeses, encabezados, anchos, i, L } = planoHoja(filasSitios);
  const ultimaCol = letraCol(encabezados.length);

  let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<dimension ref="A1:' + ultimaCol + Math.max(5, 4 + filasSitios.length) + '"/>'
    + '<sheetViews><sheetView showGridLines="0" tabSelected="1" workbookViewId="0">'
    + '<pane ySplit="4" topLeftCell="A5" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
    + '<sheetFormatPr defaultRowHeight="15"/>'
    + '<cols>' + anchos.map((w,k)=>'<col min="' + (k+1) + '" max="' + (k+1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>'
    + '<sheetData>';

  xml += filaXml(1, [cT('Control de Kioskos Forpass', 1)]);
  xml += filaXml(2, [cT('Instrucciones: una fila por sitio. Escribe 1 en el mes cuando se pague esa mensualidad (0 o vacío si no). '
    + 'El onboarding y los viáticos se cobran una sola vez, en el pago 1: por eso la columna «Primer pago» es más alta que la «Mensualidad». '
    + 'La columna «Suscripción» dice si el contrato sigue Activa o ya Terminó según las fechas. «Estatus de pago» te avisa si el cliente va Al día o Atrasado. '
    + 'Las columnas calculadas se actualizan solas al abrir el archivo.', 2)]);
  xml += filaXml(3, [cT('Fecha de hoy:', 9), cX('TODAY()', serialExcel(HOY), 8), cT('(cambia sola cada día que abres el archivo)', 2)]);
  xml += filaXml(4, encabezados.map(h => cT(h, 3)));

  filasSitios.forEach((f, k)=>{
    const n = 5 + k;                       /* número de fila en Excel */
    const c = f.calc, s = f.sitio;
    const celdas = [
      cT(f.cliente, 4), cT(s.nombre, 4), cT(s.zona, 5), cN(s.modulos, 5), cT(ETIQUETA_TIPO[s.tipo], 4),
      cN(s.mensualidad, 7), cF(s.fechaInicio, 6), cF(c.fin, 6),
      cX('IF(TODAY()<=' + L(i.vigencia) + n + ',"Activa","Terminó")', c.suscripcion, 5)
    ];
    /* Una casilla por mes; los meses fuera del contrato quedan en blanco. */
    for(let m=0; m<nMeses; m++) celdas.push(m < s.meses ? cN(s.pagos[m] ? 1 : 0, 5) : cT('', 5));

    const F = L(i.inicio) + n, U = L(i.pagados) + n, W = L(i.debio) + n;
    celdas.push(cX('SUM(' + L(i.mes0) + n + ':' + L(i.mesN) + n + ')', c.pagados, 5));
    celdas.push(cX(s.meses + '-' + U, c.pendientes, 5));
    celdas.push(cX('IF(TODAY()<' + F + ',0,MIN(' + s.meses + ',DATEDIF(' + F + ',TODAY(),"m")+1))', c.debidas, 5));
    celdas.push(cX('IF(' + U + '>=' + W + ',"Al día","Atrasado")', c.atrasadas > 0 ? 'Atrasado' : 'Al día', 5));
    celdas.push(cN(s.incOnboarding ? s.onboarding : 0, 7));
    celdas.push(cN(s.incViaticos ? s.viaticos : 0, 7));
    /* Fórmulas vivas, no números tecleados: la fila de instrucciones promete
       que «las columnas calculadas se actualizan solas» y estas dos eran las
       únicas que no cumplían — corregir una mensualidad en el Excel las dejaba
       diciendo el valor viejo. El valor del contrato puede ir como mensualidad
       × meses + extras porque todos los meses cobran lo mismo y los extras van
       completos en el pago 1: es la misma suma que montos[], expresada como
       fórmula. Las letras salen de L(), nunca a mano. */
    const M = L(i.mensualidad) + n, O = L(i.onboarding) + n, V = L(i.viaticos) + n;
    celdas.push(cX(M + '+' + O + '+' + V, c.primerPago, 7));
    celdas.push(cX(M + '*' + s.meses + '+' + O + '+' + V, c.valorContrato, 7));
    celdas.push(c.proximo ? cF(c.proximo, 6) : cT('Cubierto', 5));
    /* Días restantes: fórmula viva contra la fecha de «Próximo pago». */
    celdas.push(c.proximo ? cX(L(i.proximo) + n + '-TODAY()', c.diasRest, 5) : cT('—', 5));
    celdas.push(cT(ETIQUETA_ESTADO[s.estado], 5));
    celdas.push(cT(s.encargado.nombre, 4));
    /* Las OC de cada mensualidad pagada, en una sola celda para el vistazo
       rápido. El detalle completo va en la hoja «Pagos con OC». */
    celdas.push(cT(s.pagos.map((p, m) => {
      const d = s.pagosDetalle[m] || {};
      return (p && d.oc) ? 'M' + (m+1) + ' ' + d.oc : '';
    }).filter(Boolean).join(' · '), 4));
    /* Quién nos manda la OC, para poder perseguirla desde el Excel. */
    celdas.push(cT(s.contactos.map(x =>
      [x.nombre, x.puesto, x.correo, x.telefono].filter(Boolean).join(' · ')
    ).join(' | '), 4));
    celdas.push(cT(s.notas, 4));

    xml += filaXml(n, celdas);
  });

  const ultima = Math.max(5, 4 + filasSitios.length);
  const colEstatus = L(i.estatus);
  xml += '</sheetData>'
    + '<autoFilter ref="A4:' + ultimaCol + ultima + '"/>'
    + '<conditionalFormatting sqref="' + colEstatus + '5:' + colEstatus + ultima + '">'
    + '<cfRule type="cellIs" dxfId="0" priority="1" operator="equal"><formula>"Atrasado"</formula></cfRule>'
    + '<cfRule type="cellIs" dxfId="1" priority="2" operator="equal"><formula>"Al día"</formula></cfRule>'
    + '</conditionalFormatting>'
    + '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>'
    + '</worksheet>';
  return xml;
}

/* Segunda hoja: un renglón por mensualidad, con su OC y quién la capturó.
   Es la que sirve para filtrar y cuadrar pagos contra órdenes de compra. */
const ENC_PAGOS = ['Cliente','Sitio','Zona','Mensualidad','Fecha de corte','Concepto','Monto ($)',
                   'Estatus','¿Facturada?','Número de OC','Capturó','Fecha de captura'];
const ANCHOS_PAGOS = [22,14,10,12,14,34,13,12,13,18,22,18];

function construirHojaPagos(filasSitios){
  let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<sheetViews><sheetView showGridLines="0" workbookViewId="0">'
    + '<pane ySplit="2" topLeftCell="A3" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
    + '<sheetFormatPr defaultRowHeight="15"/>'
    + '<cols>' + ANCHOS_PAGOS.map((w,k)=>'<col min="' + (k+1) + '" max="' + (k+1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>'
    + '<sheetData>';

  xml += filaXml(1, [cT('Pagos con su orden de compra', 1)]);
  xml += filaXml(2, ENC_PAGOS.map(h => cT(h, 3)));

  let fila = 2;
  filasSitios.forEach(f=>{
    const s = f.sitio, c = f.calc;
    for(let m = 0; m < s.meses; m++){
      const d = s.pagosDetalle[m] || {};
      const pagado = !!s.pagos[m];
      const vencida = !pagado && m < c.debidas;

      let concepto = 'Mensualidad';
      if(m === 0){
        const extras = [];
        if(s.incOnboarding && s.onboarding) extras.push('onboarding ' + dinero(s.onboarding));
        if(s.incViaticos && s.viaticos)     extras.push('viáticos ' + dinero(s.viaticos));
        if(extras.length) concepto = 'Mensualidad + ' + extras.join(' + ');
      }

      fila++;
      xml += filaXml(fila, [
        cT(f.cliente, 4), cT(s.nombre, 4), cT(s.zona, 5), cN(m + 1, 5),
        cF(sumarMeses(s.fechaInicio, m), 6),
        cT(concepto, 4), cN(c.montos[m], 7),
        cT(pagado ? 'Pagada' : (vencida ? 'Vencida' : 'Pendiente'), 5),
        cT(pagado ? (d.facturado ? 'Sí' : 'No') : '', 5),
        cT(pagado ? (d.oc || '(sin OC)') : '', 4),
        cT(pagado ? (d.quien || '') : '', 4),
        (d.cuando && fechaLocalISO(d.cuando)) ? cF(fechaLocalISO(d.cuando), 6) : cT('', 5)
      ]);
    }
  });

  const ultima = Math.max(3, fila);
  xml += '</sheetData>'
    + '<autoFilter ref="A2:' + letraCol(ENC_PAGOS.length) + ultima + '"/>'
    + '<conditionalFormatting sqref="H3:H' + ultima + '">'
    + '<cfRule type="cellIs" dxfId="0" priority="1" operator="equal"><formula>"Vencida"</formula></cfRule>'
    + '<cfRule type="cellIs" dxfId="1" priority="2" operator="equal"><formula>"Pagada"</formula></cfRule>'
    + '</conditionalFormatting>'
    + '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>'
    + '</worksheet>';
  return xml;
}

function descargarExcel(clienteId){
  const lista = (clienteId ? sitiosDe(clienteId) : datos.sitios).slice();
  if(!lista.length){ aviso('No hay sitios que exportar todavía.', true); return; }

  lista.sort((a,b)=>{
    const ca = clientePorId(a.clienteId), cb = clientePorId(b.clienteId);
    return String(ca ? ca.nombre : '').localeCompare(String(cb ? cb.nombre : ''), 'es') || a.nombre.localeCompare(b.nombre, 'es');
  });

  const filas = lista.map(s=>{
    const c = clientePorId(s.clienteId);
    return { cliente: c ? c.nombre : 'Sin cliente', sitio:s, calc:calcular(s) };
  });

   El correo se recuerda aunque cierres sesión, para que la próxima vez solo
   teclees la contraseña. La contraseña nunca se guarda: de eso se encarga el
   navegador si le dices que la recuerde.
   ==================================================================== */
const LLAVE_CORREO = 'forguard_forpass_ultimo_correo_v1';
function recordarCorreo(correo){
  try{ localStorage.setItem(LLAVE_CORREO, correo || ''); }catch(e){}
}
function correoRecordado(){
  try{ return localStorage.getItem(LLAVE_CORREO) || ''; }catch(e){ return ''; }
}

}

/* La animación SMIL del logo arranca sola al cargar la página. Si el login se
   abre después, ya se acabó y aparecería congelada en el logo final; por eso hay
   que rebobinarla justo cuando se muestra la pantalla.
   Con "menos movimiento" activado en el sistema, se salta al final de una vez.

   retrasoMs: espera antes de arrancar, PARADA en el fotograma cero. Se usa al
   volver de la persiana de cierre de sesión: si arranca de inmediato, el logo se
   empieza a mover mientras la persiana todavía está subiendo. Parada en cero el
   logo no se ve, así que entra limpio cuando le toca en vez de aparecer completo
   y luego reiniciarse. */
let temporizadorIntro = null;
function reproducirIntro(retrasoMs){
  const svg = $('logoAcceso');
  if(!svg || typeof svg.setCurrentTime !== 'function') return;
  if(temporizadorIntro){ clearTimeout(temporizadorIntro); temporizadorIntro = null; }
  const quieto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try{
    if(quieto){ svg.setCurrentTime(3.7); svg.pauseAnimations(); return; }
    svg.setCurrentTime(0);
    if(retrasoMs > 0){
      svg.pauseAnimations();
      temporizadorIntro = setTimeout(()=>{
        temporizadorIntro = null;
        try{ svg.setCurrentTime(0); svg.unpauseAnimations(); }catch(e){}
      }, retrasoMs);
    }else{
      svg.unpauseAnimations();
    }
  }catch(e){ /* si el navegador no deja controlar SMIL, se queda el logo fijo */ }
}

/* ------------------------- Pantalla de carga -------------------------- */
/* ESTE es el número que manda cuánto tiempo se ve la pantalla de carga, no el
   dur="3.7s" del llenado. El llenado es un ciclo infinito: se sigue llenando
   hasta que los datos llegan, y si llegan antes de este mínimo, se espera.
   Con 900 ms el logo apenas alcanzaba a llenarse como al 20% y de ahí saltaba
   al 100%: se sentía cortado. Con 1.6 s llega cerca del 80% y el remate se ve
   natural. Pasado el mínimo no agrega ni un milisegundo de espera. */
const CARGA_MINIMA_MS = 1600;
const ANCHO_LOGO_SVG = 335.42;   /* el viewBox del logo; el clip llena hasta aquí */

const menosMovimiento = () =>
  !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

function mostrarCargando(){
  const c = $('cargando');
  const svg = $('logoCarga');
  c.classList.remove('volando');
  c.classList.add('abierto');

  /* Se esconde el logo del encabezado mientras dura la carga. Si no, al aterrizar
     se ven los dos encimados: son archivos distintos (PNG el del header, SVG el
     que vuela) con márgenes internos distintos, así que nunca calzan exacto.
     Escondido, el que vuela ocupa su lugar y al final se hace el cambio cuando ya
     están del mismo tamaño y en la misma posición: no se nota. */
  const logoHeader = $('logoHeader');
  if(logoHeader) logoHeader.style.visibility = 'hidden';

  /* Deja el llenado en cero y le devuelve su <animate> si una carga anterior lo
     quitó (pasa al cerrar y volver a entrar sin recargar la página). */
  const rect = svg && svg.querySelector('#fgRectCarga');
  if(rect){
    rect.setAttribute('width', '0');
    if(!rect.querySelector('animate')){
      const a = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
      a.setAttribute('attributeName', 'width');
      a.setAttribute('dur', '3.7s');
      a.setAttribute('values', '0;' + ANCHO_LOGO_SVG + ';' + ANCHO_LOGO_SVG);
      a.setAttribute('keyTimes', '0;0.7;1');
      a.setAttribute('calcMode', 'spline');
      a.setAttribute('keySplines', '0.5 0 0.2 1;0 0 1 1');
      a.setAttribute('repeatCount', 'indefinite');
      rect.appendChild(a);
    }
  }
  if(svg && typeof svg.setCurrentTime === 'function'){
    try{ svg.setCurrentTime(0); svg.unpauseAnimations(); }catch(e){}
  }
  return Date.now();
}

/* Termina de llenar el logo desde donde vaya, en 240 ms. Se hace a mano en vez
   de esperar el ciclo: si los datos llegan al 20% del llenado, esperar los 2.4 s
   que faltan del ciclo sería espera inventada, y saltar al 100% de golpe se ve
   como un brinco. */
function completarLlenado(svg){
  return new Promise(listo => {
    const rect = svg && svg.querySelector('#fgRectCarga');
    if(!rect){ listo(); return; }
    /* El valor se ACOTA a [0, ancho]. Sin esto llegaba a ser negativo y el
       navegador tiraba «<rect> attribute width: A negative value is not valid»
       en cada carga: SMIL lo devuelve fuera de rango porque el keySplines del
       llenado no es monótono en x (`0.5 0 0.2 1`, con x1 > x2), y ahí la curva
       se dobla. Acotar aquí lo arregla venga de donde venga — un ancho negativo
       nunca es un estado válido de esta barra. */
    let desde = 0;
    try{ desde = rect.width.animVal.value || 0; }catch(e){ desde = 0; }
    desde = Math.max(0, Math.min(ANCHO_LOGO_SVG, desde));
    const anim = rect.querySelector('animate');
    if(anim) anim.remove();          /* libera el valor animado por SMIL */
    rect.setAttribute('width', String(desde));

    if(menosMovimiento() || desde >= ANCHO_LOGO_SVG - 1){
      rect.setAttribute('width', String(ANCHO_LOGO_SVG));
      listo(); return;
    }
    const DUR = 240, t0 = performance.now();
    /* requestAnimationFrame NO corre si la pestaña está en segundo plano, y sin
       esta red la promesa no se resolvería nunca: la pantalla de carga se
       quedaría trabada tapando el tablero. Pase lo que pase, esto la cierra. */
    let cerrado = false;
    const acabar = () => {
      if(cerrado) return;
      cerrado = true;
      rect.setAttribute('width', String(ANCHO_LOGO_SVG));
      listo();
    };
    setTimeout(acabar, DUR + 400);

    const paso = (t) => {
      if(cerrado) return;
      const p = Math.min(1, (t - t0) / DUR);
      const suave = 1 - Math.pow(1 - p, 3);          /* ease-out */
      rect.setAttribute('width', String(desde + (ANCHO_LOGO_SVG - desde) * suave));
      if(p < 1) requestAnimationFrame(paso); else acabar();
    };
    requestAnimationFrame(paso);
  });
}

/* Manda el logo a encogerse encima del logo del encabezado. El destino se mide
   en vivo porque depende del ancho de la ventana; no se puede dejar fijo. */
function volarAlEncabezado(c, svg){
  const meta = $('logoHeader');
  if(!meta || menosMovimiento()){ c.classList.add('volando'); return; }
  const d = meta.getBoundingClientRect();
  const o = svg.getBoundingClientRect();
  if(!d.height || !o.height){ c.classList.add('volando'); return; }

  const escala = d.height / o.height;
  const dx = (d.left + d.width / 2) - (o.left + o.width / 2);
  const dy = (d.top + d.height / 2) - (o.top + o.height / 2);
  svg.style.setProperty('--vx', dx.toFixed(1) + 'px');
  svg.style.setProperty('--vy', dy.toFixed(1) + 'px');
  svg.style.setProperty('--ve', escala.toFixed(4));
  c.classList.add('volando');
}

async function ocultarCargando(desde){
  const c = $('cargando'), svg = $('logoCarga');
  const falta = CARGA_MINIMA_MS - (Date.now() - desde);
  if(falta > 0) await new Promise(r => setTimeout(r, falta));

  await completarLlenado(svg);
  volarAlEncabezado(c, svg);

  /* 620 ms del vuelo + margen. */
  await new Promise(r => setTimeout(r, menosMovimiento() ? 60 : 700));

  /* El cambio de estafeta: se devuelve el logo del encabezado justo antes de
     quitar el que voló, cuando los dos están del mismo tamaño y encimados. */
  const logoHeader = $('logoHeader');
  if(logoHeader) logoHeader.style.visibility = '';

  c.classList.remove('abierto', 'volando');
  svg.style.removeProperty('--vx');
  svg.style.removeProperty('--vy');
  svg.style.removeProperty('--ve');
}

  ev.preventDefault();

  if(!correo || !clave){ errorAcceso('Escribe tu correo y tu contraseña.'); return; }
  const btn = $('aEntrar');

  errorAcceso('');
  try{
    /* La pantalla de carga va DESPUÉS de que la cuenta pasó de verdad. Si la
       contraseña está mal, entrar() lanza y nunca llegamos aquí: se ve el error,
       no una animación. */
    await entrar(correo, clave);
    const desde = mostrarCargando();

      await arrancarNube();

    }
  }catch(e){

    if(/SIN_PERMISO/.test(m)){
      errorAcceso('Tu cuenta existe pero todavía no tiene acceso concedido. Pide a un administrador que te lo dé.');
      salirSilencioso();

      errorAcceso('Tu cuenta está bloqueada. Pide a un administrador que la reactive.');
      /* También aquí con los datos: si intenta entrar y está bloqueada, la copia
         local de una sesión anterior no se le queda en el navegador. */
      salirSilencioso(true);
    }else{
      errorAcceso(m);
    }
  }finally{
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});

/* Limpia la sesión sin redibujar ni mover al usuario de pantalla. */
/* Salida sin persiana. Con `tambienLosDatos` se lleva además la copia local de
   la base, y esa decisión NO es cosmética: al bloquear a alguien, su navegador
   se quedaba con ~74 KB de clientes, sitios, pólizas, precios y cobranza —
   ilegibles en pantalla porque ya no hay sesión, pero ahí, en esa laptop, para
   siempre y a un devtools de distancia. El logout normal SÍ limpiaba
   (limpiarSesionYDatos); a esta ruta se le había olvidado, y es justo la que se
   usa cuando alguien deja la empresa.

   Quién pide qué, y por qué no es lo mismo:
     · BLOQUEADO  → sí se limpia. Sale de leer SU PROPIA ficha y ver activo:false;
       no hay forma de que sea un falso positivo.
     · SIN_PERMISO → NO se limpia. Un 403 puede venir de una regla sin publicar
       —ya pasó, está en las trampas conocidas— y borrarle la copia local por un
       error nuestro le quitaría su respaldo sin deberla. */
function salirSilencioso(tambienLosDatos){
  detenerVigilancia();
  Object.assign(sesion, { correo:null, uid:null, idToken:null, refreshToken:null, expira:0, rol:null, nombre:'', telefono:'' });
  try{ localStorage.removeItem(LLAVE_SESION); }catch(e){}
  if(tambienLosDatos){
    datos = { v:1, clientes:[], sitios:[], polizas:[], catalogo:[] };
    try{ localStorage.removeItem(LLAVE); }catch(e){}
    estado.vista = inicioDelModulo(); estado.clienteId = null; estado.polizaId = null;
    sincronizado = false;
  }
}

/* --------------------- Persiana de cierre de sesión --------------------- */
/* Estos tres números salen de los keyTimes del SVG #persiana y tienen que ir a
   la par con sus dur="2s". Si cambias la duración del SVG, recalcula el 0.42. */
const PERSIANA_MS = 2000;                                  /* duración total */
const PERSIANA_CUBRE_MS = Math.round(2000 * 0.42);         /* 840 ms: ya tapa toda la pantalla */
const INTRO_TRAS_PERSIANA_MS = 400;                        /* aire antes de animar el logo del login */

/* Orden, que es lo que importa:
   1. La sesión se borra de INMEDIATO. Si alguien le pica salir y se va del
      escritorio, su sesión ya murió aunque la animación siga corriendo.
   2. El login NO se muestra hasta que la persiana ya cubre (840 ms). Antes se
      mostraba en el milisegundo cero y se veía el login primero y la persiana
      encima después — al revés de como debe ser.
   3. El intro del logo del login espera a que la persiana acabe de subir, más un
      respiro. Si arranca antes se empieza a mover mientras la persiana todavía
      va subiendo.
   Solo se usa en el logout deliberado; si la sesión expiró se va por salir() a
   secas, porque ahí toca un mensaje de error, no una animación. */
async function salirConPersiana(){
  const p = $('persiana');
  const svg = p && p.querySelector('svg');
  const espera = (ms) => new Promise(r => setTimeout(r, ms));

  /* La sesión se va primero, sin importar si habrá animación o no. */
  limpiarSesionYDatos();

  if(menosMovimiento() || !svg || typeof svg.setCurrentTime !== 'function'){
    mostrarAcceso();
    render();
    return;
  }

  p.classList.add('abierta');
  try{ svg.setCurrentTime(0); svg.unpauseAnimations(); }catch(e){}

  await espera(PERSIANA_CUBRE_MS);

  /* Ya no se ve nada del tablero: aquí sí se destapa el login, detrás. El intro
     del logo queda parado en cero hasta que la persiana termine de subir. */
  const subida = PERSIANA_MS - PERSIANA_CUBRE_MS;
  mostrarAcceso('', subida + INTRO_TRAS_PERSIANA_MS);
  render();

  await espera(subida);
  p.classList.remove('abierta');
}

/* ===================== SINCRONIZACIÓN PERIÓDICA =====================
   Firestore por REST no avisa solo de los cambios de otros, así que se
   vuelve a consultar cada medio minuto mientras la pestaña esté a la vista
   y no haya nada pendiente ni un formulario abierto.
   ==================================================================== */
/* ¿El error fue por falta de internet? Entonces NO hay que cerrar la sesión:
   sería sacar al usuario y pedirle la contraseña por una falla pasajera. */
function esFalloDeRed(e){
  if(e instanceof TypeError) return true;      /* así se queja fetch cuando no hay red */
  const m = String((e && e.message) || e || '');
  return /Failed to fetch|NetworkError|Load failed|network error|ERR_INTERNET/i.test(m);
}
/* Queda en falso mientras no se haya logrado leer del servidor ni una vez. */
let sincronizado = false;

async function refrescarDesdeNube(){
  if(!HAY_NUBE || !haySesion()) return;
  if(cola.length || vaciando) return;
  if($('telon').classList.contains('abierto')) return;
  if(document.hidden) return;
  try{
    const antes = JSON.stringify(datos);
    await bajarDeLaNube();
    sincronizado = true;
    if(JSON.stringify(datos) !== antes){
      /* Si el foco está en un buscador, el render se lo robaba: el texto
         sobrevivía (vive en estado.busca) pero el cursor se iba, a media
         palabra. Se repinta conservándolo, con el id del buscador ACTIVO —
         renderConservandoFoco necesita el suyo, es la trampa documentada. */
      const foco = document.activeElement;
      const BUSCADORES = ['buscaCliente', 'buscaEquipo', 'buscaPoliza', 'buscaAgenda'];
      if(foco && BUSCADORES.includes(foco.id)) renderConservandoFoco(foco, foco.id);
      else render();
    }
  }catch(e){
    if(/SIN_SESION|SESION_VENCIDA/.test(String(e.message))) salir(true);
  }
}

/* Al volver el internet o al regresar a la pestaña: si nunca se logró la primera
   lectura, se intenta de nuevo; si ya estaba sincronizado, basta con subir la cola. */
function reintentarSincronizar(){
  if(!HAY_NUBE || !haySesion()) return;
  intentosFallidos = 0;
  if(!sincronizado){
    cargarPerfil().then(arrancarNube).catch(manejarFalloDeArranque);
    return;
  }
  vaciarCola();
  refrescarDesdeNube();
}

/* Qué hacer si al abrir la página no se pudo hablar con el servidor. Solo se
   cierra la sesión cuando el problema es de la cuenta, nunca por red. */
function manejarFalloDeArranque(e){
  const m = String((e && e.message) || '');
  if(/SIN_PERMISO/.test(m)){
    salirSilencioso();
    mostrarAcceso('Tu cuenta ya no tiene acceso concedido. Habla con un administrador.');
    render(); return;
  }
  if(/BLOQUEADO/.test(m)){
    /* Con los datos: una cuenta bloqueada no se queda con la copia de la base. */
    salirSilencioso(true);
    mostrarAcceso('Tu cuenta está bloqueada. Pide a un administrador que la reactive.');
    render(); return;
  }
  if(/SESION_VENCIDA|SIN_SESION/.test(m)){ salir(true); return; }

  /* Cualquier otra cosa (sin internet, servidor caído) se aguanta: sigues dentro,
     trabajando con la última copia, y se reintenta solo. */
  console.warn('No se pudo sincronizar al arrancar:', m);
  /* Tienes sesión válida: que no te quede la pantalla de acceso encima. */
  if(haySesion()) ocultarAcceso();
  aviso(esFalloDeRed(e)
    ? 'Sin conexión. Estás viendo la última copia guardada aquí; se sincroniza solo al volver el internet.'
    : 'No se pudo leer del servidor; se muestra la última copia local.', true);
  render();
  vaciarCola();
}

async function arrancarNube(){
  try{
    const r = await bajarDeLaNube();
    sincronizado = true;
    /* Sin await encadenado al render: si tardan, no retrasan el tablero. */
    /* Las dos revisiones solo cambian avisos de la portada, nada de las tarjetas.
       Van juntas y con UN solo render, y únicamente si el aviso cambió de verdad:
       cada render rehace el HTML completo, así que dos redibujados extra por dos
       banderitas se veían como un parpadeo de la lista al arrancar. */
    const avisos = () => avisoRespaldo() + avisoClaveInicial();
    const avisosAntes = avisos();
    Promise.all([revisarRespaldo(), revisarClaveInicial()]).then(()=>{
      if(estado.vista === 'clientes' && avisos() !== avisosAntes) render();
    });
    arrancarVigilancia();
    /* Primera conexión: el servidor está vacío y aquí ya había capturas. Se suben. */
    if(r === 'vacia'){
      if(puedeEditar()){
        subirTodo();
        anotar('subió', 'información local', 'primera sincronización',
               datos.clientes.length + ' clientes y ' + datos.sitios.length + ' sitios');
        aviso('Subiendo al servidor lo que tenías capturado en esta computadora…');
      }else{
        aviso('El servidor está vacío y tu cuenta es Viewer: lo que ves sigue siendo local.', true);
      }
    }
  }catch(e){
    manejarFalloDeArranque(e);
    return;
  }
  /* Si la pantalla de carga está encima, el render anterior pasó tapado y nadie
     lo vio: que la entrada escalonada corra en ESTE, que es el que se destapa.
     En un refresh normal no aplica —ahí el primero sí se vio— y así no se anima
     dos veces, que era justo el parpadeo. */
  if($('cargando').classList.contains('abierto')) animarTarjetas = true;
  render();
  vaciarCola();
}

/* =============================== ARRANQUE =============================== */
cargar();
cargarCola();
/* Antes del primer render: la app abre en el módulo donde te quedaste, y así el
   selector no parpadea de Forpass a Pólizas al arrancar. */
cargarModulo();

if(!HAY_NUBE){
  /* Modo local: igual que siempre, sin cuentas. */
  render();
}else{
  cargarSesion();
  if(haySesion()){
    render();                       /* pinta ya con la copia local, sin esperar la red */
    cargarPerfil()
      .then(arrancarNube)
      .catch(manejarFalloDeArranque);
  }else{
    mostrarAcceso();
    render();
  }
  setInterval(refrescarDesdeNube, 30000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reintentarSincronizar(); });
  window.addEventListener('online', reintentarSincronizar);
}
</script>
