<style>
:root{
  --navy:#0A1B4D; --navy-2:#12266B; --ink:#1c2333; --gray:#6b7280; --line:#e5e8f0;
  --accent:#3E7FD6; --bg:#f2f4f9;
  --ok:#3FA66B; --ok-suave:#E8F5EE; --alerta:#E8A33D; --alerta-suave:#FDF4E5;
  --error:#D9534F; --error-suave:#FCEDEC; --neutro:#8a90a3; --neutro-suave:#F1F3F8;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Poppins',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh;}

/* ---------- Encabezado ---------- */
header.app{background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:50;}
header.app::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:linear-gradient(90deg,var(--navy),var(--accent));}
header.app img{height:22px;}
header.app .bar{width:4px; height:26px; border-radius:2px; background:linear-gradient(180deg,#4A90D9,#3FA66B);}
header.app h1{font-size:15px; font-weight:600; color:var(--navy);}
header.app .sub{font-size:12px; color:var(--gray); margin-left:auto;}
@media (max-width:700px){ header.app{padding:12px 16px; gap:10px;} header.app .sub{display:none;} }

/* ---------- Contenedor ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:26px 24px 90px;}
@media (max-width:700px){ .wrap{padding:20px 16px 80px;} }


/* ---------- Título de vista ---------- */
.titulo-zona{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.titulo-zona h2{font-size:23px; font-weight:700; color:var(--navy); line-height:1.2;}
.titulo-zona p{font-size:13px; color:var(--gray); margin-top:4px;}
.titulo-zona .acciones{margin-left:auto; display:flex; gap:9px; flex-wrap:wrap;}

/* ---------- Botones ---------- */
.btn{
  font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  border-radius:10px; padding:10px 15px; border:1.5px solid transparent;
  display:inline-flex; align-items:center; justify-content:center; gap:7px; white-space:nowrap;
  transition:background .15s, border-color .15s, color .15s, transform .1s, box-shadow .15s;
}
.btn:active{transform:scale(.985);}
.btn svg{width:15px; height:15px; flex-shrink:0;}
.btn-primario{background:var(--navy); color:#fff; box-shadow:0 4px 14px rgba(10,27,77,.22);}
.btn-primario:hover{background:var(--navy-2);}
.btn-suave{background:#fff; color:var(--navy); border-color:var(--line);}
.btn-suave:hover{border-color:var(--accent); background:#f6f9ff;}
.btn-peligro{background:#fff; color:var(--error); border-color:#f0d5d4;}
.btn-peligro:hover{background:var(--error-suave); border-color:var(--error);}
.btn-mini{font-size:12px; padding:7px 11px; border-radius:8px;}
.btn-verde{background:var(--ok); color:#fff;}
.btn-verde:hover{background:#35935c;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* ---------- Tarjetas de indicadores ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:22px;}
.kpi{background:#fff; border:1px solid var(--line); border-radius:14px; padding:15px 16px; position:relative; overflow:hidden;}
.kpi::before{content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--accent);}
.kpi.k-ok::before{background:var(--ok);} .kpi.k-alerta::before{background:var(--alerta);} .kpi.k-error::before{background:var(--error);}
.kpi .k-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--gray); font-weight:600;}
.kpi .k-valor{font-size:24px; font-weight:700; color:var(--navy); margin-top:5px; line-height:1.1;}
.kpi .k-pie{font-size:11px; color:var(--gray); margin-top:3px;}

/* ---------- Buscador ---------- */
.barra-busca{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.barra-busca input, .barra-busca select{
  padding:10px 12px; border:1px solid #d4d9e6; border-radius:10px; font-family:inherit; font-size:13px;
  color:var(--ink); background:#fff; outline:none; transition:border-color .15s;
}
.barra-busca input{flex:1; min-width:180px;}
.barra-busca input:focus, .barra-busca select:focus{border-color:var(--accent);}

/* ---------- Rejilla de tarjetas ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px;}
.grid-sitios{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));}
@media (max-width:700px){ .grid, .grid-sitios{grid-template-columns:1fr;} }

.tarjeta{
  background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 18px 16px;
  position:relative; overflow:hidden; transition:transform .15s, box-shadow .15s, border-color .15s;
  animation:aparece .3s cubic-bezier(.22,1,.36,1) both; animation-delay:var(--d,0ms);
}
@keyframes aparece{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
.tarjeta::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--navy),var(--accent));}
.tarjeta.t-ok::before{background:linear-gradient(90deg,var(--ok),#7ccfa1);}
.tarjeta.t-alerta::before{background:linear-gradient(90deg,var(--alerta),#f3c987);}
.tarjeta.t-error::before{background:linear-gradient(90deg,var(--error),#eda19f);}
.tarjeta.t-neutro::before{background:var(--line);}
.tarjeta-clic{cursor:pointer;}
.tarjeta-clic:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(10,27,77,.10); border-color:#c9d4ec;}

.t-cabeza{display:flex; align-items:flex-start; gap:10px;}
.t-nombre{font-size:16.5px; font-weight:700; color:var(--navy); line-height:1.25; word-break:break-word;}
.t-sub{font-size:11.5px; color:var(--gray); margin-top:2px;}
.t-avatar{
  width:40px; height:40px; border-radius:11px; flex-shrink:0; display:grid; place-items:center;
  background:linear-gradient(135deg,var(--navy-2),var(--accent)); color:#fff; font-size:14.5px; font-weight:700; letter-spacing:.02em;
}

/* Botón de tres puntos junto al nombre del sitio */
.tres-puntos{
  background:none; border:1px solid transparent; border-radius:8px; cursor:pointer; padding:3px 5px;
  color:#a3aabb; display:grid; place-items:center; flex-shrink:0; margin-left:auto;
  transition:color .15s, background .15s, border-color .15s;
}
.tres-puntos svg{width:16px; height:16px;}
.tres-puntos:hover{color:var(--navy); background:#EEF2FB; border-color:#c9d4ec;}
.tres-puntos:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* Punto de estado */
.punto{width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0;}
.punto.p-ok{background:var(--ok); box-shadow:0 0 0 3px rgba(63,166,107,.18);}
.punto.p-alerta{background:var(--alerta); box-shadow:0 0 0 3px rgba(232,163,61,.18);}
.punto.p-error{background:var(--error); box-shadow:0 0 0 3px rgba(217,83,79,.18);}
.punto.p-neutro{background:#b6bccb; box-shadow:0 0 0 3px rgba(182,188,203,.18);}
.punto.late{animation:pulso 1.8s ease-in-out infinite;}
@keyframes pulso{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

/* Insignias */
.insignia{
  display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600;
  border-radius:999px; padding:4px 10px; border:1px solid transparent; white-space:nowrap;
}
.i-ok{background:var(--ok-suave); color:#2c7a4e; border-color:#c5e6d3;}
.i-alerta{background:var(--alerta-suave); color:#9a6a15; border-color:#f0dcb4;}
.i-error{background:var(--error-suave); color:#a5322e; border-color:#f0cbc9;}
.i-neutro{background:var(--neutro-suave); color:#5c6273; border-color:#dfe3ee;}
.i-info{background:#EEF2FB; color:var(--navy); border-color:#c9d4ec;}

.t-chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px;}

/* Datos en dos columnas */
.t-datos{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line);}
.t-dato .d-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); font-weight:600;}
.t-dato .d-valor{font-size:13.5px; font-weight:600; color:var(--ink); margin-top:2px;}
.t-dato .d-valor.chico{font-size:12.5px; font-weight:500;}
.t-dato .d-valor.ok{color:#2c7a4e;} .t-dato .d-valor.alerta{color:#9a6a15;} .t-dato .d-valor.error{color:#a5322e;}

/* Barra de progreso de mensualidades */
.progreso{margin-top:14px;}
.progreso .p-cabeza{display:flex; align-items:center; justify-content:space-between; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); font-weight:600; margin-bottom:7px;}
.meses{display:flex; gap:4px; flex-wrap:wrap;}
.mes{
  width:26px; height:26px; border-radius:7px; border:1.5px solid #d9dfec; background:#fbfcfe;
  font-family:inherit; font-size:10.5px; font-weight:600; color:#9aa0b0; cursor:pointer;
  display:grid; place-items:center; transition:background .12s, border-color .12s, color .12s, transform .1s;
}
.mes:hover{border-color:var(--accent); color:var(--accent);}
.mes.pagado{background:var(--ok); border-color:var(--ok); color:#fff;}
.mes.pagado:hover{background:#35935c; border-color:#35935c; color:#fff;}
.mes.debido{border-color:var(--error); color:var(--error); background:var(--error-suave);}
.mes.debido:hover{background:#f8dcdb;}
.mes:active{transform:scale(.92);}

/* Pie de tarjeta con acciones */
.t-pie{display:flex; gap:8px; margin-top:15px; padding-top:13px; border-top:1px solid var(--line); flex-wrap:wrap;}
.t-pie .btn{flex:0 0 auto;}
.t-pie .espacio{margin-left:auto;}

/* Nota de la tarjeta */
.t-nota{margin-top:12px; font-size:11.5px; color:var(--gray); line-height:1.5; background:#fafbfe; border:1px solid var(--line); border-radius:9px; padding:8px 10px; white-space:pre-wrap;}

/* ---------- Estado vacío ---------- */
.vacio{
  background:#fff; border:1.5px dashed #d4d9e6; border-radius:16px; padding:44px 26px; text-align:center;
}
.vacio .v-icono{width:52px; height:52px; margin:0 auto 14px; border-radius:14px; display:grid; place-items:center; background:#EEF2FB; color:var(--navy);}
.vacio .v-icono svg{width:26px; height:26px;}
.vacio h3{font-size:16px; font-weight:600; color:var(--navy);}
.vacio p{font-size:13px; color:var(--gray); margin:7px auto 18px; max-width:420px; line-height:1.6;}

/* ---------- Aviso de guardado local ---------- */
.aviso{
  display:flex; gap:11px; align-items:flex-start; background:#fff; border:1px solid var(--line);
  border-left:4px solid var(--accent); border-radius:12px; padding:13px 15px; margin-bottom:20px;
}
.aviso svg{width:17px; height:17px; color:var(--accent); flex-shrink:0; margin-top:1px;}
.aviso div{font-size:12px; color:var(--gray); line-height:1.55;}
.aviso b{color:var(--navy); font-weight:600;}

/* ---------- Ventana modal ---------- */
.telon{
  position:fixed; inset:0; background:rgba(10,27,77,.5); backdrop-filter:blur(2px);
  display:none; align-items:flex-start; justify-content:center; z-index:100; padding:26px 16px; overflow-y:auto;
}
.telon.abierto{display:flex;}
.modal{
  background:#fff; border-radius:18px; width:100%; max-width:620px; box-shadow:0 24px 70px rgba(0,0,0,.3);
  animation:sube .24s cubic-bezier(.22,1,.36,1) both; overflow:hidden;
}
.modal.ancho{max-width:860px;}
@keyframes sube{ from{opacity:0; transform:translateY(16px) scale(.99);} to{opacity:1; transform:none;} }
.modal-cabeza{padding:19px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; position:sticky; top:0; background:#fff; z-index:2;}
.modal-cabeza h3{font-size:16px; font-weight:700; color:var(--navy); flex:1;}
.modal-cabeza .cerrar{background:none; border:none; cursor:pointer; color:var(--gray); font-size:22px; line-height:1; padding:2px 6px; border-radius:7px; font-family:inherit;}
.modal-cabeza .cerrar:hover{background:var(--bg); color:var(--ink);}
.modal-cuerpo{padding:20px 22px 6px;}
.modal-pie{padding:16px 22px 20px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;}
.modal-pie .izq{margin-right:auto;}

/* ---------- Campos ---------- */
.seccion{margin-bottom:20px;}
.seccion h4{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--navy); font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.seccion h4::after{content:""; flex:1; height:1px; background:var(--line);}
.campo{margin-bottom:13px;}
.campo label{display:block; font-size:12px; font-weight:500; color:#3a4256; margin-bottom:5px;}
.campo input, .campo select, .campo textarea{
  width:100%; padding:9px 11px; border:1px solid #d4d9e6; border-radius:9px;
  font-family:inherit; font-size:13px; color:var(--ink); background:#fbfcfe; outline:none; transition:border-color .15s, background .15s;
}
.campo input:focus, .campo select:focus, .campo textarea:focus{border-color:var(--accent); background:#fff;}
.campo input[readonly]{background:#f1f3f8; color:#5c6273; cursor:default;}
.campo input[readonly]:focus{border-color:#d4d9e6;}
.campo textarea{resize:vertical; min-height:66px; font-size:12.5px; line-height:1.5;}
.campo input[aria-invalid="true"]{border-color:var(--error); background:#fffafa;}
.fila2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
@media (max-width:560px){ .fila2{grid-template-columns:1fr;} }
.pista{font-size:11px; color:var(--gray); margin-top:4px; line-height:1.45;}
.casilla{display:flex; align-items:center; gap:9px; font-size:13px; font-weight:500; color:#3a4256; cursor:pointer; margin-bottom:11px;}
.casilla input{width:16px; height:16px; accent-color:var(--navy); cursor:pointer;}

/* Resumen dentro del modal */
.resumen{background:var(--navy); color:#fff; border-radius:13px; padding:15px 17px; margin-top:4px;}
.resumen .r-fila{display:flex; justify-content:space-between; gap:12px; font-size:12px; padding:5px 0;}
.resumen .r-fila span:first-child{opacity:.72;}
.resumen .r-fila span:last-child{font-weight:600; text-align:right;}
.resumen .r-total{border-top:1px solid rgba(255,255,255,.18); margin-top:6px; padding-top:9px;}
.resumen .r-total span:last-child{font-size:17px; font-weight:700;}

/* Rejilla de casillas de mes en el modal */
.meses-modal{display:flex; gap:6px; flex-wrap:wrap;}
.meses-modal .mes{width:34px; height:34px; font-size:11.5px;}

/* ---------- Aviso flotante ---------- */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translate(-50%,90px);
  background:var(--navy); color:#fff; font-size:13px; font-weight:500; padding:13px 20px;
  border-radius:12px; box-shadow:0 14px 40px rgba(10,27,77,.35); z-index:200; opacity:0;
  transition:transform .28s cubic-bezier(.22,1,.36,1), opacity .28s; pointer-events:none; max-width:calc(100% - 32px); text-align:center;
}
.toast.visible{transform:translate(-50%,0); opacity:1;}
.toast.err{background:var(--error);}

/* ---------- Indicador de nube y sesión en el encabezado ---------- */
.nube-zona{display:flex; align-items:center; gap:9px; margin-left:auto;}
.pastilla{
  display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600;
  border-radius:999px; padding:6px 12px; border:1px solid var(--line); background:#fff; color:var(--gray);
  white-space:nowrap;
}
.pastilla .punto{width:8px; height:8px;}
.pastilla.n-ok{background:var(--ok-suave); color:#2c7a4e; border-color:#c5e6d3;}
.pastilla.n-trabajo{background:#EEF2FB; color:var(--navy); border-color:#c9d4ec;}
.pastilla.n-error{background:var(--error-suave); color:#a5322e; border-color:#f0cbc9;}
.pastilla.n-local{background:var(--neutro-suave); color:#5c6273; border-color:#dfe3ee;}
.btn-cabeza{
  font-family:inherit; font-size:12px; font-weight:600; color:var(--navy); background:#fff;
  border:1.5px solid var(--line); border-radius:9px; padding:7px 11px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:border-color .15s, background .15s;
}
.btn-cabeza:hover{border-color:var(--accent); background:#f6f9ff;}
.btn-cabeza svg{width:14px; height:14px;}
.correo-sesion{font-size:12.5px; font-weight:600; color:var(--tinta, var(--ink)); max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
@media (max-width:900px){ .correo-sesion{display:none;} }

/* ---------- Etiquetas de permiso, con su color ---------- */
.rol{
  display:inline-flex; align-items:center; font-size:11px; font-weight:700; letter-spacing:.02em;
  border-radius:999px; padding:4px 11px; border:1px solid transparent; white-space:nowrap;
}
.c-owner  {background:#FCEDEC; color:#B3312C; border-color:#F0CBC9;}
.c-admin  {background:#EAF1FC; color:#1B4FA8; border-color:#C6D8F5;}
.c-analyst{background:#E8F5EE; color:#26714A; border-color:#C0E3D0;}
.c-viewer {background:#F1F3F8; color:#5C6273; border-color:#DFE3EE;}
table.tabla select.sel-rol{font-weight:600;}
@media (max-width:700px){ .pastilla span.txt{display:none;} .pastilla{padding:6px 8px;} }

/* ---------- Pantalla de acceso ---------- */
.acceso{
  position:fixed; inset:0; z-index:150; background:var(--bg);
  display:none; align-items:center; justify-content:center; padding:24px 16px; overflow-y:auto;
}
.acceso.abierto{display:flex;}
.acceso-caja{
  background:#fff; border:1px solid var(--line); border-radius:18px; padding:34px 30px 28px;
  width:100%; max-width:392px; box-shadow:0 18px 50px rgba(10,27,77,.14); position:relative; overflow:hidden;
  animation:sube .3s cubic-bezier(.22,1,.36,1) both;
}
.acceso-caja::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--navy),var(--accent));}
.acceso-caja img{height:24px; margin-bottom:18px;}
.acceso-caja h2{font-size:19px; font-weight:700; color:var(--navy);}
.acceso-caja p.intro{font-size:12.5px; color:var(--gray); line-height:1.55; margin:7px 0 20px;}
.acceso-caja .btn{width:100%; margin-top:6px; padding:13px;}
.acceso-error{
  display:none; font-size:12px; color:#a5322e; background:var(--error-suave); border:1px solid #f0cbc9;
  border-radius:9px; padding:9px 11px; margin:2px 0 12px; line-height:1.5;
}
.acceso-error.visible{display:block;}
.acceso-pie{font-size:11.5px; color:var(--gray); text-align:center; margin-top:16px; line-height:1.55;}
.acceso-pie button{background:none; border:none; font-family:inherit; font-size:11.5px; color:var(--accent); font-weight:600; cursor:pointer; padding:0;}
.acceso-pie button:hover{text-decoration:underline;}

/* ---------- Tablas del panel de administración ---------- */
.bloque{background:#fff; border:1px solid var(--line); border-radius:15px; padding:20px 20px 16px; margin-bottom:18px; position:relative; overflow:hidden;}
.bloque::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--navy),var(--accent));}
.bloque-cabeza{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
.bloque-cabeza h3{font-size:15.5px; font-weight:700; color:var(--navy);}
.bloque-cabeza p{font-size:12px; color:var(--gray); margin-top:2px;}
.bloque-cabeza .der{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}

.rodillo{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table.tabla{width:100%; border-collapse:collapse; min-width:620px;}
table.tabla th{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); font-weight:700;
  text-align:left; padding:8px 10px; border-bottom:1.5px solid var(--line); white-space:nowrap;
}
table.tabla td{font-size:12.5px; color:var(--ink); padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.tabla tr:last-child td{border-bottom:none;}
table.tabla td.acciones{white-space:nowrap; text-align:right;}
table.tabla td.acciones .btn{margin-left:5px;}
table.tabla select{
  padding:6px 9px; border:1px solid #d4d9e6; border-radius:8px; font-family:inherit; font-size:12px;
  color:var(--ink); background:#fbfcfe; outline:none;
}
table.tabla select:focus{border-color:var(--accent);}
table.tabla .yo{font-size:10.5px; color:var(--accent); font-weight:600;}
.vacio-chico{font-size:12.5px; color:var(--gray); text-align:center; padding:24px 10px; line-height:1.6;}

/* Credenciales recién creadas */
.credencial{background:var(--navy); color:#fff; border-radius:13px; padding:16px 18px; margin-top:4px;}
.credencial .c-fila{display:flex; justify-content:space-between; gap:12px; font-size:12.5px; padding:6px 0; align-items:center;}
.credencial .c-fila span:first-child{opacity:.72;}
.credencial .c-fila code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; font-weight:600; background:rgba(255,255,255,.14); border-radius:6px; padding:3px 8px;}
.credencial .c-nota{font-size:11px; opacity:.72; margin-top:9px; line-height:1.5;}

/* Historial */
.bitacora{display:flex; flex-direction:column; gap:2px;}
.evento{display:flex; gap:12px; align-items:flex-start; padding:10px 2px; border-bottom:1px solid var(--line);}
.evento:last-child{border-bottom:none;}
.evento .e-icono{width:28px; height:28px; border-radius:8px; flex-shrink:0; display:grid; place-items:center; background:#EEF2FB; color:var(--navy);}
.evento .e-icono svg{width:14px; height:14px;}
.evento.e-alta .e-icono{background:var(--ok-suave); color:#2c7a4e;}
.evento.e-baja .e-icono{background:var(--error-suave); color:#a5322e;}
.evento .e-texto{flex:1; min-width:0; font-size:12.5px; color:var(--ink); line-height:1.5;}
.evento .e-texto b{font-weight:600; color:var(--navy);}
.evento .e-meta{font-size:11px; color:var(--gray); margin-top:2px;}
.evento .e-cuando{font-size:11px; color:var(--gray); white-space:nowrap; text-align:right; flex-shrink:0;}

/* ---------- Pie ---------- */
.pie{padding:18px 24px; text-align:center; font-size:11.5px; color:var(--gray); border-top:1px solid var(--line); background:#fff;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}
</style>
</head>

<script>
/* =========================================================================
   CONTROL DE FORPASS · Forguard

   Funciona de dos maneras:

   · MODO LOCAL  — si CONFIG_NUBE está vacío. Todo se guarda solo en este
                   navegador, como una libreta personal.
   · MODO NUBE   — al pegar los datos de Firebase abajo. Entonces pide correo
                   y contraseña, guarda en el servidor, varias personas ven lo
                   mismo, hay permisos (admin / captura / lectura) y queda
                   historial de quién cambió qué.

   Modelo de datos
   ---------------
   clientes: { id, nombre, contacto, notas }
   sitios:   { id, clienteId, nombre, estado, tipo, modulos, mensualidad,
               incViaticos, viaticos, incOnboarding, onboarding,
               fechaInicio, meses, pagos:[bool], notas }
   usuarios: { id(uid), correo, nombre, rol, activo, creado, creadoPor, ultimoAcceso }
   bitacora: { cuando, quien, accion, que, nombre, detalle }
   ========================================================================= */

/* ┌───────────────────────────────────────────────────────────────────────┐
   │  PEGA AQUÍ LOS DATOS DE TU PROYECTO DE FIREBASE                       │
   │  Los encuentras en la consola de Firebase, en Configuración del       │
   │  proyecto → Tus apps → Configuración del SDK.                         │
   │  Estos dos datos NO son secretos: quien los ve no puede entrar sin     │
   │  una cuenta. La seguridad real está en las reglas y en el login.       │
   └───────────────────────────────────────────────────────────────────────┘ */
const CONFIG_NUBE = {
  apiKey:    'AIzaSyDITGFvQCsMB0Co27QjHJHTnFjEdjORN_E',
  projectId: 'control-de-forpass'
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const HAY_NUBE = !!(CONFIG_NUBE.apiKey && CONFIG_NUBE.projectId);

/* Tope de mensualidades por contrato (12 meses es lo normal, 24 el máximo). */
const MAX_MESES = 24;

/* =============================== ALMACÉN =============================== */
const LLAVE = 'forguard_control_forpass_v1';
let datos = { v:1, clientes:[], sitios:[] };

function cargar(){
  try{
    const cruda = localStorage.getItem(LLAVE);
    if(!cruda) return;
    const d = JSON.parse(cruda);
    if(d && Array.isArray(d.clientes) && Array.isArray(d.sitios)){
      datos = { v:1, clientes:d.clientes.map(normalizarCliente), sitios:d.sitios.map(normalizarSitio) };
    }
  }catch(e){ console.warn('No se pudo leer el respaldo local:', e); }
}
/* Copia local: sirve de caché y para que la página siga sirviendo sin internet. */
function guardarLocal(){
  try{ localStorage.setItem(LLAVE, JSON.stringify(datos)); }
  catch(e){ aviso('No se pudo guardar en este navegador. Descarga un respaldo JSON.', true); }
}
function nuevoId(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function normalizarCliente(c){
  return { id:c.id || nuevoId(), nombre:c.nombre || 'Cliente', contacto:c.contacto || '', notas:c.notas || '' };
}

/* ---- Guardado de un registro: local siempre, y a la nube si está activa ---- */
function guardarCliente(c, accion){
  guardarLocal();
  encolar({ tipo:'poner', coleccion:'clientes', id:c.id, obj:c });
  anotar(accion || 'editó', 'cliente', c.nombre);
}
function guardarSitio(s, accion, detalle){
  guardarLocal();
  encolar({ tipo:'poner', coleccion:'sitios', id:s.id, obj:s });
  anotar(accion || 'editó', 'sitio', s.nombre, detalle);
}
function borrarRegistro(coleccion, id){
  guardarLocal();
  encolar({ tipo:'borrar', coleccion, id });
}

/* ============================ SESIÓN Y PERMISOS ============================
   Nada de esto corre en modo local: ahí no hay cuentas ni permisos.
   ========================================================================== */
const LLAVE_SESION = 'forguard_forpass_sesion_v1';

/* Los cuatro permisos, de más a menos poder. El Owner es el dueño del tablero:
   nadie más puede quitarle el permiso ni bloquearlo, y es el único que puede
   nombrar a otro Owner. */
const ROLES = {
  owner:   { nombre:'Owner',   desc:'Dueño del tablero: todo, y nadie lo puede bloquear ni degradar.' },
  admin:   { nombre:'Admin',   desc:'Todo, incluido el panel de administración y las cuentas.' },
  analyst: { nombre:'Analyst', desc:'Puede agregar y modificar clientes, sitios y pagos.' },
  viewer:  { nombre:'Viewer',  desc:'Solo puede ver la información; no modifica nada.' }
};

/* Saca un nombre presentable del correo: santiago.garza@… → «Santiago Garza».
   Sirve para no andar mostrando correos crudos en pantalla. */
function nombreDeCorreo(correo){
  const local = String(correo || '').split('@')[0];
  if(!local) return '';
  return local.split(/[._\-+]+/)
    .filter(Boolean)
    .map(p => p.charAt(0).toLocaleUpperCase('es') + p.slice(1).toLocaleLowerCase('es'))
    .join(' ');
}

function nombreDe(u){
  return (u && u.nombre && u.nombre.trim()) ? u.nombre.trim() : nombreDeCorreo(u && u.correo);
}

function urlAuth(metodo){
  return 'https://identitytoolkit.googleapis.com/v1/accounts:' + metodo + '?key=' + encodeURIComponent(CONFIG_NUBE.apiKey);
}
async function pedirAuth(metodo, cuerpo){
  const r = await fetch(urlAuth(metodo), {
    method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(cuerpo)
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(traducirAuth(d && d.error && d.error.message));
  return d;
}
function traducirAuth(codigo){
  const c = String(codigo || '');
  if(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(c)) return 'Correo o contraseña incorrectos.';
  if(/USER_DISABLED/.test(c)) return 'Esta cuenta está deshabilitada. Pide a un administrador que la reactive.';
  if(/TOO_MANY_ATTEMPTS/.test(c)) return 'Demasiados intentos fallidos. Espera unos minutos y vuelve a probar.';
  if(/EMAIL_EXISTS/.test(c)) return 'Ya existe una cuenta con ese correo.';
  if(/WEAK_PASSWORD/.test(c)) return 'La contraseña debe tener al menos 6 caracteres.';
  if(/INVALID_EMAIL/.test(c)) return 'Ese correo no tiene un formato válido.';
  if(/OPERATION_NOT_ALLOWED/.test(c)) return 'Falta activar el acceso por correo y contraseña en Firebase.';
  return c ? 'No se pudo completar la operación (' + c + ').' : 'No se pudo conectar con el servidor.';
}

async function entrar(correo, contrasena){

async function renovarToken(){
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(CONFIG_NUBE.apiKey), {
    method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type:'refresh_token', refresh_token: sesion.refreshToken }).toString()
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('SESION_VENCIDA');
  sesion.idToken = d.id_token;
  sesion.refreshToken = d.refresh_token || sesion.refreshToken;
  sesion.expira = Date.now() + (Number(d.expires_in) || 3600) * 1000;
  guardarSesion();
}
async function tokenVigente(){
  if(!haySesion()) throw new Error('SIN_SESION');

}

/* El perfil dice el rol. Si no existe, la cuenta no tiene acceso concedido. */

/* ========================= FIRESTORE POR REST =========================
   Se habla con Firestore con fetch normal, sin librerías, para que la
   página siga siendo un solo archivo.
   ====================================================================== */
const RAIZ_NUBE = () =>
  'https://firestore.googleapis.com/v1/projects/' + CONFIG_NUBE.projectId + '/databases/(default)/documents';

function aValor(v){
  if(v === null || v === undefined) return { nullValue:null };
  if(typeof v === 'boolean') return { booleanValue:v };
  if(typeof v === 'number') return Number.isInteger(v) ? { integerValue:String(v) } : { doubleValue:v };
  if(Array.isArray(v)) return { arrayValue:{ values: v.map(aValor) } };
  if(typeof v === 'object') return { mapValue:{ fields: aCampos(v) } };
  return { stringValue:String(v) };
}
function aCampos(o){ const f = {}; Object.keys(o).forEach(k=>{ f[k] = aValor(o[k]); }); return f; }
function deValor(v){
  if(!v || typeof v !== 'object') return null;
  if('booleanValue' in v) return v.booleanValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v)  return Number(v.doubleValue);
  if('stringValue' in v)  return v.stringValue;
  if('timestampValue' in v) return v.timestampValue;
  if('nullValue' in v)    return null;
  if('arrayValue' in v)   return (v.arrayValue.values || []).map(deValor);
  if('mapValue' in v)     return deCampos(v.mapValue.fields || {});
  return null;
}
function deCampos(f){ const o = {}; Object.keys(f).forEach(k=>{ o[k] = deValor(f[k]); }); return o; }

async function pedirNube(ruta, opciones, permitirVacio, esReintento){
  const t = await tokenVigente();
  const op = Object.assign({}, opciones);
  op.headers = Object.assign({ 'Authorization':'Bearer ' + t, 'Content-Type':'application/json' }, op.headers || {});
  const r = await fetch(RAIZ_NUBE() + ruta, op);
  if(r.status === 401 && !esReintento){
    await renovarToken();
    return pedirNube(ruta, opciones, permitirVacio, true);
  }
  if(r.status === 404 && permitirVacio) return null;
  if(r.status === 403) throw new Error('SIN_PERMISO');
  if(!r.ok){
    const t2 = await r.text().catch(()=>'');
    throw new Error('HTTP ' + r.status + ' ' + t2.slice(0,200));
  }
  if(r.status === 204) return null;
  return r.json().catch(()=>null);
}

async function listarNube(coleccion){
  const salida = [];
  let pagina = '';
  do{
    const d = await pedirNube('/' + coleccion + '?pageSize=300' + (pagina ? '&pageToken=' + encodeURIComponent(pagina) : ''), { method:'GET' });
    ((d && d.documents) || []).forEach(doc=>{
      const o = deCampos(doc.fields || {});
      o.id = doc.name.split('/').pop();
      salida.push(o);
    });
    pagina = (d && d.nextPageToken) || '';
  }while(pagina);
  return salida;
}
/* updateMask explícito: sin él, Firestore no reemplaza el registro de forma predecible. */
async function escribirNube(coleccion, id, obj){
  const campos = Object.assign({}, obj);
  delete campos.id;
  const mascara = Object.keys(campos).map(k => 'updateMask.fieldPaths=' + encodeURIComponent(k)).join('&');
  return pedirNube('/' + coleccion + '/' + encodeURIComponent(id) + '?' + mascara, {
    method:'PATCH', body: JSON.stringify({ fields: aCampos(campos) })
  });
}
async function borrarNube(coleccion, id){
  return pedirNube('/' + coleccion + '/' + encodeURIComponent(id), { method:'DELETE' }, true);
}
async function crearNube(coleccion, obj){
  return pedirNube('/' + coleccion, { method:'POST', body: JSON.stringify({ fields: aCampos(obj) }) });
}

/* ===================== COLA DE CAMBIOS PENDIENTES =====================
   Cada cambio se guarda primero local y se apunta en una cola. La cola se
   vacía contra el servidor; si no hay internet, espera y reintenta. Así no
   se pierde nada aunque se cierre la pestaña.
   ====================================================================== */
const LLAVE_COLA = 'forguard_forpass_cola_v1';
let cola = [];
let vaciando = false, intentosFallidos = 0, temporizadorCola = null;

function cargarCola(){ try{ cola = JSON.parse(localStorage.getItem(LLAVE_COLA) || '[]'); }catch(e){ cola = []; } }
function guardarCola(){ try{ localStorage.setItem(LLAVE_COLA, JSON.stringify(cola)); }catch(e){} }

function encolar(op){
  if(!HAY_NUBE) return;
  /* Si ya había un cambio pendiente del mismo registro, este lo reemplaza. */
  cola = cola.filter(x => !(x.coleccion === op.coleccion && x.id === op.id));
  cola.push(op);
  guardarCola();
  pintarEstadoNube();
  vaciarCola();
}

async function vaciarCola(){
  if(vaciando || !HAY_NUBE || !haySesion() || !cola.length) return;
  clearTimeout(temporizadorCola);
  vaciando = true;
  pintarEstadoNube();
  try{
    while(cola.length){
      const op = cola[0];
      if(op.tipo === 'borrar') await borrarNube(op.coleccion, op.id);
      else                     await escribirNube(op.coleccion, op.id, op.obj);
      cola.shift();
      guardarCola();
      pintarEstadoNube();
    }
    intentosFallidos = 0;
  }catch(e){
    const m = String(e.message || '');
    if(/SIN_SESION|SESION_VENCIDA/.test(m)){ vaciando = false; salir(true); return; }
    if(/SIN_PERMISO/.test(m)){
      vaciando = false;
      aviso('Tu cuenta no tiene permiso para guardar cambios. Los dejé pendientes.', true);
      pintarEstadoNube();
      return;
    }
    intentosFallidos = Math.min(intentosFallidos + 1, 6);
    temporizadorCola = setTimeout(vaciarCola, 1500 * Math.pow(2, intentosFallidos - 1));
    console.warn('Reintentando guardar en la nube:', m);
  }finally{
    vaciando = false;
    pintarEstadoNube();
  }
}

/* Trae del servidor y reemplaza la copia local.
   Si el servidor está completamente vacío pero aquí sí hay información, no la
   borra: devuelve 'vacia' para que quien arranca decida subirla. Así nadie
   pierde lo que ya había capturado antes de conectar la nube. */
async function bajarDeLaNube(){
  const [cl, si] = await Promise.all([listarNube('clientes'), listarNube('sitios')]);
  if(!cl.length && !si.length && (datos.clientes.length || datos.sitios.length)) return 'vacia';
  datos = { v:1, clientes: cl.map(normalizarCliente), sitios: si.map(normalizarSitio) };
  guardarLocal();
  return 'ok';
}
/* Sube todo lo que hay local (para la primera vez o al restaurar un respaldo). */
function subirTodo(){
  datos.clientes.forEach(c => encolar({ tipo:'poner', coleccion:'clientes', id:c.id, obj:c }));
  datos.sitios.forEach(s => encolar({ tipo:'poner', coleccion:'sitios', id:s.id, obj:s }));

/* Rellena valores faltantes para que un sitio viejo o importado no rompa la vista. */
function normalizarSitio(s){
  const meses = Math.max(1, Math.min(MAX_MESES, parseInt(s.meses,10) || 12));
  const pagos = Array.from({length:meses}, (_,i)=> !!(Array.isArray(s.pagos) && s.pagos[i]));
  /* Un renglón por mensualidad con su OC y quién la capturó. Va en paralelo a
     "pagos" para no romper los sitios que se capturaron antes de esta versión. */
  const pagosDetalle = Array.from({length:meses}, (_,i)=>{
    const d = (Array.isArray(s.pagosDetalle) && s.pagosDetalle[i]) || null;
    return {
      oc:     d && d.oc     ? String(d.oc)     : '',
      quien:  d && d.quien  ? String(d.quien)  : '',
      cuando: d && d.cuando ? String(d.cuando) : ''
    };
  });
  return {
    pagosDetalle,
    id: s.id || nuevoId(),
    clienteId: s.clienteId || '',
    nombre: s.nombre || 'Sitio',
    estado: ['activo','pausado','baja'].includes(s.estado) ? s.estado : 'activo',
    tipo: s.tipo === 'sw' ? 'sw' : 'hw',
    modulos: Math.max(0, parseInt(s.modulos,10) || 0),
    mensualidad: Math.max(0, Number(s.mensualidad) || 0),
    incViaticos: !!s.incViaticos,
    viaticos: Math.max(0, Number(s.viaticos) || 0),
    incOnboarding: !!s.incOnboarding,
    onboarding: Math.max(0, Number(s.onboarding) || 0),
    fechaInicio: /^\d{4}-\d{2}-\d{2}$/.test(s.fechaInicio||'') ? s.fechaInicio : hoyISO(),
    meses, pagos,
    notas: s.notas || ''
  };
}

/* ============================ FECHAS Y FORMATOS ============================ */
/* Se trabaja con textos 'AAAA-MM-DD' para no pelear con zonas horarias. */
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function partes(iso){ const [a,m,d] = iso.split('-').map(Number); return {a,m,d}; }
function aUTC(iso){ const p = partes(iso); return Date.UTC(p.a, p.m-1, p.d); }
function sumarMeses(iso, n){
  const p = partes(iso);
  const total = (p.m - 1) + n;
  const a = p.a + Math.floor(total/12);
  const m = ((total % 12) + 12) % 12;              /* 0..11 */
  const ultimo = new Date(Date.UTC(a, m+1, 0)).getUTCDate();   /* días del mes destino */
  const d = Math.min(p.d, ultimo);                 /* 31 de enero + 1 mes = 28/29 de febrero */
  return a + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}
function diasEntre(isoA, isoB){ return Math.round((aUTC(isoB) - aUTC(isoA)) / 86400000); }
/* Meses completos transcurridos entre dos fechas (como DATEDIF "m" de Excel). */
function mesesTranscurridos(isoIni, isoFin){
  const a = partes(isoIni), b = partes(isoFin);
  let m = (b.a - a.a) * 12 + (b.m - a.m);
  if(b.d < a.d) m--;
  return m;
}
function fmtFecha(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||'')) return '—';
  const p = partes(iso);
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return String(p.d).padStart(2,'0') + ' ' + MES[p.m-1] + ' ' + p.a;
}
function dinero(n){ return '$' + Math.round(Number(n)||0).toLocaleString('en-US'); }
function numero(n){ return (Number(n)||0).toLocaleString('en-US'); }
function plural(n, uno, muchos){ return n === 1 ? uno : muchos; }
/* Serial de fecha de Excel (1899-12-30 = 0). */
function serialExcel(iso){ return Math.round((aUTC(iso) - Date.UTC(1899,11,30)) / 86400000); }

/* ========================== CÁLCULOS DEL SITIO ========================== */
/* Un solo lugar donde se decide todo lo que la tarjeta y el Excel muestran. */
function calcular(s){
  const hoy = hoyISO();
  const fin = sumarMeses(s.fechaInicio, s.meses);           /* vigencia */
  const pagados = s.pagos.filter(Boolean).length;
  const pendientes = s.meses - pagados;

  /* Mensualidades que ya debieron pagarse: una al inicio y una por mes cumplido. */
  let debidas = 0;
  if(diasEntre(s.fechaInicio, hoy) >= 0) debidas = Math.min(s.meses, mesesTranscurridos(s.fechaInicio, hoy) + 1);

  const atrasadas = Math.max(0, debidas - pagados);
  /* La siguiente mensualidad es la primera sin pagar (mes 1 = fecha de inicio). */
  const iSig = s.pagos.findIndex(p => !p);
  const proximo = iSig === -1 ? null : sumarMeses(s.fechaInicio, iSig);
  const diasRest = proximo ? diasEntre(hoy, proximo) : null;

  const vigente = diasEntre(hoy, fin) >= 0;
  const suscripcion = vigente ? 'Activa' : 'Terminó';
  const diasVigencia = diasEntre(hoy, fin);

  /* Semáforo */
  let estatus, tono;
  if(s.estado === 'baja'){ estatus = 'Baja'; tono = 'neutro'; }
  else if(s.estado === 'pausado'){ estatus = 'Pausado'; tono = 'neutro'; }
  else if(atrasadas > 0){ estatus = 'Atrasado'; tono = 'error'; }
  else if(pendientes === 0){ estatus = 'Contrato cubierto'; tono = 'ok'; }
  else if(diasRest !== null && diasRest <= 7){ estatus = 'Por pagar'; tono = 'alerta'; }
  else{ estatus = 'Al día'; tono = 'ok'; }

  const activo = s.estado === 'activo' && vigente;
  const forpassActivos = activo ? s.modulos : 0;

  /* Los viáticos y el onboarding se cobran UNA sola vez, en el pago 1.
     De la mensualidad 2 en adelante es la renta normal. */
  const extras = (s.incViaticos ? s.viaticos : 0) + (s.incOnboarding ? s.onboarding : 0);
  const montos = Array.from({length:s.meses}, (_,i)=> s.mensualidad + (i === 0 ? extras : 0));
  const primerPago = montos[0];
  const valorContrato = s.mensualidad * s.meses + extras;
  const cobrado = s.pagos.reduce((t,p,i)=> t + (p ? montos[i] : 0), 0);

  /* Dinero vencido: solo las mensualidades que ya debieron pagarse y no están pagadas. */
  let adeudo = 0;
  for(let i = 0; i < debidas; i++) if(!s.pagos[i]) adeudo += montos[i];

  return { hoy, fin, pagados, pendientes, debidas, atrasadas, proximo, diasRest,
           vigente, suscripcion, diasVigencia, estatus, tono, activo, forpassActivos,
           extras, montos, primerPago, valorContrato, cobrado, adeudo };
}

/* Suma de un conjunto de sitios, para los indicadores de arriba. */
function resumir(sitios){
  const r = { sitios:sitios.length, sitiosActivos:0, forpass:0, mrr:0, atrasados:0, porPagar:0, porVencer:0, mensualidadesAtrasadas:0, adeudo:0 };
  sitios.forEach(s=>{
    const c = calcular(s);
    if(c.activo){ r.sitiosActivos++; r.forpass += s.modulos; r.mrr += s.mensualidad; }
    if(c.tono === 'error'){ r.atrasados++; r.mensualidadesAtrasadas += c.atrasadas; r.adeudo += c.adeudo; }
    else if(c.estatus === 'Por pagar') r.porPagar++;
    if(c.activo && c.diasVigencia >= 0 && c.diasVigencia <= 45) r.porVencer++;
  });
  return r;
}

/* Botón para volver a la lista de clientes, arriba de cada vista interna. */
function botonRegresar(){
  return '<div style="margin-bottom:14px">'
       + '<button type="button" class="btn btn-suave btn-mini" data-accion="ir-clientes">'
       + ICONO.atras + 'Regresar a clientes</button></div>';
}

function iniciales(nombre){
  const p = String(nombre||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '—';
  return (p.length === 1 ? p[0].slice(0,2) : p[0][0] + p[1][0]).toUpperCase();
}

function tarjetaKpi(label, valor, pie, clase){
  return '<div class="kpi ' + (clase||'') + '"><div class="k-label">' + esc(label) + '</div>'
       + '<div class="k-valor">' + valor + '</div>'
       + (pie ? '<div class="k-pie">' + esc(pie) + '</div>' : '') + '</div>';
}

function barraHerramientas(){
  return '<button type="button" class="btn btn-suave btn-mini" data-accion="excel">' + ICONO.excel + 'Descargar Excel</button>'
       + '<button type="button" class="btn btn-suave btn-mini" data-accion="respaldo">' + ICONO.respaldo + 'Respaldo JSON</button>'
       + '<button type="button" class="btn btn-suave btn-mini" data-accion="restaurar">' + ICONO.subir + 'Restaurar</button>';
}

/* ------------------------------ Vista: clientes ------------------------------ */
function vistaClientes(){
  const r = resumir(datos.sitios);
  let h = '';

  h += '<div class="titulo-zona"><div>'
     +   '<h2>Clientes</h2>'
     +   '<p>' + numero(datos.clientes.length) + ' ' + plural(datos.clientes.length,'cliente','clientes')
     +   ' · ' + numero(r.sitios) + ' ' + plural(r.sitios,'sitio','sitios') + ' registrados</p>'
     + '</div><div class="acciones">'
     +   barraHerramientas()
     +   '<button type="button" class="btn btn-primario" data-accion="nuevo-cliente">' + ICONO.mas + 'Agregar cliente</button>'
     + '</div></div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Forpass activos', numero(r.forpass), r.sitiosActivos + ' ' + plural(r.sitiosActivos,'sitio activo','sitios activos'), 'k-ok')
     + tarjetaKpi('Mensualidad total', dinero(r.mrr), 'Suma de sitios activos (sin IVA)')
     + tarjetaKpi('Sitios atrasados', numero(r.atrasados), r.mensualidadesAtrasadas + ' ' + plural(r.mensualidadesAtrasadas,'mensualidad vencida','mensualidades vencidas') + ' · ' + dinero(r.adeudo), r.atrasados ? 'k-error' : '')
     + tarjetaKpi('Por pagar (7 días)', numero(r.porPagar), 'Mensualidad próxima a vencer', r.porPagar ? 'k-alerta' : '')
     + tarjetaKpi('Vigencias por vencer', numero(r.porVencer), 'Contratos que terminan en 45 días', r.porVencer ? 'k-alerta' : '')
     + '</div>';

  h += avisoLocal();

  if(!datos.clientes.length){
    h += vistaVacia('edificio','Todavía no hay clientes','Agrega tu primer cliente y después registra los sitios con sus Forpass, mensualidad y vigencia.','nuevo-cliente','Agregar cliente');
    return h;
  }

  h += '<div class="barra-busca">'
     +   '<input type="search" id="buscaCliente" placeholder="Buscar cliente…" value="' + esc(estado.busca) + '">'
     +   '<select id="filtroCliente">'
     +     '<option value="todos">Todos los clientes</option>'
     +     '<option value="atrasados">Solo con atrasos</option>'
     +     '<option value="activos">Solo con Forpass activos</option>'
     +   '</select>'
     + '</div>';

  const q = estado.busca.trim().toLowerCase();
  const lista = datos.clientes.filter(c=>{
    const ss = sitiosDe(c.id);
    if(q){
      const enSitios = ss.some(s => s.nombre.toLowerCase().includes(q));
      if(!c.nombre.toLowerCase().includes(q) && !enSitios) return false;
    }
    const rr = resumir(ss);
    if(estado.filtro === 'atrasados' && !rr.atrasados) return false;
    if(estado.filtro === 'activos' && !rr.forpass) return false;
    return true;
  });

  if(!lista.length){
    h += '<div class="vacio"><h3>Sin resultados</h3><p>Ningún cliente coincide con la búsqueda o el filtro.</p></div>';
    return h;
  }

  h += '<div class="grid">' + lista.map((c,i)=>{
    const ss = sitiosDe(c.id);
    const rr = resumir(ss);
    const tono = rr.atrasados ? 'error' : (rr.porPagar ? 'alerta' : (rr.forpass ? 'ok' : 'neutro'));
    const puntoTono = tono === 'error' ? 'p-error' : (tono === 'alerta' ? 'p-alerta' : (rr.forpass ? 'p-ok' : 'p-neutro'));

    let chips = '<span class="insignia ' + (rr.forpass ? 'i-ok' : 'i-neutro') + '">'
              + '<span class="punto ' + puntoTono + '"></span>'
              + numero(rr.forpass) + ' ' + plural(rr.forpass,'Forpass activo','Forpass activos') + '</span>';
    if(rr.atrasados) chips += '<span class="insignia i-error">' + rr.atrasados + ' ' + plural(rr.atrasados,'sitio atrasado','sitios atrasados') + '</span>';
    else if(rr.porPagar) chips += '<span class="insignia i-alerta">' + rr.porPagar + ' por pagar</span>';
    if(rr.porVencer) chips += '<span class="insignia i-info">' + rr.porVencer + ' por vencer</span>';

    return '<div class="tarjeta tarjeta-clic t-' + tono + '" data-cliente="' + esc(c.id) + '" style="--d:' + (i*45) + 'ms" tabindex="0" role="button">'
         +   '<div class="t-cabeza">'
         +     '<div class="t-avatar">' + esc(iniciales(c.nombre)) + '</div>'
         +     '<div style="flex:1; min-width:0">'
         +       '<div class="t-nombre">' + esc(c.nombre) + '</div>'
         +       '<div class="t-sub">' + numero(rr.sitios) + ' ' + plural(rr.sitios,'sitio','sitios')
         +         (c.contacto ? ' · ' + esc(c.contacto) : '') + '</div>'
         +     '</div>'
         +   '</div>'
         +   '<div class="t-chips">' + chips + '</div>'
         +   '<div class="t-datos">'
         +     '<div class="t-dato"><div class="d-label">Mensualidad</div><div class="d-valor">' + dinero(rr.mrr) + '</div></div>'
         +     '<div class="t-dato"><div class="d-label">Sitios activos</div><div class="d-valor">' + numero(rr.sitiosActivos) + ' de ' + numero(rr.sitios) + '</div></div>'
         +   '</div>'
         +   '<div class="t-pie">'
         +     '<button type="button" class="btn btn-suave btn-mini" data-ver="' + esc(c.id) + '">Ver sitios →</button>'
         +     '<span class="espacio"></span>'
         +     '<button type="button" class="btn btn-suave btn-mini" data-editar-cliente="' + esc(c.id) + '" title="Editar cliente">' + ICONO.lapiz + '</button>'
         +     '<button type="button" class="btn btn-peligro btn-mini" data-borrar-cliente="' + esc(c.id) + '" title="Eliminar cliente">' + ICONO.basura + '</button>'
         +   '</div>'
         + '</div>';
  }).join('') + '</div>';

  return h;
}

/* ------------------------------- Vista: sitios ------------------------------- */
function vistaCliente(){
  const c = clientePorId(estado.clienteId);
  if(!c){ estado.vista = 'clientes'; return vistaClientes(); }
  const todos = sitiosDe(c.id);

  /* El filtro decide qué sitios entran a los indicadores y a la lista.
     Si el sitio elegido ya no existe, se regresa a "todos". */
  if(estado.sitioFiltro && !todos.some(s => s.id === estado.sitioFiltro)) estado.sitioFiltro = '';
  const ss = estado.sitioFiltro ? todos.filter(s => s.id === estado.sitioFiltro) : todos;
  const r = resumir(ss);
  const rTodos = resumir(todos);
  const uno = !!estado.sitioFiltro;
  let h = '';

  h += botonRegresar();

  h += '<div class="titulo-zona"><div>'
     +   '<h2>' + esc(c.nombre) + '</h2>'
     +   '<p>' + numero(rTodos.sitios) + ' ' + plural(rTodos.sitios,'sitio','sitios')
     +   ' · ' + numero(rTodos.forpass) + ' ' + plural(rTodos.forpass,'Forpass activo','Forpass activos')
     +   (c.contacto ? ' · ' + esc(c.contacto) : '') + '</p>'
     + '</div><div class="acciones">'
     +   '<button type="button" class="btn btn-suave btn-mini" data-accion="excel-cliente">' + ICONO.excel + 'Excel de este cliente</button>'
     +   '<button type="button" class="btn btn-primario" data-accion="nuevo-sitio">' + ICONO.mas + 'Agregar sitio</button>'
     + '</div></div>';

  /* Filtro por sitio: ver el total de todos o de uno solo. */
  if(todos.length > 1){
    const opciones = todos.slice().sort((a,b)=> a.nombre.localeCompare(b.nombre,'es')).map(s =>
      '<option value="' + esc(s.id) + '"' + (s.id === estado.sitioFiltro ? ' selected' : '') + '>'
      + esc(s.nombre) + ' — ' + dinero(s.mensualidad) + '/mes</option>').join('');
    h += '<div class="barra-busca">'
       +   '<label for="filtroSitio" style="font-size:12.5px; color:var(--gray); align-self:center; font-weight:600">Ver totales de:</label>'
       +   '<select id="filtroSitio" style="flex:1; min-width:210px">'
       +     '<option value="">Todos los sitios (' + todos.length + ')</option>' + opciones
       +   '</select>'
       + '</div>';
  }

  const pieMrr = uno ? 'Solo este sitio · ' + dinero(rTodos.mrr) + ' entre todos' : 'Sitios activos (sin IVA)';

  h += '<div class="kpis">'
     + tarjetaKpi('Forpass activos', numero(r.forpass), r.sitiosActivos + ' ' + plural(r.sitiosActivos,'sitio activo','sitios activos'), 'k-ok')
     + tarjetaKpi('Mensualidad total', dinero(r.mrr), pieMrr)
     + tarjetaKpi('Mensualidades vencidas', numero(r.mensualidadesAtrasadas), r.adeudo ? dinero(r.adeudo) + ' por cobrar' : 'Nada pendiente', r.mensualidadesAtrasadas ? 'k-error' : '')
     + tarjetaKpi('Vigencias por vencer', numero(r.porVencer), 'Terminan en 45 días', r.porVencer ? 'k-alerta' : '')
     + '</div>';

  if(!todos.length){
    h += vistaVacia('credencial','Este cliente aún no tiene sitios','Registra un sitio (por ejemplo MXCD13) con sus Forpass, la mensualidad, la vigencia y si incluyó viáticos u onboarding.','nuevo-sitio','Agregar sitio');
    return h;
  }

  const ordenados = ss.slice().sort((a,b)=>{
    const ca = calcular(a), cb = calcular(b);
    const peso = t => t === 'error' ? 0 : t === 'alerta' ? 1 : t === 'ok' ? 2 : 3;
    return peso(ca.tono) - peso(cb.tono) || a.nombre.localeCompare(b.nombre, 'es');
  });

  h += '<div class="grid grid-sitios">' + ordenados.map((s,i)=> tarjetaSitio(s, i)).join('') + '</div>';
  return h;
}

function tarjetaSitio(s, i){
  const c = calcular(s);
  const clasePunto = c.tono === 'error' ? 'p-error late' : c.tono === 'alerta' ? 'p-alerta' : (c.activo ? 'p-ok' : 'p-neutro');
  const claseIns = c.tono === 'error' ? 'i-error' : c.tono === 'alerta' ? 'i-alerta' : c.tono === 'ok' ? 'i-ok' : 'i-neutro';

  /* Siguiente pago: se muestra el MONTO como dato principal y la fecha abajo.
     Así el analista ve de una lo que hay que cobrar, sin cuentas mentales. */
  const iSig = s.pagos.findIndex(p => !p);
  let txtProx = 'Contrato cubierto', tonoProx = 'ok', pieProx = 'Las ' + s.meses + ' mensualidades están pagadas';
  if(c.proximo){
    txtProx = dinero(c.montos[iSig]);
    const cuando = fmtFecha(c.proximo) + ' · mensualidad ' + (iSig + 1);
    if(c.diasRest < 0){ tonoProx = 'error'; pieProx = cuando + ' · vencida hace ' + Math.abs(c.diasRest) + ' ' + plural(Math.abs(c.diasRest),'día','días'); }
    else if(c.diasRest === 0){ tonoProx = 'error'; pieProx = cuando + ' · se vence hoy'; }
    else{ tonoProx = c.diasRest <= 7 ? 'alerta' : 'ok'; pieProx = cuando + ' · faltan ' + c.diasRest + ' ' + plural(c.diasRest,'día','días'); }
  }

  const casillas = s.pagos.map((p,idx)=>{
    const cl = p ? 'pagado' : (idx < c.debidas ? 'debido' : '');
    const fecha = fmtFecha(sumarMeses(s.fechaInicio, idx));
    const detalle = 'Mensualidad ' + (idx+1) + ' · ' + fecha + ' · ' + dinero(c.montos[idx])
                  + (idx === 0 && c.extras ? ' (incluye onboarding y viáticos)' : '')
                  + (p ? ' · pagada' : ' · sin pagar');
    return '<button type="button" class="mes ' + cl + '" data-pago="' + esc(s.id) + '" data-idx="' + idx + '" '
         + 'title="' + esc(detalle) + '" aria-label="' + esc(detalle) + '" '
         + 'aria-pressed="' + (p ? 'true' : 'false') + '">' + (idx+1) + '</button>';
  }).join('');

  return '<div class="tarjeta t-' + c.tono + '" style="--d:' + (i*45) + 'ms">'
       +   '<div class="t-cabeza">'
       +     '<div style="flex:1; min-width:0">'
       +       '<div class="t-nombre" style="display:flex; align-items:center; gap:9px">'
       +         '<span class="punto ' + clasePunto + '"></span>' + esc(s.nombre)
       +         '<button type="button" class="tres-puntos" data-plan="' + esc(s.id) + '" '
       +           'title="Ver el plan de pagos mes por mes" aria-label="Plan de pagos de ' + esc(s.nombre) + '">'
       +           '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>'
       +         '</button>'
       +       '</div>'
       +       '<div class="t-sub">' + numero(s.modulos) + ' Forpass'
       +         (c.activo ? plural(s.modulos,' activo',' activos') : ' · ' + ETIQUETA_ESTADO[s.estado] + (c.vigente ? '' : ' · vigencia terminada'))
       +         ' · ' + ETIQUETA_TIPO[s.tipo] + '</div>'
       +     '</div>'
       +     '<span class="insignia ' + claseIns + '">' + esc(c.estatus) + '</span>'
       +   '</div>'

       +   '<div class="t-datos">'
       +     '<div class="t-dato"><div class="d-label">Siguiente pago</div><div class="d-valor ' + tonoProx + '">' + esc(txtProx) + '</div><div class="d-label" style="text-transform:none; letter-spacing:0; font-weight:500; margin-top:2px">' + esc(pieProx) + '</div></div>'
       +     '<div class="t-dato"><div class="d-label">Mensualidad</div><div class="d-valor">' + dinero(s.mensualidad) + '</div></div>'
       +     '<div class="t-dato"><div class="d-label">Inicio</div><div class="d-valor chico">' + fmtFecha(s.fechaInicio) + '</div></div>'
       +     '<div class="t-dato"><div class="d-label">Vigencia</div><div class="d-valor chico">' + fmtFecha(c.fin)
       +       '</div><div class="d-label" style="text-transform:none; letter-spacing:0; font-weight:500; margin-top:2px">'
       +       (c.vigente ? 'Faltan ' + c.diasVigencia + ' ' + plural(c.diasVigencia,'día','días') : 'Terminó hace ' + Math.abs(c.diasVigencia) + ' ' + plural(Math.abs(c.diasVigencia),'día','días'))
       +       '</div></div>'
       +   '</div>'

       +   '<div class="progreso">'
       +     '<div class="p-cabeza"><span>Mensualidades pagadas</span><span>' + c.pagados + ' de ' + s.meses
       +       (c.atrasadas ? ' · <b style="color:#a5322e">' + c.atrasadas + ' vencida' + (c.atrasadas===1?'':'s') + '</b>' : '') + '</span></div>'
       +     '<div class="meses">' + casillas + '</div>'
       +   '</div>'

       +   (s.notas ? '<div class="t-nota">' + esc(s.notas) + '</div>' : '')

       +   '<div class="t-pie">'
       +     (c.proximo ? '<button type="button" class="btn btn-verde btn-mini" data-marcar="' + esc(s.id) + '">' + ICONO.cheque + 'Marcar pagada</button>' : '')
       +     '<span class="espacio"></span>'
       +     '<button type="button" class="btn btn-suave btn-mini" data-editar-sitio="' + esc(s.id) + '">' + ICONO.lapiz + 'Editar</button>'
       +     '<button type="button" class="btn btn-peligro btn-mini" data-borrar-sitio="' + esc(s.id) + '" title="Eliminar sitio">' + ICONO.basura + '</button>'
       +   '</div>'
       + '</div>';
}

function vistaVacia(icono, titulo, texto, accion, textoBoton){
  return '<div class="vacio">'
       +   '<div class="v-icono">' + ICONO[icono] + '</div>'
       +   '<h3>' + esc(titulo) + '</h3><p>' + esc(texto) + '</p>'
       +   '<button type="button" class="btn btn-primario" data-accion="' + accion + '">' + ICONO.mas + esc(textoBoton) + '</button>'
       + '</div>';
}

function avisoLocal(){
  if(HAY_NUBE){
    if(sesion.rol === 'viewer'){
      return '<div class="aviso">' + ICONO.info
           + '<div>Tu cuenta es <b>Viewer</b>: puedes ver todo y descargar el Excel, pero no cambiar nada. '
           + 'Si necesitas capturar, pide que te suban a <b>Analyst</b>.</div></div>';
    }
    return '';
  }
  return '<div class="aviso">' + ICONO.info
       + '<div>La información se guarda <b>en este navegador</b>, no en un servidor. '
       + 'Si vas a usar otra computadora o quieres compartir el control, descarga el <b>Respaldo JSON</b> '
       + 'y ábrelo allá con <b>Restaurar</b>. El <b>Excel</b> es para reportar y respaldar en tu formato de siempre.</div></div>';
}

function render(){
  pintarEstadoNube();
  pintarCabecera();
  $('vista').innerHTML = estado.vista === 'admin'  ? vistaAdmin()
                       : estado.vista === 'cliente' ? vistaCliente()
                       : vistaClientes();
  const b = $('buscaCliente');
  if(b){
    b.addEventListener('input', ()=>{ estado.busca = b.value; renderConservandoFoco(b); });
    const f = $('filtroCliente');
    f.value = estado.filtro;
    f.addEventListener('change', ()=>{ estado.filtro = f.value; render(); });
  }
  const fs = $('filtroSitio');
  if(fs) fs.addEventListener('change', ()=>{ estado.sitioFiltro = fs.value; render(); });
  if(estado.vista === 'admin') montarAdmin();
}

function pintarCabecera(){
  const dentro = HAY_NUBE && haySesion();
  const nom = $('nombreSesion');
  nom.textContent = dentro ? nombreDe(sesion) : '';
  nom.title = dentro ? sesion.correo : '';          /* el correo queda al pasar el mouse */
  $('rolSesion').innerHTML = (dentro && sesion.rol) ? etiquetaRol(sesion.rol) : '';
  $('btnAdmin').style.display = (dentro && esAdmin()) ? '' : 'none';
  $('btnSalir').style.display = dentro ? '' : 'none';
}

/* Corta la acción si la cuenta no tiene permiso de modificar. */
function exigirPermiso(){
  if(puedeEditar()) return true;
  aviso('Tu cuenta es Viewer: no puede hacer cambios.', true);
  return false;
}
/* Redibuja sin perder el cursor del buscador. */
function renderConservandoFoco(input){
  const pos = input.selectionStart;
  render();
  const nuevo = $('buscaCliente');
  if(nuevo){ nuevo.focus(); try{ nuevo.setSelectionRange(pos,pos); }catch(e){} }
}

/* ====================== PANEL DE ADMINISTRACIÓN ======================
   Solo visible para el rol admin. Muestra las cuentas (no las contraseñas:
   Firebase las guarda encriptadas y nadie las puede leer) y el historial.
   ==================================================================== */
const admin = { usuarios:null, bitacora:null, cargando:false, error:'' };

function vistaAdmin(){
  let h = botonRegresar();

  h += '<div class="titulo-zona"><div><h2>Administración</h2>'

async function montarAdmin(forzar){
  if(!esAdmin()) return;
  if(admin.cargando) return;
  if(admin.usuarios && !forzar){ pintarUsuarios(); pintarBitacora(); return; }
  admin.cargando = true; admin.error = '';
  $('tablaUsuarios').innerHTML = '<div class="vacio-chico">Cargando cuentas…</div>';
  $('listaBitacora').innerHTML = '<div class="vacio-chico">Cargando historial…</div>';
  try{
    const [us, bi] = await Promise.all([listarNube('usuarios'), listarNube('bitacora')]);
    admin.usuarios = us;
    admin.bitacora = bi.sort((a,b)=> String(b.cuando||'').localeCompare(String(a.cuando||''))).slice(0,150);
  }catch(e){
    admin.error = /SIN_PERMISO/.test(String(e.message)) ? 'permiso' : String(e.message);
  }finally{
    admin.cargando = false;
  }
  pintarUsuarios(); pintarBitacora();
}

function pintarUsuarios(){
  const cont = $('tablaUsuarios');
  if(!cont) return;
  if(admin.error){
    cont.innerHTML = '<div class="vacio-chico">' + (admin.error === 'permiso'
      ? 'Tu cuenta no tiene permiso de administrador para ver las cuentas.'
      : 'No se pudieron cargar las cuentas: ' + esc(admin.error)) + '</div>';
    $('adminResumen').textContent = '';
    return;
  }
  const ORDEN_ROL = ['owner','admin','analyst','viewer'];
  const us = (admin.usuarios || []).slice()
    .map(u => Object.assign({}, u, { rol: normalizarRol(u.rol) }))
    .sort((a,b)=> ORDEN_ROL.indexOf(a.rol) - ORDEN_ROL.indexOf(b.rol)
                  || String(a.correo||'').localeCompare(String(b.correo||'')));

  const cuenta = r => us.filter(u => u.rol === r).length;
  const bloqueados = us.filter(u => u.activo === false).length;
  $('adminResumen').textContent = us.length + ' ' + plural(us.length,'cuenta','cuentas') + ' · '
    + ORDEN_ROL.filter(r => cuenta(r)).map(r => cuenta(r) + ' ' + ROLES[r].nombre).join(' · ')
    + (bloqueados ? ' · ' + bloqueados + ' ' + plural(bloqueados,'bloqueada','bloqueadas') : '');

  if(!us.length){ cont.innerHTML = '<div class="vacio-chico">Todavía no hay cuentas registradas.</div>'; return; }

  cont.innerHTML = '<table class="tabla"><thead><tr>'
    + '<th>Cuenta</th><th>Permiso</th><th>Estado</th><th>Creada</th><th>Último acceso</th><th></th>'
    + '</tr></thead><tbody>'
    + us.map(u=>{
        const yo = u.id === sesion.uid;
        const esDueno = u.rol === 'owner';
        /* Solo un Owner puede tocar a otro Owner o nombrar uno nuevo. */
        const protegido = yo || (esDueno && !esOwner());
        /* El Owner borra a cualquiera; un Admin a todos menos a un Owner.
           Nadie se borra a sí mismo: sería quedarse fuera sin vuelta. */
        const puedeBorrar = !yo && (esOwner() || (esAdmin() && !esDueno));
        const rolesQuePuedeDar = Object.keys(ROLES).filter(r => r !== 'owner' || esOwner());
        const opciones = rolesQuePuedeDar.map(r =>
          '<option value="' + r + '"' + (u.rol === r ? ' selected' : '') + '>' + esc(ROLES[r].nombre) + '</option>').join('');
        const razon = yo ? 'No puedes cambiarte tu propio permiso'
                         : 'Solo un Owner puede cambiar el permiso de un Owner';

        return '<tr>'
          + '<td><b>' + esc(nombreDe(u) || '—') + '</b>' + (yo ? ' <span class="yo">(tú)</span>' : '')
          +   '<div style="font-size:11.5px; color:var(--gray)">' + esc(u.correo || '') + '</div></td>'
          + '<td>' + (protegido
                ? '<span class="rol c-' + u.rol + '" title="' + esc(razon) + '">' + esc(ROLES[u.rol].nombre) + '</span>'
                : '<select class="sel-rol c-' + u.rol + '" data-rol="' + esc(u.id) + '">' + opciones + '</select>') + '</td>'
          + '<td>' + (u.activo === false
                ? '<span class="insignia i-error">Bloqueada</span>'
                : '<span class="insignia i-ok"><span class="punto p-ok"></span>Activa</span>') + '</td>'
          + '<td>' + esc(fechaHora(u.creado, true)) + '</td>'
          + '<td>' + esc(fechaHora(u.ultimoAcceso, true)) + '</td>'
          + '<td class="acciones">'
          +   (protegido ? '' : '<button type="button" class="btn ' + (u.activo === false ? 'btn-verde' : 'btn-suave')
                 + ' btn-mini" data-bloquear="' + esc(u.id) + '">' + (u.activo === false ? 'Reactivar' : 'Bloquear') + '</button>')
          +   (puedeBorrar ? '<button type="button" class="btn btn-peligro btn-mini" data-borrar-usuario="' + esc(u.id) + '" '
                 + 'title="Borrar el acceso de esta cuenta">' + ICONO.basura + '</button>' : '')
          + '</td></tr>';
      }).join('')
    + '</tbody></table>';

/* Fecha y hora legibles a partir de un texto ISO. */
function fechaHora(iso, soloFecha){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const base = String(d.getDate()).padStart(2,'0') + ' ' + MES[d.getMonth()] + ' ' + d.getFullYear();
  if(soloFecha) return base;
  return base + ', ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* Contraseña temporal fácil de dictar por teléfono. */
function claveSugerida(){
  const silabas = ['for','pass','guard','kio','sco','mex','nova','ter','lum','vera','sol','rio'];
  const s = () => silabas[Math.floor(Math.random()*silabas.length)];
  return s() + '-' + s() + '-' + String(Math.floor(Math.random()*9000) + 1000);
}

        +   '<div class="c-fila"><span>Correo</span><code>' + esc(correo) + '</code></div>'
        +   '<div class="c-fila"><span>Contraseña</span><code>' + esc(clave) + '</code></div>'
        +   '<div class="c-nota">Esta es la única vez que ves la contraseña. Si se pierde, no se recupera: '
        +   'se manda un correo para poner una nueva.</div>'

        + '<button type="button" class="btn btn-primario" data-modal="cancelar">Listo</button>');

          .then(()=> aviso('Datos copiados.'))
          .catch(()=> aviso('No se pudo copiar. Selecciona el texto a mano.', true));

      pintarUsuarios();
    }catch(e){
      btn.disabled = false; btn.textContent = 'Crear cuenta';
      aviso(e.message, true);
    }
  };

$('vista').addEventListener('click', async ev=>{

          anotar('borró el acceso de', 'cuenta', u.correo, ROLES[normalizarRol(u.rol)].nombre);
          pintarUsuarios();
          aviso('Acceso de ' + nombreDe(u) + ' borrado.');
        }catch(e){
          aviso(/SIN_PERMISO/.test(String(e.message))

            : 'No se pudo borrar: ' + e.message, true);
        }
      });

  }

  const blo = ev.target.closest('[data-bloquear]');

    if(!u) return;

      bloquear
        ? 'A <b>' + esc(nombreDe(u)) + '</b> (' + esc(u.correo) + ') se le va a quitar el acceso de inmediato. La cuenta no se borra: la puedes reactivar cuando quieras.'
        : 'A <b>' + esc(nombreDe(u)) + '</b> (' + esc(u.correo) + ') se le devuelve el acceso con el permiso de <b>' + esc(ROLES[normalizarRol(u.rol)].nombre) + '</b>.',

function aviso(texto, esError){
  const t = $('toast');
  t.textContent = texto;
  t.classList.toggle('err', !!esError);
  t.classList.add('visible');
  clearTimeout(t._temp);
  t._temp = setTimeout(()=>t.classList.remove('visible'), 3400);
}

    +     '<div class="pista" id="pistaUnitario">Es el total mensual del sitio, sumando todos sus Forpass.</div></div>'

    +   '<div class="aviso" style="margin:2px 0 14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>'
