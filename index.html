  if(typeof v === 'number') return Number.isInteger(v) ? { integerValue:String(v) } : { doubleValue:v };
  if(Array.isArray(v)) return { arrayValue:{ values: v.map(aValor) } };
  if(typeof v === 'object') return { mapValue:{ fields: aCampos(v) } };
  return { stringValue:String(v) };
}
function aCampos(o){ const f = {}; Object.keys(o).forEach(k=>{ f[k] = aValor(o[k]); }); return f; }
function deValor(v){
  if(!v || typeof v !== 'object') return null;
  if('booleanValue' in v) return v.booleanValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v)  return Number(v.doubleValue);
  if('stringValue' in v)  return v.stringValue;
  if('timestampValue' in v) return v.timestampValue;
  if('nullValue' in v)    return null;
  if('arrayValue' in v)   return (v.arrayValue.values || []).map(deValor);
  if('mapValue' in v)     return deCampos(v.mapValue.fields || {});
  return null;
}
function deCampos(f){ const o = {}; Object.keys(f).forEach(k=>{ o[k] = deValor(f[k]); }); return o; }

async function pedirNube(ruta, opciones, permitirVacio, esReintento){
  const t = await tokenVigente();
  const op = Object.assign({}, opciones);
  op.headers = Object.assign({ 'Authorization':'Bearer ' + t, 'Content-Type':'application/json' }, op.headers || {});
  const r = await fetch(RAIZ_NUBE() + ruta, op);
  if(r.status === 401 && !esReintento){
    await renovarToken();
    return pedirNube(ruta, opciones, permitirVacio, true);
  }
  if(r.status === 404 && permitirVacio) return null;
  if(r.status === 403){
    /* El servidor rechazó: lo más probable es que le acaben de quitar el acceso.
       Se confirma contra su perfil en segundo plano para sacarlo de inmediato en
       vez de esperar la revisión periódica. Sin await: quien llamó necesita su
       error ya. El guardo de "vigilando" evita que esto se muerda la cola cuando
       el 403 viene de la revisión misma. */
    if(!vigilando && haySesion()) revisarCuenta();
    throw new Error('SIN_PERMISO');
  }
  if(!r.ok){
    const t2 = await r.text().catch(()=>'');
    throw new Error('HTTP ' + r.status + ' ' + t2.slice(0,200));
  }
  if(r.status === 204) return null;
  return r.json().catch(()=>null);
}

/* El tamaño de página se puede bajar para colecciones de documentos gordos:
   300 pólizas de 25 KB serían una respuesta de 7 MB. Por omisión, 300, que es
   como venía para clientes y sitios. */
async function listarNube(coleccion, porPagina){
  const salida = [];
  let pagina = '';
  const tam = Math.max(1, Math.min(300, parseInt(porPagina, 10) || 300));
  do{
    const d = await pedirNube('/' + coleccion + '?pageSize=' + tam + (pagina ? '&pageToken=' + encodeURIComponent(pagina) : ''), { method:'GET' });
    ((d && d.documents) || []).forEach(doc=>{
      const o = deCampos(doc.fields || {});
      o.id = doc.name.split('/').pop();
      salida.push(o);
    });
    pagina = (d && d.nextPageToken) || '';
  }while(pagina);
  return salida;
}
/* updateMask explícito: sin él, Firestore no reemplaza el registro de forma predecible. */
async function escribirNube(coleccion, id, obj){
  const campos = Object.assign({}, obj);
  delete campos.id;
  const mascara = Object.keys(campos).map(k => 'updateMask.fieldPaths=' + encodeURIComponent(k)).join('&');
  return pedirNube('/' + coleccion + '/' + encodeURIComponent(id) + '?' + mascara, {
    method:'PATCH', body: JSON.stringify({ fields: aCampos(campos) })
  });
}
async function borrarNube(coleccion, id){
  return pedirNube('/' + coleccion + '/' + encodeURIComponent(id), { method:'DELETE' }, true);
}
async function crearNube(coleccion, obj){
  return pedirNube('/' + coleccion, { method:'POST', body: JSON.stringify({ fields: aCampos(obj) }) });
}

/* ===================== COLA DE CAMBIOS PENDIENTES =====================
   Cada cambio se guarda primero local y se apunta en una cola. La cola se
   vacía contra el servidor; si no hay internet, espera y reintenta. Así no
   se pierde nada aunque se cierre la pestaña.
   ====================================================================== */
const LLAVE_COLA = 'forguard_forpass_cola_v1';
let cola = [];
let vaciando = false, intentosFallidos = 0, temporizadorCola = null;

function cargarCola(){ try{ cola = JSON.parse(localStorage.getItem(LLAVE_COLA) || '[]'); }catch(e){ cola = []; } }
function guardarCola(){ try{ localStorage.setItem(LLAVE_COLA, JSON.stringify(cola)); }catch(e){} }

function encolar(op){
  if(!HAY_NUBE) return;
  /* Si ya había un cambio pendiente del mismo registro, este lo reemplaza. */
  cola = cola.filter(x => !(x.coleccion === op.coleccion && x.id === op.id));
  cola.push(op);
  guardarCola();
  pintarEstadoNube();
  vaciarCola();
}

async function vaciarCola(){
  if(vaciando || !HAY_NUBE || !haySesion() || !cola.length) return;
  clearTimeout(temporizadorCola);
  vaciando = true;
  pintarEstadoNube();
  try{
    while(cola.length){
      const op = cola[0];
      try{
        if(op.tipo === 'borrar') await borrarNube(op.coleccion, op.id);
        else                     await escribirNube(op.coleccion, op.id, op.obj);
      }catch(e){
        /* Un 403 de escritura NO es pasajero: el servidor no la va a aceptar
           nunca, ni en el reintento número mil. Dejarla en la cola la atoraba
           para siempre —el tablero decía "cambios pendientes" a perpetuidad y
           hasta estorbaba al cerrar sesión— y el aviso genérico echaba la culpa a
           la cuenta cuando lo que faltaba era publicar una regla. Se saca, se
           dice CUÁL fue, y se sigue con las demás. */
        if(/SIN_PERMISO/.test(String(e.message || ''))){
          /* Solo si sigue siendo la MISMA operación: si el usuario volvió a
             guardar este registro durante el intento, encolar() ya la
             reemplazó y quitarla aquí tiraría la versión nueva sin mandarla. */
          if(cola[0] === op) cola.shift();
          guardarCola();
          aviso('El servidor rechazó un cambio en «' + op.coleccion + '». Se quedó guardado aquí, pero no subió. '
              + (op.coleccion === 'catalogo'
                  ? 'Falta publicar la regla de /catalogo en Firebase.'
                  : 'Puede faltar la regla de esa colección, o tu permiso no alcanza.'), true);
          continue;
        }
        throw e;
      }
      /* Mismo cuidado que arriba, y este sí mordió: dos guardados rápidos del
         mismo registro (marcar un pago e inmediatamente palomear «facturado»).
         encolar() reemplaza en la cola la operación del mismo registro, así que
         durante el await de escribirNube cola[0] puede dejar de ser `op`: el
         shift ciego quitaba la versión NUEVA —que nunca viajó— y el servidor se
         quedaba con la vieja. El siguiente refresco pisaba la copia local con
         eso y el segundo guardado se perdía sin ningún aviso. */
      if(cola[0] === op) cola.shift();
      guardarCola();
      pintarEstadoNube();
    }
    intentosFallidos = 0;
  }catch(e){
    const m = String(e.message || '');
    if(/SIN_SESION|SESION_VENCIDA/.test(m)){ vaciando = false; salir(true); return; }
    intentosFallidos = Math.min(intentosFallidos + 1, 6);
    temporizadorCola = setTimeout(vaciarCola, 1500 * Math.pow(2, intentosFallidos - 1));
    console.warn('Reintentando guardar en la nube:', m);
  }finally{
    vaciando = false;
    pintarEstadoNube();
  }
}

/* Trae del servidor y reemplaza la copia local.
   Si el servidor está completamente vacío pero aquí sí hay información, no la
   borra: devuelve 'vacia' para que quien arranca decida subirla. Así nadie
   pierde lo que ya había capturado antes de conectar la nube. */
async function bajarDeLaNube(){
  /* Una póliza pesa ~25 KB contra ~1.1 KB de un sitio, así que se piden de 60 en
     60 y no de 300: una página de 300 pólizas serían ~7 MB en una sola respuesta.
     listarNube pagina igual, nada más que en más viajes y más chicos. */
  /* La lista de precios va en UN documento con un arreglo adentro, no en un
     documento por equipo: así son 48 equipos por 1 lectura en vez de 48. Se
     edita poco y se lee en cada carga, así que el ahorro es todo. El costo es
     que dos admins editándola a la vez se pisan, y eso está anotado en la vista. */
  const [cl, si, po, eq] = await Promise.all([
    listarNube('clientes'), listarNube('sitios'), listarNube('polizas', 60), leerCatalogo()
  ]);
  if(!cl.length && !si.length && !po.length
     && (datos.clientes.length || datos.sitios.length || datos.polizas.length)) return 'vacia';
  /* La descarga tarda —cuatro lecturas paginadas— y el guardia de quien llama
     revisa la cola ANTES de arrancarla: una captura hecha DENTRO de esa ventana
     quedaba pisada en pantalla y en la copia local por la versión del servidor,
     hasta el siguiente refresco. Y en el arranque con cola pendiente de una
     sesión sin internet era peor: se pisaba la copia local antes de subir. Con
     cambios pendientes se sigue trabajando con la copia local; el siguiente
     refresco, ya con la cola vacía, descarga limpio. */
  if(cola.length || vaciando) return 'ok';
  datos = { v:1, clientes: cl.map(normalizarCliente), sitios: si.map(normalizarSitio),
            polizas: po.map(normalizarPoliza), catalogo: eq.map(normalizarEquipo) };
  guardarLocal();
  return 'ok';
}

/* La lista de precios NUNCA puede impedir entrar al tablero.

   Se lee aparte y se traga cualquier error a propósito. La primera versión no lo
   hacía y el resultado fue no poder entrar: sin la regla de /catalogo pegada, el
   catch-all responde 403 —no 404—, pedirNube lanzaba SIN_PERMISO, y
   manejarFalloDeArranque lee SIN_PERMISO como "esta cuenta perdió el acceso" y
   saca al usuario. Un dato de comodidad tumbando el login entero.

   Si falla, se trabaja con la semilla en memoria y ya. */
async function leerCatalogo(){
  try{
    const d = await pedirNube('/catalogo/lista', { method:'GET' }, true);
    return (d && d.fields) ? (deCampos(d.fields).equipos || []) : [];
  }catch(e){
    console.warn('No se pudo leer la lista de precios; se usa la de arranque:', String(e.message || e));
    return [];
  }
}

/* Guarda la lista de precios completa. Local primero, como todo lo demás.
   No se guarda equipo por equipo porque el documento es uno solo. */
function guardarCatalogo(detalle){
  guardarLocal();
  encolar({ tipo:'poner', coleccion:'catalogo', id:'lista', obj:{ equipos: datos.catalogo } });
  anotar('actualizó', 'lista de precios', datos.catalogo.length + ' equipos', detalle);
}

/* La semilla se sube cuando alguien lo pide, NO sola al arrancar.

   Automático era peor: si la regla de /catalogo no está pegada, la escritura
   rebota con 403, se queda atorada en la cola, y a partir de ahí el tablero dice
   "hay cambios pendientes" para siempre y hasta estorba al cerrar sesión. Un
   botón no puede envenenar la cola de nadie sin que se haya pedido. */
function sembrarCatalogo(){
  if(!exigirAdmin('guardar la lista de precios')) return;
  if(datos.catalogo.length){ aviso('La lista ya está guardada en el servidor.'); return; }
  datos.catalogo = CATALOGO_SEMILLA.map(normalizarEquipo);
  guardarCatalogo('siembra inicial de las cotizaciones de MXGT01, MXNL02, INOAC y NGK');
  render();
  aviso('Lista de precios guardada con ' + datos.catalogo.length + ' equipos.');
}
/* ===================== VIGILANCIA DEL RESPALDO =====================
   El respaldo automático deja en sistema/respaldo la fecha de la última copia.
   Aquí se lee para poder avisar si se quedó viejo: si un día deja de correr,
   que se vea en el tablero y no solo en un correo que nadie abre.
   ================================================================== */
const DIAS_RESPALDO_VIEJO = 2;
let respaldoInfo = null;      /* {ultimo, registros, clientes, sitios} o null */

/* Hace falta aparte de respaldoInfo porque "null" era ambiguo: significaba
   tanto "todavía no se ha preguntado" como "ya se preguntó y no hay registro".
   Solo lo segundo merece aviso. Sin esta distinción el mensaje alcanzaba a
   pintarse en cada refresh —render() corre antes de que la red conteste— y al
   quitarse empujaba las tarjetas de abajo. */
let respaldoRevisado = false;

async function revisarRespaldo(){
  if(!HAY_NUBE || !haySesion()) return;
  try{
    const d = await pedirNube('/sistema/respaldo', { method:'GET' }, true);
    respaldoInfo = d && d.fields ? deCampos(d.fields) : null;
    respaldoRevisado = true;   /* solo si de verdad se pudo leer */
  }catch(e){
    /* Si no se puede leer, no se inventa nada: ni dato ni aviso. Un fallo de red
       no es lo mismo que un respaldo que no corrió. */
    respaldoInfo = null;
  }
}

/* Cuántos días tiene el último respaldo. null si no se sabe. */
function diasDesdeRespaldo(){
  if(!respaldoInfo || !respaldoInfo.ultimo) return null;
  const t = new Date(respaldoInfo.ultimo);
  if(isNaN(t)) return null;
  return Math.floor((Date.now() - t.getTime()) / 86400000);
}

/* Aviso para Owner y Admin: son los que pueden hacer algo al respecto. */
function avisoRespaldo(){
  if(!HAY_NUBE || !esAdmin()) return '';
  const dias = diasDesdeRespaldo();

  if(dias === null){
    /* Sin marca todavía: puede ser que el respaldo aún no corra con la versión
       nueva. No se alarma, solo se informa.
       Se exige respaldoRevisado y NO "respaldoInfo === null": mientras la red no
       conteste no se pinta nada. Antes se pintaba y al llegar el dato se quitaba,
       moviendo todo lo de abajo en cada refresh. */
    return respaldoRevisado
      ? '<div class="aviso" style="border-left-color:var(--gray)">' + ICONO.info
        + '<div>Todavía no hay registro del respaldo automático. Aparecerá aquí después de la próxima copia.</div></div>'
      : '';
  }
  if(dias <= DIAS_RESPALDO_VIEJO) return '';

  return '<div class="aviso" style="border-left-color:var(--error)">' + ICONO.info
       + '<div><b>El respaldo automático tiene ' + dias + ' ' + plural(dias,'día','días') + ' sin correr.</b> '
       + 'La última copia es del ' + esc(fechaHora(respaldoInfo.ultimo)) + '. '
       + 'Revisa la pestaña <b>Actions</b> del repo de respaldos, o baja un '
       + '<b>Respaldo JSON</b> ahora mismo por si acaso.</div></div>';
}

/* Sube todo lo que hay local (para la primera vez o al restaurar un respaldo).
   Filtrando por ROL: en modo local esAdmin() dice que sí a todo, así que un
   Analyst puede traer en el navegador cosas que el servidor no le va a aceptar
   —el catálogo es de Admin, y una póliza solo puede nacerle en estatus abierto—.
   Encolarlas era sembrarle 403 en la primera conexión, con el aviso culpando a
   las reglas. Se avisa qué se quedó local para que un Admin haga esa subida. */
function subirTodo(){
  datos.clientes.forEach(c => encolar({ tipo:'poner', coleccion:'clientes', id:c.id, obj:c }));
  datos.sitios.forEach(s => encolar({ tipo:'poner', coleccion:'sitios', id:s.id, obj:s }));
  /* `puedeCat` y no `admin`: ese nombre ya lo ocupa la caché del panel. */
  const puedeCat = esAdmin();
  let fuera = 0;
  datos.polizas.forEach(p => {
    if(puedeCat || ESTATUS_ABIERTOS.includes(p.estatus)){
      encolar({ tipo:'poner', coleccion:'polizas', id:p.id, obj:p });
    } else fuera++;
  });
  if(datos.catalogo.length && puedeCat){
    encolar({ tipo:'poner', coleccion:'catalogo', id:'lista', obj:{ equipos: datos.catalogo } });
  }
  if(!puedeCat && (fuera || datos.catalogo.length)){
    aviso('Se subió lo tuyo. ' + (fuera ? fuera + ' ' + plural(fuera,'póliza cerrada','pólizas cerradas') + ' ' : '')
        + (fuera && datos.catalogo.length ? 'y ' : '')
        + (datos.catalogo.length ? 'la lista de precios ' : '')
        + 'se quedaron solo en este navegador: subirlas es de un Admin.', true);
  }
}

/* ============================== BITÁCORA ==============================
   Historial de quién cambió qué. Solo los administradores lo pueden leer;
   cualquiera con acceso puede escribir en él, y nadie puede modificarlo.
   ====================================================================== */
function anotar(accion, que, nombre, detalle){
  if(!HAY_NUBE || !haySesion()) return;
  crearNube('bitacora', {
    cuando: new Date().toISOString(),
    quien: sesion.correo || '',
    uid: sesion.uid || '',
    accion: accion || '',
    que: que || '',
    nombre: nombre || '',
    detalle: detalle || ''
  }).catch(e => console.warn('No se pudo anotar en la bitácora:', e.message));
}

/* ====================== INDICADOR DE ESTADO ====================== */
function pintarEstadoNube(){
  const p = $('estadoNube');
  if(!p) return;
  if(!HAY_NUBE){
    p.className = 'pastilla n-local';
    p.innerHTML = '<span class="punto p-neutro"></span><span class="txt">Solo en esta compu</span>';
    p.title = 'La información se guarda únicamente en este navegador. Configura Firebase para compartirla.';
    return;
  }
  if(!haySesion()){
    p.className = 'pastilla n-local';
    p.innerHTML = '<span class="punto p-neutro"></span><span class="txt">Sin sesión</span>';
    return;
  }
  if(cola.length){
    const err = intentosFallidos > 0;
    p.className = 'pastilla ' + (err ? 'n-error' : 'n-trabajo');
    p.innerHTML = '<span class="punto ' + (err ? 'p-error' : 'p-alerta') + '"></span><span class="txt">'
                + (err ? 'Sin conexión · ' + cola.length + ' por guardar' : 'Guardando…') + '</span>';
    p.title = err
      ? 'No se pudo llegar al servidor. Los cambios están guardados aquí y se suben solos cuando vuelva el internet.'
      : 'Subiendo cambios al servidor.';
    return;
  }
  p.className = 'pastilla n-ok';
  p.innerHTML = '<span class="punto p-ok"></span><span class="txt">Guardado en la nube</span>';
  p.title = 'Todo está guardado en el servidor.';
}

/* Rellena valores faltantes para que un sitio viejo o importado no rompa la vista. */
function normalizarSitio(s){
  const meses = Math.max(1, Math.min(MAX_MESES, parseInt(s.meses,10) || 12));
  const pagos = Array.from({length:meses}, (_,i)=> !!(Array.isArray(s.pagos) && s.pagos[i]));
  /* Un renglón por mensualidad con su OC y quién la capturó. Va en paralelo a
     "pagos" para no romper los sitios que se capturaron antes de esta versión. */
  const pagosDetalle = Array.from({length:meses}, (_,i)=>{
    const d = (Array.isArray(s.pagosDetalle) && s.pagosDetalle[i]) || null;
    return {
      oc:     d && d.oc     ? String(d.oc)     : '',
      quien:  d && d.quien  ? String(d.quien)  : '',
      cuando: d && d.cuando ? String(d.cuando) : '',
      facturado: !!(d && d.facturado)
    };
  });
  /* Quién nos manda la OC de este sitio. Puede haber más de una persona. */
  const contactos = (Array.isArray(s.contactos) ? s.contactos : []).map(x=>({
    nombre:   x && x.nombre   ? String(x.nombre)   : '',
    puesto:   x && x.puesto   ? String(x.puesto)   : '',
    correo:   x && x.correo   ? String(x.correo)   : '',
    telefono: x && x.telefono ? String(x.telefono) : '',
    notas:    x && x.notas    ? String(x.notas)    : ''
  })).filter(x => x.nombre || x.puesto || x.correo || x.telefono || x.notas);

  /* Quién de nuestro equipo tiene el sitio a su cargo. */
  const e = s.encargado || {};
  const encargado = {
    uid:    e.uid    ? String(e.uid)    : '',
    nombre: e.nombre ? String(e.nombre) : '',
    correo: e.correo ? String(e.correo) : ''
  };

  return {
    pagosDetalle, contactos, encargado,
    id: s.id || nuevoId(),
    clienteId: s.clienteId || '',
    nombre: s.nombre || 'Sitio',
    zona: (s.zona || '').trim(),
    color: IDS_COLOR.includes(s.color) ? s.color : 'azul',
    estado: ['activo','pausado','baja'].includes(s.estado) ? s.estado : 'activo',
    tipo: s.tipo === 'sw' ? 'sw' : 'hw',
    modulos: Math.max(0, parseInt(s.modulos,10) || 0),
    mensualidad: Math.max(0, Number(s.mensualidad) || 0),
    incViaticos: !!s.incViaticos,
    viaticos: Math.max(0, Number(s.viaticos) || 0),
    incOnboarding: !!s.incOnboarding,
    onboarding: Math.max(0, Number(s.onboarding) || 0),
    fechaInicio: /^\d{4}-\d{2}-\d{2}$/.test(s.fechaInicio||'') ? s.fechaInicio : hoyISO(),
    meses, pagos,
    notas: s.notas || ''
  };
}

/* Rellena valores faltantes para que una póliza vieja o importada no rompa la
   vista. Igual que normalizarSitio, ESTA función es el contrato de datos: el
   proyecto no tiene TypeScript, así que un campo que no esté aquí no existe.
   Todo campo nuevo se agrega aquí primero y después en el formulario.

   Tiene que ser IDEMPOTENTE: normalizar dos veces debe dar exactamente lo mismo,
   llave por llave y tipo por tipo. No es cosmético — la regla de Firestore que
   congela los precios compara `request.resource.data.partidas` contra
   `resource.data.partidas`, y si al releer se reordena algo o cambia un tipo, la
   comparación falla y un analyst no puede ni capturar una OC. Sale un 403 sin
   explicación. Por eso las llaves se emiten siempre en el mismo orden. */
function normalizarPoliza(p){
  /* Cobranza: UNA casilla si se factura al año, doce si es mensual. Se deriva de
     "facturacion" y no se guarda un contador aparte — dos datos que dicen lo
     mismo acaban desincronizados, que es lo que ya nos pasó con respaldoInfo. */
  const facturacion = p.facturacion === 'mensual' ? 'mensual' : 'anual';
  const nCobros = facturacion === 'mensual' ? MESES_POLIZA : 1;
  const cobros = Array.from({length:nCobros}, (_,i)=> !!(Array.isArray(p.cobros) && p.cobros[i]));
  /* Mismo molde que pagosDetalle. Se llama distinto a propósito: si se llamara
     "pagos", pasarle una póliza a calcular() no tronaría — devolvería un
     semáforo verde sobre NaN. Con este nombre truena en la primera línea. */
  const cobrosDetalle = Array.from({length:nCobros}, (_,i)=>{
    const d = (Array.isArray(p.cobrosDetalle) && p.cobrosDetalle[i]) || null;
    return {
      oc:     d && d.oc     ? String(d.oc)     : '',
      quien:  d && d.quien  ? String(d.quien)  : '',
      cuando: d && d.cuando ? String(d.cuando) : '',
      facturado: !!(d && d.facturado)
    };
  });

  /* Quién cotizó. Se guarda COPIADO, no por referencia al usuario: el documento
     impreso lleva su nombre y su celular, y tiene que seguir diciendo lo mismo
     dentro de un año aunque esa persona ya no esté en el equipo. Mismo molde que
     el encargado del sitio, más el teléfono, que es lo que se imprime. */
  const v = p.vendedor || {};
  const vendedor = {
    uid:      v.uid      ? String(v.uid)      : '',
    nombre:   v.nombre   ? String(v.nombre)   : '',
    correo:   v.correo   ? String(v.correo)   : '',
    telefono: v.telefono ? String(v.telefono) : ''
  };

  /* Un renglón sin concepto es basura de una captura a medias: se tira. Se
     normaliza TODO primero y se filtra después, para que los índices sigan
     alineados con p.partidas mientras se sube el formato viejo — filtrar antes
     recorría el arreglo y el historial acababa en el renglón equivocado. */
  const partidasCrudas = (Array.isArray(p.partidas) ? p.partidas : []);
  const todas = partidasCrudas.map(normalizarPartida);
  const partidas = todas.filter(x => x.concepto);

  /* Lo ejecutado: {"<idPartida>": {"<mes>": {cuando, quien, nota}}}.

     Vive AQUÍ ARRIBA y no adentro de cada partida, y no es cosmético: la regla
     de Firestore congela `partidas` en cuanto la póliza deja de ser cotización
     —exige que salga idéntica a como entró—, así que un registro de servicio
     guardado adentro haría que un Analyst NO pudiera marcar un mantenimiento en
     una póliza activa. O sea, justo en el único momento en que se marcan. Un
     403 sin explicación, en manos de quien más lo necesita. Es exactamente por
     lo que la cobranza vive en `cobrosDetalle`, arriba: la simetría era la pista.

     Se llavea por el ID de la partida y por el MES, nunca por posiciones. Con el
     mes ya nos pasó: cuando esto era un arreglo paralelo a mesesServicio, meter
     un equipo y pasar de [0,4,8] a [0,2,4,8] recorría el registro del mes 4 al
     mes 2, sin error y sin aviso. Con el id de la partida es la misma trampa un
     nivel más arriba: duplicar o borrar un renglón recorrería todo lo demás.

     Un mes que ya NO está en el calendario no se borra si el servicio de verdad
     se hizo: significa que se retiró un equipo después de haberle dado
     mantenimiento, y borrarlo sería negar trabajo hecho y cobrado. La vista lo
     marca aparte — ver serviciosFueraDeCalendario().

     Las llaves se emiten ordenadas —los ids alfabéticamente, los meses por
     número, no alfabéticamente, donde "10" < "2"— para que el objeto salga
     siempre igual. De eso depende que normalizar sea idempotente. */
  const vivas = new Set(partidas.map(x => x.id));
  /* Copia, NO la referencia: abajo se le escribe al subir el formato viejo, y
     hacerlo sobre p.hechos le metería mano al objeto que nos pasaron. Normalizar
     lee y devuelve; no debe modificar su entrada. */
  const crudos = Object.assign({},
    (p.hechos && typeof p.hechos === 'object' && !Array.isArray(p.hechos)) ? p.hechos : {});
  /* Formato viejo: hechosDetalle adentro de cada partida. Se sube solo. Lo que
     ya esté arriba gana, por si el documento trae los dos. */
  partidasCrudas.forEach((cruda, i)=>{
    const viejo = cruda && cruda.hechosDetalle;
    if(!viejo || typeof viejo !== 'object' || Array.isArray(viejo)) return;
    const id = todas[i] && todas[i].id;
    if(!id || !vivas.has(id)) return;
    crudos[id] = Object.assign({}, viejo, crudos[id] || {});
  });

  /* Para acotar `hechas` contra el tamaño real del renglón. */
  const cantidadDe = new Map(partidas.map(x => [x.id, x.cantidad]));

  const hechos = {};
  Object.keys(crudos).filter(id => vivas.has(id)).sort().forEach(id=>{
    const porMes = crudos[id];
    if(!porMes || typeof porMes !== 'object' || Array.isArray(porMes)) return;
    const limpio = {};
    Object.keys(porMes).map(Number).filter(m => Number.isInteger(m) && m >= 0 && m < MESES_POLIZA)
      .sort((a,b)=> a - b)
      .forEach(m=>{
        const d = porMes[String(m)];
        /* Sin fecha no hubo servicio: es una casilla que alguien abrió y no
           llenó. Se tira para que no se acumule basura invisible. */
        if(!d || !d.cuando) return;
        /* `hechas`: cuántas unidades del renglón se atendieron ese mes. Las
           unidades de un renglón consolidado son intercambiables —tres Rational
           idénticos—, así que lo que se guarda es el CUÁNTAS, no cuáles. Se
           materializa SIEMPRE (los registros viejos no la traían: significaban
           "todas") para que normalizar sea idempotente, y se acota a
           [1, cantidad]: cero hechas no es un servicio, es no marcar el mes.
           `motivo` es el porqué de las que faltaron: solo existe cuando faltó
           alguna — completo, el porqué no significa nada. */
        const tope = cantidadDe.get(id) || 1;
        const n = parseInt(d.hechas, 10);
        const hechas = Math.max(1, Math.min(tope, (Number.isInteger(n) && n > 0) ? n : tope));
        const reg = {
          cuando: String(d.cuando),
          quien:  d.quien ? String(d.quien) : '',
          nota:   d.nota  ? String(d.nota)  : '',
          hechas
        };
        if(hechas < tope && d.motivo) reg.motivo = String(d.motivo);
        limpio[String(m)] = reg;
      });
    /* Un renglón sin nada hecho no deja llave vacía colgando. */
    if(Object.keys(limpio).length) hechos[id] = limpio;
  });

  return {
    partidas, hechos, cobros, cobrosDetalle, vendedor,
    id: p.id || nuevoId(),
    clienteId: p.clienteId || '',
    /* El sitio es OPCIONAL: hay pólizas en cafeterías sin kiosco Forpass. El
       nombre en cambio nunca falta, porque es lo que sale impreso y tiene que
       sobrevivir aunque ese sitio no exista en el módulo de Forpass o se borre. */
    sitioId: p.sitioId || '',
    sitioNombre: (p.sitioNombre || '').trim(),
    folio: (p.folio || '').trim(),
    estatus: ESTATUS_POLIZA.includes(p.estatus) ? p.estatus : 'cotizacion',
    facturacion,
    /* Descuento comercial, en PORCENTAJE, a nivel de la póliza y NUNCA dentro
       de un renglón: los precios siguen siendo precios. Es lo único que se
       guarda del descuento — el monto y el total se derivan siempre, como todo
       lo demás. Guardar el monto sería exactamente el error de MXGT01, donde el
       5% vivía enterrado en los totales y por eso el papel dejó de cuadrar.
       Se acota a [0, 100] y a dos decimales: un 5.125% no existe en una
       negociación y sí produce centavos que nadie puede reproducir a mano. */
    descuento: Math.max(0, Math.min(100,
      Math.round((parseFloat(p.descuento) || 0) * 100) / 100)),
    /* La que sale en la portada del documento. */
    fechaCotizacion: /^\d{4}-\d{2}-\d{2}$/.test(p.fechaCotizacion||'') ? p.fechaCotizacion : hoyISO(),
    /* Cuándo se mandó al cliente. De aquí sale "cuántos días lleva esperando",
       que es el número comercial que de verdad se mira. */
    fechaEnvio:  /^\d{4}-\d{2}-\d{2}$/.test(p.fechaEnvio||'')  ? p.fechaEnvio  : '',
    /* Arranque de la vigencia. Manda también el calendario: los meses de
       servicio son corrimientos DESDE AQUÍ, no meses del año, así que mover esta
       fecha mueve el calendario completo sin tocar ni una partida. */
    fechaInicio: /^\d{4}-\d{2}-\d{2}$/.test(p.fechaInicio||'') ? p.fechaInicio : hoyISO(),
    /* Cuándo aceptó el cliente. Vacía mientras siga siendo cotización; con fecha
       significa que los precios ya quedaron congelados. */
    fechaCierre: /^\d{4}-\d{2}-\d{2}$/.test(p.fechaCierre||'') ? p.fechaCierre : '',
    notas: p.notas || ''
  };
}

/* Un renglón de la cotización.

   El total NUNCA se guarda: se calcula con precioUnitario × cantidad ×
   frecuencia. Si se guardara volveríamos exactamente al problema que nos trajo
   aquí — cotizaciones con totales tecleados que dejaron de cuadrar, una con
   cantidades escondidas sin columna y otra con un factor que nadie documentó.
   Tampoco hay campo de descuento: un ajuste se refleja en el precioUnitario. */
function normalizarPartida(x){
  /* CUÁNTOS mantenimientos al año. En QUÉ meses es mesesServicio, aparte.
     A propósito NO se fuerza que frecuencia === mesesServicio.length: si no
     cuadran lo tiene que avisar el formulario con aria-invalid + aviso(). Si se
     "arreglara" aquí en silencio, nadie sabría que capturó 3 con 2 meses
     marcados. Ver cuadraFrecuencia(). */
  const frecuencia = Math.max(1, Math.min(MESES_POLIZA, parseInt(x.frecuencia,10) || 1));

  /* Corrimientos 0..11 desde el inicio de la vigencia, ordenados y sin
     repetidos. Ordenar aquí es parte de la idempotencia: si el formulario los
     entrega en otro orden, el documento igual queda siempre igual. */
  const mesesServicio = [...new Set(
      (Array.isArray(x.mesesServicio) ? x.mesesServicio : [])
        .map(m => parseInt(m, 10))
        .filter(m => Number.isInteger(m) && m >= 0 && m < MESES_POLIZA)
    )].sort((a,b)=> a - b);

  return {
    mesesServicio,
    /* Identidad estable del renglón. NO es adorno: lo ejecutado se guarda
       llaveado por este id (ver `hechos` en normalizarPoliza), y sin él habría
       que llavear por la posición en el arreglo — que se recorre en cuanto
       alguien duplica o borra un renglón. Es la misma lección que ya nos costó
       una vez con los meses: llavear por el dato, nunca por la posición. */
    id: (x.id || '').trim() || nuevoId(),
    concepto: (x.concepto || '').trim(),
    marca: (x.marca || '').trim(),
    /* Llave del catálogo, para rellenar la descripción sin guardarla. */
    catalogoId: (x.catalogoId || '').trim(),
    /* Solo se guarda si alguien la editó a mano. Vacía = se usa la del catálogo. */
    descripcion: (x.descripcion || '').trim(),
    cantidad: Math.max(1, parseInt(x.cantidad,10) || 1),
    /* Al centavo. Un precio con más decimales no se puede facturar, y además
       rompería la promesa de que la suma de las casillas de cobro da el anual
       exacto: si el precio trae milésimas, el anual las trae y el reparto en
       centavos ya no le cuadra. Redondear aquí es idempotente. */
    precioUnitario: Math.max(0, Math.round((Number(x.precioUnitario) || 0) * 100) / 100),
    frecuencia
  };
}

/* ============================ FECHAS Y FORMATOS ============================ */
/* Se trabaja con textos 'AAAA-MM-DD' para no pelear con zonas horarias. */
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function partes(iso){ const [a,m,d] = iso.split('-').map(Number); return {a,m,d}; }
function aUTC(iso){ const p = partes(iso); return Date.UTC(p.a, p.m-1, p.d); }
function sumarMeses(iso, n){
  const p = partes(iso);
  const total = (p.m - 1) + n;
  const a = p.a + Math.floor(total/12);
  const m = ((total % 12) + 12) % 12;              /* 0..11 */
  const ultimo = new Date(Date.UTC(a, m+1, 0)).getUTCDate();   /* días del mes destino */
  const d = Math.min(p.d, ultimo);                 /* 31 de enero + 1 mes = 28/29 de febrero */
  return a + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}
function diasEntre(isoA, isoB){ return Math.round((aUTC(isoB) - aUTC(isoA)) / 86400000); }
/* Meses completos transcurridos entre dos fechas (como DATEDIF "m" de Excel). */
function mesesTranscurridos(isoIni, isoFin){
  const a = partes(isoIni), b = partes(isoFin);
  let m = (b.a - a.a) * 12 + (b.m - a.m);
  if(b.d < a.d) m--;
  return m;
}
function fmtFecha(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||'')) return '—';
  const p = partes(iso);
  const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return String(p.d).padStart(2,'0') + ' ' + MES[p.m-1] + ' ' + p.a;
}
function dinero(n){ return '$' + Math.round(Number(n)||0).toLocaleString('en-US'); }
function numero(n){ return (Number(n)||0).toLocaleString('en-US'); }
function plural(n, uno, muchos){ return n === 1 ? uno : muchos; }
/* Serial de fecha de Excel (1899-12-30 = 0). */
function serialExcel(iso){ return Math.round((aUTC(iso) - Date.UTC(1899,11,30)) / 86400000); }

/* La fecha LOCAL de un timestamp de captura. Los `cuando` de pagosDetalle se
   guardan con toISOString(), que es UTC: recortarles los primeros diez
   caracteres da la fecha de Londres, no la de Monterrey (UTC−6) — un pago
   capturado en la tarde-noche salía en el Excel fechado al día siguiente,
   distinto de lo que la pantalla enseña con fechaHora(). Aquí sí se usa `Date`,
   pero solo para CONVERTIR a hora local, no para aritmética de meses. */
function fechaLocalISO(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* ========================== CÁLCULOS DEL SITIO ========================== */
/* Un solo lugar donde se decide todo lo que la tarjeta y el Excel muestran. */
function calcular(s){
  const hoy = hoyISO();
  const fin = sumarMeses(s.fechaInicio, s.meses);           /* vigencia */
  const pagados = s.pagos.filter(Boolean).length;
  const pendientes = s.meses - pagados;

  /* Mensualidades que ya debieron pagarse: una al inicio y una por mes cumplido. */
  let debidas = 0;
  if(diasEntre(s.fechaInicio, hoy) >= 0) debidas = Math.min(s.meses, mesesTranscurridos(s.fechaInicio, hoy) + 1);

  const atrasadas = Math.max(0, debidas - pagados);
  /* La siguiente mensualidad es la primera sin pagar (mes 1 = fecha de inicio). */
  const iSig = s.pagos.findIndex(p => !p);
  const proximo = iSig === -1 ? null : sumarMeses(s.fechaInicio, iSig);
  const diasRest = proximo ? diasEntre(hoy, proximo) : null;

  const vigente = diasEntre(hoy, fin) >= 0;
  const suscripcion = vigente ? 'Activa' : 'Terminó';
  const diasVigencia = diasEntre(hoy, fin);

  /* Semáforo */
  let estatus, tono;
  if(s.estado === 'baja'){ estatus = 'Baja'; tono = 'neutro'; }
  else if(s.estado === 'pausado'){ estatus = 'Pausado'; tono = 'neutro'; }
  else if(atrasadas > 0){ estatus = 'Atrasado'; tono = 'error'; }
  else if(pendientes === 0){ estatus = 'Contrato cubierto'; tono = 'ok'; }
  else if(diasRest !== null && diasRest <= 7){ estatus = 'Por pagar'; tono = 'alerta'; }
  else{ estatus = 'Al día'; tono = 'ok'; }

  const activo = s.estado === 'activo' && vigente;
  const forpassActivos = activo ? s.modulos : 0;

  /* Los viáticos y el onboarding se cobran UNA sola vez, en el pago 1.
     De la mensualidad 2 en adelante es la renta normal. */
  const extras = (s.incViaticos ? s.viaticos : 0) + (s.incOnboarding ? s.onboarding : 0);
  const montos = Array.from({length:s.meses}, (_,i)=> s.mensualidad + (i === 0 ? extras : 0));
  const primerPago = montos[0];
  const valorContrato = s.mensualidad * s.meses + extras;
  const cobrado = s.pagos.reduce((t,p,i)=> t + (p ? montos[i] : 0), 0);

  /* Dinero vencido: solo las mensualidades que ya debieron pagarse y no están pagadas. */
  let adeudo = 0;
  for(let i = 0; i < debidas; i++) if(!s.pagos[i]) adeudo += montos[i];

  return { hoy, fin, pagados, pendientes, debidas, atrasadas, proximo, diasRest,
           vigente, suscripcion, diasVigencia, estatus, tono, activo, forpassActivos,
           extras, montos, primerPago, valorContrato, cobrado, adeudo };
}

const ETIQUETA_TIPO = { hw:'Software + Hardware', sw:'Solo Software' };
const ETIQUETA_ESTADO = { activo:'Activo', pausado:'Pausado', baja:'Baja' };

function sitiosDe(clienteId){ return datos.sitios.filter(s => s.clienteId === clienteId); }
function polizasDeCliente(id){ return datos.polizas.filter(q => q.clienteId === id); }

/* La colección de clientes es UNA sola —así una empresa con kioscos Y pólizas es
   un solo registro—, pero cada módulo lista solo los que le tocan: un cliente que
   existe nada más porque se le cotizó una póliza no tiene por qué ensuciar la
   lista de Forpass con "0 sitios".

   El que no tiene NADA sí aparece en Forpass: ahí es donde se crean, y esconderlo
   mientras le capturas el primer sitio sería peor. */
function clientesDeForpass(){
  /* Con kioscos CAPTURADOS siempre entra: esconder un cliente con sitios
     dejaría sus sitios inalcanzables, así que el dato le gana a la casilla.
     Sin sitios manda la casilla de su ficha; y si es un cliente de antes de la
     casilla (''), se decide como siempre: entra mientras no tenga pólizas. */
  return datos.clientes.filter(c =>
    sitiosDe(c.id).length
    || c.usaForpass === 'si'
    || (c.usaForpass === '' && !polizasDeCliente(c.id).length));
}
function clientePorId(id){ return datos.clientes.find(c => c.id === id); }
function sitioPorId(id){ return datos.sitios.find(s => s.id === id); }

/* Suma de un conjunto de sitios, para los indicadores de arriba. */
function resumir(sitios){
  const r = { sitios:sitios.length, sitiosActivos:0, forpass:0, mrr:0, atrasados:0, porPagar:0, porVencer:0, mensualidadesAtrasadas:0, adeudo:0,
              pausados:0, bajas:0, cubiertos:0 };
  sitios.forEach(s=>{
    const c = calcular(s);
    if(c.activo){ r.sitiosActivos++; r.forpass += s.modulos; r.mrr += s.mensualidad; }
    if(c.tono === 'error'){ r.atrasados++; r.mensualidadesAtrasadas += c.atrasadas; r.adeudo += c.adeudo; }
    else if(c.estatus === 'Por pagar') r.porPagar++;
    if(c.activo && c.diasVigencia >= 0 && c.diasVigencia <= 45) r.porVencer++;
    /* Estos tres hacen falta para que la tarjeta los distinga. Sin ellos, un
       sitio pausado y un contrato que ya se pagó completo se veían idénticos:
       los dos como "0 Forpass activos · $0 · 0 de 1", que son situaciones
       opuestas. */
    if(s.estado === 'pausado') r.pausados++;
    else if(s.estado === 'baja') r.bajas++;
    else if(c.estatus === 'Contrato cubierto') r.cubiertos++;
  });
  return r;
}

/* ======================= CÁLCULOS DE LA PÓLIZA =======================
   Función APARTE de calcular(). No comparten nada y no deben: una póliza no
   tiene mensualidad ni módulos, y un sitio no tiene partidas. Mezclarlas
   habría dado semáforos verdes sobre NaN.
   ==================================================================== */

/* LA regla de oro, en un solo lugar. El total de un renglón jamás se captura.
   Está aquí y nada más aquí para que no pueda haber dos versiones. */
const totalRenglon = x => x.precioUnitario * x.cantidad * x.frecuencia;

/* ---------------------------- Centavos ----------------------------
   El dinero de las pólizas se reparte en CENTAVOS ENTEROS, no en pesos con
   decimales flotantes.

   Por qué: 683,134 ÷ 12 = 56,927.8333… Si cada casilla guardara ese número y se
   mostrara redondeado, doce casillas de $56,927.83 sumarían $683,133.96 — cuatro
   centavos menos que el anual. Y si se mostrara en pesos cerrados, doce de
   $56,928 darían $683,136: dos pesos DE MÁS. Es exactamente el "los totales no
   cuadran" que este módulo existe para matar, nada más que en chiquito y
   acumulándose casilla por casilla.

   La regla: se reparte en enteros de centavo y el residuo se le carga a la
   ÚLTIMA casilla. Así la suma da el anual al centavo, siempre. Se escoge la
   última y no la primera porque la primera es la que se negocia y se cita; unos
   centavos en el mes 12 no los mira nadie. */
const aCentavos  = n => Math.round((Number(n) || 0) * 100);
const deCentavos = c => c / 100;

/* Igual que dinero(), pero con centavos siempre. Las mensualidades de póliza
   casi nunca son redondas, y el documento impreso también las trae con dos
   decimales. dinero() se queda como está: es el de Forpass. */
function dineroCent(n){
  return '$' + (Number(n) || 0).toLocaleString('en-US',
    { minimumFractionDigits:2, maximumFractionDigits:2 });
}

/* Reparte un total en n casillas de centavos enteros. La suma de lo que
   devuelve es SIEMPRE exactamente el total: es la única forma de que la
   cobranza cuadre contra el precio anual. */
function repartirCentavos(totalCent, n){
  if(n <= 0) return [];
  const cuota = Math.floor(totalCent / n);
  const partes = Array.from({length:n}, ()=> cuota);
  partes[n - 1] += totalCent - cuota * n;   /* el residuo, a la última */
  return partes;
}

/* Lo ejecutado de UN renglón. Todos pasan por aquí para que el resto del código
   no tenga que saber que `hechos` vive en la póliza y no en la partida. */
const hechosDe = (p, x) => (p.hechos && p.hechos[x.id]) || {};
/* El segurista es una PERSONA supervisando, no un equipo: no se le "da
   mantenimiento" ni lleva palomita. Se detecta por el concepto y no por una
   bandera en la partida A PROPÓSITO: `partidas` está congelada por la regla del
   servidor en las pólizas vivas, así que agregarle un campo dejaría a un
   Analyst sin poder guardar nada en una activa. Su dinero no se toca — sigue
   siendo un renglón cotizado; lo que cambia es que no cuenta como servicio
   pendiente y el calendario lo anuncia como «Incluye segurista». */
const esSegurista = x => /segurist/i.test(x.concepto || '');

const servicioHecho = (p, x, mes) => !!hechosDe(p, x)[String(mes)];
const servicioDetalle = (p, x, mes) => hechosDe(p, x)[String(mes)] || null;
const serviciosHechos = (p, x) => x.mesesServicio.filter(m => servicioHecho(p, x, m)).length;
/* Servicios reales en meses que ya salieron del calendario: la huella de un
   equipo que se retiró a media vigencia después de habérsele dado servicio. */
function serviciosFueraDeCalendario(p, x){
  return Object.keys(hechosDe(p, x)).map(Number)
    .filter(m => !x.mesesServicio.includes(m)).sort((a,b)=> a - b);
}
/* Escribe o borra un servicio, dejando `hechos` sin llaves vacías colgando.
   Un solo lugar que lo toca, para no repetir el cuidado en cada quien. */
function marcarServicio(p, partidaId, mes, det){
  if(!p.hechos) p.hechos = {};
  if(det){
    if(!p.hechos[partidaId]) p.hechos[partidaId] = {};
    p.hechos[partidaId][String(mes)] = det;
  }else if(p.hechos[partidaId]){
    delete p.hechos[partidaId][String(mes)];
    if(!Object.keys(p.hechos[partidaId]).length) delete p.hechos[partidaId];
  }
}
/* Se avisa, no se bloquea: una cotización a medias se puede guardar, pero no
   cerrarse como activa. */
const cuadraFrecuencia = x => x.mesesServicio.length === x.frecuencia;

/* Cuántos caracteres de concepto caben en la columna del documento impreso.
   Calibrado el 18-ago-2026 MIDIENDO lo dibujado, después de fijar la geometría
   de la tabla —no antes, porque el ancho de la columna es lo que manda—: la
   columna mide 126.6 pt a 7.2 pt de Poppins, y el concepto más ancho de las
   cuatro cotizaciones reales, «Barra caliente de servicio eléctrica», ocupa
   124.3 pt con 36 caracteres. O sea que 36 cabe con 2.3 pt de sobra y 37 ya es
   territorio de nadie.

   Es un PROXY y se avisa como tal: el ancho depende de las letras, no de
   cuántas son —treinta y siete «i» caben y treinta y cinco «W» no—. Medir de
   verdad pediría las métricas de Poppins dentro de la app, que usa Manrope. Y no
   hace falta que sea exacto porque el documento no se rompe si falla: el
   concepto ENVUELVE y el renglón crece, que se ve, y de la paginación se encarga
   evitarTraslapeConPie(). Esto solo sirve para que casi nunca pase. */
const CHARS_CONCEPTO_IMPRESO = 36;
const conceptoCabeImpreso = x => (x.concepto || '').trim().length <= CHARS_CONCEPTO_IMPRESO;

/* ---------------------- Los meses se calculan, no se pican ----------------------
   En las cotizaciones reales la frecuencia manda el intervalo: 3 servicios al año
   es cada 4 meses, 2 es cada 6, 12 es todos, 1 es una vez. Así que con la
   frecuencia y el MES DE ARRANQUE los meses salen solos.

   Sin esto, capturar MXNL02 eran 102 clics —tres casillas de doce por cada uno de
   34 renglones—. Con esto es escoger un mes por renglón.
   ------------------------------------------------------------------------------ */
/* Los meses que le tocan a un renglón que arranca en "arranque".

   El reparto es parejo SIN exigir intervalo entero. La primera versión hacía
   `intervalo = 12 / frecuencia`, y eso solo funciona con los divisores de 12
   (1, 2, 3, 4, 6, 12). Con frecuencia 5 daba 2.4, al redondear salían meses
   repetidos, el Set los colapsaba y el renglón quedaba con 4 meses en vez de 5 —
   marcado en rojo por no cuadrar con su propia frecuencia.

   Con `round(i * 12 / frecuencia)` salen siempre "frecuencia" meses distintos, y
   para los divisores da exactamente lo mismo que la fórmula vieja. */
function mesesRegulares(arranque, frecuencia){
  const f = Math.max(1, Math.min(MESES_POLIZA, parseInt(frecuencia,10) || 1));
  const a = ((parseInt(arranque,10) || 0) % MESES_POLIZA + MESES_POLIZA) % MESES_POLIZA;
  const m = [];
  for(let i = 0; i < f; i++) m.push((a + Math.round(i * MESES_POLIZA / f)) % MESES_POLIZA);
  return [...new Set(m)].sort((x,y)=> x - y);
}

/* Los arranques que dan calendarios DISTINTOS. Con frecuencia 3 son 4 y no 12,
   porque arrancar en el mes 0 y en el 4 dan el mismo [0,4,8]. Con frecuencia 5
   son los 12, porque el patrón no se repite antes. Se calcula en vez de
   derivarse de una división: así vale para cualquier frecuencia. */
function arranquesDe(frecuencia){
  const vistos = new Set(), salida = [];
  for(let a = 0; a < MESES_POLIZA; a++){
    const llave = JSON.stringify(mesesRegulares(a, frecuencia));
    if(vistos.has(llave)) continue;
    vistos.add(llave); salida.push(a);
  }
  return salida;
}

/* En qué mes arranca un renglón, deducido de sus meses. null = a mano.

   Se DEDUCE en vez de guardarse: un campo más sería un dato que se puede
   desincronizar de los meses reales, y los meses son los que alimentan el
   calendario y el seguimiento. */
function mesArranqueDe(x){
  const suyos = JSON.stringify(x.mesesServicio);
  for(const a of arranquesDe(x.frecuencia)){
    if(JSON.stringify(mesesRegulares(a, x.frecuencia)) === suyos) return a;
  }
  return null;
}

function calcularPoliza(p){
  const hoy = hoyISO();
  const fin = sumarMeses(p.fechaInicio, MESES_POLIZA);

  const totales = p.partidas.map(totalRenglon);
  /* El SUBTOTAL es la suma de los renglones, sin tocar. El descuento se aplica
     UNA vez, aquí, sobre el total — nunca repartido entre los equipos, que es
     como se vuelve invisible. Se redondea a centavos enteros para que el
     documento y la cobranza partan del mismo número exacto. */
  const subtotal = totales.reduce((t,n)=> t + n, 0);
  const subtotalCent = aCentavos(subtotal);
  const descuento = p.descuento || 0;
  const descuentoCent = descuento ? Math.round(subtotalCent * descuento / 100) : 0;
  const precioAnualCent = subtotalCent - descuentoCent;
  const precioAnual = deCentavos(precioAnualCent);
  /* Entre 12 fijo, no entre una variable: la póliza es anual por contrato.
     Este es el mensual NOMINAL, el que se imprime en el documento. Ojo: por
     doce no siempre da el anual —683,134 ÷ 12 son 56,927.83 y por doce son
     683,133.96—. El calendario de cobro real vive en montos[], que sí cuadra
     al centavo. Un solo número mensual nunca puede cuadrar; doce casillas sí. */
  const cuotaCent = Math.floor(precioAnualCent / MESES_POLIZA);
  const precioMensual = deCentavos(cuotaCent);

  const arranco = diasEntre(p.fechaInicio, hoy) >= 0;
  const mesesCumplidos = arranco ? mesesTranscurridos(p.fechaInicio, hoy) : 0;
  const mesActual = arranco ? Math.min(mesesCumplidos, MESES_POLIZA - 1) : -1;

  /* Cobranza. Una casilla al año o doce mensuales; el monto se deriva, nunca
     se guarda, igual que los montos[] de calcular(). */
  const nCobros = p.cobros.length;
  /* Se reparte en centavos enteros para que la suma de las casillas dé
     EXACTAMENTE el precio anual. Con facturación anual es una sola casilla y el
     reparto es trivial; con mensual son doce y la última se lleva el residuo. */
  const montosCent = repartirCentavos(precioAnualCent, nCobros);
  const montos = montosCent.map(deCentavos);
  const cobrados = p.cobros.filter(Boolean).length;
  const debidos = arranco ? Math.min(nCobros, mesesCumplidos + 1) : 0;
  const cobrosAtrasados = Math.max(0, debidos - cobrados);
  /* Las sumas también en centavos: doce sumas de flotantes con decimales
     terminan en 683,133.9999999999 y eso se vería como un peso faltante. */
  let adeudoCent = 0;
  for(let i = 0; i < debidos; i++) if(!p.cobros[i]) adeudoCent += montosCent[i];
  const cobradoCent = p.cobros.reduce((t,c,i)=> t + (c ? montosCent[i] : 0), 0);
  const adeudo  = deCentavos(adeudoCent);
  const cobrado = deCentavos(cobradoCent);
  const iSigCobro = p.cobros.findIndex(c => !c);
  const proximoCobro = iSigCobro === -1 ? null
    : (p.facturacion === 'mensual' ? sumarMeses(p.fechaInicio, iSigCobro) : p.fechaInicio);

  /* Ejecución. Un servicio está atrasado cuando su mes ya se cumplió completo y
     nadie lo marcó; el del mes en curso todavía no lo está, solo "toca". */
  let programados = 0, hechos = 0, atrasados = 0, tocanEsteMes = 0, huerfanos = 0;
  p.partidas.forEach(x=>{
    /* El segurista no entra al seguimiento: es presencia, no mantenimiento.
       Sin esto, sus meses contarían como "atrasados" para siempre y la póliza
       viviría en rojo. Su dinero ya quedó sumado arriba, en totales. */
    if(esSegurista(x)) return;
    programados += x.mesesServicio.length;
    hechos      += serviciosHechos(p, x);
    huerfanos   += serviciosFueraDeCalendario(p, x).length;
    x.mesesServicio.forEach(m=>{
      if(servicioHecho(p, x, m)) return;
      if(m < mesesCumplidos) atrasados++;
      else if(m === mesActual) tocanEsteMes++;
    });
  });
  const pendientes = programados - hechos;

  const vigente = diasEntre(hoy, fin) >= 0;
  const diasVigencia = diasEntre(hoy, fin);
  /* Cuántos días lleva en la calle sin respuesta. */
  const diasEsperando = p.fechaEnvio ? diasEntre(p.fechaEnvio, hoy) : null;
  const noCuadran = p.partidas.filter(x => !cuadraFrecuencia(x)).length;
  /* Una póliza vacía o con renglones chuecos no se puede cerrar como activa. */
  const cerrable = p.partidas.length > 0 && noCuadran === 0;

  /* Semáforo. Los estatus que no son 'activa' hablan por sí solos; solo una
     póliza viva se juzga por servicios, cobranza y vigencia. */
  let estado, tono;
  if(p.estatus === 'cancelada'){ estado = 'Cancelada'; tono = 'neutro'; }
  else if(p.estatus === 'perdida'){ estado = 'No se cerró'; tono = 'neutro'; }
  else if(p.estatus === 'cotizacion'){ estado = 'Borrador'; tono = 'neutro'; }
  else if(p.estatus === 'enviada'){ estado = 'En espera de confirmar'; tono = 'alerta'; }
  else if(!vigente){ estado = 'Terminada'; tono = 'neutro'; }
  else if(atrasados > 0){ estado = 'Servicios atrasados'; tono = 'error'; }
  else if(cobrosAtrasados > 0){ estado = 'Cobro atrasado'; tono = 'error'; }
  else if(tocanEsteMes > 0){ estado = 'Toca este mes'; tono = 'alerta'; }
  else if(diasVigencia <= 45){ estado = 'Por vencer'; tono = 'alerta'; }
  else{ estado = 'Al día'; tono = 'ok'; }

  const activa = p.estatus === 'activa' && vigente;

  return { hoy, fin, precioAnual, precioAnualCent, precioMensual, totales,
           subtotal, subtotalCent, descuento, descuentoCent,
           montoDescuento: deCentavos(descuentoCent),
           montos, montosCent, cobrados, debidos, cobrosAtrasados, adeudo, cobrado, proximoCobro,
           programados, hechos, pendientes, atrasados, tocanEsteMes, huerfanos,
           mesesCumplidos, mesActual, vigente, diasVigencia, diasEsperando,
           noCuadran, cerrable, estado, tono, activa };
}

/* ==================== La agenda de servicios (Fase 4) ====================
   El calendario de `modalCalendario` contesta «qué toca en ESTA póliza». Esto
   contesta la pregunta que de verdad organiza la semana: «qué toca AHORA, en
   todas». Son preguntas distintas y por eso es vista y no modal — se vuelve a
   ella todo el día.

   Dos decisiones que la sostienen:

   · **El estado lo calcula `calcularPoliza`, no esta función.** Los meses de
     servicio son DESFASES desde la vigencia de cada póliza, así que «atrasado» se
     mide contra los meses cumplidos de SU póliza, no contra el calendario. Si aquí
     se comparara 'AAAA-MM' con el mes de hoy, una póliza que arrancó el día 15
     daría atrasado el día 1 del mes siguiente y la agenda diría un número y los
     indicadores de la portada otro. Se reusa el mismo juicio para que los dos
     cuadren siempre; el mes de calendario se usa solo para AGRUPAR.
   · **Se agrupa por estado y dentro por mes**, no al revés. «Atrasados» y «Toca
     ahora» suman exactamente lo que dicen los dos indicadores de la portada, y eso
     se puede verificar. Agrupando solo por mes, un servicio que «toca ahora» de una
     póliza que arrancó a media mes caería en la casilla del mes pasado y se leería
     como atrasado.

   El segurista no genera trabajo —es presencia, no mantenimiento— así que no entra
   como pendiente; se cuenta aparte para poder anunciarlo. */
function agendaServicios(){
  const atrasados = [], ahora = [], proximos = [], hechos = [];
  let seguristas = 0;

  datos.polizas.forEach(p=>{
    const c = calcularPoliza(p);
    /* Solo pólizas VIVAS — el mismo `c.activa` (estatus activa Y vigente) que usa
       resumirPolizas. La primera versión incluía las activas ya vencidas y sus
       meses sin marcar salían aquí como atrasados mientras el indicador de la
       portada decía cero: dos números distintos para la misma pregunta. El
       criterio ya estaba decidido en el semáforo —una póliza vencida es
       «Terminada», no «atrasada»— y la agenda lo sigue. */
    if(!c.activa) return;
    const cli = clientePorId(p.clienteId);
    p.partidas.forEach(x=>{
      if(esSegurista(x)){ seguristas += x.mesesServicio.length; return; }
      x.mesesServicio.forEach(m=>{
        const inicioMes = sumarMeses(p.fechaInicio, m);
        const det = servicioDetalle(p, x, m);
        const it = {
          polizaId:p.id, poliza:p, partida:x, mes:m,
          cliente: cli ? cli.nombre : '', titulo: tituloPoliza(p),
          clave: inicioMes.slice(0,7),
          etiquetaMes: etiquetaMesServicio(p.fechaInicio, m),
          det,
          /* Parcial: se atendieron algunas unidades del renglón y falta el resto.
             `hechas` se materializa en normalizarPoliza, así que aquí ya existe. */
          parcial: !!det && det.hechas < x.cantidad
        };
        if(det) hechos.push(it);
        else if(m < c.mesesCumplidos) atrasados.push(it);
        else if(m === c.mesActual)    ahora.push(it);
        else if(m > c.mesActual)      proximos.push(it);
        /* Un mes anterior al actual que además está hecho ya cayó en `hechos`; no
           hay cuarto caso. */
      });
    });
  });

  /* Orden: lo más viejo primero en lo que ya se debe, lo más cercano primero en lo
     que viene. Es el orden en que se trabaja. */
  const porFecha = (a,b)=> a.clave < b.clave ? -1 : a.clave > b.clave ? 1
                         : a.titulo.localeCompare(b.titulo,'es');
  atrasados.sort(porFecha); ahora.sort(porFecha); proximos.sort(porFecha);
  return { atrasados, ahora, proximos, hechos, seguristas };
}

/* Agrupa una lista de la agenda por mes de calendario y, dentro, por póliza. Así
   una visita cubre varios equipos del mismo sitio en el mismo viaje, que es como
   se trabaja de verdad. */
function agruparAgenda(lista){
  const meses = [];
  lista.forEach(it=>{
    let mes = meses.find(g => g.clave === it.clave);
    if(!mes){ mes = { clave:it.clave, etiqueta:it.etiquetaMes, sitios:[] }; meses.push(mes); }
    let sitio = mes.sitios.find(g => g.polizaId === it.polizaId);
    if(!sitio){ sitio = { polizaId:it.polizaId, titulo:it.titulo, cliente:it.cliente, equipos:[] }; mes.sitios.push(sitio); }
    sitio.equipos.push(it);
  });
  meses.forEach(g => g.sitios.forEach(si =>
    si.equipos.sort((a,b)=> (a.partida.concepto||'').localeCompare(b.partida.concepto||'','es'))));
  return meses;
}

/* ==================== El puente hacia el documento imprimible ====================
   armarPayloadPoliza() entrega TODO resuelto. La plantilla formatea y concatena:
   no multiplica, no divide, no calcula módulos y no decide títulos.

   Por qué así, y no pasarle la póliza cruda: el descuadre que originó este módulo
   nació de que el papel se armaba aparte del cálculo. Si la plantilla vuelve a
   multiplicar, hay dos lugares que calculan lo mismo y el bug regresa por otra
   puerta. Aquí los totales salen de calcularPoliza() y totalRenglon(), las MISMAS
   que ya pinta la pantalla.

   Las cifras van como cadenas YA FORMATEADAS para que el redondeo tenga un solo
   dueño. Los números crudos viajan aparte, en `crudo`, y son solo para las
   aserciones de prueba — nunca para imprimir.
   ============================================================================= */

const MES_LARGO = ['enero','febrero','marzo','abril','mayo','junio',
                   'julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* «29 de julio 2026». Es el ÚNICO formato de fecha que existe en las cuatro
   cotizaciones reales —medido—, así que se usa en todas: la de la cotización y
   las dos de la vigencia. Dos detalles que salen del papel y no de la intuición:
   el día va con cero a la izquierda (NGK imprime «09 de julio 2026») y NO lleva
   «de» antes del año. fmtFecha() no sirve aquí: esa es «29 jul 2026», la de la
   pantalla. */
function fechaDocumento(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return '—';
  const q = partes(iso);
  return String(q.d).padStart(2,'0') + ' de ' + MES_LARGO[q.m - 1] + ' ' + q.a;
}

/* «ago-26», con guion, como lo imprimen las cuatro. */
function etiquetaColumnaCalendario(fechaInicio, i){
  const q = partes(sumarMeses(fechaInicio, i));
  return MES_CORTO[q.m - 1] + '-' + String(q.a).slice(2);
}

/* El día ANTERIOR al que devuelve sumarMeses(inicio, 12).
   calcularPoliza().fin es el fin exclusivo: con vigencia desde el 1-ago-2026 da
   1-ago-2027, y eso son doce meses y un día. En pantalla da igual, pero en el
   papel es una fecha contractual y tiene que ser la correcta: 31 de julio 2027.
   Un solo día se resta con Date.UTC sin riesgo — la regla de no usar Date es para
   la aritmética de MESES, que es la que se mueve con las zonas horarias. */
function diaAnterior(iso){
  const d = new Date(aUTC(iso) - 86400000);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0')
       + '-' + String(d.getUTCDate()).padStart(2,'0');
}

function armarPayloadPoliza(p){
  const c   = calcularPoliza(p);
  const cli = clientePorId(p.clienteId);

  return {
    meta: { generado: new Date().toISOString(), origen: 'control-forpass', version: 1 },

    /* Resuelto aquí, no en la plantilla: solo una póliza VIVA se imprime como
       póliza; todo lo demás —incluidas perdida y cancelada— es una cotización.
       Las líneas son las del documento real: tres de las cuatro cotizaciones
       de referencia titulan «Cotización / Póliza de / Mtto Prev.», y quitarle
       «Cotización» es exactamente lo que distingue a la póliza cerrada. */
    titulo: { lineas: p.estatus === 'activa'
                ? ['Póliza de', 'Mtto Prev.']
                : ['Cotización', 'Póliza de', 'Mtto Prev.'] },
    /* Los textos de las hojas INTERIORES también cambian con el estatus: la
       portada ya decía «Póliza de Mtto Prev.» pero adentro cada hoja seguía
       diciendo «Cotización de Servicios Extras» y «Concepto Cotizado:» — un
       contrato activo presentándose como cotización. Resueltos aquí porque la
       plantilla no calcula: formatea y concatena. */
    textos: p.estatus === 'activa'
      ? { eyebrow: 'Póliza de Servicios Extras', conceptoEtiqueta: 'Concepto Contratado:' }
      : { eyebrow: 'Cotización de Servicios Extras', conceptoEtiqueta: 'Concepto Cotizado:' },

    /* sitioNombre es lo que se imprime, SIEMPRE: es texto guardado y sobrevive a
       que el sitio se borre del módulo de Forpass. */
    /* El documento imprimía «INOAC INOAC» y también imprimiría «Prolec Prolec
       Planta 1»: cuando el SITIO ya trae el nombre del cliente adentro —igual
       («INOAC»/«INOAC») o como prefijo («Prolec»/«Prolec Planta 1»)—, repetir
       el nombre es ruido. En ese caso se imprime SOLO el sitio, que ya
       identifica al cliente. Si el sitio es un código aparte («Mercado Libre» /
       «MXGT01») se imprimen los dos, como en las cotizaciones reales.
       La comparación ignora mayúsculas y acentos: «Álamo» / «alamo norte»
       también es prefijo. */
    cliente: (() => {
      const llano = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .toLowerCase().replace(/\s+/g,' ').trim();
      const nombre = cli ? cli.nombre : '';
      const sitio  = p.sitioNombre || '';
      if(sitio && llano(sitio).startsWith(llano(nombre)))
        return { nombre: sitio, sitio: '' };
      return { nombre, sitio };
    })(),
    folio: p.folio || '',
    estatus: p.estatus,

    fechas: {
      cotizacion:     fechaDocumento(p.fechaCotizacion),
      vigenciaInicio: fechaDocumento(p.fechaInicio),
      vigenciaFin:    fechaDocumento(diaAnterior(c.fin))
    },

    vendedor: { nombre:   p.vendedor.nombre   || '',
                correo:   p.vendedor.correo   || '',
                telefono: p.vendedor.telefono || '' },
    contacto: { telOficina: TEL_OFICINA, oficinas: OFICINAS.slice() },

    renglones: p.partidas.map((x, i) => {
      /* `total` es el intermedio que el documento imprime en su propia columna:
         precio × cantidad. `totalMtto` viene de totalRenglon(), o sea por otro
         camino. Que los dos cuadren (total × frecuencia === totalMtto) es la
         aserción que el cliente va a hacer con una calculadora sobre el papel. */
      const total = x.precioUnitario * x.cantidad;
      return {
        n: i + 1,
        concepto: x.concepto,
        /* La marca va aparte aunque se imprima pegada al concepto: la plantilla
           hace la concatenación y su <span>. El payload no mete marcado adentro
           de un dato. */
        marca: x.marca || '',
        cantidad: String(x.cantidad),
        precioUnitario: dineroCent(x.precioUnitario),
        total:          dineroCent(total),
        frecuencia: String(x.frecuencia),
        totalMtto:      dineroCent(c.totales[i]),
        /* YA son índices de columna. mesesServicio son DESFASES desde
           fechaInicio, así que el valor guardado ES la columna: no se rota.
           Se llama `columnas` justo para que nadie le aplique un % 12. */
        columnas: x.mesesServicio.slice(),
        crudo: { precioUnitario: x.precioUnitario, cantidad: x.cantidad,
                 frecuencia: x.frecuencia, total, totalMtto: c.totales[i] }
      };
    }),

    /* Los doce encabezados salen de fechaInicio, que trae el año. NUNCA de
       Math.min(...mesesServicio): si ningún equipo se atiende el primer mes
       —normal, se escalonan a propósito— el mínimo ancla el calendario en el mes
       equivocado y se recorren TODOS los renglones a la vez, sin aviso. */
    calendario: { encabezados: Array.from({length: MESES_POLIZA},
                    (_, i) => etiquetaColumnaCalendario(p.fechaInicio, i)) },

    /* La hoja de «Descripción de Trabajos»: UNA fila por concepto distinto, no
       por renglón —dos refrigeradores de la misma marca comparten el texto del
       mantenimiento—. La deduplicación se hace aquí y no en la plantilla, que no
       calcula nada.

       Se omiten los conceptos SIN texto. MXGT01 tiene 20 de 35 y MXNL02 10 de 26,
       porque esas dos cotizaciones no traían esta página y sus descripciones se
       cruzaron por concepto desde INOAC y NGK. Imprimir esos renglones con la
       celda en blanco no informa de nada y ensucia una hoja que el cliente lee.
       Y no se inventa el texto de un mantenimiento. */
    descripciones: (() => {
      const vistos = new Set(), out = [];
      p.partidas.forEach(x => {
        const texto = descripcionDe(x);
        if(!texto || vistos.has(x.concepto)) return;
        vistos.add(x.concepto);
        out.push({ concepto: x.concepto, texto });
      });
      return out;
    })(),

    /* Con descuento viajan los tres números ya formateados. `descuento` es el
       porcentaje como texto listo para el papel («5%»), y va vacío si no hay:
       la plantilla decide si pinta el bloque, no si calcula. */
    totales: { anual:   dineroCent(c.precioAnual),
               mensual: dineroCent(c.precioMensual),
               subtotal: c.descuento ? dineroCent(c.subtotal) : '',
               descuento: c.descuento ? c.descuento + '%' : '',
               montoDescuento: c.descuento ? dineroCent(c.montoDescuento) : '',
               crudo:   { anual: c.precioAnual, mensual: c.precioMensual,
                          subtotal: c.subtotal, descuento: c.descuento,
                          montoDescuento: c.montoDescuento } },

    pie: { iva: 'Precio más Iva.', tagline: 'Sostenemos a los que sostienen todo.' }
  };
}

/* Abre el documento en pestaña nueva con los datos en sessionStorage.

   SIN 'noopener'. No es descuido y no se debe "arreglar": con noopener la pestaña
   nueva estrena un contexto y NO HEREDA el sessionStorage, así que llegaría vacía
   y la plantilla pintaría «Sin datos». El riesgo que noopener mitiga —que la
   pestaña abierta manipule a la que la abrió— aquí no aplica: el destino es un
   archivo nuestro, del mismo origen. */
const LLAVE_DOC_POLIZA = 'forguard.documento.poliza';

function abrirDocumentoPoliza(id){
  const p = polizaPorId(id);
  if(!p) return;
  let payload;
  try{
    payload = armarPayloadPoliza(p);
    sessionStorage.setItem(LLAVE_DOC_POLIZA, JSON.stringify(payload));
  }catch(e){
    aviso('No se pudo preparar el documento: ' + (e && e.message ? e.message : 'error'), true);
    return;
  }
  /* Ruta relativa: la plantilla vive junto al index.html en docs/ de Pages.
     Con ?v= del momento, SIEMPRE fresca. GitHub Pages manda
     `cache-control: max-age=600` en la plantilla, y como se abre en pestaña
     nueva el refresco forzado del tablero no la alcanza: el navegador seguía
     sirviendo la copia vieja: se arreglaba un defecto del documento, se
     desplegaba, y el papel salía igual de roto durante diez minutos. Pesa 78 KB
     y se abre de vez en cuando — volver a bajarla no le cuesta nada a nadie, y
     un documento que va al cliente no se imprime de una copia rancia. */
  const w = window.open('docs/plantilla_poliza_forguard.html?v=' + Date.now(), '_blank');
  if(!w) aviso('El navegador bloqueó la pestaña. Permite las ventanas emergentes de este sitio.', true);
  return payload;
}

/* Gemelos de sitiosDe() / sitioPorId(): join en memoria, sin consulta. */
function polizasDe(clienteId){ return datos.polizas.filter(p => p.clienteId === clienteId); }
function polizaPorId(id){ return datos.polizas.find(p => p.id === id); }

/* =============================== VISTAS =============================== */
/* "modulo" decide QUÉ producto se está viendo; "vista" decide en qué pantalla de
   ese producto se está. Son dos ejes distintos a propósito: el panel de admin es
   de la app entera y vive fuera de los dos módulos. */
const estado = { modulo:'forpass', vista:'clientes', clienteId:null, polizaId:null,
                 busca:'', filtro:'todos', sitioFiltro:'', encargadoFiltro:'',
                 /* Cuántos meses adelante enseña la agenda. Hace falta un tope:
                    MXGT01 sola son ~108 servicios al año, y cinco pólizas activas
                    llenarían la pantalla de trabajo que no es de ahora. */
                 horizonte:2 };

/* Se recuerda el último módulo para abrir donde te quedaste. Es preferencia de
   pantalla, no información: va en localStorage y no viaja al servidor. */
const LLAVE_MODULO = 'forguard_forpass_modulo_v1';
const MODULOS = ['forpass', 'polizas'];
function cargarModulo(){
  try{
    const m = localStorage.getItem(LLAVE_MODULO);
    if(MODULOS.includes(m)) estado.modulo = m;
  }catch(e){}
  estado.vista = inicioDelModulo();
}
function guardarModulo(){ try{ localStorage.setItem(LLAVE_MODULO, estado.modulo); }catch(e){} }

/* La pantalla de arranque de cada módulo. Una sola función para que el logo, el
   selector y el arranque no se desincronicen. */
function inicioDelModulo(){ return estado.modulo === 'polizas' ? 'polizas' : 'clientes'; }

/* Salto de la póliza a su kiosco en Forpass, y de regreso. Es la única razón
   por la que los dos módulos comparten la colección de clientes: cuando la misma
   dirección tiene kiosco Y póliza, poder verlas juntas. Antes `sitioId` solo
   pintaba un «(con kiosco Forpass)» en gris — un selector completo a cambio de un
   paréntesis— y ahora es el puente.

   Se arma a mano en vez de reusar irAModulo(): esa función limpia clienteId y
   sitioFiltro para no arrastrar filtros entre módulos, que es justo lo que aquí
   hace falta conservar. UN solo render, como manda la casa. */
function irAlSitioDeForpass(sitioId){
  const s = sitioPorId(sitioId);
  if(!s){ aviso('Ese kiosco ya no existe en Forpass.', true); return; }
  estado.modulo = 'forpass';
  guardarModulo();
  estado.vista = 'cliente';
  estado.clienteId = s.clienteId;
  estado.polizaId = null;
  estado.busca = ''; estado.filtro = 'todos';
  estado.sitioFiltro = sitioId;          /* se abre en SU kiosco, no en toda la lista */
  estado.encargadoFiltro = '';
  animarTarjetas = true;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
  aviso('Este es el kiosco Forpass de ' + s.nombre + '. Su póliza está en el otro módulo.');
}

/* El camino de regreso: del kiosco a la póliza que lo cubre. */
function irALaPolizaDelSitio(sitioId){
  const pol = datos.polizas.find(q => q.sitioId === sitioId);
  if(!pol){ aviso('Ese kiosco no tiene póliza de mantenimiento ligada.', true); return; }
  estado.modulo = 'polizas';
  guardarModulo();
  estado.clienteId = null;
  estado.busca = ''; estado.filtro = 'todos';
  estado.sitioFiltro = ''; estado.encargadoFiltro = '';
  entrarPoliza(pol.id);
}

function irAModulo(m){
  if(!MODULOS.includes(m) || m === estado.modulo) return;   /* clic en la que ya está: nada */
  estado.modulo = m;
  guardarModulo();
  /* Se limpia lo del módulo anterior: una búsqueda de sitios no tiene por qué
     seguir filtrando pólizas. */
  estado.vista = inicioDelModulo();
  estado.clienteId = null; estado.polizaId = null;
  estado.busca = ''; estado.filtro = 'todos';
  estado.sitioFiltro = ''; estado.encargadoFiltro = '';
  animarTarjetas = true;      /* lista nueva: sí anima */
  render();                   /* UN render, no dos */
  window.scrollTo({ top:0, behavior:'smooth' });
}
