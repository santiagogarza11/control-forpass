<!DOCTYPE html>

<head>

<title>Póliza de Mantenimiento Preventivo · Forguard</title>

<!--
  ==========================================================================
  PLANTILLA · Póliza de Mantenimiento Preventivo — Forguard          v2
  ==========================================================================
  REGLA DE ORO: el "Total Mtto" nunca se teclea. Se calcula:
        Total Mtto = Precio Unitario × Cantidad × Frecuencia
  El Precio Anual es la suma de los renglones. El Mensual es Anual / 12.
  No existe columna ni etiqueta de descuento en ninguna parte del documento.

  Todo el documento se dibuja desde el objeto POLIZA (más abajo).
  Ese objeto ES el contrato de datos para Firestore.
  ==========================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    /* ---- TIPOGRAFÍA -------------------------------------------------
       --font-display : fuente de marca (logotipo y títulos de portada)
       --font-body    : tablas y texto corrido
       Si la fuente oficial de Forguard es otra (Gilroy, Sofia Pro, etc.),
       cámbiala SOLO en estas dos líneas y todo el documento se actualiza. */
    --font-display:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;
    --font-body:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;

    /* ---- COLORES (muestreados de las cotizaciones) ---- */
    --navy:#08194B;
    --navy-deep:#050F35;
    --navy-glow:#102A63;
    --deco:#17295E;

    --ink:#D7D9DD;          /* título de portada */
    --white:#FFFFFF;
    --meta:#8FA2C6;         /* etiquetas sobre navy */
    --meta-val:#B3C2DD;     /* valores sobre navy */
    --tagline-cover:#C2CEE2;

    --title:#14181D;        /* títulos grandes en hoja blanca */
    --brand-navy:#0B2059;   /* logotipo en hoja blanca */
    --label-blue:#3C63A8;   /* "Concepto Cotizado:" / "Cliente" */
    --text:#22282F;
    --muted:#9AA1AB;
    --rule:#DFE3E8;
    --rule-strong:#C9CFD6;
    --zebra:#F5F7F9;
    --shade:#C0D2E6;        /* celda marcada del calendario */

    --chip-1:#8CA0B8;
    --chip-2:#4FA0A6;
    --chip-3:#46A85A;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#E9EBEE;font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased;}

  .page{
    position:relative;width:8.5in;height:11in;margin:22px auto;
    background:#fff;overflow:hidden;
    box-shadow:0 4px 24px rgba(8,25,75,.15);
  }

  /* ============================ PORTADA ============================ */
  .cover{background:var(--navy);color:var(--ink);}
  .cover .bg{position:absolute;top:0;right:0;bottom:0;left:0;}
  .cover .inner{position:absolute;top:0;right:0;bottom:0;left:0;padding:.78in .8in .58in .82in;}

  .chip{position:absolute;left:0;top:6.55in;width:11px;height:1.75in;
        background:linear-gradient(180deg,var(--chip-1) 0%,var(--chip-2) 52%,var(--chip-3) 100%);}

  .wordmark-cover{position:absolute;left:.82in;top:2.5in;color:var(--white);line-height:0;}
  .cover-title{line-height:.96;
    position:absolute;left:.8in;top:3.35in;right:.6in;
    font-family:var(--font-display);font-weight:700;
    font-size:70px;line-height:.96;letter-spacing:-1.6px;color:var(--ink);
  }
  .cover-meta{position:absolute;left:.84in;top:6.35in;font-size:10.5px;line-height:1.45;}
  .cover-meta td{padding-right:20px;vertical-align:top;color:var(--meta);}
  .cover-meta .sep{border-left:1px solid rgba(143,162,198,.45);padding-left:20px;}
  .cover-meta i{font-style:italic;}
  .cover-meta b{font-weight:400;color:var(--meta-val);}

  .cover-contact{position:absolute;left:.84in;bottom:.62in;font-size:9px;color:var(--meta);line-height:1.5;}
  .cover-contact .k{font-weight:700;color:#CBD6E8;display:block;}
  .cover-contact .blk{margin-bottom:9px;}
  .tagline-cover{position:absolute;right:.72in;bottom:.62in;font-size:10.5px;color:var(--tagline-cover);}

  /* ======================= HOJAS DE CONTENIDO ======================= */
  .sheet{position:absolute;top:0;right:0;bottom:0;left:0;padding:.62in .72in;}
  .logo-tl{position:absolute;left:.62in;top:.42in;color:var(--brand-navy);}
  .wordmark-tr{position:absolute;right:.62in;top:.46in;color:var(--brand-navy);line-height:0;}

  .eyebrow{position:absolute;left:1.55in;top:.78in;font-size:8.5px;color:#5C6673;letter-spacing:.1px;}
  .h1{position:absolute;left:1.53in;top:.98in;right:.7in;
      font-family:var(--font-body);font-weight:300;font-size:36px;line-height:1.06;
      letter-spacing:-.8px;color:var(--title);}
  .h1.two{font-size:33px;}

  .metabar{position:absolute;left:1.55in;top:2.05in;font-size:9.5px;}
  .metabar td{padding-right:56px;vertical-align:top;}
  .metabar .k{color:var(--label-blue);padding-bottom:3px;}
  .metabar .v{color:var(--text);}

  .body{position:absolute;left:.72in;right:.72in;top:2.62in;}

  /* ---- Tablas ---- */
  table.grid{width:100%;border-collapse:collapse;}
  table.grid thead th{
    font-size:8.5px;font-weight:600;color:#2B3341;text-align:left;
    padding:6px 7px;border-bottom:1.2px solid var(--rule-strong);
  }
  table.grid tbody td{font-size:9.5px;padding:6px 7px;border-bottom:1px solid var(--rule);vertical-align:middle;}
  
  .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .c{text-align:center;}
  .ix{width:22px;color:#98A0AA;text-align:right;}

  /* ---- Totales ---- */
  .totals{margin-top:16px;width:100%;}
  .totals td{font-size:11px;padding:6px 9px;}
  .totals .lbl{text-align:right;color:#2B3341;font-weight:600;}
  .totals .val{text-align:right;width:1.5in;font-variant-numeric:tabular-nums;}
  .totals tr.grand td{font-weight:700;border-top:1px solid var(--rule-strong);}
  .note{margin-top:12px;font-size:8.5px;color:#5C6673;line-height:1.6;}
  .note li{margin-left:12px;}

  /* ---- Calendario ---- */
  table.cal{width:100%;border-collapse:collapse;table-layout:fixed;}
  table.cal th{font-size:7.5px;font-weight:600;color:#2B3341;padding:5px 2px;text-align:center;
               border-bottom:1.2px solid var(--rule-strong);}
  table.cal th.cpt{text-align:left;padding-left:7px;}
  table.cal td{border-bottom:1px solid var(--rule);height:20px;padding:0;}
  table.cal td.lbl{font-size:8px;padding:4px 7px;line-height:1.25;}
  table.cal td.ix{font-size:8px;text-align:right;color:#98A0AA;padding-right:4px;}
  table.cal td.on{background:var(--shade);}

  /* ---- Consideraciones ---- */
  .clause{border-top:1px solid var(--rule);padding:9px 0 8px;}
  .clause .hd{font-size:8.5px;font-weight:600;letter-spacing:.5px;color:#2B3341;text-align:center;padding-bottom:6px;}
  .clause p{font-size:8.5px;line-height:1.55;color:#2E353E;}
  .clause .two-col{width:100%;border-collapse:collapse;}
  .clause .two-col td{width:50%;vertical-align:top;padding-right:16px;font-size:8.5px;line-height:1.5;color:#2E353E;}
  .clause .two-col b{display:block;color:#2B3341;padding-bottom:3px;}

  /* ---- Descripción de trabajos ---- */
  table.desc tbody td{font-size:8.5px;line-height:1.45;padding:6px 7px;}
  table.desc tbody td.eq{width:1.75in;font-weight:600;color:#2B3341;}

  /* ---- Pie ---- */
  .footwrap{position:absolute;left:.72in;right:.72in;bottom:.46in;}
  .foot{width:100%;table-layout:fixed;border-collapse:collapse;}
  .foot td{font-size:8px;color:var(--muted);line-height:1.45;vertical-align:bottom;word-wrap:break-word;}
  .foot .k{font-weight:700;color:#8A929D;display:block;}
  .foot .tag{text-align:right;font-size:10px;color:#2E4E96;}

  @media print{
    body{background:#fff;}
    .page{margin:0;box-shadow:none;page-break-after:always;}
    @page{size:letter;margin:0;}
  }
</style>
</head>

const precioAnual=()=>POLIZA.partidas.reduce((s,p)=>s+totalRenglon(p),0);

  return out;
}

function isotipo(alto){
  const ancho=(alto*ISOTIPO_RATIO).toFixed(1);
  return `<svg width="${ancho}" height="${alto}" viewBox="${ISOTIPO_VB}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Forguard">${ISOTIPO_PATHS}</svg>`;
}
function logotipo(ancho){
  const alto=(ancho/LOGOTIPO_RATIO).toFixed(1);
  return `<svg width="${ancho}" height="${alto}" viewBox="${LOGOTIPO_VB}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Forguard">${LOGOTIPO_PATHS}</svg>`;
}

/* ---------- Piezas compartidas ---------- */
function sheetHead(titulo,dosLineas){
  return `<div class="logo-tl">${isotipo(44)}</div>
  <div class="wordmark-tr">${logotipo(116)}</div>
  <div class="eyebrow">Cotización de Servicios Extras</div>
  <div class="h1${dosLineas?" two":""}">${titulo}</div>
  <table class="metabar"><tr>
    <td><div class="k">Concepto Cotizado:</div><div class="v">${POLIZA.proyecto}</div></td>
    <td><div class="k">Cliente</div><div class="v">${POLIZA.cliente}${POLIZA.sitio?` ${POLIZA.sitio}`:""}</div></td>
  </tr></table>`;
}
function sheetFoot(nota){
  return `<div class="footwrap"><table class="foot"><tr>
    <td width="34%"><span class="k">Teléfono</span>${POLIZA.telOficina}<br><br>
      <span class="k">Correo:</span>${POLIZA.contacto.correo}</td>
    <td width="30%"><span class="k">Oficinas Corporativas:</span>${POLIZA.oficinas.join("<br>")}</td>
    <td class="tag">${nota?`<div style="color:#5C6673;font-size:8px;text-align:right;padding-bottom:6px">${nota}</div>`:""}Sostenemos a los que sostienen todo.</td>
  </tr></table></div>`;
}

/* ============================ PORTADA ============================ */
function pageCover(){
  return `<section class="page cover">
    <svg class="bg" viewBox="0 0 816 1056" preserveAspectRatio="none">
      <defs>
        <radialGradient id="g1" cx="72%" cy="14%" r="62%">
          <stop offset="0%" stop-color="#0C2058"/><stop offset="100%" stop-color="#08194B"/>
        </radialGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#08194B" stop-opacity="0"/>
          <stop offset="100%" stop-color="#050F35" stop-opacity=".85"/>
        </linearGradient>
      </defs>
      <rect width="816" height="1056" fill="url(#g1)"/>
      <rect width="816" height="1056" fill="url(#g2)"/>
      <g stroke="#14265A" stroke-width="1.1" fill="none" opacity=".85">
        <path d="M404 -60 L404 236 Q404 300 460 300 L648 300 Q712 300 712 364 L712 700 Q712 764 656 764 L472 764 Q408 764 408 828 L408 1116"/>
        <path d="M470 -60 L470 196 Q470 258 526 258 L700 258 Q762 258 762 320 L762 736 Q762 798 706 798 L520 798 Q458 798 458 860 L458 1116"/>
      </g>
    </svg>
    <div class="chip"></div>
    <div class="inner">
      ${isotipo(70)}
      <div class="wordmark-cover">${logotipo(152)}</div>
      <div class="cover-title">${POLIZA.tituloPortada.join("<br>")}</div>
      <table class="cover-meta"><tr>
        <td><i>Cliente:</i> <b>${POLIZA.cliente}${POLIZA.sitio?`<br>${POLIZA.sitio}`:""}</b></td>
        <td class="sep"><i>Fecha:</i> <b>${POLIZA.fecha}</b></td>
        <td class="sep"><i>Proyecto:</i> <b>${POLIZA.proyecto}</b></td>
      </tr></table>
      <div class="cover-contact">
        <div class="blk"><span class="k">Teléfono</span>${POLIZA.contacto.tel}</div>
        <div class="blk"><span class="k">Correo:</span>${POLIZA.contacto.correo}</div>
      </div>
      <div class="tagline-cover">Sostenemos a los que sostienen todo.</div>
    </div>
  </section>`;
}

/* ====================== PÓLIZA (tabla + totales) ====================== */
function pagePoliza(){
  const filas=POLIZA.partidas.map((p,i)=>`<tr>
      <td class="ix">${i+1}</td>
      <td>${p.concepto}</td>
      <td>${p.marca||"—"}</td>
      <td class="c">${p.cantidad}</td>
      <td class="n">${mxn2(p.precioUnitario)}</td>
      <td class="c">${p.frecuencia}</td>
      <td class="n">${mxn0(totalRenglon(p))}</td>
    </tr>`).join("");
  const anual=precioAnual();
  return `<section class="page">
    <div class="sheet">
      ${sheetHead("Póliza de Mantenimiento")}
      <div class="body">
        <table class="grid">
          <thead><tr>
            <th class="ix">#</th><th>Concepto</th><th>Marca</th>
            <th class="c">Cantidad</th><th class="n">Precio Unitario</th>
            <th class="c">Frecuencia</th><th class="n">Total Mtto</th>
          </tr></thead>
          <tbody>${filas}</tbody>
        </table>
        <table class="totals">
          <tr><td class="lbl">Precio Anual</td><td class="val">${mxn2(anual)}</td></tr>
          <tr class="grand"><td class="lbl">Precio Mensual</td><td class="val">${mxn2(anual/12)}</td></tr>
        </table>
        <ul class="note">
          <li>Precio más IVA.</li>
          <li>La póliza se contrata y se presta por un periodo anual de doce (12) meses, independientemente de que la facturación se realice de forma anual o mensual.</li>
          <li>La vigencia iniciará en la fecha acordada por las partes y se mantendrá por el periodo anual establecido.</li>
        </ul>
      </div>
    </div>
    ${sheetFoot()}
  </section>`;
}

/* ============================ CALENDARIO ============================ */
function pageCalendario(){
  const th=MESES.map(m=>`<th>${m}</th>`).join("");
  const filas=POLIZA.partidas.map((p,i)=>{
    const celdas=MESES.map((_,mi)=>`<td class="${p.mesesServicio.includes(mi)?"on":""}"></td>`).join("");
    return `<tr><td class="ix">${i+1}</td><td class="lbl">${p.concepto}</td>${celdas}</tr>`;
  }).join("");
  return `<section class="page">
    <div class="sheet">
      ${sheetHead("Calendario de<br>Mantenimientos",true)}
      <div class="body" style="top:2.85in">
        <table class="cal">
          <colgroup><col style="width:22px"><col style="width:1.55in">
            ${MESES.map(()=>'<col style="width:6.55%">').join("")}</colgroup>
          <thead><tr><th class="ix"></th><th class="cpt">Concepto</th>${th}</tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>
    ${sheetFoot()}
  </section>`;
}

/* ========================= CONSIDERACIONES ========================= */
function pageConsideraciones(){
  const c=[
    {h:"VISITAS NO PLANEADAS O PACTADAS (PRECIO ADICIONAL)",
     p:`<b>Aplicación:</b> toda visita solicitada por el cliente fuera del cronograma preventivo tendrá un precio adicional, excepto que sea por falla cubierta bajo garantía de reparación reciente (por ejemplo, dentro de los 15 días posteriores a una visita programada).`},
    {h:"EXCLUSIONES DE INFRAESTRUCTURA",
     t:`<table class="two-col"><tr>
        <td><b>No están cubiertos bajo esta póliza:</b>
          Daños a infraestructura ajena al equipo, como cableado eléctrico externo, tuberías y estructuras arquitectónicas. Software no incluido en el Anexo Técnico. Equipos periféricos no contratados, como sensores externos o UPS no cubiertos.</td>
        <td><b>Causas externas:</b>
          Fallas por voltaje inestable. Inundaciones, incendios, vandalismo o fuerza mayor.</td>
      </tr></table>`},
    {h:"CUMPLIMIENTO DE NORMATIVAS ESPECÍFICAS",
     p:`Esta póliza asegura el mantenimiento para la correcta operación de los equipos. <b>No incluye servicios específicos requeridos para el cumplimiento de normativas locales o certificaciones particulares</b> (por ejemplo, pruebas de emisiones, calibración de equipos de medición con certificación externa o inspecciones de seguridad especializadas) que no formen parte del mantenimiento preventivo estándar. Estos servicios pueden gestionarse por separado bajo solicitud del cliente.`},
    {h:"REPARACIONES MAYORES O SUSTITUCIÓN COMPLETA DE COMPONENTES PRINCIPALES",
     p:`Esta póliza cubre el mantenimiento preventivo y las reparaciones correctivas menores destinadas a mantener la operatividad básica de los equipos. <b>No incluye la sustitución completa de componentes principales</b> como compresores de refrigeración, quemadores industriales completos, tarjetas electrónicas principales (PLC, unidades de control), motores de gran potencia, ni cualquier otro componente cuyo precio individual exceda el monto acordado por las partes en pesos mexicanos (MXN). Estas sustituciones se cotizarán por separado y requerirán una orden de compra adicional aprobada por el cliente.`},
    {h:"TRABAJOS ESTÉTICOS O DE ACABADO",
     p:`Esta póliza se enfoca en el mantenimiento funcional de los equipos. <b>No incluye trabajos estéticos</b> como pintura, limpieza profunda no rutinaria (más allá de la necesaria para el mantenimiento técnico), pulido de acero inoxidable ni la reparación de daños superficiales que no afecten la operatividad del equipo.`},
    {h:"ACTUALIZACIÓN Y VIGENCIA",
     p:`En caso de que el cliente solicite la incorporación o el retiro de equipos durante la vigencia, la póliza será actualizada para reflejar dichos cambios, lo cual podrá implicar un ajuste en el alcance y en el precio del servicio. Toda modificación deberá quedar debidamente documentada y aceptada por ambas partes. ${POLIZA.vigencia}`}
  ].map(x=>`<div class="clause"><div class="hd">${x.h}</div>${x.t||`<p>${x.p}</p>`}</div>`).join("");

  return `<section class="page">
    <div class="sheet">
      ${sheetHead("Consideraciones Relevantes")}
      <div class="body">${c}</div>
    </div>
    ${sheetFoot()}
  </section>`;
}

/* ====================== DESCRIPCIÓN DE TRABAJOS ====================== */
function pageDescripcion(){
  const vistos=new Set();
  const filas=POLIZA.partidas.filter(p=>{
    if(vistos.has(p.concepto))return false;vistos.add(p.concepto);return true;
  }).map((p,i)=>`<tr><td class="ix">${i+1}</td><td class="eq">${p.concepto}</td><td>${p.descripcion||""}</td></tr>`).join("");
  return `<section class="page">
    <div class="sheet">
      ${sheetHead("Descripción de Trabajos")}
      <div class="body">
        <table class="grid desc">
          <thead><tr><th class="ix">#</th><th>Equipo</th><th>Descripción del trabajo a realizar</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>
    ${sheetFoot()}
  </section>`;
}

document.getElementById("doc").innerHTML =
  pageCover()+pagePoliza()+pageCalendario()+pageConsideraciones()+pageDescripcion();
</script>
</body>
</html>
